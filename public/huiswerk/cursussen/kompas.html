<style>
  :root{

  .hero h1{font-size:26px;font-weight:800;margin:4px 0 6px;position:relative;z-index:1;}
  .hero p{opacity:.96;font-size:14px;max-width:92%;position:relative;z-index:1;}
  .hero .stats{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap;}
  .hero .chip{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;backdrop-filter:blur(4px);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow);}
  .card h2{font-size:17px;font-weight:800;}
  .sub{color:var(--muted);font-size:13px;}
  .sub2{color:var(--muted);font-size:12px;display:block;}
  .pbar{height:9px;background:#e6f2ec;border-radius:999px;overflow:hidden;margin-top:8px;}
  .pbar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .5s;}
  .pbar.mod i{background:var(--mc,var(--pri));}
  .btn{font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--pri);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:transform .08s,filter .15s;}

  .btn.ghost{background:#e3f5ec;color:var(--pri);}
  .btn.ok{background:linear-gradient(135deg,#12b886,#0ca678);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.75;cursor:default;}
  .tag{display:inline-block;background:#e3f5ec;color:var(--pri);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .tag.done{background:#e4f8ef;color:#0ca678;}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
  .nav .inner{display:flex;width:100%;max-width:640px;}
  .nav button{flex:1;background:none;border:0;padding:8px 1px 9px;font:inherit;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}

  .nav button.active{color:var(--pri);}

  .lesrow{display:flex;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;}

  .tech b{display:block;font-size:14.5px;margin-bottom:2px;}
  .tech p{font-size:13.5px;color:#3d4a43;}
  .lines li{list-style:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:7px;font-size:14px;}

  .fout{background:#fff1f2;border:1px solid #fecdd3;border-left:3px solid #ef4444;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#7f1d2b;margin-top:8px;}

  .oef b{color:#0e7c53;}
  .quiz .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:8px;font:inherit;font-size:14px;cursor:pointer;transition:.12s;}
  .quiz .opt:hover{border-color:var(--pri);}
  .quiz .opt.good{background:#e4f8ef;border-color:#0ca678;color:#0a5c46;font-weight:700;}
  .quiz .opt.bad{background:#fff1f2;border-color:#ef4444;color:#9f1239;}

  .seg{display:flex;background:#e3f5ec;border-radius:12px;padding:4px;gap:4px;margin-top:12px;overflow:auto;}
  .seg button{flex:1;white-space:nowrap;border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:9px;cursor:pointer;}
  .seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .quote{font-size:15px;line-height:1.55;}
  .kv{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:0;}
  .big{font-size:30px;font-weight:800;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .refl{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;resize:vertical;min-height:64px;margin-top:8px;background:#fff;color:var(--ink);}
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px;}
  .badge{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;}
  .badge.locked{opacity:.42;filter:grayscale(1);}
  .badge .be{font-size:22px;}
  .badge b{font-size:13px;display:block;}
  .badge span{font-size:11px;color:var(--muted);}
  .reflitem{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px;}
  .reflitem:first-child{border-top:0;}
  .reflitem .rd{font-size:11px;color:var(--muted);}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .backhome{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--muted);font-size:12.5px;text-decoration:none;}
</style>

<script>

/* ============================================================
   KOMPAS — slim leren, focus & studievaardigheden (voor de kinderen)

   Voortgang in localStorage. Onderdeel van de Bennaghmouch Academie.
   ============================================================ */
const KEY='kompas_v1';
const store=(()=>{ let s={};
  try{s=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){s={};}
  s.done=s.done||{}; s.checks=s.checks||{}; s.oefdagen=s.oefdagen||[]; s.oefLaatst=s.oefLaatst||null;
  s.reflecties=s.reflecties||[]; s.kaarten=s.kaarten||{};
  return s; })();
function save(){ try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){} }
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dagIndex(){ return Math.floor(Date.now()/86400000); }

  {id:'mindset', naam:'Mindset & motivatie', emoji:'💪', kleur:'#8b5cf6', tag:'Doorzetten & groeien'}
];
const MOD=Object.fromEntries(MODULES.map(m=>[m.id,m]));

/* ---------------- LESSEN ---------------- */
const LESSONS=[
  {m:'focus', t:"Eén ding tegelijk", d:"Multitasken bestaat niet echt. Eén taak per keer is sneller én beter.",

  {m:'plannen', t:"Plannen met een weekoverzicht", d:"Wat je opschrijft, vergeet je niet.",

  {m:'plannen', t:"Eerst het vervelendste (prioriteiten)", d:"Doe de moeilijkste taak eerst. Daarna voelt de rest licht.",

  {s:"Tijdens een toets blijf je hangen bij vraag 3.", aanpak:"Overslaan, makkelijke eerst, later terug.", zin:"Streepje erbij, ik ga verder en kom er straks op terug."},
  {s:"Je maakte een fout in je huiswerk en voelt je dom.", aanpak:"Groeimindset: fout = les.", zin:"Ik kan dit nóg niet. Wat leer ik van deze fout?"}
];

/* ---------------- STREAK / VOORTGANG ---------------- */
function streak(){ const dagen=new Set(store.oefdagen); let s=0; let d=new Date();
  const key=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
  if(!dagen.has(key(d))){ d.setDate(d.getDate()-1); if(!dagen.has(key(d))) return 0; }
  while(dagen.has(key(d))){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function afgerond(){ return LESSONS.filter((_,i)=>store.done[i]).length; }
function modVoortgang(id){ const idx=LESSONS.map((l,i)=>[l,i]).filter(([l])=>l.m===id).map(([,i])=>i);
  const done=idx.filter(i=>store.done[i]).length; return {done, totaal:idx.length}; }
function kaartenBeheerst(){ return Object.values(store.kaarten).filter(k=>k&&k.box>=4).length; }
function kaartenDue(){ const d=dagIndex(); return KAARTEN.map((k,i)=>({i,k,st:store.kaarten[i]}))
  .filter(x=> !x.st || (x.st.due||0)<=d ); }

/* ---------------- ROUTER / RENDER ---------------- */
let view={tab:'vandaag', les:null, mat:null, oefsub:'kaarten', reveal:false};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function render(){
  window.scrollTo(0,0);
  if(view.les!==null){ app.innerHTML=lesDetail(view.les); }
  else if(view.tab==='vandaag') app.innerHTML=tabVandaag();
  else if(view.tab==='lessen') app.innerHTML=tabLessen();
  else if(view.tab==='oefenen') app.innerHTML=tabOefenen();
  else if(view.tab==='toolkit') app.innerHTML=tabToolkit();
  else if(view.tab==='ik') app.innerHTML=tabIk();
  app.classList.remove('fade'); void app.offsetWidth; app.classList.add('fade');
  renderNav();
  bind();
}
function renderNav(){
  const items=[['vandaag','☀️','Vandaag'],['lessen','📚','Lessen'],['oefenen','🎯','Oefenen'],['toolkit','🗂️','Toolkit'],['ik','📈','Ik']];
  document.getElementById('nav').innerHTML=items.map(([id,ic,l])=>
    `<button data-tab="${id}" class="${view.les===null&&view.tab===id?'active':''}"><span class="ic">${ic}</span>${l}</button>`).join('');
}

function tabVandaag(){
  const d=dagIndex();
  const uit=DAGUITDAGINGEN[d%DAGUITDAGINGEN.length];
  const [tt,tp]=TECHVDDAG[d%TECHVDDAG.length];
  const gedaan=store.oefdagen.includes(today());
  const s=streak(), af=afgerond();
  const tipAll=MATERIAAL["Onthoud-trucs"]; const tip=tipAll[d%tipAll.length];
  const due=kaartenDue().length;
  const reflVandaag=(store.reflecties.find(r=>r.d===today())||{}).t||'';
  return `
  <div class="hero">
    <div class="eyebrow">Kompas · Dagtraining</div>
    <h1>Elke dag een beetje slimmer leren</h1>
    <p>Focus, plannen en slim onthouden — één trucje per dag maakt je een leerbaas.</p>
    <div class="stats"><span class="chip">🔥 ${s} dag${s===1?'':'en'} streak</span><span class="chip">✅ ${af}/${LESSONS.length} lessen</span><span class="chip">🗓️ ${store.oefdagen.length} oefendagen</span></div>
  </div>

  <div class="card">
    <span class="tag">Uitdaging van vandaag</span>
    <h2 style="margin-top:8px">${esc(uit)}</h2>
    <p class="sub" style="margin-top:6px">Klein en concreet. Doe 'm vandaag en vink af — zo bouw je je streak.</p>
    ${gedaan
      ? `<button class="btn ok block" style="margin-top:12px" disabled>✅ Vandaag gedaan — knap!</button>`
      : `<button class="btn ok block" data-act="oefdone" style="margin-top:12px">Ik heb 'm gedaan ✅</button>`}
  </div>

  <div class="card">
    <span class="tag">Trucje van de dag</span>
    <h2 style="margin-top:8px">${esc(tt)}</h2>
    <p class="sub" style="margin-top:6px">${esc(tp)}</p>
  </div>

  <div class="card">
    <span class="tag">Tip om vandaag te gebruiken</span>
    <p class="quote" style="margin-top:10px">💡 ${esc(tip)}</p>
    <button class="btn ghost" data-act="nieuwetip" style="margin-top:12px">Geef me een andere</button>
  </div>

  <div class="card">
    <span class="tag">Reflectie van vandaag</span>
    <p class="sub" style="margin-top:6px">Wat ging vandaag goed met leren, of wat wil je onthouden? Eén zin is genoeg.</p>
    <textarea id="reflinput" class="refl" placeholder="Vandaag lukte het me om…">${esc(reflVandaag)}</textarea>
    <button class="btn ghost block" data-act="reflsave" style="margin-top:8px">Bewaar reflectie</button>
  </div>

  <div class="card center">
    <p class="sub">${due>0?`🎯 ${due} kenniskaart${due===1?'':'en'} klaar om te herhalen.`:'✨ Alle kaarten voor nu herhaald — kom morgen terug.'}</p>
    <button class="btn block" data-tab="oefenen" style="margin-top:10px">🎯 Naar oefenen</button>
  </div>`;
}

function tabLessen(){
  const af=afgerond();
  let html=`
  <div class="hero"><div class="eyebrow">De cursus</div><h1>${LESSONS.length} lessen · 6 modules</h1>
    <p>Van focus en plannen tot slim onthouden, toetsen aanpakken en doorzetten.</p>
    <div class="stats"><span class="chip">✅ ${af}/${LESSONS.length} afgerond</span></div>
  </div>`;
  for(const mod of MODULES){
    const rows=LESSONS.map((l,i)=>[l,i]).filter(([l])=>l.m===mod.id);
    const {done,totaal}=modVoortgang(mod.id);
    const pct=Math.round(done/totaal*100);
    html+=`<div class="card" style="--mc:${mod.kleur}">
      <div class="modhead"><div class="me">${mod.emoji}</div><div><b>${esc(mod.naam)}</b><span class="sub2">${esc(mod.tag)} · ${done}/${totaal}</span></div></div>
      <div class="pbar mod"><i style="width:${pct}%"></i></div>
      ${rows.map(([l,i])=>{const dn=!!store.done[i];return `
        <div class="lesrow" data-les="${i}">
          <div class="num ${dn?'done':''}">${dn?'✓':(i+1)}</div>
          <div class="grow"><b>${esc(l.t)}</b><span>${esc(l.d)}</span></div>
          <div class="chev">›</div>
        </div>`;}).join('')}
    </div>`;
  }
  return html;
}

function quizHTML(i){
  const l=LESSONS[i]; if(!l.check) return '';
  const passed=!!store.checks[i];
  return `<div class="block"><h3>Kennischeck</h3>
    <div class="quiz">
      <p style="font-size:14.5px"><b>${esc(l.check.v)}</b></p>
      ${l.check.o.map((o,oi)=>{ let cls='opt'; let dis=''; if(passed){dis='disabled'; if(oi===l.check.a) cls+=' good';} return `<button class="${cls}" ${dis} data-quiz="${i}" data-opt="${oi}">${esc(o)}</button>`;}).join('')}
      <p class="quizfb goodfb" style="${passed?'':'display:none'}">${passed?('✅ Klopt! '+esc(l.check.u)):''}</p>
    </div></div>`;
}

function lesDetail(i){
  const l=LESSONS[i]; const done=!!store.done[i]; const mod=MOD[l.m];
  return `
  <div class="topbar"><button class="back" data-act="terug">‹ Lessen</button><span class="tag" style="background:${mod.kleur}22;color:${mod.kleur}">${mod.emoji} ${esc(mod.naam)}</span><span class="tag">Les ${i+1} · ${l.min} min</span></div>
  <div class="hero" style="margin-top:12px"><div class="eyebrow">Les ${i+1}</div><h1>${esc(l.t)}</h1><p>${esc(l.d)}</p></div>

  <div class="card">
    <div class="block"><h3>De kern</h3><p class="quote">${esc(l.principe)}</p></div>
    <div class="block"><h3>Waarom het werkt</h3><div class="why">${esc(l.waarom)}</div></div>
    <div class="block"><h3>Zo doe je het</h3>
      ${l.tech.map(([b,p])=>`<div class="tech"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join('')}
    </div>
    ${l.lines&&l.lines.length?`<div class="block"><h3>Zeg tegen jezelf</h3><ul class="lines" style="padding:0;margin:0">${l.lines.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <div class="block"><h3>Valkuil</h3><div class="fout">⚠️ ${esc(l.fout)}</div></div>
    <div class="oef"><b>🎯 Doe dit vandaag</b><p style="margin-top:4px">${esc(l.oef)}</p></div>
    ${quizHTML(i)}
    ${done
      ? `<button class="btn ok block" data-act="undone" data-les="${i}" style="margin-top:16px">✅ Afgerond — tik om te herzien</button>`
      : `<button class="btn block" data-act="done" data-les="${i}" style="margin-top:16px">Markeer als afgerond</button>`}
  </div>
  ${i<LESSONS.length-1?`<button class="btn ghost block" data-les="${i+1}" style="margin-top:12px">Volgende les › ${esc(LESSONS[i+1].t)}</button>`:`<div class="card center"><b>🎉 Laatste les!</b><p class="sub">Herhaal dagelijks in het tabblad Vandaag en oefen met de kenniskaarten.</p></div>`}`;
}

function tabOefenen(){
  const sub=view.oefsub||'kaarten';
  let inner = sub==='kaarten' ? oefKaarten() : oefSimulator();
  return `
  <div class="hero"><div class="eyebrow">Oefenen</div><h1>Trainen & herhalen</h1>
    <p>Verstevig wat je leerde met kenniskaarten en oefen echte leer-situaties in de simulator.</p></div>
  <div class="seg">
    <button data-oefsub="kaarten" class="${sub==='kaarten'?'on':''}">🧠 Kenniskaarten</button>
    <button data-oefsub="sim" class="${sub==='sim'?'on':''}">🎮 Simulator</button>
  </div>
  ${inner}`;
}
function oefKaarten(){
  const due=kaartenDue(); const beheerst=kaartenBeheerst();
  if(due.length===0){
    return `<div class="card center">
      <p class="big">🧠</p>
      <b>Alles herhaald!</b>
      <p class="sub" style="margin-top:6px">Je hebt alle kaarten voor nu gehad. Kaarten komen vanzelf terug volgens slim herhalen — kom later terug.</p>
      <div class="kv" style="margin-top:12px"><span>Beheerst</span><b>${beheerst} / ${KAARTEN.length}</b></div>
    </div>`;
  }
  const cur=due[0]; const [q,a]=cur.k; const rev=view.reveal;
  return `
  <div class="card">
    <div class="kv" style="border:0;padding-top:0"><span class="sub">Nog te herhalen: ${due.length}</span><span class="sub">Beheerst: ${beheerst}/${KAARTEN.length}</span></div>
    <div class="flash">
      <small>Kenniskaart</small>
      <div class="fq" style="margin-top:10px">${esc(q)}</div>
      ${rev?`<div class="fa">${esc(a)}</div>`:''}
    </div>
    ${rev
      ? `<div class="pill-row" style="margin-top:12px">
           <button class="btn ghost" style="flex:1" data-act="kaartfout" data-kid="${cur.i}">Nog niet</button>
           <button class="btn ok" style="flex:1" data-act="kaartgoed" data-kid="${cur.i}">Ik wist het ✓</button>
         </div>`
      : `<button class="btn block" data-act="kaartreveal" style="margin-top:12px">Toon antwoord</button>`}
  </div>
  <p class="sub center" style="margin-top:10px">Eerlijk zijn loont: kaarten die je goed kent, komen minder vaak terug.</p>`;
}
function oefSimulator(){
  const sc=view.sim!=null?SIM[view.sim]:null;
  return `
  <div class="card center">
    <span class="tag">Leer-simulator</span>
    ${sc?`
      <p class="quote" style="margin-top:12px;text-align:left"><b>Situatie:</b> ${esc(sc.s)}</p>
      <p class="sub" style="margin-top:10px;text-align:left"><b>Slimme aanpak:</b> ${esc(sc.aanpak)}</p>
      ${view.simModel
        ? `<div class="oef" style="text-align:left"><b>💡 Wat je tegen jezelf zegt</b><p style="margin-top:4px">“${esc(sc.zin)}”</p><p class="sub" style="margin-top:6px">Dit is één manier — jouw eigen woorden werken ook. Probeer het echt vandaag.</p></div>`
        : `<button class="btn ghost block" data-act="simmodel" style="margin-top:12px">Toon een slimme aanpak</button>`}
    `:`<p class="quote" style="margin-top:12px">Tik op de knop voor een willekeurige leer-situatie. Bedenk: wat is hier de slimme aanpak?</p>`}
    <button class="btn block" data-act="sim" style="margin-top:12px">🎲 ${sc?'Nieuwe situatie':'Geef me een situatie'}</button>
  </div>
  <div class="card">
    <b style="font-size:14px">Zo pak je 'm aan</b>
    <p class="sub" style="margin-top:6px">1. Wat wil je bereiken? 2. Welke truc uit de lessen past hier? 3. Begin klein en doe het echt. Gebruik de tips uit de Toolkit.</p>
  </div>`;
}

function tabToolkit(){
  const cats=Object.keys(MATERIAAL);
  const cur=view.mat||cats[0];
  return `
  <div class="hero"><div class="eyebrow">Handige hulp</div><h1>Je leer-toolkit</h1>
    <p>Kant-en-klare trucjes en checklists om vandaag te gebruiken bij je huiswerk.</p></div>
  <div class="seg">${cats.map(c=>`<button data-mat="${esc(c)}" class="${c===cur?'on':''}">${esc(c)}</button>`).join('')}</div>
  <div class="card"><ul class="lines" style="padding:0;margin:0">${MATERIAAL[cur].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card center">
    <p class="sub">Wil je oefenen met een echte situatie?</p>
    <button class="btn block" data-tab="oefenen" data-act="naarsim" style="margin-top:10px">🎮 Naar de simulator</button>
  </div>`;
}

function tabIk(){
  const s=streak(), af=afgerond(), pct=Math.round(af/LESSONS.length*100);
  const beheerst=kaartenBeheerst();
  const recent=store.reflecties.slice(-5).reverse();
  const bd=badges();
  return `
  <div class="hero"><div class="eyebrow">Jouw groei</div><h1>Voortgang & medailles</h1><p>Elke dag een beetje. Volhouden wint van heel hard, één keer.</p></div>
  <div class="card">
    <div class="kv"><span>🔥 Huidige streak</span><b>${s} dag${s===1?'':'en'}</b></div>
    <div class="kv"><span>🗓️ Totaal oefendagen</span><b>${store.oefdagen.length}</b></div>
    <div class="kv"><span>📚 Lessen afgerond</span><b>${af} / ${LESSONS.length}</b></div>
    <div class="kv"><span>🧠 Kaarten beheerst</span><b>${beheerst} / ${KAARTEN.length}</b></div>
  </div>
  <div class="card">
    <div class="kv" style="border:0"><span><b>Cursusvoortgang</b></span><b>${pct}%</b></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    ${MODULES.map(m=>{const {done,totaal}=modVoortgang(m.id);const p=Math.round(done/totaal*100);return `
      <div style="margin-top:12px">
        <div class="kv" style="border:0;padding:2px 0"><span style="font-size:13px">${m.emoji} ${esc(m.naam)}</span><b style="font-size:13px">${done}/${totaal}</b></div>
        <div class="pbar mod" style="--mc:${m.kleur}"><i style="width:${p}%"></i></div>
      </div>`;}).join('')}
  </div>
  <div class="card">
    <b style="font-size:15px">🏅 Medailles</b>
    <div class="badges">
      ${bd.map(([e,t,d,unlocked])=>`<div class="badge ${unlocked?'':'locked'}"><span class="be">${e}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}
    </div>
  </div>
  ${recent.length?`<div class="card">
    <b style="font-size:15px">✍️ Jouw reflecties</b>
    <div style="margin-top:8px">${recent.map(r=>`<div class="reflitem"><span class="rd">${esc(r.d)}</span><br>${esc(r.t)}</div>`).join('')}</div>
  </div>`:''}
  <div class="card center">
    <p class="big">${store.oefdagen.length===0?'🚀':'⭐'}</p>
    <p class="sub">${store.oefdagen.length===0?'Begin vandaag met de uitdaging van de dag — de eerste stap is de belangrijkste.':'Knap bezig! Kom morgen terug voor je volgende oefening.'}</p>
  </div>
  <a class="backhome" href="../index.html">‹ Terug naar de Bennaghmouch Academie</a>`;
}

function badges(){
  const s=streak(), af=afgerond(), od=store.oefdagen.length, beh=kaartenBeheerst(), ref=store.reflecties.length;
  return [
    ['🌱','Eerste stap','1 oefendag gedaan', od>=1],
    ['🔥','Op dreef','3-dagen streak', s>=3],
    ['⚡','Doorzetter','7-dagen streak', s>=7],
    ['📚','Leergierig','5 lessen afgerond', af>=5],
    ['🎓','Leermeester','alle lessen afgerond', af>=LESSONS.length],
    ['🗓️','Volhouder','30 oefendagen', od>=30],
    ['🧠','Scherp brein','10 kaarten beheerst', beh>=10],
    ['✍️','Denker','5 reflecties', ref>=5]
  ];
}

/* ---------------- EVENTS ---------------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ view.les=null; view.tab=b.dataset.tab; if(b.dataset.act) act(b.dataset.act,b.dataset); render(); }));
  document.querySelectorAll('[data-les]').forEach(b=>b.addEventListener('click',()=>{ view.les=+b.dataset.les; render(); }));
  document.querySelectorAll('[data-mat]').forEach(b=>b.addEventListener('click',()=>{ view.mat=b.dataset.mat; render(); }));
  document.querySelectorAll('[data-oefsub]').forEach(b=>b.addEventListener('click',()=>{ view.oefsub=b.dataset.oefsub; view.reveal=false; render(); }));
  document.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>quizAnswer(+b.dataset.quiz,+b.dataset.opt,b)));
  document.querySelectorAll('[data-act]').forEach(b=>{ if(b.hasAttribute('data-tab')) return; b.addEventListener('click',()=>act(b.dataset.act,b.dataset)); });
}
function quizAnswer(i,opt,btn){
  const l=LESSONS[i]; if(store.checks[i]) return;
  const wrap=btn.closest('.quiz'); const fb=wrap.querySelector('.quizfb'); const opts=wrap.querySelectorAll('.opt');
  if(opt===l.check.a){ store.checks[i]=true; save();
    opts.forEach(o=>{o.disabled=true;}); btn.classList.add('good');
    fb.style.display='block'; fb.className='quizfb goodfb'; fb.innerHTML='✅ Klopt! '+esc(l.check.u);
  } else {
    btn.classList.add('bad'); btn.disabled=true;
    fb.style.display='block'; fb.className='quizfb badfb'; fb.textContent='Nog niet — probeer een andere.';
  }
}
function act(a,ds){
  if(a==='terug'){ view.les=null; view.tab='lessen'; render(); }
  else if(a==='done'){ store.done[+ds.les]=true; save(); render(); }
  else if(a==='undone'){ store.done[+ds.les]=false; save(); render(); }
  else if(a==='oefdone'){ const t=today(); if(!store.oefdagen.includes(t)){ store.oefdagen.push(t); store.oefdagen=store.oefdagen.slice(-400); store.oefLaatst=t; save(); } render(); }
  else if(a==='nieuwetip'){ const el=document.querySelector('.quote'); const arr=MATERIAAL["Onthoud-trucs"]; if(el) el.innerHTML='💡 '+esc(arr[Math.floor(Math.random()*arr.length)]); }
  else if(a==='reflsave'){ const el=document.getElementById('reflinput'); if(!el) return; const t=el.value.trim(); const d=today();
    const ex=store.reflecties.find(r=>r.d===d);
    if(t===''){ if(ex) store.reflecties=store.reflecties.filter(r=>r.d!==d); }
    else if(ex){ ex.t=t; } else { store.reflecties.push({d,t}); }
    store.reflecties=store.reflecties.slice(-200); save(); render();
  }
  else if(a==='kaartreveal'){ view.reveal=true; render(); }
  else if(a==='kaartgoed'||a==='kaartfout'){ const id=+ds.kid; const st=store.kaarten[id]||{box:0,due:0};
    if(a==='kaartgoed'){ st.box=Math.min(5,(st.box||0)+1); } else { st.box=0; }
    st.due=dagIndex()+KINTERVAL[st.box]; store.kaarten[id]=st; save(); view.reveal=false; render();
  }
  else if(a==='sim'){ view.sim=Math.floor(Math.random()*SIM.length); view.simModel=false; render(); }
  else if(a==='simmodel'){ view.simModel=true; render(); }
  else if(a==='naarsim'){ view.oefsub='sim'; }
}
/* Deze cursus stond achter een slot met een cijfercode. Dat slot is eraf: het
   is lesstof voor volwassenen en er staat niets in dat afgeschermd hoeft te
   worden — geen gegevens van een kind, geen account, geen naam. Wat je hier
   doet blijft net als eerst in localStorage op dit toestel staan. */
render();
