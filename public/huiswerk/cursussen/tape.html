<script>
"use strict";
/* ============================================================
   TAPE, technische analyse voor gevorderden
   Zelfstandig bestand, werkt offline, geen verbinding naar buiten.
   Voortgang in localStorage, in dezelfde vorm als de andere cursussen
   van de Academie (done, oefdagen, kaarten), zodat de startpagina hem
   met dezelfde uitlezer kan lezen.

   Alle grafieken zijn verzonnen. Ze komen uit een generator met een
   vast zaadje, zodat elke les elke keer hetzelfde laat zien, en ze zijn
   zo gebouwd dat ze het ene verschijnsel tonen waar de les over gaat.
   Echte grafieken zijn rommeliger; dat staat er in de lessen ook bij.
   ============================================================ */
const KEY='tape_v1';
const store=(()=>{ let s={};
  try{ s=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ s={}; }
  s.done=s.done||{}; s.oefdagen=s.oefdagen||[]; s.kaarten=s.kaarten||{};
  s.trainer=s.trainer||{goed:0,totaal:0}; s.laatsteLes=s.laatsteLes??null;
  return s; })();
function bewaar(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
/* Met voorloopnullen: de startpagina sorteert deze datums als tekst. */
function vandaag(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dagIndex(){ return Math.floor(Date.now()/86400000); }
function oefendag(){ const v=vandaag(); if(!store.oefdagen.includes(v)){ store.oefdagen.push(v); bewaar(); } }

/* ---------------- getallen ---------------- */
const nl=(x,d=2)=>Number(x).toFixed(d).replace('.',',');
const nlk=(x)=>Math.round(x).toLocaleString('nl-NL');
const pct=(x,d=1)=>nl(x*100,d)+'%';
const R=(x,d=2)=>(x>=0?'+':'')+nl(x,d)+'R';

/* ---------------- toeval met een zaadje ---------------- */
function rng(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function gauss(r){ let u=0; while(!u) u=r(); const v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

/* ---------------- koersreeks ----------------
   Een reeks bestaat uit stukken. Een stuk {n,to,s,v,v2} loopt in n bars van
   de huidige koers naar `to`, met ruis s en een volume dat van v naar v2
   schuift. Omdat elke stap opnieuw naar het doel rekent, trekt de ruis
   zichzelf recht en eindigt het stuk waar het hoort. Een stuk {bar:{c,h,l,v}}
   is één met de hand gemaakte bar: c is de verandering, h en l de lonten. */
function reeks(seed,stukken,start=100,basis=1000){
  const r=rng(seed); const uit=[]; let c=start;
  for(const g of stukken){
    if(g.bar){ const b=g.bar, o=c, cl=c+b.c;
      uit.push({o, c:cl, h:Math.max(o,cl)+(b.h??0.08), l:Math.min(o,cl)-(b.l??0.08), v:Math.round(basis*(b.v??1)*(0.92+0.16*r()))});
      c=cl; continue; }
    const doel=g.to??c, s=g.s??0.4;
    for(let k=0;k<g.n;k++){
      const rest=g.n-k, o=c, cl=c+(doel-c)/rest+gauss(r)*s*(rest>1?1:0.15);
      const h=Math.max(o,cl)+Math.abs(gauss(r))*s*0.55, l=Math.min(o,cl)-Math.abs(gauss(r))*s*0.55;
      const vm=(g.v??1)+((g.v2??g.v??1)-(g.v??1))*(g.n>1?k/(g.n-1):0);
      const v=basis*vm*(0.75+0.25*Math.abs(cl-o)/(s||1))*Math.exp(gauss(r)*0.22);
      uit.push({o,h,l,c:cl,v:Math.round(v)}); c=cl;
    }
  }
  return uit;
}
function bundel(d,f){ const uit=[]; for(let i=0;i<d.length;i+=f){ const g=d.slice(i,i+f);
  uit.push({o:g[0].o, c:g[g.length-1].c, h:Math.max(...g.map(b=>b.h)), l:Math.min(...g.map(b=>b.l)), v:g.reduce((a,b)=>a+b.v,0)}); } return uit; }

/* ---------------- indicatoren ---------------- */
function ema(d,n){ const k=2/(n+1); const uit=[]; let e=d[0].c; d.forEach((b,i)=>{ e=i? b.c*k+e*(1-k) : b.c; uit.push(i>=n-1?e:null); }); return uit; }
function sma(a,n){ return a.map((_,i)=> i<n-1?null : a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n); }
/* VWAP met de typische prijs; de banden zijn de volumegewogen standaardafwijking. */
function vwap(d,van=0){ let pv=0,vv=0,p2=0; return d.map((b,i)=>{ if(i<van) return null;
  const tp=(b.h+b.l+b.c)/3; pv+=tp*b.v; vv+=b.v; p2+=tp*tp*b.v; const w=pv/vv; const sd=Math.sqrt(Math.max(0,p2/vv-w*w)); return {w,sd}; }); }
/* ATR volgens Wilder: true range, glad gestreken met 1/n. */
function atr(d,n=14){ const uit=[]; let a=null; d.forEach((b,i)=>{ const pc=i?d[i-1].c:b.c; const tr=Math.max(b.h-b.l,Math.abs(b.h-pc),Math.abs(b.l-pc));
  if(i<n){ a=(a??0)+tr/n; uit.push(i===n-1?a:null); } else { a=(a*(n-1)+tr)/n; uit.push(a); } }); return uit; }
/* Swingpunten: een top is een bar met de hoogste high van k links en k rechts.
   Alleen bevestigde punten: wie de rechterrand van de grafiek meetelt, tekent
   toppen die er op dat moment nog niet waren. */
function swings(d,k=3){ const p=[];
  for(let i=k;i<d.length-k;i++){ const r=d.slice(i-k,i+k+1);
    if(d[i].h===Math.max(...r.map(b=>b.h))) p.push({i,t:'H',p:d[i].h});
    if(d[i].l===Math.min(...r.map(b=>b.l))) p.push({i,t:'L',p:d[i].l}); }
  const z=[]; for(const q of p){ const l=z[z.length-1];
    if(l&&l.t===q.t){ if((q.t==='H'&&q.p>l.p)||(q.t==='L'&&q.p<l.p)) z[z.length-1]=q; } else z.push(q); }
  let vh=null, vl=null; for(const q of z){ if(q.t==='H'){ q.lab=vh==null?'H':(q.p>vh?'HH':'LH'); vh=q.p; } else { q.lab=vl==null?'L':(q.p>vl?'HL':'LL'); vl=q.p; } }
  return z; }
/* Volumeprofiel: het volume van elke bar gelijk verdeeld over zijn bereik.
   Value area: vanaf de POC steeds de zwaarste buur erbij tot zeventig procent. */
function profiel(d,lo,hi,bins=28){ const st=(hi-lo)/bins; const v=new Array(bins).fill(0);
  d.forEach(b=>{ const a=Math.max(0,Math.floor((b.l-lo)/st)), z=Math.min(bins-1,Math.floor((b.h-lo)/st)); const per=b.v/(z-a+1); for(let j=a;j<=z;j++) v[j]+=per; });
  const tot=v.reduce((x,y)=>x+y,0); let poc=v.indexOf(Math.max(...v)); let a=poc,z=poc,som=v[poc];
  while(som<0.7*tot && (a>0||z<bins-1)){ const onder=a>0?v[a-1]:-1, boven=z<bins-1?v[z+1]:-1; if(boven>=onder){ z++; som+=v[z]; } else { a--; som+=v[a]; } }
  return {v,st,lo,poc,a,z,max:Math.max(...v)}; }

/* ---------------- de grafiek ----------------
   Eén functie voor alle grafieken in de cursus. `toon` knipt de reeks af
   (voor de trainer: je ziet alleen tot het beslismoment), `plek` houdt de
   breedte vast zodat de grafiek niet verspringt als de rest verschijnt. */
function grafiek(d,o={}){
  const W=640, H=o.h||320, n=o.toon??d.length, plek=o.plek??d.length;
  const profB=o.profiel?92:0, asB=46, L=4, Rr=W-asB-profB, T=10;
  const volH=o.geenVol?0:Math.round(H*.2), tus=volH?8:0, PH=H-T-volH-tus-6;
  const zicht=d.slice(0,n);
  let lo=Math.min(...zicht.map(b=>b.l)), hi=Math.max(...zicht.map(b=>b.h));
  (o.zones||[]).forEach(z=>{ lo=Math.min(lo,z.van); hi=Math.max(hi,z.tot); });
  (o.lijnen||[]).forEach(z=>{ lo=Math.min(lo,z.p); hi=Math.max(hi,z.p); });
  if(o.bereik){ lo=Math.min(lo,o.bereik[0]); hi=Math.max(hi,o.bereik[1]); }
  const m=(hi-lo)*.07; lo-=m; hi+=m;
  const cw=(Rr-L)/plek, x=i=>L+(i+.5)*cw, y=p=>T+(hi-p)/(hi-lo)*PH;
  const s=[`<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="${o.label||'koersgrafiek'}">`];
  const stap=netteStap((hi-lo)/4);
  for(let p=Math.ceil(lo/stap)*stap;p<=hi;p+=stap){ s.push(`<line class="raster" x1="0" x2="${W-asB}" y1="${y(p)}" y2="${y(p)}"/><text class="as" x="${W-asB+5}" y="${y(p)+4}">${nl(p,stap<1?2:(stap<10?1:0))}</text>`); }
  if(o.band) s.push(`<rect class="mk" x="${x(o.band[0])-cw/2}" y="${T}" width="${(o.band[1]-o.band[0]+1)*cw}" height="${PH}"/>`);
  if(o.markeer!=null && o.markeer<n) s.push(`<rect class="mk" x="${x(o.markeer)-cw/2}" y="${T}" width="${cw}" height="${H-T}"/>`);
  (o.zones||[]).forEach(z=>{ const x0=z.vanI!=null?x(z.vanI)-cw/2:0; s.push(`<rect class="zone ${z.cls||''}" x="${x0}" y="${y(z.tot)}" width="${Rr-x0}" height="${Math.max(2,y(z.van)-y(z.tot))}"/>`);
    if(z.label) s.push(`<text class="lijntekst" x="${x0+6}" y="${y(z.tot)-4}">${z.label}</text>`); });
  if(o.box){ const b=o.box; s.push(`<rect class="box" x="${x(b.van)-cw/2}" y="${y(b.hi)}" width="${(b.tot-b.van+1)*cw}" height="${y(b.lo)-y(b.hi)}"/>`); if(b.label) s.push(`<text class="lijntekst blauw" x="${x(b.van)}" y="${y(b.hi)-4}">${b.label}</text>`); }
  if(o.profiel){ const pr=profiel(zicht,lo,hi,o.bins||30); const X0=Rr+4, bw=profB-10;
    pr.v.forEach((v,j)=>{ const y1=y(lo+(j+1)*pr.st), h=Math.max(1,y(lo+j*pr.st)-y1-1); const cls=j===pr.poc?'poc':(j>=pr.a&&j<=pr.z?'va':'');
      s.push(`<rect class="prof ${cls}" x="${X0}" y="${y1}" width="${Math.max(1,v/pr.max*bw)}" height="${h}"/>`); });
    if(o.va){ const vah=lo+(pr.z+1)*pr.st, val=lo+pr.a*pr.st, pp=lo+(pr.poc+.5)*pr.st;
      [[vah,'VAH','wit'],[pp,'POC',''],[val,'VAL','wit']].forEach(([p,t,c])=>s.push(`<line class="lijn ${c}" x1="0" x2="${Rr}" y1="${y(p)}" y2="${y(p)}"/><text class="lijntekst ${c}" x="6" y="${y(p)-4}">${t}</text>`)); }
  }
  zicht.forEach((b,i)=>{ const up=b.c>=b.o, bw=Math.max(1,cw*.64), top=y(Math.max(b.o,b.c)), bh=Math.max(1,Math.abs(y(b.o)-y(b.c)));
    s.push(`<line class="${up?'lont-up':'lont-dn'}" x1="${x(i)}" x2="${x(i)}" y1="${y(b.h)}" y2="${y(b.l)}"/><rect class="${up?'up':'dn'}" x="${x(i)-bw/2}" y="${top}" width="${bw}" height="${bh}"/>`); });
  const pl=(arr,cls,van=0)=>{ const pts=[]; for(let i=van;i<n;i++){ const v=arr[i]; if(v!=null) pts.push(`${x(i).toFixed(1)},${y(v).toFixed(1)}`); } if(pts.length>1) s.push(`<polyline class="${cls}" points="${pts.join(' ')}"/>`); };
  (o.ema||[]).forEach(k=>pl(ema(d,k),'ema'));
  if(o.vwap){ const w=vwap(d,o.vwapVan||0); pl(w.map(q=>q&&q.w),'vwap'); if(o.banden){ pl(w.map(q=>q&&q.w+q.sd),'band'); pl(w.map(q=>q&&q.w-q.sd),'band'); pl(w.map(q=>q&&q.w+2*q.sd),'band'); pl(w.map(q=>q&&q.w-2*q.sd),'band'); } }
  (o.avwap??[]).forEach(a=>{ const w=vwap(d,a); pl(w.map(q=>q&&q.w),'avwap'); s.push(`<circle cx="${x(a)}" cy="${y((d[a].h+d[a].l)/2)}" r="4" fill="#b48cf2"/>`); });
  (o.lijnen||[]).forEach(l=>{ const x0=l.vanI!=null?x(l.vanI):0; s.push(`<line class="lijn ${l.cls||''}" x1="${x0}" x2="${Rr}" y1="${y(l.p)}" y2="${y(l.p)}"/>`); if(l.label) s.push(`<text class="lijntekst ${l.cls||''}" x="${l.rechts?Rr-6:x0+6}" y="${y(l.p)-4}" ${l.rechts?'text-anchor="end"':''}>${l.label}</text>`); });
  if(o.swings){ swings(zicht,o.k||3).forEach(q=>{ const boven=q.t==='H'; s.push(`<text class="swing ${boven?'h':'l'}" x="${x(q.i)}" y="${boven?y(q.p)-6:y(q.p)+14}" text-anchor="middle">${q.lab}</text>`); }); }
  (o.noten||[]).forEach(t=>{ if(t.i>=n) return; const b=d[t.i]; const boven=t.boven!==false; const py=boven?y(b.h)-10:y(b.l)+18;
    s.push(`<text class="noot" x="${Math.min(Rr-4,Math.max(4,x(t.i)))}" y="${py}" text-anchor="${x(t.i)>Rr-80?'end':(x(t.i)<80?'start':'middle')}">${t.t}</text>`); });
  if(o.beslis!=null) s.push(`<line class="beslis" x1="${x(o.beslis)+cw/2}" x2="${x(o.beslis)+cw/2}" y1="${T}" y2="${H}"/>`);
  if(volH){ const vt=H-volH, vmax=Math.max(...zicht.map(b=>b.v));
    zicht.forEach((b,i)=>{ const h=b.v/vmax*(volH-4); s.push(`<rect class="${b.c>=b.o?'v-up':'v-dn'} ${o.markeer===i?'v-mk':''}" x="${x(i)-Math.max(1,cw*.64)/2}" y="${H-h}" width="${Math.max(1,cw*.64)}" height="${h}"/>`); });
    if(o.volGem){ const g=sma(d.map(b=>b.v),20); const pts=[]; for(let i=0;i<n;i++) if(g[i]!=null) pts.push(`${x(i).toFixed(1)},${(H-g[i]/vmax*(volH-4)).toFixed(1)}`); if(pts.length>1) s.push(`<polyline class="volgem" points="${pts.join(' ')}"/>`); }
    s.push(`<text class="as" x="${W-asB+5}" y="${vt+12}">vol</text>`); }
  if(o.klik) zicht.forEach((b,i)=>s.push(`<rect class="klik" data-act="${o.klik}" data-i="${i}" x="${x(i)-cw/2}" y="0" width="${cw}" height="${H}"/>`));
  s.push('</svg>'); return s.join('');
}
function netteStap(r){ const e=Math.pow(10,Math.floor(Math.log10(r))); const f=r/e; return (f<1.5?1:f<3?2:f<7?5:10)*e; }

/* Twee lijnen onder elkaar, voor prijs en cumulatieve delta. */
function lijnenGrafiek(reeksen,o={}){
  const W=640, H=o.h||300, n=reeksen[0].w.length, L=4, Rr=W-46, gap=10, ph=(H-10-gap*(reeksen.length-1))/reeksen.length;
  const s=[`<svg viewBox="0 0 ${W} ${H}" class="graf" role="img" aria-label="${o.label||'grafiek'}">`];
  reeksen.forEach((r,k)=>{ const top=5+k*(ph+gap); let lo=Math.min(...r.w), hi=Math.max(...r.w); const m=(hi-lo)*.12||1; lo-=m; hi+=m;
    const x=i=>L+i*(Rr-L)/(n-1), y=v=>top+(hi-v)/(hi-lo)*ph;
    s.push(`<rect x="0" y="${top}" width="${W}" height="${ph}" fill="#0b0f14"/><line class="raster" x1="0" x2="${Rr}" y1="${top+ph}" y2="${top+ph}"/>`);
    if(r.nul&&lo<0&&hi>0) s.push(`<line class="raster" x1="0" x2="${Rr}" y1="${y(0)}" y2="${y(0)}" stroke-dasharray="3 3"/>`);
    s.push(`<polyline class="lijnplot" stroke="${r.kleur}" points="${r.w.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`);
    s.push(`<text class="as" x="${Rr+5}" y="${top+14}">${r.naam}</text>`); });
  s.push('</svg>'); return s.join(''); }

{m:'structuur', t:"Niveaus zijn zones met een geheugen", d:"Een niveau werkt niet door de lijn op je scherm, maar door de orders die er liggen.", min:7,
 tekst:[
  "Een niveau werkt niet omdat er een lijn op je scherm staat, maar omdat er op die prijs iets gebeurd is dat mensen onthouden: een top waar kopers vastzitten, een dal waar verkopers te laat waren, een opening, een gap. Wie bij de vorige top kocht en sindsdien verlies heeft, verkoopt graag bij break-even. Dat is aanbod, en het staat op een prijs.",
  "Er is ook een mechanische reden, en die is onderzocht. Carol Osler bekeek de werkelijke orderboeken van een grote valutabank en vond dat winstnemingsorders zich ophopen óp ronde getallen en stop-loss-orders net erachter. Het eerste verklaart waarom de koers vaak op een rond niveau keert; het tweede waarom hij versnelt als het niveau eenmaal gebroken is, want dan gaan de stops af en worden ze marktorders in de richting van de uitbraak.",
  "Daarom is een niveau een zone en geen streep. De sterkste niveaus zijn zichtbaar op het hogere tijdframe, er is eerder met volume op gereageerd, en ze zijn niet te vaak getest. Dat laatste is contra-intuïtief: elke test haalt orders weg die er lagen, dus een niveau dat vijf keer is aangetikt, is eerder uitgeput dan sterker. En een doorbroken niveau wisselt van rol. Oude weerstand wordt steun, omdat de verkopers die er zaten weg zijn en de kopers die de uitbraak misten er alsnog willen instappen."
 ],
 ia:'niveaus',
 bewijs:{sterkte:2, tekst:"Osler (2000) vond dat steun- en weerstandsniveaus die zes firma's aan klanten doorgaven, intraday vaker een trendonderbreking voorspelden dan willekeurige niveaus, al verschilde de kracht per valuta en per firma. Osler (2003) toonde met echte orderdata dat winstnemingen clusteren op ronde getallen en stop-losses net daarachter, wat zowel het keren óp het niveau als het versnellen erdoorheen verklaart. Het effect is statistisch duidelijk en praktisch bescheiden."},
 valkuil:"Tien lijnen op een grafiek. Als elk niveau belangrijk is, is geen enkel niveau belangrijk. Houd er per tijdframe twee of drie, en weet van elk waarom het er staat.",
 regel:"Teken zones, geen strepen, en verwacht de stops net áchter het voor de hand liggende getal.",
 check:{v:"Een weerstand is vijf keer getest zonder door te breken. Wat is de meest verdedigbare lezing?", o:["Hij wordt steeds sterker","Elke test haalt aanbod weg; de kans op een doorbraak neemt eerder toe","Het aantal tests zegt niets"], a:1, u:"Elke test vult orders die er lagen. Blijft de vraag komen, dan raakt het aanbod op dat niveau op."}},

/* ======================= VOLUME ======================= */
{m:'volume', t:"Inspanning tegen resultaat", d:"Hoog volume is niet bullish en laag volume niet bearish. De betekenis zit in de verhouding met de prijs.", min:8,
 tekst:[
  "Volume is inspanning, de prijsbeweging is het resultaat. Die gedachte, uit het werk van Richard Wyckoff van een eeuw geleden, is nog steeds de bruikbaarste manier om volume te lezen. Je vraagt bij een opvallende bar niet ‘is het volume hoog?’ maar ‘past het resultaat bij de inspanning?’",
  "Dat geeft vier situaties. <b>Groot volume en een grote bar</b>: inspanning en resultaat in harmonie, de beweging is echt. <b>Groot volume en een kleine bar</b>, of een lange lont: er werd hard geduwd maar de prijs kwam niet vooruit, iemand heeft aan de andere kant alles opgenomen. Dat heet absorptie, en het is vaak het eerste teken van een omslag. <b>Klein volume en een grote beweging</b>: weinig tegenpartij, de prijs glijdt door een leeg gebied. Dat kan doorlopen, maar het is broos. <b>Klein volume en een kleine bar</b>: niemand heeft haast. In een pullback binnen een trend is dat precies wat je wilt zien.",
  "Volume staat nooit op zichzelf. Het is de verhouding met de prijs, én de plek waar het gebeurt, die de betekenis geeft. Absorptie midden in een range zegt weinig; absorptie precies op een weerstand van het dagniveau zegt veel. In de oefening hieronder zie je steeds een stukje grafiek met de laatste bar gemarkeerd, en de stippellijn in het volumevenster is het gemiddelde van twintig bars. Welke van de vier is het?"
 ],
 ia:'kwadrant',
 bewijs:{sterkte:2, tekst:"De relatie tussen volume en prijs is een van de oudste onderwerpen in de empirische financiering. Campbell, Grossman en Wang (1993) vonden dat koersbewegingen op hoog volume eerder terugdraaien, wat past bij liquiditeitsvraag die door anderen wordt opgevangen. Llorente, Michaely, Saar en Wang (2002) lieten zien dat het omgekeerde geldt voor aandelen waar veel private informatie in omgaat: daar lopen bewegingen op hoog volume juist door. Dat is inspanning tegen resultaat in academische taal: hetzelfde volume betekent iets anders naargelang wie er handelt."},
 valkuil:"Volume vergelijken met de vorige bar. Volume schommelt sterk per bar. Vergelijk met het gemiddelde van de laatste twintig bars, en intraday met hetzelfde tijdstip op eerdere dagen (volgende les).",
 regel:"Vraag bij elke opvallende bar: past het resultaat bij de inspanning?",
 check:{v:"Op een dagweerstand verschijnt een bar met drie keer het normale volume, maar de body is klein en de bovenlont lang. Wat zie je?", o:["Sterke kopers, de uitbraak volgt","Absorptie: kopers duwden, een verkoper nam alles op","Niets bijzonders"], a:1, u:"Veel inspanning, weinig resultaat, op een niveau met een reden: het klassieke beeld van absorptie."}},

{m:'volume', t:"Relatief volume en de klok", d:"Een miljoen aandelen om tien uur is normaal, om één uur uitzonderlijk. Volume zonder klok is appels met peren.", min:6,
 tekst:[
  "Handelsvolume heeft door de dag een vaste vorm: hoog bij de opening, laag rond het middaguur, weer hoog naar het slot. Dat U-patroon is in de literatuur sinds de jaren tachtig beschreven en zit in bijna elke markt die opent en sluit. Ruw volume vergelijken zonder rekening te houden met de klok is appels met peren vergelijken.",
  "Relatief volume (RVOL) lost dat op: het volume van nu gedeeld door het gemiddelde volume op hetzelfde tijdstip over de afgelopen tien of twintig dagen. Een RVOL van 1 is normaal, boven de 2 gebeurt er iets, en een aandeel dat een uur na de opening op 4 of 5 staat, wordt door de markt opgemerkt. Voor een daytrader is het de eerste filter: zonder ongewone deelname is er geen reden dat een patroon anders afloopt dan anders.",
  "Crypto handelt de klok rond maar kent ook een ritme: de opening van Europa en vooral van de Amerikaanse aandelenmarkt geeft pieken, het weekend is dunner. Dezelfde regel geldt: vergelijk met hetzelfde uur, niet met het vorige uur. Schuif hieronder het tijdstip en het volume en kijk wat de verhouding doet."
 ],
 ia:'rvol',
 bewijs:{sterkte:2, tekst:"Het U-vormige dagpatroon in volume en volatiliteit is breed gedocumenteerd (onder meer Jain en Joh, 1988; Admati en Pfleiderer, 1988, voor de theorie). Dat ongewoon volume informatie draagt, vonden Gervais, Kaniel en Mingelgrin (2001): aandelen met een uitzonderlijk hoog volume over een dag of week presteerden de maand erna beter, de ‘high-volume return premium’, toegeschreven aan extra zichtbaarheid. RVOL als filter voor daytrading is vooral praktijk; zie les 17 voor het onderzoek naar de openingsrange."},
 valkuil:"Hoog volume bij de opening lezen als bijzondere belangstelling. De eerste vijftien minuten zijn altijd druk; pas de vergelijking met dezelfde vijftien minuten op andere dagen zegt iets.",
 regel:"Vergelijk volume altijd met hetzelfde moment op andere dagen.",
 check:{v:"Om 13.00 uur is het volume in een halfuur 400.000, bij een gemiddelde van 150.000. Om 9.30 uur was het 900.000, bij een gemiddelde van 1.000.000. Welk moment is ongewoner?", o:["9.30 uur, want daar is het volume het hoogst","13.00 uur: een RVOL van ongeveer 2,7 tegen 0,9","Ze zijn even ongewoon"], a:1, u:"400.000 gedeeld door 150.000 is ongeveer 2,7; 900.000 gedeeld door 1.000.000 is 0,9. Het drukke moment was eigenlijk een rustige opening."}},

{m:'volume', t:"VWAP en geankerde VWAP", d:"De gemiddelde prijs van iedereen die kocht. Geen indicator, maar een boekhoudkundig feit.", min:8,
 tekst:[
  "VWAP is de gemiddelde prijs die vandaag betaald is, gewogen naar volume: de som van prijs maal volume, gedeeld door het totale volume, meestal met de typische prijs per bar (high plus low plus close, gedeeld door drie). Het is geen indicator in de gewone zin maar een boekhoudkundig feit: wie vandaag kocht, zit gemiddeld op die prijs. Grote partijen worden er bovendien op afgerekend; een koopopdracht die onder de VWAP is uitgevoerd, geldt als goed werk.",
  "Daaruit volgt het gedrag. Boven de VWAP staan de kopers van vandaag gemiddeld op winst en is er weinig haast om te verkopen. Eronder staan ze op verlies, en is elke terugkeer naar de VWAP een kans om er zonder schade uit te gaan. Een koers die de VWAP terugwint en erboven blijft, of er steeds op afketst, vertelt je wie de dag in handen heeft. De banden eromheen zijn een en twee volumegewogen standaardafwijkingen: een maat voor hoe ver de koers van het gemiddelde is afgedwaald.",
  "De geankerde VWAP (AVWAP) is hetzelfde, maar je kiest zelf het beginpunt: een belangrijk dal, een top, een kwartaalcijfer, een gap. Hij beantwoordt de vraag ‘wat is de gemiddelde prijs van iedereen die sinds dát moment kocht?’ Voor een swingtrader is dat vaak bruikbaarder dan een voortschrijdend gemiddelde, omdat het ankerpunt een reden heeft en de lengte van een gemiddelde niet. <b>Tik hieronder op een bar om daar een AVWAP te ankeren.</b>"
 ],
 ia:'vwap',
 bewijs:{sterkte:1, tekst:"VWAP als maatstaf voor uitvoeringskwaliteit is in de literatuur over handelskosten standaard (Berkowitz, Logue en Noser, 1988, en veel werk daarna), en dat verklaart waarom grote partijen eromheen handelen. Of de koers er als steun of weerstand op reageert, is voor zover bekend niet overtuigend onafhankelijk getoetst. Behandel hem als referentie voor wie er in de winst of het verlies staat, niet als bewezen keerpunt."},
 valkuil:"De VWAP gebruiken waar hij niets betekent. De dag-VWAP hoort bij intraday; op een weekgrafiek is hij een willekeurige lijn. En omdat crypto geen opening heeft, is de ‘dag’ daar een afspraak, meestal 00.00 uur UTC.",
 regel:"Anker waar iets gebeurde, niet waar het mooi uitkomt.",
 check:{v:"Een aandeel staat de hele ochtend onder de VWAP en wordt er drie keer precies op afgewezen. Wat is de meest verdedigbare lezing?", o:["De kopers hebben de dag in handen","De verkopers hebben de dag in handen; kopers van vandaag gebruiken de VWAP om break-even uit te stappen","De VWAP zegt hier niets"], a:1, u:"Onder de VWAP staan de kopers van vandaag op verlies. Elke terugkeer naar hun gemiddelde prijs is voor hen een uitgang: aanbod."}},

{m:'volume', t:"Volumeprofiel: waar is gehandeld", d:"Draai de volume-as een kwartslag en de vraag verandert van ‘wanneer was het druk?’ naar ‘waar vond de markt de prijs eerlijk?’", min:7,
 tekst:[
  "Het gewone volume staat onder de grafiek, per tijdseenheid. Het volumeprofiel draait die as een kwartslag: hoeveel is er op elke prijs verhandeld?",
  "Drie begrippen zijn genoeg. De <b>point of control</b> (POC) is de prijs met het meeste volume, de plek waar kopers en verkopers het het langst eens waren. De <b>value area</b> is de zone rond de POC waar ongeveer zeventig procent van het volume viel, een conventie uit de Market Profile-methode die Peter Steidlmayer in de jaren tachtig aan de beurs van Chicago ontwikkelde. En dan de knopen: gebieden met veel volume (HVN) werken als stroop, de prijs vertraagt en draait er; gebieden met weinig volume (LVN) als ijs, de prijs schiet erdoorheen omdat daar nooit overeenstemming was.",
  "In de praktijk: een uitbraak uit de value area die niet terugkeert, is acceptatie van een nieuwe prijs. Een uitbraak die snel terugvalt in de value area, heeft een redelijke kans om naar de andere kant ervan te lopen. En een LVN tussen je ingang en je doel is goed nieuws; een HVN ertussen is een obstakel."
 ],
 ia:'profiel',
 bewijs:{sterkte:1, tekst:"Market Profile en het volumeprofiel zijn in de praktijk wijdverbreid, maar academisch nauwelijks getoetst. De onderliggende gedachte dat prijzen waar veel volume is verhandeld als referentiepunt werken, sluit aan bij het werk over ‘anchoring’ en over kostprijseffecten: beleggers gedragen zich anders rond de prijs waarop ze kochten (Grinblatt en Han, 2005). Het is een plausibel en veelgebruikt kader, geen bewezen voorspeller."},
 valkuil:"Het profiel over een willekeurige periode trekken. Een profiel over zes maanden mengt twee markten als er halverwege een trendbreuk was. Begin een profiel op een punt dat ertoe doet, net als een AVWAP.",
 regel:"LVN tussen ingang en doel: vrije baan. HVN ertussen: obstakel.",
 check:{v:"Tussen je ingang en je koersdoel ligt een gebied waar zeer weinig is verhandeld. Wat betekent dat voor de trade?", o:["Een obstakel: de prijs zal er stoppen","De prijs beweegt daar doorgaans snel doorheen","Het maakt niet uit"], a:1, u:"Weinig volume betekent dat daar nooit overeenstemming over de prijs was. De koers glijdt er meestal doorheen."}},

{m:'volume', t:"Climax, droogte en de uitbraak die volume nodig heeft", d:"Het grootste volume van maanden is zelden het begin van een beweging, en vaak het einde.", min:7,
 tekst:[
  "Aan het eind van een lange beweging verschijnt vaak één bar met extreem volume: de climax. Bij een daling heet het verkoopclimax: paniek bij de laatste houders, een lange onderlont, het grootste volume van maanden. Het is zelden het exacte dal, maar het is wel het moment waarop wie moest verkopen dat gedaan heeft. Wie dán short gaat, verkoopt aan de partij die al die paniek aan het opkopen is.",
  "Het tegendeel is droogte. Na een climax volgt vaak een test: de koers zakt terug naar het gebied van de climax, maar nu op een fractie van het volume. Er is geen aanbod meer. Die test op laag volume is de eigenlijke ingang, niet de climax zelf.",
  "Voor uitbraken geldt het omgekeerde. Een uitbraak uit een compressie op hoog relatief volume heeft meer deelnemers achter zich dan een uitbraak op dun volume; de tweede is vaker een val. Het is geen garantie. Het is een verschuiving van de kansen, en dat is alles wat technische analyse ooit biedt. Loop hieronder stap voor stap door een climax en zijn test."
 ],
 ia:'climax',
 bewijs:{sterkte:1, tekst:"Het bredere verschijnsel is onderzocht: extreme bewegingen op zeer hoog volume draaien op korte termijn gemiddeld deels terug (Campbell, Grossman en Wang, 1993), en Lee en Swaminathan (2000) vonden dat verliezers met een hoog volume later beter presteren dan de momentumlogica zou voorspellen, alsof het volume het einde van de beweging markeert. De specifieke Wyckoff-figuren (climax, test, spring) zijn als regel nauwelijks getoetst."},
 valkuil:"Volume op een uitbraak beoordelen terwijl de bar nog loopt. Halverwege een bar is het volume per definitie laag. Kijk naar het tempo: ligt het volume na de helft van de tijd al boven het gemiddelde van een hele bar?",
 regel:"Niet shorten in de climax, wel kopen op de test die geen aanbod meer vindt.",
 check:{v:"Na een verkoopclimax zakt de koers terug naar het dal, op een derde van het volume. Wat is dat?", o:["Een nieuwe verkoopgolf","Een test zonder aanbod: een mogelijke ingang long","Niets, volume doet er hier niet toe"], a:1, u:"Dezelfde prijs, een fractie van het volume: de verkopers die er waren, zijn weg."}},

/* ======================= ORDERBOEK ======================= */
{m:'boek', t:"Het orderboek van binnen", d:"Limietorders bieden liquiditeit aan, marktorders nemen haar weg. De prijs beweegt alleen als een niveau leeg is.", min:7,
 tekst:[
  "Het orderboek (level 2) toont de limietorders die wachten: kopers op de bid, verkopers op de ask, per prijsniveau de hoeveelheid. Level 1 is alleen de beste bid en ask. Het verschil tussen beide is de spread, en die betaal je elke keer dat je met een marktorder instapt.",
  "Het belangrijkste mechanisme is dit: een limietorder biedt liquiditeit aan, een marktorder neemt haar weg. De prijs beweegt alleen als marktorders een niveau helemaal opeten. Een koper die met een marktorder meer wil dan er op de beste ask ligt, loopt het boek op en betaalt steeds meer: slippage. Hoe dunner het boek, hoe verder hij loopt.",
  "Dat verklaart waarom dezelfde order in het ene aandeel geruisloos wordt opgenomen en in het andere de koers een procent verzet, en waarom kleine aandelen zo hard bewegen op nieuws: er ligt weinig in het boek, dus weinig marktorders zijn genoeg om het leeg te trekken. Probeer het hieronder: koop of verkoop met een marktorder en kijk hoe diep je het boek in gaat."
 ],
 ia:'boek',
 bewijs:{sterkte:3, tekst:"Dit is het best onderbouwde deel van de cursus. Cont, Kukanov en Stoikov (2014) lieten bij vijftig Amerikaanse aandelen zien dat de onbalans tussen orders aan de bid- en askkant (order flow imbalance) prijsveranderingen over tien seconden voor gemiddeld zo'n 65 procent verklaart, lineair, en dat de prijsimpact omgekeerd evenredig is met de diepte van het boek. Let op: dat is verklaren van wat er tegelijk gebeurt, geen voorspellen. Chordia en Subrahmanyam (2004) vonden dat de orderonbalans van gisteren samenhangt met het rendement van vandaag. Cao, Hansch en Wang (2009) vonden op de Australische beurs dat het boek voorbij de beste bied- en laatprijs ongeveer 22 procent van de prijsvorming draagt."},
 valkuil:"Denken dat je met een marktorder ‘de prijs’ krijgt. Je krijgt de prijzen van alle niveaus die je opeet. In een dun boek of een snelle markt: een limietorder, of een order met een prijsgrens.",
 regel:"Kijk voor je instapt hoeveel er op de eerste drie niveaus ligt, en vergelijk dat met je order.",
 check:{v:"Beste ask 50,01 met 800 stuks, daarna 50,02 met 1.200. Je koopt 2.000 stuks met een marktorder. Wat is je gemiddelde prijs?", o:["50,01","Ongeveer 50,016","50,02"], a:1, u:"800 × 50,01 plus 1.200 × 50,02, gedeeld door 2.000, is 50,016. Je betaalt voor het deel dat het eerste niveau niet dekte."}},

{m:'boek', t:"Level 2 lezen, en waar het liegt", d:"Het boek toont intentie, de tape toont feiten. Wie ze verwart, laat zich leiden door orders die er zijn om gezien te worden.", min:8,
 tekst:[
  "Het boek toont intentie, geen feit. Een limietorder kost niets zolang hij niet wordt uitgevoerd en kan in een milliseconde weg zijn. Wat je ziet is wat partijen willen laten zien, en dat is bij grote partijen zelden alles.",
  "Twee verschijnselen zijn de moeite van het herkennen waard. Het eerste is de <b>iceberg</b>: een grote order die maar een klein deel toont. Op het scherm staan er 300 stuks op de ask, maar op de tape zie je er tienduizenden op die prijs doorgaan, en het niveau blijft staan en vult zich steeds aan. Dat is een verkoper met geduld en een grote order, en zolang hij er staat komt de koers er niet voorbij. Het tweede is <b>spoofing</b>: een grote order die er staat om gezien te worden en verdwijnt zodra de prijs in de buurt komt. Spoofing is in de VS sinds de Dodd-Frank-wet van 2010 uitdrukkelijk verboden, in Europa via de verordening marktmisbruik, maar het komt voor, en in dunne markten makkelijker dan in dikke.",
  "Voor Amerikaanse aandelen weegt een structurele beperking extra zwaar. De handel is verdeeld over meer dan tien beurzen, en een groot deel van het volume gaat buiten de openbare boeken om (in 2025 voor het eerst ruim de helft over het hele jaar), via internaliseerders van particuliere orders en dark pools. Je level 2 laat dus een deel van het aanbod zien, niet het geheel. De tape toont wél elke uitvoering. Loop hieronder de twee scenario's door."
 ],
 ia:'ijsberg',
 bewijs:{sterkte:2, tekst:"Dat verborgen orders een wezenlijk deel van het boek uitmaken, is onder meer aangetoond voor Euronext Parijs (Bessembinder, Panayides en Venkataraman, 2009). Dat het zichtbare boek informatie bevat, zie de vorige les. Tegelijk laat onderzoek naar snelle handel zien dat een groot deel van de orders binnen een seconde weer wordt ingetrokken, wat het naïef lezen van ‘muren’ onbetrouwbaar maakt. Het boek is informatief, maar alleen in combinatie met wat er daadwerkelijk wordt uitgevoerd."},
 valkuil:"Een grote muur op de bid lezen als steun. Een order die er staat om gezien te worden, is er meestal niet om uitgevoerd te worden. Pas als er op die prijs daadwerkelijk wordt gehandeld en het niveau houdt, is het steun.",
 regel:"Het boek zegt wat er zou kunnen gebeuren. De tape zegt wat er gebeurde.",
 check:{v:"Op de ask staat steeds 300 stuks op 12,50. Op de tape gaat er in vijf minuten 45.000 stuks op 12,50 doorheen en de prijs komt er niet boven. Wat is er aan de hand?", o:["Er zijn weinig verkopers","Een iceberg: een grote verkoper die maar een fractie laat zien","Een fout in de data"], a:1, u:"Het getoonde volume vult zich steeds aan terwijl er veel meer wordt uitgevoerd. Dat is de definitie van een verborgen restorder."}},

{m:'boek', t:"De tape en delta", d:"Elke transactie heeft een agressor. Wie de spread oversteekt, laat zien wie haast heeft.", min:8,
 tekst:[
  "Elke transactie heeft een agressor: de partij die een marktorder gaf en daarmee de spread overstak. Een transactie op de ask is een koper die niet wilde wachten, een transactie op de bid een verkoper die niet wilde wachten. <b>Delta</b> is per bar het volume van de agressieve kopers min dat van de agressieve verkopers; de <b>cumulatieve delta</b> (CVD) telt dat op.",
  "Delta op zich is weinig waard: agressie beweegt de prijs, dus stijgende koersen gaan meestal samen met positieve delta. De informatie zit in de afwijking. Stijgt de CVD sterk terwijl de prijs niet vooruitkomt, dan kopen agressieve partijen tegen iemand in die passief, met limietorders, alles opneemt. Dat is absorptie, dezelfde die je in de volumeles aan volume en bar zag, nu van dichterbij. Maakt de prijs een nieuwe top terwijl de CVD een lagere top maakt, dan wordt de beweging gedragen door steeds minder agressie: uitputting.",
  "Twee kanttekeningen. In aandelen wordt de agressorkant geschat, niet gemeten: algoritmes als dat van Lee en Ready wijzen elke transactie toe aan bid of ask en zitten er in een aanzienlijk deel van de gevallen naast. In crypto futures geven de beurzen de agressorkant wel mee, en daar is delta betrouwbaarder. En delta is het verschil van twee getallen die elk veel groter zijn; bij weinig volume is de ruis groot."
 ],
 ia:'delta',
 bewijs:{sterkte:2, tekst:"Orderonbalans op basis van agressorkant voorspelt korte-termijnrendementen (Chordia, Roll en Subrahmanyam, 2002; Chordia en Subrahmanyam, 2004), maar het effect is klein en kortlevend, en na kosten voor een particulier moeilijk te oogsten. De classificatie zelf heeft een foutmarge: Lee en Ready (1991) is de standaard, en latere studies vinden bij snelle handel duidelijk lagere nauwkeurigheid. Delta is dus een lens, geen signaal."},
 valkuil:"Positieve delta lezen als ‘de kopers winnen’. Tegenover elke agressieve koper staat een passieve verkoper met precies hetzelfde volume. Wie wint, zie je aan de prijs, niet aan de delta.",
 regel:"Delta en prijs samen: stijgen ze samen, dan is het echt; lopen ze uiteen, dan zit er iemand aan de andere kant.",
 check:{v:"De prijs staat een half uur stil op een weerstand, de cumulatieve delta stijgt al die tijd sterk. Wat is de meest verdedigbare lezing?", o:["De kopers winnen, de uitbraak komt eraan","Absorptie: een passieve verkoper neemt alle agressieve koop op","Delta en prijs hebben niets met elkaar te maken"], a:1, u:"Veel agressie, geen prijsbeweging: iemand staat aan de andere kant en vult alles. Blijft die verkoper, dan keert de koers als de kopers moe worden."}},

{m:'boek', t:"Crypto: open interest, funding en liquidaties", d:"Drie gegevens die in aandelen ontbreken en die vertellen waar de pijn zit als de beweging stopt.", min:7,
 tekst:[
  "In crypto perpetual futures zijn er drie gegevens die in aandelen ontbreken. <b>Open interest</b> (OI) is het aantal openstaande contracten. Stijgt de prijs en stijgt de OI, dan komen er nieuwe posities bij; stijgt de prijs en daalt de OI, dan sluiten shorts, een short squeeze, en dat is brandstof die opraakt. De matrix hieronder zet de vier combinaties op een rij.",
  "<b>Funding</b> houdt de perpetual bij de spotprijs: staat de future boven spot, dan betalen longs aan shorts, en andersom. De afrekening gaat periodiek: bij veel beurzen standaard elke acht uur, bij een deel van de contracten elke vier uur of vaker, en Kraken Futures rekent voor Europese klanten elk uur af. Sterk positieve funding betekent dat longs bereid zijn te betalen om long te blijven: een drukke kant. Dat is geen timingsignaal, markten kunnen dagen doorlopen met hoge funding, maar het vertelt je aan welke kant de pijn zit als de beweging stopt.",
  "<b>Liquidaties</b> zijn gedwongen marktorders. Wie met hefboom onder de onderhoudsmarge komt, wordt door de beurs gesloten, tegen de markt in. Dat maakt ze zelfversterkend: een daling liquideert longs, die liquidaties zijn marktverkopen, die duwen de prijs naar de volgende laag liquidaties. De lange lonten in crypto zijn vaak precies dat. Het boek is bovendien versnipperd over tientallen beurzen: wat je op één beurs ziet, is een deel van het geheel."
 ],
 ia:'oi',
 bewijs:{sterkte:2, tekst:"Voor crypto is tijdreeksmomentum sterk gevonden: rendementen van de afgelopen week tot enkele weken voorspellen die van de komende (Liu en Tsyvinski, 2021), en voortschrijdende gemiddelden hebben voorspellende waarde voor bitcoin (Detzel en anderen, 2021). Over funding en open interest als voorspeller is het onderzoek jonger en minder eenduidig; het is vooral bruikbaar als maat voor positionering en dus voor het risico op een squeeze of een liquidatiecascade."},
 valkuil:"Funding of OI als ingangssignaal gebruiken. Het zijn gegevens over positionering, geen trigger. Ze horen bij de vraag ‘hoe hard kan dit bewegen als ik gelijk heb’, niet bij ‘wanneer stap ik in’.",
 regel:"OI en funding vertellen wie er klem kan zitten; de grafiek vertelt wanneer.",
 check:{v:"BTC stijgt 4 procent, de open interest daalt sterk en de funding zakt van hoog positief naar nul. Wat is de beste lezing?", o:["Nieuwe kopers stromen in","Shorts sluiten: een squeeze, en die brandstof raakt op","Longs sluiten"], a:1, u:"Stijgende prijs met dalende OI betekent dat posities gesloten worden, hier de shorts. Een squeeze stopt als er geen shorts meer te sluiten zijn."}},

/* ======================= SETUPS ======================= */
{m:'setups', t:"Uitbraak of val", d:"Van tevoren zien ze er hetzelfde uit. Het verschil zit in de sluiting en het volume.", min:7,
 tekst:[
  "Een goede uitbraak heeft een voorgeschiedenis. De koers heeft een niveau meerdere keren getest, de bars worden krapper (compressie), het volume droogt op terwijl de koers tegen het niveau aan drukt. Dat is een markt waar het aanbod opraakt. De uitbraak zelf komt dan met een wijde bar, een sluiting ruim boven het niveau, en relatief volume dat duidelijk boven het gemiddelde ligt.",
  "Een val ziet er van tevoren hetzelfde uit en onderscheidt zich pas bij de uitbraak: de koers prikt door het niveau, triggert de stops van de shorts en de kooporders van de uitbrekers, en sluit terug binnen de range. Al die kopers zitten op dat moment vast boven een niveau dat niet hield. Hun stops liggen onder de range, en dat is de brandstof voor de beweging de andere kant op. Een mislukte uitbraak is daarmee zelf een setup, vaak een betere dan de uitbraak.",
  "De praktische regel: laat de sluiting beslissen, niet de prikker. Een retest van het doorbroken niveau op laag volume die houdt, is voor wie de eerste bar miste de tweede kans, met een scherpere stop. In de trainer hieronder zie je telkens de grafiek tot het beslismoment. Kies, en zie dan hoe het afliep."
 ],
 ia:'trainer:uitbraak,dun,val',
 bewijs:{sterkte:2, tekst:"Brock, Lakonishok en LeBaron (1992) vonden dat uitbraken uit een handelsbereik op de Dow Jones in de twintigste eeuw voorspellende waarde hadden; latere studies met correctie voor data-snooping en kosten vonden het buiten die periode niet meer terug. Wat wel standhoudt, is de koppeling met volume: Osler (2003) verklaart het versnellen na een doorbraak uit de stop-orders erachter. De mislukte uitbraak als setup is praktijkkennis zonder sterke formele toets."},
 valkuil:"Instappen op de eerste tick boven het niveau. Daar zijn de valse uitbraken het duurst en is de spread vaak het wijdst.",
 regel:"De sluiting beslist, niet de prikker.",
 check:{v:"De koers breekt boven een weerstand, prikt 0,8 procent hoger en sluit het uur terug onder het niveau, op hoog volume. Wat is de best onderbouwde reactie?", o:["Long, de uitbraak is begonnen","Een mislukte uitbraak: een short-scenario met de stop boven de prikker","Niets, het is ruis"], a:1, u:"Kopers zitten vast boven een niveau dat niet hield. Hun stops liggen lager: dat is brandstof voor een daling. De top van de prikker is je ongeldigheidspunt."}},

{m:'setups', t:"De pullback in een trend", d:"De goedkoopste ingang in een trend. Het lastige is het verschil met het begin van een omslag.", min:7,
 tekst:[
  "In een gezonde trend is de pullback de goedkoopste ingang. De trend is er al; je wacht tot hij even pauzeert en stapt in wanneer hij weer op gang komt, met een stop onder het dal van de pauze. Wat het lastig maakt, is het onderscheid tussen een pullback en het begin van een omslag.",
  "Drie dingen helpen. Het <b>volume</b>: een gezonde pullback gaat op dalend volume, de verkopers hebben geen haast; een pullback op stijgend volume is verdacht. De <b>plek</b>: de pullback stopt bij iets met een reden, het doorbroken niveau, de geankerde VWAP vanaf de start van de beweging, of een oplopend gemiddelde dat de trend tot nu toe volgde. En de <b>structuur</b>: het vorige hogere dal blijft intact. Gaat dat punt, dan is het geen pullback meer.",
  "De trigger komt pas daarna: een bar die sluit boven de high van de vorige bar, op oplopend volume. Kopen tijdens de daling omdat ‘het een pullback is’, is raden. Kopen als de daling aantoonbaar gestopt is, kost een fractie van de beweging en scheelt een groot deel van de verliezers."
 ],
 ia:'trainer:pullback,omslag,range,avwap',
 bewijs:{sterkte:3, tekst:"Dit is de setup die het dichtst bij het sterkste bewijs ligt: trend over maanden (Jegadeesh en Titman, 1993; Moskowitz, Ooi en Pedersen, 2012) gecombineerd met omkering over dagen tot weken (Jegadeesh, 1990; Lehmann, 1990). Wie in een trend een korte terugval koopt, handelt twee gedocumenteerde effecten tegelijk. Let wel: momentum kent zeldzame, heftige ‘crashes’, vooral bij een scherpe omslag na een lange daling (Daniel en Moskowitz, 2016)."},
 valkuil:"Een pullback kopen in een trend die al vier of vijf golven lang is. Hoe later in de trend, hoe groter de kans dat de ‘pullback’ het begin van de correctie is. Tel de golven op het hogere tijdframe.",
 regel:"Pullback op dalend volume, naar een plek met een reden, met het hogere dal intact. Dan pas een trigger.",
 check:{v:"Opwaartse trend, pullback naar de geankerde VWAP vanaf het laatste dal. Het volume in de pullback stijgt elke bar. Wat doe je?", o:["Kopen, de AVWAP is steun","Wachten: stijgend volume in een pullback is een waarschuwing","Short gaan"], a:1, u:"De plek klopt, het volume niet. Verkopers met haast in een pullback wijzen op een mogelijke omslag. Wacht tot het volume opdroogt of het hogere dal breekt."}},

{m:'setups', t:"Daytrading: de eerste uren", d:"Intraday heeft een eigen structuur, en die begint bij de opening.", min:7,
 tekst:[
  "De eerste vijf tot dertig minuten zetten de openingsrange neer: het hoog en laag van dat eerste stuk. Die range is geen voorspelling, wel een referentie, met de VWAP als tweede. Een uitbraak uit de openingsrange aan de kant waar de koers ten opzichte van de VWAP staat, op hoog relatief volume, is een van de oudste intradaypatronen; Toby Crabel beschreef het al in 1990. Een uitbraak tegen de VWAP in, of een die terugvalt in de range, is vaker een val.",
  "Daarbij hoort voorbereiding die een swingtrader niet nodig heeft. Vóór de opening: de high en low van gisteren, het slot van gisteren, het premarket-hoog en -laag, en of er nieuws is dat verklaart waarom dít aandeel vandaag anders beweegt. Een aandeel zonder aanleiding en met een RVOL rond 1 doet meestal wat het elke dag doet, binnen een range die je spread en commissie niet waard is.",
  "Dan de middag. Het volume zakt rond het middaguur, de spreads worden relatief wijder, patronen lopen slordiger. Veel ervaren daytraders handelen alleen het eerste en het laatste uur. Dat is geen luiheid; dat is waar de deelname zit. Zet hieronder de lagen aan en uit."
 ],
 ia:'orb',
 bewijs:{sterkte:2, tekst:"Gao, Han, Li en Zhou (2018) vonden in de S&P 500-tracker SPY (1993 tot 2013) dat het rendement van het eerste halfuur het rendement van het laatste halfuur voorspelt, sterker op dagen met veel volume en volatiliteit. De verklaarde variantie is klein, rond 1,5 procent: een echt maar smal effect. Voor de openingsrange-uitbraak op ‘aandelen in beweging’ met hoog relatief volume rapporteerden Zarattini, Barbon en Aziz (2024) over 2016 tot 2023 zeer sterke resultaten na kosten, maar dat is een backtest in een werkdocument zonder peer review, van auteurs met een commercieel belang in daytrading-educatie en -strategieën. Interessant, niet bewezen. Tegenover al dit werk staat de uitkomst voor daytraders als groep (les 22)."},
 valkuil:"In de eerste minuten traden omdat het druk is. De spreads zijn dan het wijdst en de richting wisselt het vaakst. Laat de openingsrange zich eerst vormen.",
 regel:"Geen aanleiding en geen RVOL: geen daytrade.",
 check:{v:"Een aandeel breekt om 10.05 uur uit boven de openingsrange, maar staat onder de VWAP en de RVOL is 0,9. Wat is de beste lezing?", o:["Een sterke uitbraak, instappen","Een zwakke kandidaat: geen ongewone deelname, en tegen de VWAP in","Short gaan, want hij staat onder de VWAP"], a:1, u:"Zonder ongewoon volume en tegen de VWAP in mist de uitbraak de twee dingen die hem onderscheiden van ruis."}},

{m:'risico', t:"Verwachting, met het interval erbij", d:"Een strategie is niet goed omdat ze vaak wint. En twintig trades zeggen bijna niets.", min:8,
 tekst:[
  "Een strategie is niet goed omdat ze vaak wint. Ze is goed als de verwachting positief is: winstkans maal gemiddelde winst, min verlieskans maal gemiddeld verlies. Reken in R, veelvouden van je risico per trade; dan maakt de positiegrootte niet uit. Een strategie met 35 procent winnaars van gemiddeld 3R en verliezers van 1R verdient 0,40R per trade. Een met 70 procent winnaars van 0,5R en verliezers van 1,2R verliest licht.",
  "Wat vrijwel nooit gebeurt, is de volgende stap: hoe zeker ben je van die winstkans? Na twintig trades met twaalf winnaars is je geschatte winstkans 60 procent, maar het 95%-betrouwbaarheidsinterval loopt van ruwweg 39 tot 78 procent. Bij een gemiddelde winst en verlies van 1R betekent dat een verwachting ergens tussen duidelijk verlieslatend en ruim winstgevend. Het is dezelfde les als bij een kleine studie: een getal zonder zijn onzekerheid is misleidend.",
  "Vul hieronder je eigen cijfers in. Het interval voor de winstkans is het Wilson-interval, dat zich ook bij kleine aantallen goed gedraagt. Het neemt de onzekerheid in de gemiddelde winst en het gemiddelde verlies niet mee, dus het werkelijke interval is nog wijder. Het rekent ook uit hoeveel trades je bij deze cijfers nodig hebt voordat de ondergrens boven nul komt."
 ],
 ia:'verwachting',
 bewijs:{sterkte:3, tekst:"Dit is gewone statistiek en geen marktonderzoek: het Wilson-interval (1927) is in vergelijkende studies een van de betrouwbaarste intervallen voor een proportie bij kleine aantallen (Brown, Cai en DasGupta, 2001). Het principe erachter is hetzelfde als in de rest van deze cursus: wat je niet over genoeg gevallen hebt gemeten, weet je niet."},
 valkuil:"Na een reeks verliezers de strategie aanpassen. Bij een winstkans van 40 procent is de kans op minstens één reeks van tien verliezers in 200 trades ongeveer een op drie. Het is geen bewijs dat er iets veranderd is.",
 regel:"Geen winstkans zonder het aantal trades erbij, en geen verwachting zonder interval.",
 check:{v:"Na 30 trades is je winstkans 50 procent, je gemiddelde winst 1,5R en je gemiddeld verlies 1R. Wat kun je zeggen?", o:["De strategie verdient 0,25R per trade","De geschatte verwachting is +0,25R, maar het interval loopt nog tot onder nul","De strategie werkt niet"], a:1, u:"Het Wilson-interval voor 15 uit 30 loopt van ongeveer 33 tot 67 procent. Aan de onderkant is de verwachting negatief. Veelbelovend, niet bewezen."}},

{m:'risico', t:"Positiegrootte en de wiskunde van verlies", d:"De positie volgt uit de stop, niet andersom. En verlies is asymmetrisch.", min:8,
 tekst:[
  "De positiegrootte volgt uit de stop. Je bepaalt eerst waar het idee ongeldig is, dan hoeveel van je rekening je bereid bent te verliezen als dat gebeurt, en pas dan hoeveel stuks je koopt: het risicobedrag gedeeld door de afstand tussen ingang en stop. Wie het andersom doet, eerst een bedrag kiest en dan een stop die ‘past’, legt zijn stop op een plek die niets met de markt te maken heeft.",
  "Hefboom verandert daar niets aan. Een positie met tien keer hefboom en een stop op één procent riskeert evenveel als een positie zonder hefboom met een stop op tien procent, als het risicobedrag gelijk is. De hefboom bepaalt hoeveel onderpand je vastzet en waar de beurs je liquideert, en die liquidatieprijs moet ruim voorbij je stop liggen, anders is de beurs je stop.",
  "Dan de asymmetrie. Na 10 procent verlies heb je 11 procent nodig om terug te komen, na 25 procent 33, na 50 procent 100. Bij 1 procent risico per trade kost een reeks van tien verliezers 9,6 procent; bij 5 procent is dat 40 procent. De simulatie hieronder laat zien hoe wijd de uitkomsten van dezelfde strategie uiteenlopen, alleen door de volgorde van winst en verlies."
 ],
 ia:'positie',
 bewijs:{sterkte:3, tekst:"De wiskunde van positiegrootte gaat terug op Kelly (1956): bij een bekende edge maximaliseert een vaste fractie de groei op lange termijn, en een te grote fractie leidt met zekerheid tot ruïne, ook bij een positieve verwachting. Omdat je edge in werkelijkheid onzeker is (vorige les), gebruiken professionele partijen een fractie van Kelly, vaak de helft of minder. Een vast risico van 0,5 tot 1 procent per trade ligt daar voor de meeste particuliere strategieën ruim onder."},
 valkuil:"Het risico per trade opvoeren na een paar winnaars. Een reeks winst zegt net zo weinig over de volgende trade als een reeks verlies; het enige wat verandert is hoeveel er op het spel staat als het omslaat.",
 regel:"Eerst de stop, dan het risicobedrag, dan pas het aantal stuks.",
 check:{v:"Rekening 20.000, risico 1 procent, ingang 50, stop 48. Hoeveel stuks?", o:["40","100","200"], a:1, u:"Risicobedrag 200, afstand 2 per stuk: 100 stuks. De positie is 5.000 waard, een kwart van de rekening, en toch is het risico 1 procent."}},

{m:'risico', t:"Stops en uitstappen", d:"Een stop hoort waar je ongelijk hebt, niet op een rond getal. Met een marge die de ruis kent.", min:7,
 tekst:[
  "Een stop hoort op de plek waar je idee aantoonbaar fout is: onder het hogere dal bij een long in een trend, boven de top van een mislukte uitbraak bij een short. Dat is een structurele stop. Hij heeft één zwakte: iedereen ziet hetzelfde dal, dus er liggen daar veel stops, en een snelle prik eronder om ze op te halen is een bekend patroon (les 5, de stops net achter het niveau).",
  "Daarom leggen gevorderde traders er een marge onder, en de maat voor die marge is de volatiliteit: de <b>Average True Range</b>, de gemiddelde beweging per bar inclusief gaps, zoals Welles Wilder hem in 1978 beschreef. Een stop een halve tot een hele ATR voorbij het structurele punt valt buiten de gewone ruis. Een stop binnen één ATR van je ingang zonder structurele reden wordt door ruis geraakt, niet door ongelijk. Vergelijk hieronder drie stops op dezelfde trade.",
  "Uitstappen is het moeilijkste deel, omdat het tegen de natuur in gaat: mensen nemen winst te vroeg en laten verlies te lang lopen. Twee werkwijzen houden het mechanisch. Een vast doel op een niveau met een reden, de volgende weerstand of de andere kant van de value area, eventueel met een deel eraf bij 1R. Of een volgstop die met de structuur meeschuift, onder elk nieuw hoger dal. De eerste pakt meer kleine winsten, de tweede laat af en toe een grote lopen. Kies vóór de trade."
 ],
 ia:'stops',
 bewijs:{sterkte:2, tekst:"Osler (2003, 2005) liet met echte orderdata zien dat stop-orders clusteren net voorbij ronde getallen en dat hun uitvoering koersbewegingen versnelt: precies het mechanisme achter de prik onder een voor de hand liggend dal. Over stopregels in trendstrategieën vonden Kaminski en Lo (2014) dat een stop-loss vooral waarde toevoegt als er momentum in de markt zit, en in een markt zonder patroon alleen kost."},
 valkuil:"De stop verplaatsen als de koers ernaartoe loopt. Een stop die je verlegt is geen stop maar een voornemen. Verleggen mag alleen in de richting van minder risico.",
 regel:"Stop = structureel punt plus een halve tot een hele ATR.",
 check:{v:"Long op 100, het laatste hogere dal ligt op 97,40, de ATR is 1,20. Waar leg je de stop het best onderbouwd?", o:["99,00, een procent onder de ingang","Ongeveer 96,80 tot 96,20: onder het dal met een halve tot een hele ATR marge","Precies op 97,40"], a:1, u:"Het dal is het ongeldigheidspunt, de ATR-marge houdt je uit de zone waar de stops van iedereen liggen."}},

{m:'proces', t:"Eén leesvolgorde", d:"Wat de lessen los gaven, moet in één beslissing samenkomen. Snel, en elke keer in dezelfde volgorde.", min:6,
 tekst:[
  "Wat de vorige lessen als losse onderdelen gaven, moet in de praktijk in één beslissing samenkomen. Dat lukt alleen met een vaste volgorde, zodat je niet bij elke grafiek opnieuw hoeft te bedenken waar je kijkt. De volgorde gaat van groot naar klein, en elke stap kan de trade al afblazen.",
  "Eén: <b>context</b>. Welke kant op wijst het hogere tijdframe, en hoe oud is de trend? Twee: <b>locatie</b>. Staat de koers bij een niveau dat een reden heeft, of in niemandsland? Drie: <b>volume</b>. Past de inspanning bij het resultaat, en is de deelname ongewoon? Vier: <b>orderflow</b>, als je hem hebt. Wordt er op het niveau echt gehandeld, en houdt het? Vijf: <b>trigger</b>. Welke concrete gebeurtenis zet je in? Zes: <b>risico</b>. Waar is de stop, hoeveel is 1R, en is de afstand tot het doel minstens twee keer zo groot?",
  "Zeg de antwoorden in één zin hardop of schrijf ze op. Als die zin niet lukt, is er geen trade. Dat klinkt streng, maar het is de enige bescherming tegen de trade die je neemt omdat je al een uur naar het scherm kijkt. Het journaal is hetzelfde, achteraf: dezelfde zes vragen, en een zevende, ‘deed ik wat ik zei’, die belangrijker is dan de uitkomst."
 ],
 ia:'checklist',
 bewijs:{sterkte:2, tekst:"Het bewijs hiervoor komt niet uit de financiering maar uit de geneeskunde en de luchtvaart. De WHO-checklist voor chirurgische veiligheid verminderde in de oorspronkelijke studie de sterfte en complicaties aanzienlijk (Haynes en anderen, 2009), niet door nieuwe kennis maar door bestaande kennis elke keer toe te passen. In trading is het vergelijkbare werk schaars, maar het werk over beslisfouten (volgende les) wijst in dezelfde richting."},
 valkuil:"Het journaal alleen bijhouden voor verliezers. Winnaars die buiten je plan vielen, zijn gevaarlijker: ze belonen gedrag dat je op termijn geld kost.",
 regel:"Geen zin, geen trade.",
 check:{v:"Een grafiek ziet er ‘goed’ uit, maar je kunt geen niveau aanwijzen waar je idee ongeldig is. Wat doe je?", o:["Instappen met een krappe stop","Geen trade","Instappen zonder stop en goed opletten"], a:1, u:"Zonder ongeldigheidspunt is er geen stop, geen 1R en dus geen positiegrootte. Er valt niets te beheersen."}},

{m:'proces', t:"De trader als onzekere factor", d:"De standaarduitkomst van daytrading is verlies. Het verschil zit zelden in de grafiek.", min:7,
 tekst:[
  "De eerlijkste gegevens over daytrading komen uit landen waar alle transacties per persoon te volgen zijn. In Taiwan vonden Barber, Lee, Liu en Odean dat minder dan één procent van de daytraders voorspelbaar winstgevend was na kosten. In Brazilië volgden Chague, De-Losso en Giovannetti in een veelgeciteerd werkdocument iedereen die tussen 2013 en 2015 begon met daytraden in minifutures op de index en dat meer dan driehonderd dagen volhield: 97 procent verloor geld, en 1,1 procent verdiende meer dan het minimumloon. Dat is geen reden om het niet te doen. Het is een reden om te weten dat de standaarduitkomst verlies is, en dat het verschil zelden in de grafiek zit.",
  "Het zit in gedrag. Het <b>dispositie-effect</b>, winnaars te vroeg verkopen en verliezers te lang houden, is door Odean in de rekeningen van tienduizend beleggers aangetoond. <b>Overtrading</b>: in de gegevens van Barber en Odean verdienden de huishoudens die het meest handelden het minst, vooral door kosten. <b>Recency</b>: de laatste drie trades wegen zwaarder dan de laatste driehonderd. En de wraaktrade na een verlies, waarin je niet meer handelt op de grafiek maar op je saldo.",
  "De tegenmaatregelen zijn saai en ze werken: een maximaal dagverlies waarna je stopt, een maximum aantal trades per dag, en de vaste leesvolgorde vóór elke trade. Als arts ken je het principe: niet de kennis van de richtlijn onderscheidt de goede dokter, maar het volgen ervan om drie uur 's nachts."
 ],
 ia:'bias',
 bewijs:{sterkte:3, tekst:"Barber, Lee, Liu en Odean (2014) en Chague, De-Losso en Giovannetti (2019) gebruikten volledige transactiegegevens van hele markten, geen enquêtes. Odean (1998) vond het dispositie-effect in de rekeningen van tienduizend beleggers bij een Amerikaanse broker; Barber en Odean (2000) vonden in ruim 66.000 huishoudens dat de actiefste handelaren 11,4 procent per jaar haalden, tegen 17,9 procent voor de markt. Samen de robuustste bevindingen in de hele cursus."},
 valkuil:"Denken dat deze cijfers over anderen gaan. Iedereen in die datasets dacht dat ook.",
 regel:"Leg dagverlies en maximum aantal trades vast vóór de opening, niet erna.",
 check:{v:"Na drie verliezers op rij voel je de drang om de volgende trade groter te maken om het terug te verdienen. Wat beschermt het best?", o:["Een kortere stop, zodat de grotere positie hetzelfde risico heeft","Een vooraf vastgelegd dagverlies en een vaste positiegrootte","Doorgaan tot je weer op nul staat"], a:1, u:"De beslissing moet genomen zijn voordat de emotie er is. Achteraf kiezen is precies het gedrag dat de cijfers verklaart."}}
];

/* ================================================================
   INTERACTIEF
   Elk stuk is een functie die HTML teruggeeft, met zijn toestand in
   `st`. Een klik op iets met data-act roept ACT aan en tekent daarna
   alleen dat ene stuk opnieuw, zodat de pagina niet naar boven springt.
   ================================================================ */
const st={ vraag:{} };
const IA={}, ACT={}, INP={};
function blok(w,titel,inhoud){ return `<div class="ia" id="${iaId(w)}" data-w="${w}"><div class="kop">${titel}</div>${inhoud}</div>`; }
const iaId=w=>'ia-'+w.replace(/[^a-z0-9]/gi,'_');
function herteken(w){ const el=document.getElementById(iaId(w)); if(!el) return; const [naam,arg]=w.split(':'); const tmp=document.createElement('div'); tmp.innerHTML=IA[naam](arg,w); el.innerHTML=tmp.firstElementChild.innerHTML; }
function toonIA(w){ const [naam,arg]=w.split(':'); return IA[naam](arg,w); }
const knop=(act,tekst,extra='',cls='knop klein stil')=>`<button class="${cls}" data-act="${act}" ${extra}>${tekst}</button>`;
const seg=(act,opties,huidig)=>`<div class="seg">${opties.map(([v,t])=>`<button data-act="${act}" data-v="${v}" class="${String(v)===String(huidig)?'aan':''}">${t}</button>`).join('')}</div>`;

/* ---------- bewijskaart ---------- */
st.bk=0;
const STERKTE=['Geen bewijs','Zwak of niet getoetst','Gemengd of beperkt','Sterk en breed'];
const punten=s=>'<span style="letter-spacing:2px;color:var(--pri)">'+'●'.repeat(s)+'<span style="color:#3a4553">'+'●'.repeat(3-s)+'</span></span>';
IA.bewijskaart=(a,w)=>blok(w,'Bewijskaart',
  `<div class="matrix" style="grid-template-columns:1fr">${BEWIJSKAART.map((b,i)=>`<button data-act="bk" data-v="${i}" class="${st.bk===i?'aan':''}"><b>${b.n}</b>${punten(b.s)} <span class="klein">${STERKTE[b.s]}</span>${st.bk===i?`<div style="margin-top:8px;font-size:14px;color:#dde4ea">${b.t}</div>`:''}</button>`).join('')}</div>`);
ACT.bk=el=>{ st.bk=+el.dataset.v; };

/* ---------- data-snooping ---------- */
st.sn={seed:7};
function snoopRun(seed){
  const r=rng(seed), N=1000, p=[100]; for(let i=1;i<N;i++) p.push(p[i-1]*Math.exp(gauss(r)*0.012));
  const cs=[0]; p.forEach((v,i)=>cs.push(cs[i]+v)); const gem=(i,n)=>i<n-1?null:(cs[i+1]-cs[i+1-n])/n;
  const lr=p.map((v,i)=>i?Math.log(v/p[i-1]):0), half=N/2, regels=[];
  for(let k=0;k<200;k++){ const f=3+Math.floor(r()*28), s=f+10+Math.floor(r()*170); let a=0,b=0; const eq=[0];
    const stand=j=>gem(j,s)==null?0:(gem(j,f)>gem(j,s)?1:-1);
    for(let i=1;i<N;i++){ const pos=stand(i-1); const x=pos*lr[i]-(i>1&&pos!==stand(i-2)?0.0005:0);
      if(i<half) a+=x; else b+=x; eq.push(eq[i-1]+x); }
    regels.push({f,s,a,b,eq}); }
  const best=regels.reduce((m,x)=>x.a>m.a?x:m); const gemB=regels.reduce((t,x)=>t+x.b,0)/regels.length;
  const markt=p.map(v=>Math.log(v/p[0]));
  return {best,gemB,markt,half,N,rang:1+regels.filter(x=>x.b>best.b).length};
}
IA.snoop=(a,w)=>{ const R0=snoopRun(st.sn.seed), b=R0.best, e=x=>pct(Math.exp(x)-1,0);
  const W=640,H=230,L=4,Rr=594; const all=[...b.eq,...R0.markt]; const lo=Math.min(...all), hi=Math.max(...all);
  const x=i=>L+i*(Rr-L)/(R0.N-1), y=v=>8+(hi-v)/(hi-lo||1)*(H-16);
  const pl=(arr,kl)=>`<polyline class="lijnplot" stroke="${kl}" points="${arr.map((v,i)=>i%2?'':x(i).toFixed(1)+','+y(v).toFixed(1)).filter(Boolean).join(' ')}"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="graf"><rect x="${x(R0.half)}" y="0" width="${Rr-x(R0.half)}" height="${H}" fill="rgba(233,188,85,.06)"/><line class="beslis" x1="${x(R0.half)}" x2="${x(R0.half)}" y1="0" y2="${H}"/>
    <line class="raster" x1="0" x2="${Rr}" y1="${y(0)}" y2="${y(0)}"/>${pl(R0.markt,'#7d8995')}${pl(b.eq,'#e9bc55')}
    <text class="noot" x="${x(R0.half)-8}" y="18" text-anchor="end">gekozen</text><text class="noot" x="${x(R0.half)+8}" y="18">getest</text></svg>`;
  return blok(w,'Proef: tweehonderd regels op toeval', svg+`
   <div class="uitkomst"><div class="kv"><span>Beste regel (gemiddelde ${b.f} tegen ${b.s}), eerste helft</span><b>${e(b.a)}</b></div>
   <div class="kv"><span>Dezelfde regel, tweede helft</span><b>${e(b.b)}</b></div>
   <div class="kv"><span>Alle 200 regels gemiddeld, tweede helft</span><b>${e(R0.gemB)}</b></div>
   <div class="kv"><span>Plaats van de ‘beste’ regel in de tweede helft</span><b>${R0.rang} van 200</b></div></div>
   <p class="uitleg">Goud is de beste regel, grijs de koers zelf, een toevalswandeling. Links van de streep is de regel gekozen, rechts wordt hij getest. Er zit geen enkel patroon in deze koers, dus alles wat de beste regel links verdiende, is toeval dat eruitziet als vakmanschap. Druk een paar keer op ‘nieuwe koers’. Links ziet de beste regel er steeds goed uit. Rechts gaan alle regels op en neer met de richting die het toeval die helft kiest, en de plaats van de ‘beste’ regel in die rangorde is willekeurig: soms bovenaan, soms onderaan, gemiddeld in het midden. De transactiekosten zijn hier klein gehouden (vijf honderdste procent per wissel).</p>
   <div class="rij">${knop('sn','Nieuwe koers')}</div>`); };
ACT.sn=()=>{ st.sn.seed++; };

const STRUCT=[

/* ---------- tijdframes ---------- */
st.tf='hoog';
const TFBASIS=reeks(11,[{n:240,to:130,s:.35,v:1},{n:110,to:121,s:.3,v:1.15},{n:34,to:121.9,s:.18,v:.55}]);

  <p class="uitleg">Drie keer liep de koers vast onder dezelfde zone. De vierde keer gaat hij erdoor, op duidelijk hoger volume, en de terugval daarna stopt precies op de oude weerstand, nu op laag volume. De verkopers die er zaten zijn weg; wie de uitbraak miste, koopt hier. Let ook op de toppen: ze liggen niet op één streep, en dat is waarom het een zone is.</p>`); };
