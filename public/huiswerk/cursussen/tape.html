/* ---------- data-snooping ---------- */
st.sn={seed:7};
function snoopRun(seed){
  const r=rng(seed), N=1000, p=[100]; for(let i=1;i<N;i++) p.push(p[i-1]*Math.exp(gauss(r)*0.012));
  const cs=[0]; p.forEach((v,i)=>cs.push(cs[i]+v)); const gem=(i,n)=>i<n-1?null:(cs[i+1]-cs[i+1-n])/n;
  const lr=p.map((v,i)=>i?Math.log(v/p[i-1]):0), half=N/2, regels=[];
  for(let k=0;k<200;k++){ const f=3+Math.floor(r()*28), s=f+10+Math.floor(r()*170); let a=0,b=0; const eq=[0];
    const stand=j=>gem(j,s)==null?0:(gem(j,f)>gem(j,s)?1:-1);
    for(let i=1;i<N;i++){ const pos=stand(i-1); const x=pos*lr[i]-(i>1&&pos!==stand(i-2)?0.0005:0);
      if(i<half) a+=x; else b+=x; eq.push(eq[i-1]+x); }
    regels.push({f,s,a,b,eq}); }
  const best=regels.reduce((m,x)=>x.a>m.a?x:m); const gemB=regels.reduce((t,x)=>t+x.b,0)/regels.length;
  const markt=p.map(v=>Math.log(v/p[0]));
  return {best,gemB,markt,half,N,rang:1+regels.filter(x=>x.b>best.b).length};
}
IA.snoop=(a,w)=>{ const R0=snoopRun(st.sn.seed), b=R0.best, e=x=>pct(Math.exp(x)-1,0);
  const W=640,H=230,L=4,Rr=594; const all=[...b.eq,...R0.markt]; const lo=Math.min(...all), hi=Math.max(...all);
  const x=i=>L+i*(Rr-L)/(R0.N-1), y=v=>8+(hi-v)/(hi-lo||1)*(H-16);
  const pl=(arr,kl)=>`<polyline class="lijnplot" stroke="${kl}" points="${arr.map((v,i)=>i%2?'':x(i).toFixed(1)+','+y(v).toFixed(1)).filter(Boolean).join(' ')}"/>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="graf"><rect x="${x(R0.half)}" y="0" width="${Rr-x(R0.half)}" height="${H}" fill="rgba(233,188,85,.06)"/><line class="beslis" x1="${x(R0.half)}" x2="${x(R0.half)}" y1="0" y2="${H}"/>
    <line class="raster" x1="0" x2="${Rr}" y1="${y(0)}" y2="${y(0)}"/>${pl(R0.markt,'#7d8995')}${pl(b.eq,'#e9bc55')}
    <text class="noot" x="${x(R0.half)-8}" y="18" text-anchor="end">gekozen</text><text class="noot" x="${x(R0.half)+8}" y="18">getest</text></svg>`;
  return blok(w,'Proef: tweehonderd regels op toeval', svg+`
   <div class="uitkomst"><div class="kv"><span>Beste regel (gemiddelde ${b.f} tegen ${b.s}), eerste helft</span><b>${e(b.a)}</b></div>
   <div class="kv"><span>Dezelfde regel, tweede helft</span><b>${e(b.b)}</b></div>
   <div class="kv"><span>Alle 200 regels gemiddeld, tweede helft</span><b>${e(R0.gemB)}</b></div>
   <div class="kv"><span>Plaats van de ‘beste’ regel in de tweede helft</span><b>${R0.rang} van 200</b></div></div>
   <p class="uitleg">Goud is de beste regel, grijs de koers zelf, een toevalswandeling. Links van de streep is de regel gekozen, rechts wordt hij getest. Er zit geen enkel patroon in deze koers, dus alles wat de beste regel links verdiende, is toeval dat eruitziet als vakmanschap. Druk een paar keer op ‘nieuwe koers’. Links ziet de beste regel er steeds goed uit. Rechts gaan alle regels op en neer met de richting die het toeval die helft kiest, en de plaats van de ‘beste’ regel in die rangorde is willekeurig: soms bovenaan, soms onderaan, gemiddeld in het midden. De transactiekosten zijn hier klein gehouden (vijf honderdste procent per wissel).</p>
   <div class="rij">${knop('sn','Nieuwe koers')}</div>`); };
ACT.sn=()=>{ st.sn.seed++; };

/* ---------- structuur ---------- */
const STRUCT=[
 {naam:'A', segs:[{n:8,to:104},{n:5,to:102},{n:8,to:107},{n:5,to:104.8},{n:8,to:110},{n:5,to:108},{n:6,to:112}], goed:'op', uitleg:"Elke top hoger (HH), elk dal hoger (HL). Het laatste HL is het punt dat deze trend moet verdedigen; daar hoort een stop voor een long."},
 {naam:'B', segs:[{n:8,to:96},{n:5,to:98.2},{n:8,to:93},{n:5,to:95.2},{n:8,to:90},{n:5,to:92},{n:6,to:88}], goed:'neer', uitleg:"Lagere toppen (LH) en lagere dalen (LL). De laatste LH is het punt waar een short ongeldig wordt."},
 {naam:'C', segs:[{n:8,to:104},{n:5,to:102},{n:8,to:107},{n:5,to:104.8},{n:8,to:109},{n:6,to:103.5,v:1.5},{n:4,to:105.6,v:.7},{n:6,to:102.2,v:1.4}], goed:'omslag', uitleg:"Tot de laatste top een nette opwaartse trend. Dan breekt de koers onder het laatste HL, op hoger volume, en de opleving daarna blijft onder de vorige top (LH). Dat is een change of character: nog geen bewezen daling, wel het einde van de reden om long te zijn."}
];
st.str={k:0,antw:{}};
IA.structuur=(a,w)=>{ const s=STRUCT[st.str.k], d=reeks(40+st.str.k,s.segs), an=st.str.antw[st.str.k];
  return blok(w,'Lees de structuur',
   seg('strk',STRUCT.map((x,i)=>[i,'Grafiek '+x.naam]),st.str.k)+grafiek(d,{swings:an!=null,k:2,h:280})+
   (an==null?`<p class="uitleg">Hoe zou je de structuur aan de rechterrand noemen?</p><div class="rij">${[['op','Opwaarts'],['neer','Neerwaarts'],['omslag','Omslag bezig']].map(([v,t])=>knop('stra',t,`data-v="${v}"`)).join('')}</div>`
   :`<div class="terugk ${an===s.goed?'goed':'fout'}">${an===s.goed?'Goed gelezen.':'Niet helemaal.'} ${s.uitleg}</div>`)); };
ACT.strk=el=>{ st.str.k=+el.dataset.v; };
ACT.stra=el=>{ st.str.antw[st.str.k]=el.dataset.v; oefendag(); };

/* ---------- tijdframes ---------- */
st.tf='hoog';
const TFBASIS=reeks(11,[{n:240,to:130,s:.35,v:1},{n:110,to:121,s:.3,v:1.15},{n:34,to:121.9,s:.18,v:.55}]);
IA.tijdframe=(a,w)=>{ const v=st.tf; const d=v==='hoog'?bundel(TFBASIS,16):v==='midden'?bundel(TFBASIS,4).slice(-60):TFBASIS.slice(-72);
  const tekst={hoog:"Het hoge tijdframe: een ruime opwaartse trend met aan het eind een terugval. De richting is omhoog; de terugval is voorlopig een pullback, zolang het vorige dal niet breekt.",
    midden:"Het middelste: het einde van de trend en een nette neerwaartse beweging. Dit is het scenario: een correctie in een opwaartse trend, die ergens moet stoppen.",
    laag:"Het lage: de daling is tot stilstand gekomen in een smalle range op laag volume. Hier zoek je de timing. Een uitbraak naar boven uit deze range is de ingang die de drie tijdframes met elkaar verbindt."}[v];
  return blok(w,'Drie tijdframes, dezelfde koers', seg('tf',[['hoog','Hoog (×16)'],['midden','Midden (×4)'],['laag','Laag']],v)+grafiek(d,{ema:v==='hoog'?[]:[20],volGem:true,h:280})+`<p class="uitleg">${tekst}</p>`); };
ACT.tf=el=>{ st.tf=el.dataset.v; };

/* ---------- niveaus ---------- */
st.niv={zone:false,rol:false};
const NIV=reeks(21,[{n:12,to:106,s:.5},{n:6,to:102.5},{n:6,to:105.9,s:.3},{n:6,to:102.8},{n:6,to:105.8,s:.3},{n:4,to:104.4},{n:3,to:107,s:.3,v:1.9,v2:2.2},{n:5,to:108.6},{n:5,to:106.4,s:.25,v:.55},{n:10,to:110.6,v:1.2}]);
IA.niveaus=(a,w)=>{ const z=[]; if(st.niv.zone) z.push({van:105.3,tot:106.2,label:'weerstand, drie keer getest'}); if(st.niv.rol) z.push({van:105.3,tot:106.2,vanI:43,cls:'steun',label:'nu steun'});
  return blok(w,'Zone en rolwissel', grafiek(NIV,{zones:z,volGem:true,h:280})+`<div class="rij">${knop('niv','Toon zone','data-v="zone"',st.niv.zone?'knop klein aan':'knop klein stil')}${knop('niv','Toon rolwissel','data-v="rol"',st.niv.rol?'knop klein aan':'knop klein stil')}</div>
  <p class="uitleg">Drie keer liep de koers vast onder dezelfde zone. De vierde keer gaat hij erdoor, op duidelijk hoger volume, en de terugval daarna stopt precies op de oude weerstand, nu op laag volume. De verkopers die er zaten zijn weg; wie de uitbraak miste, koopt hier. Let ook op de toppen: ze liggen niet op één streep, en dat is waarom het een zone is.</p>`); };
ACT.niv=el=>{ st.niv[el.dataset.v]=!st.niv[el.dataset.v]; };

/* ---------- inspanning tegen resultaat ---------- */
const KWAD={
 bev:{n:'Bevestiging',segs:[{n:18,to:106,s:.4}],b:{c:1.6,h:.15,l:.1,v:2.9},u:"Grote bar, groot volume: inspanning en resultaat in harmonie. De beweging heeft deelnemers achter zich."},
 abs:{n:'Absorptie',segs:[{n:18,to:108,s:.4}],b:{c:.12,h:1.5,l:.1,v:3.1},u:"Drie keer het gemiddelde volume en de koers kwam nauwelijks vooruit: een lange bovenlont, een kleine body. Iemand heeft de koop opgenomen."},
 dun:{n:'Dunne beweging',segs:[{n:18,to:103,s:.35}],b:{c:1.7,h:.1,l:.1,v:.45},u:"Een grote bar op minder dan de helft van het gemiddelde volume. Weinig tegenpartij: het kan doorlopen, maar er staat weinig achter."},
 rust:{n:'Rustige pullback',segs:[{n:14,to:108,s:.4,v:1.1},{n:4,to:106.7,s:.2,v:.5}],b:{c:-.22,h:.1,l:.12,v:.32},u:"Kleine bars, dalend en laag volume in een stijgende trend: niemand heeft haast om te verkopen. Dit is de pullback die je in een trend wilt zien."}
};
st.kw={seed:1,type:'abs',keuze:null,goed:0,tot:0};
function kwNieuw(){ const t=Object.keys(KWAD); st.kw.seed++; st.kw.type=t[Math.floor(rng(st.kw.seed*97)()*t.length)]; st.kw.keuze=null; }
IA.kwadrant=(a,w)=>{ const K=KWAD[st.kw.type], d=reeks(300+st.kw.seed,[...K.segs,{bar:K.b}]), k=st.kw.keuze;
  return blok(w,`Inspanning tegen resultaat <span class="klein" style="float:right;text-transform:none;letter-spacing:0">${st.kw.goed} van ${st.kw.tot} goed</span>`,
   grafiek(d,{markeer:d.length-1,volGem:true,h:250})+
   `<div class="vraag">${Object.entries(KWAD).map(([t,x])=>`<button class="opt ${k!=null?(t===st.kw.type?'goed':(t===k?'fout':'')):''}" data-act="kw" data-v="${t}" ${k!=null?'disabled':''}>${x.n}</button>`).join('')}</div>`+
   (k!=null?`<div class="terugk ${k===st.kw.type?'goed':'fout'}">${K.u}</div><div class="rij">${knop('kwn','Volgende','', 'knop klein')}</div>`:'')); };
ACT.kw=el=>{ if(st.kw.keuze!=null) return; st.kw.keuze=el.dataset.v; st.kw.tot++; if(st.kw.keuze===st.kw.type) st.kw.goed++; oefendag(); };
ACT.kwn=()=>kwNieuw();

/* ---------- RVOL ---------- */
const UUR=['9:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30','14:00','14:30','15:00','15:30'];
const GEMVOL=[1000,640,480,390,330,280,250,240,260,300,360,470,820];
st.rv={t:7,v:400};
IA.rvol=(a,w)=>{ const t=st.rv.t, g=GEMVOL[t], rv=st.rv.v/g, W=640,H=190,bw=W/13;
  const mx=Math.max(...GEMVOL,st.rv.v); const y=v=>H-18-(v/mx)*(H-30);
  const bars=GEMVOL.map((v,i)=>`<rect x="${i*bw+4}" y="${y(v)}" width="${bw-8}" height="${H-18-y(v)}" fill="${i===t?'#e9bc55':'#3a4553'}"/><text class="as" x="${i*bw+bw/2}" y="${H-4}" text-anchor="middle">${UUR[i]}</text>`).join('');
  const nu=`<line x1="${t*bw}" x2="${t*bw+bw}" y1="${y(st.rv.v)}" y2="${y(st.rv.v)}" stroke="#5fd3c7" stroke-width="3"/>`;
  const oordeel=rv<0.8?'rustiger dan normaal':rv<1.5?'normaal voor dit tijdstip':rv<2.5?'duidelijk verhoogd: er gebeurt iets':'uitzonderlijk: de markt let op dit aandeel';
  return blok(w,'Relatief volume',`<svg viewBox="0 0 ${W} ${H}" class="graf" data-deel="rs">${bars}${nu}</svg>
   <div class="velden"><label class="veld"><span data-deel="rl1">Halfuur vanaf ${UUR[t]}</span><input type="range" min="0" max="12" value="${t}" data-inp="rvt"></label>
   <label class="veld"><span data-deel="rl2">Volume nu: ${nlk(st.rv.v*1000)}</span><input type="range" min="50" max="2500" step="10" value="${st.rv.v}" data-inp="rvv"></label></div>
   <div class="uitkomst" data-deel="ru"><div class="kv"><span>Gemiddeld volume in dit halfuur</span><b>${nlk(g*1000)}</b></div><div class="kv"><span>RVOL</span><b>${nl(rv,1)}</b></div><p class="sub" style="margin-top:6px">${oordeel}</p></div>
   <p class="uitleg">Grijs is het gemiddelde volume per halfuur (verzonnen, maar met de vorm van een gewone beursdag), de groene streep het volume van nu. Zet het volume op 800.000 en schuif door de dag: om half tien is dat minder dan normaal, om één uur ruim drie keer zoveel.</p>`); };
INP.rvt=el=>{ st.rv.t=+el.value; }; INP.rvv=el=>{ st.rv.v=+el.value; };

/* ---------- VWAP ---------- */
const VW=reeks(31,[{n:12,to:101.6,s:.35,v:2.1,v2:1.2},{n:14,to:99.2,s:.3,v:1.2,v2:.9},{n:10,to:100.3,s:.25,v:.8},{n:10,to:99.5,s:.2,v:.7},{n:24,to:102.6,s:.3,v:.9,v2:1.6}]);
st.vw={anker:VW.reduce((m,b,i,a)=>b.l<a[m].l?i:m,0),banden:false};
IA.vwap=(a,w)=>blok(w,'VWAP en geankerde VWAP',grafiek(VW,{vwap:true,banden:st.vw.banden,avwap:[st.vw.anker],klik:'vwk',h:300})+
  `<div class="rij">${knop('vwb','Banden','',st.vw.banden?'knop klein aan':'knop klein stil')}<span class="klein"><span style="color:#8fbaf8">▬</span> VWAP van de dag &nbsp; <span style="color:#b48cf2">▬</span> AVWAP vanaf bar ${st.vw.anker+1}</span></div>
  <p class="uitleg">De ochtend opent hoog en zakt onder de VWAP, waar hij twee keer op wordt afgewezen: de kopers van de ochtend stappen uit zodra ze break-even staan. De middag wint de VWAP terug en blijft erboven. Tik op het dal: de AVWAP vanaf daar laat zien waar de kopers van de middag gemiddeld zitten, en de koers blijft er de rest van de dag boven. Tik op de top van de ochtend en je ziet waar het aanbod van die kopers ligt.</p>`);
ACT.vwk=el=>{ st.vw.anker=+el.dataset.i; }; ACT.vwb=()=>{ st.vw.banden=!st.vw.banden; };

/* ---------- volumeprofiel ---------- */
st.pf={seed:5,va:true};
IA.profiel=(a,w)=>{ const d=reeks(st.pf.seed,[{n:15,to:104,s:.5},{n:35,to:103.4,s:.65,v:1.1},{n:6,to:109,s:.4,v:.7},{n:30,to:109.4,s:.55},{n:10,to:107.2,s:.5}]);
  return blok(w,'Volumeprofiel',grafiek(d,{profiel:true,va:st.pf.va,bins:30,h:300})+`<div class="rij">${knop('pfv','POC en value area','',st.pf.va?'knop klein aan':'knop klein stil')}${knop('pfn','Andere grafiek')}</div>
  <p class="uitleg">Twee gebieden waar de markt lang handelde, met daartussen een snelle beweging. In het profiel rechts zie je dat als twee bulten met een dal ertussen: de LVN. Komt de koers terug in dat dal, dan verwacht je geen steun maar snelheid, tot hij weer in een bult komt. De goudkleurige balk is de POC.</p>`); };
ACT.pfv=()=>{ st.pf.va=!st.pf.va; }; ACT.pfn=()=>{ st.pf.seed++; };

/* ---------- climax ---------- */
const CL=reeks(51,[{n:30,to:88,s:.5,v:1,v2:1.35},{bar:{c:-.3,l:3.1,h:.2,v:5.2}},{n:6,to:91.6,s:.4,v:1.3,v2:1},{n:6,to:86.8,s:.28,v:.45,v2:.3},{bar:{c:1.2,l:.1,v:1.7}},{n:10,to:94,s:.4,v:1.1}]);
const CLSTAP=[
 {toon:31,n:[{i:30,t:'climax',boven:false}],t:"Na een lange daling één bar met het grootste volume van de hele reeks en een lange onderlont. Paniek bij de laatste houders, en een koper die alles opneemt. Short gaan is hier de slechtste keuze."},
 {toon:37,n:[{i:30,t:'climax',boven:false},{i:34,t:'opleving'}],t:"De opleving erna is snel: er is geen aanbod meer om hem tegen te houden. Nog geen ingang; je weet niet of het dal houdt."},
 {toon:43,n:[{i:30,t:'climax',boven:false},{i:41,t:'test',boven:false}],t:"De test. De koers zakt terug naar het gebied van de climax, maar op een fractie van het volume. Dezelfde prijs, geen verkopers: het aanbod is op."},
 {toon:54,n:[{i:30,t:'climax',boven:false},{i:41,t:'test',boven:false},{i:43,t:'trigger'}],t:"De trigger: een bar die sluit boven de vorige, op oplopend volume. De stop ligt onder het dal van de test, of met ruimte onder de climax. Dit is de ingang, niet de climax zelf."}
];
st.cl=0;
IA.climax=(a,w)=>{ const s=CLSTAP[st.cl]; return blok(w,'Climax en test, stap voor stap',`<div class="stappen">${CLSTAP.map((_,i)=>`<i class="${i<=st.cl?'aan':''}"></i>`).join('')}</div>`+grafiek(CL,{toon:s.toon,plek:CL.length,noten:s.n,volGem:true,h:280})+`<p class="uitleg">${s.t}</p><div class="rij">${st.cl>0?knop('cl','Vorige','data-v="-1"'):''}${st.cl<CLSTAP.length-1?knop('cl','Volgende','data-v="1"','knop klein'):''}</div>`); };
ACT.cl=el=>{ st.cl=Math.max(0,Math.min(CLSTAP.length-1,st.cl+(+el.dataset.v))); };

/* ---------- orderboek ---------- */
function boekStart(){ return { asks:[800,1200,600,2500,900,4000,1500,700,3000,5200].map((q,i)=>({p:50.01+i*0.01,q,o:q})), bids:[900,1500,700,2200,1100,3500,800,1600,2800,4800].map((q,i)=>({p:50.00-i*0.01,q,o:q})), uit:null, tape:[] }; }
st.bk2=boekStart();
function marktorder(zijde,n){ const b=st.bk2, kant=zijde==='koop'?b.asks:b.bids; const beste=kant.find(x=>x.q>0)?.p; let rest=n,kost=0,niv=0;
  for(const l of kant){ if(rest<=0) break; if(l.q<=0) continue; const x=Math.min(rest,l.q); l.q-=x; rest-=x; kost+=x*l.p; niv++; b.tape.unshift([l.p,x,zijde==='koop'?'k':'v']); }
  const gedaan=n-rest; b.uit={zijde,n,gedaan,gem:gedaan?kost/gedaan:0,beste,niv,rest}; oefendag(); }
IA.boek=(a,w)=>{ const b=st.bk2, u=b.uit, mx=5200;
  const rij=(l,kant)=>`<div class="c ${kant} ${l.q===0?'weg':''}"><i style="width:${l.q/mx*100}%"></i><span>${l.q?nlk(l.q):nlk(l.o)}</span></div>`;
  const rijen=[]; for(let i=9;i>=0;i--) rijen.push(`<div class="c"></div><div class="c p">${nl(b.asks[i].p,2)}</div>${rij(b.asks[i],'ask')}`);
  for(let i=0;i<10;i++) rijen.push(`${rij(b.bids[i],'bid')}<div class="c p">${nl(b.bids[i].p,2)}</div><div class="c"></div>`);
  let uit=''; if(u){ const slip=u.zijde==='koop'?u.gem-u.beste:u.beste-u.gem; uit=`<div class="uitkomst"><div class="kv"><span>Markt${u.zijde==='koop'?'koop':'verkoop'} van ${nlk(u.n)} stuks</span><b>${nlk(u.gedaan)} uitgevoerd</b></div>
    <div class="kv"><span>Beste prijs vooraf</span><b>${nl(u.beste,2)}</b></div><div class="kv"><span>Gemiddelde uitvoering</span><b>${nl(u.gem,4)}</b></div>
    <div class="kv"><span>Slippage</span><b>${nl(slip*100,2)} cent, ${nl(slip/u.beste*10000,1)} basispunten</b></div><div class="kv"><span>Niveaus opgegeten</span><b>${u.niv}</b></div>${u.rest?`<div class="kv"><span>Niet uitgevoerd, boek leeg</span><b>${nlk(u.rest)}</b></div>`:''}</div>`; }
  return blok(w,'Orderboek',`<div class="ladder"><div class="c kop" style="text-align:right">Bid</div><div class="c kop p">Prijs</div><div class="c kop">Ask</div>${rijen.join('')}</div>
   <div class="rij">${[500,3000,10000].map(n=>knop('mo',`Koop ${nlk(n)}`,`data-z="koop" data-n="${n}"`)).join('')}</div>
   <div class="rij">${[500,3000,10000].map(n=>knop('mo',`Verkoop ${nlk(n)}`,`data-z="verkoop" data-n="${n}"`)).join('')}${knop('mor','Boek herstellen','', 'knop klein')}</div>${uit}
   <p class="uitleg">Een koop van 500 stuks past op het eerste niveau: geen slippage, alleen de spread. Een koop van 10.000 loopt zes niveaus op. Op een aandeel van 50 euro lijken een paar cent weinig, maar bij een stop van 50 cent is dat een tiende van je risico, verloren bij het instappen. Doe daarna een tweede koop zonder te herstellen: het boek is dunner geworden, en dezelfde order kost meer.</p>`); };
ACT.mo=el=>marktorder(el.dataset.z,+el.dataset.n); ACT.mor=()=>{ st.bk2=boekStart(); };

/* ---------- iceberg en spoof ---------- */
const lad=(asks,bids)=>({asks,bids});
const IJS={
 ijsberg:[
  {b:lad([[12.54,2100],[12.53,1400],[12.52,900],[12.51,1200],[12.50,300]],[[12.49,1500],[12.48,2200],[12.47,1800],[12.46,2600],[12.45,3000]]),tape:[],hl:12.50,t:"Een rustig boek. Op 12,50 staan 300 stuks te koop. Wie één blik werpt, ziet een dunne ask: een paar kopers en de koers loopt erdoorheen."},
  {b:lad([[12.54,2100],[12.53,1400],[12.52,900],[12.51,1200],[12.50,300]],[[12.49,2400],[12.48,2600],[12.47,1800],[12.46,2600],[12.45,3000]]),tape:[[12.50,300,'k'],[12.50,300,'k'],[12.50,500,'k'],[12.50,300,'k'],[12.50,400,'k']],hl:12.50,t:"Er wordt op 12,50 gekocht: 1.800 stuks, terwijl er maar 300 stonden. En het niveau staat er nog, weer met 300. Het vult zich aan."},
  {b:lad([[12.54,2100],[12.53,1400],[12.52,900],[12.51,1200],[12.50,300]],[[12.49,3100],[12.48,2900],[12.47,2000],[12.46,2600],[12.45,3000]]),tape:[[12.50,2000,'k'],[12.50,1500,'k'],[12.50,3000,'k'],[12.50,2500,'k'],[12.50,1800,'k'],[12.50,4200,'k']],hl:12.50,t:"Vijf minuten later is er op 12,50 ruim 45.000 stuks verhandeld. Op het scherm heeft er nooit meer dan 300 gestaan. De kopers zijn agressief, de delta is sterk positief, en de prijs komt geen cent hoger. Dit is een iceberg."},
  {b:lad([[12.51,1200],[12.50,300],[12.49,800],[12.48,700],[12.47,500]],[[12.46,900],[12.45,1500],[12.44,2200],[12.43,1600],[12.42,2800]]),tape:[[12.48,1200,'v'],[12.47,2000,'v'],[12.47,900,'v'],[12.46,1500,'v']],hl:12.50,t:"De kopers geven het op. Er komt geen vraag meer op 12,50 en de bids trekken zich terug. Wie long ging ‘omdat de ask dun was’, zit nu vast onder een verkoper die er nog steeds staat."}],

/* ---------- de beslisser ---------- */
store.beslis=store.beslis||{};
st.bsl={}; st.bslTag='Alles';
function caseData(C){ const pre=reeks(C.seed,C.pre); const d=reeks(C.seed,[...C.pre,...C.post]); return {d,beslis:pre.length-1}; }
function caseLijst(){ return CASES.filter(c=>st.bslTag==='Alles'||c.tags.includes(st.bslTag)); }
function bslState(w,vast){ if(!st.bsl[w]) st.bsl[w]={id:vast||caseLijst().find(c=>store.beslis[c.id]==null)?.id||CASES[0].id,stap:0,antw:[]}; return st.bsl[w]; }
IA.casus=(arg,w)=>beslisBlok(w,arg);
IA.beslis=(arg,w)=>beslisBlok(w,null);
function beslisBlok(w,vast){
  const S=bslState(w,vast), C=CASES.find(c=>c.id===S.id), {d,beslis}=caseData(C), klaar=S.stap>=C.stap.length;
  const ov=C.ov||{}, opts={toon:klaar?d.length:beslis+1,plek:d.length,volGem:true,beslis,h:330,
    lijnen:(ov.niv||[]).map(([p,l])=>({p,label:l,cls:'wit',rechts:true})),ema:ov.ema||[],vwap:!!ov.vwap,avwap:ov.avwap!=null?[ov.avwap]:[]};
  if(ov.orb){ const g=d.slice(0,ov.orb); opts.box={van:0,tot:ov.orb-1,hi:Math.max(...g.map(b=>b.h)),lo:Math.min(...g.map(b=>b.l)),label:'openingsrange'}; }
  const goedAantal=S.antw.filter((a,k)=>C.stap[k].g.includes(a)).length;
  const stappen=C.stap.map((s,k)=>{ if(k>S.stap) return ''; const a=S.antw[k];
    if(a==null) return `<div class="vraag" style="margin-top:14px"><p style="font-weight:700;font-size:15px"><span class="label">Stap ${k+1} van ${C.stap.length}</span><br>${s.v}</p>${s.o.map((o,j)=>`<button class="opt" data-act="bza" data-v="${j}">${o}</button>`).join('')}</div>`;
    return `<div class="vraag" style="margin-top:14px"><p style="font-weight:700;font-size:14px;color:var(--muted)">${s.v}</p>${s.o.map((o,j)=>s.g.includes(j)||j===a?`<button class="opt ${s.g.includes(j)?'goed':'fout'}" disabled>${o}</button>`:'').join('')}<div class="terugk ${s.g.includes(a)?'goed':'fout'}">${s.u}</div></div>`; }).join('');
  let slot=''; if(klaar){ const e=d[beslis].c, eind=d[d.length-1].c, bew=(eind-e)/e*100;
    slot=`<div class="regel" style="margin-top:14px">${C.kern}</div><p class="klein" style="margin-top:8px">${goedAantal} van ${C.stap.length} stappen verdedigbaar · koers na het beslismoment: ${bew>=0?'+':''}${nl(bew,1)}%</p>
     <div class="rij">${vast?knop('bzr','Opnieuw','', 'knop klein stil'):knop('bzn','Volgende casus','', 'knop klein')+knop('bzr','Opnieuw')}</div>`; }
  return blok(w,`${vast?'Casus':'Beslisser'} · ${C.tags.join(' · ')}${store.beslis[C.id]!=null?` <span class="klein" style="float:right;text-transform:none;letter-spacing:0">beste: ${store.beslis[C.id]}/${C.stap.length}</span>`:''}`,
   `<h3 style="margin-top:6px">${C.t}</h3><p class="klein">${C.markt}${klaar?'':' · je ziet tot de gestippelde lijn'}</p>`+grafiek(d,opts)+
   `<div class="ctx">${C.ctx.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`+stappen+slot); }
ACT.bza=el=>{ const w=el.closest('.ia').dataset.w, S=st.bsl[w], C=CASES.find(c=>c.id===S.id); if(S.antw[S.stap]!=null) return;
  S.antw[S.stap]=+el.dataset.v; S.stap++;
  if(S.stap>=C.stap.length){ const sc=S.antw.filter((a,k)=>C.stap[k].g.includes(a)).length; store.beslis[C.id]=Math.max(store.beslis[C.id]??0,sc); bewaar(); oefendag(); } };
ACT.bzr=el=>{ const w=el.closest('.ia').dataset.w; st.bsl[w].stap=0; st.bsl[w].antw=[]; };
ACT.bzn=el=>{ const w=el.closest('.ia').dataset.w, L=caseLijst(), i=L.findIndex(c=>c.id===st.bsl[w].id);
  const volg=L.slice(i+1).concat(L.slice(0,i+1)); const n=volg.find(c=>store.beslis[c.id]==null)||volg[0]; st.bsl[w]={id:n.id,stap:0,antw:[]}; };

ACT.bzk=el=>{ st.bsl.beslis={id:el.dataset.v,stap:0,antw:[]}; render(); return 'klaar'; };
ACT.bzt=el=>{ st.bslTag=el.dataset.v; const L=caseLijst(); if(!L.some(c=>c.id===st.bsl.beslis?.id)) st.bsl.beslis={id:(L.find(c=>store.beslis[c.id]==null)||L[0]).id,stap:0,antw:[]}; render(false); return 'klaar'; };

const LIQ={
 normaal:{n:'Normaal',spread:.01,f:1,t:"Een gewone middag. De order van 3.000 stuks past in de eerste vier niveaus."},
 nieuws:{n:'Rond nieuws',spread:.05,f:.2,t:"Een minuut voor een macrocijfer. Marktmakers hebben hun quotes grotendeels ingetrokken: de spread is vijf keer zo wijd en er ligt een vijfde van de diepte."},

function liqBoek(k){ const L=LIQ[k], basis=[800,1200,600,2500,900,4000,1500,700,3000,5200]; return basis.map((q,i)=>({p:50+L.spread+i*(k==='paniek'?.05:.01),q:Math.max(50,Math.round(q*L.f))})); }
function vul(asks,n){ let r=n,k=0; for(const l of asks){ const x=Math.min(r,l.q); k+=x*l.p; r-=x; if(!r) break; } return {gem:k/(n-r),rest:r}; }
IA.liqverdwijnt=(a,w)=>{ const asks=liqBoek(st.lq), mx=5200, uit=Object.keys(LIQ).map(k=>{ const v=vul(liqBoek(k),3000); return [LIQ[k].n,v]; });
  return blok(w,'Hetzelfde boek, drie momenten',seg('lq',Object.entries(LIQ).map(([k,v])=>[k,v.n]),st.lq)+
   `<div class="ladder"><div class="c kop" style="text-align:right">Bid</div><div class="c kop p">Prijs</div><div class="c kop">Ask</div>${asks.slice().reverse().map(l=>`<div class="c"></div><div class="c p">${nl(l.p,2)}</div><div class="c ask"><i style="width:${l.q/mx*100}%"></i><span>${nlk(l.q)}</span></div>`).join('')}<div class="c bid"><span>…</span></div><div class="c p">50,00</div><div class="c"></div></div>
   <div class="uitkomst">${uit.map(([n,v])=>`<div class="kv"><span>Koop 3.000 stuks, ${n.toLowerCase()}</span><b>${v.rest?`${nlk(3000-v.rest)} gevuld, rest niet`:`gem. ${nl(v.gem,3)}, ${nl((v.gem-50.005)*100,1)} cent boven het midden`}</b></div>`).join('')}</div>
   <p class="uitleg">${LIQ[st.lq].t}</p>`); };
ACT.lq=el=>{ st.lq=el.dataset.v; };

/* ---------- long tegen short gamma ----------
   Dezelfde schokken, twee soorten hedgers. Bij long gamma trekt het hedgen
   de koers terug naar de strike; bij short gamma duwt het mee met de
   vorige beweging. Een schets van het mechanisme, geen model van de markt. */
st.gm={seed:4};
IA.gamma=(a,w)=>{ const r=rng(st.gm.seed), n=78, lang=[100], kort=[100]; let vk=0;
  for(let i=1;i<n;i++){ const e=gauss(r)*.16; lang.push(lang[i-1]+e-.22*(lang[i-1]-100)); const dk=e+.55*vk; kort.push(kort[i-1]+dk); vk=dk; }
  return blok(w,'Dezelfde schokken, andere hedgers',lijnenGrafiek([{w:lang,naam:'long γ',kleur:'#5fd3c7'},{w:kort,naam:'short γ',kleur:'#ff8a86'}],{h:260,gedeeld:true})+
   `<p class="uitleg">Beide lijnen krijgen exact dezelfde willekeurige schokken en staan op dezelfde schaal. Boven: dealers zijn long gamma en handelen tegen elke beweging in, dus de koers blijft rond de strike van 100 hangen. Onder: dealers zijn short gamma en moeten meebewegen, dus elke beweging krijgt een duw in dezelfde richting. Hetzelfde nieuws, een andere dag.</p><div class="rij">${knop('gmn','Andere schokken')}</div>`); };
ACT.gmn=()=>{ st.gm.seed++; };

/* ---------- contrarian: de drie voorwaarden ---------- */
const MASSA=[['extreem','Extreem sentiment of positionering','funding, calls, koppen, OI'],['klem','Een groep zit klem','hefboom, stops net achter het niveau'],['mislukt','Een mislukte beweging','sluiting terug binnen het niveau'],['nieuws','Nieuws dat de trend verklaart','cijfers, prognose, beleid']];
st.ms={};
IA.massa=(a,w)=>{ const s=st.ms, n=['extreem','klem','mislukt'].filter(k=>s[k]).length;
  const oordeel= s.nieuws?"<b>Niet contrarian.</b> Nieuws dat de beweging verklaart, maakt van extreem sentiment een terechte herwaardering. Hier wint momentum."
   : n===3?"<b>Contrarian trade.</b> Stop voorbij het extreem van de mislukte beweging, doel de andere kant van de range of het vorige acceptatieniveau."
   : s.mislukt&&!s.extreem?"<b>Een gewone mislukte beweging.</b> Handelbaar, maar zonder extreem is de brandstof beperkt: een kleiner doel."
   : n===2&&!s.mislukt?"<b>Wachten.</b> De opstelling is er, de trigger niet. Extreem kan nog lang extreem blijven."
   : "<b>Geen contrarian trade.</b> Tegen de massa zonder extreem en zonder klem is tegen momentum in handelen.";
  return blok(w,'Contrarian of niet',MASSA.map(([k,t,x])=>`<div class="check"><div class="t"><b>${t}</b><span class="klein">${x}</span></div><div class="drie"><button data-act="ms" data-k="${k}" class="${s[k]?'ja':''}">ja</button><button data-act="ms" data-k="${k}" class="${s[k]?'':'nee'}">nee</button></div></div>`).join('')+`<div class="terugk ${n===3&&!s.nieuws?'goed':'fout'}" style="margin-top:12px">${oordeel}</div>`); };
ACT.ms=el=>{ const k=el.dataset.k; st.ms[k]=el.textContent==='ja'; };

/* ---------- openingsrange ---------- */
const ORB=reeks(61,[{bar:{c:.7,h:.4,l:.3,v:4.2}},{n:5,to:100.4,s:.35,v:2.6,v2:1.9},{n:2,to:101.2,s:.2,v:1.5},{bar:{c:.9,h:.1,l:.1,v:2.7}},{n:14,to:103.2,s:.25,v:1.2,v2:.8},{n:30,to:102.6,s:.15,v:.5,v2:.45},{n:25,to:104,s:.22,v:.7,v2:1.7}],100,1000);
st.orb={box:true,vwap:true,gist:true};
IA.orb=(a,w)=>{ const or=ORB.slice(0,6), hi=Math.max(...or.map(b=>b.h)), lo=Math.min(...or.map(b=>b.l));
  return blok(w,'De eerste uren (bars van vijf minuten)',grafiek(ORB,{box:st.orb.box?{van:0,tot:5,hi,lo,label:'openingsrange (30 min)'}:null,vwap:st.orb.vwap,lijnen:st.orb.gist?[{p:101.9,label:'high gisteren',cls:'wit',rechts:true}]:[],h:300})+
   `<div class="rij">${[['box','Openingsrange'],['vwap','VWAP'],['gist','High van gisteren']].map(([k,t])=>knop('orb',t,`data-v="${k}"`,st.orb[k]?'knop klein aan':'knop klein stil')).join('')}</div>
   <p class="uitleg">De eerste dertig minuten zetten een brede range neer op het hoogste volume van de dag. De koers blijft boven de VWAP, breekt uit boven de openingsrange op hoog volume en daarna ook boven de high van gisteren. Dat zijn drie redenen op één plek. Dan de middag: de beweging stokt, het volume valt weg, de bars worden klein. Pas naar het slot komt de deelname terug.</p>`); };
ACT.orb=el=>{ st.orb[el.dataset.v]=!st.orb[el.dataset.v]; };

/* ---------- verwachting met interval ---------- */
function wilson(k,n,z=1.96){ if(!n) return [0,1]; const p=k/n, z2=z*z, dn=1+z2/n, c=(p+z2/(2*n))/dn, m=z*Math.sqrt(p*(1-p)/n+z2/(4*n*n))/dn; return [Math.max(0,c-m),Math.min(1,c+m)]; }
st.vw2={n:20,k:12,w:1,v:1};
IA.verwachting=(a,w)=>{ const {n,k,w:aw,v:av}=st.vw2, kk=Math.min(k,n), p=n?kk/n:0, [lo,hi]=wilson(kk,n), E=q=>q*aw-(1-q)*av;
  let nodig='';
  if(E(p)<=0) nodig='Nooit: bij deze cijfers is de geschatte verwachting zelf niet positief.';
  else { let m=n; while(m<20000 && E(wilson(Math.round(p*m),m)[0])<=0) m+=Math.max(1,Math.round(m*0.02)); nodig=m>=20000?'Meer dan 20.000 trades.':`Ongeveer ${nlk(m)} trades bij dezelfde winstkans${m<=n?' (die heb je al)':''}.`; }
  const x=q=>10+q*600, sc=`<svg viewBox="0 0 620 60" class="graf"><rect x="${x(lo)}" y="20" width="${x(hi)-x(lo)}" height="18" fill="rgba(233,188,85,.3)" stroke="#e9bc55"/><line x1="${x(p)}" x2="${x(p)}" y1="14" y2="44" stroke="#fff" stroke-width="2"/>
    <line x1="${x(av/(aw+av))}" x2="${x(av/(aw+av))}" y1="8" y2="52" stroke="#ef5350" stroke-dasharray="3 3"/><text class="as" x="${x(av/(aw+av))+4}" y="12">break-even ${pct(av/(aw+av),0)}</text><text class="as" x="10" y="56">0%</text><text class="as" x="600" y="56" text-anchor="end">100%</text></svg>`;
  return blok(w,'Verwachting met betrouwbaarheidsinterval',`<div class="velden">
   <label class="veld">Aantal trades<input type="number" min="1" value="${n}" data-inp="vwn"></label><label class="veld">Winnaars<input type="number" min="0" value="${k}" data-inp="vwk"></label>
   <label class="veld">Gemiddelde winst (R)<input type="number" step="0.1" min="0" value="${aw}" data-inp="vww"></label><label class="veld">Gemiddeld verlies (R)<input type="number" step="0.1" min="0.1" value="${av}" data-inp="vwv"></label></div>
   <div data-deel="vu">${sc}<div class="uitkomst"><div class="kv"><span>Winstkans</span><b>${pct(p,0)} (95%: ${pct(lo,0)} tot ${pct(hi,0)})</b></div>
   <div class="kv"><span>Verwachting per trade</span><b>${R(E(p))}</b></div><div class="kv"><span>95%-interval van de verwachting</span><b>${R(E(lo))} tot ${R(E(hi))}</b></div>
   <div class="kv"><span>Nodig voor een ondergrens boven nul</span><b style="text-align:right">${nodig}</b></div></div></div>
   <p class="uitleg">De rode stippellijn is de winstkans waarbij je bij deze winst en dit verlies quitte speelt. Zolang die in de gouden balk valt, weet je niet of je strategie geld verdient. Probeer 12 van 20, en dan 120 van 200: dezelfde winstkans, een heel ander verhaal.</p>`); };
INP.vwn=el=>{ st.vw2.n=Math.max(1,+el.value||1); }; INP.vwk=el=>{ st.vw2.k=Math.max(0,+el.value||0); }; INP.vww=el=>{ st.vw2.w=Math.max(0,+el.value||0); }; INP.vwv=el=>{ st.vw2.v=Math.max(0.1,+el.value||0.1); };

/* ---------- positiegrootte en Monte Carlo ---------- */
st.ps={rek:20000,risico:1,in:50,stop:48,lev:1,wk:40,rw:2,seed:3};
function mc(p,rw,risico,seed){ const r=rng(seed), paden=[], dd=[], eind=[];
  for(let k=0;k<400;k++){ let e=100,top=100,md=0; const pad=[100]; for(let t=0;t<100;t++){ e*= r()<p ? 1+rw*risico : 1-risico; top=Math.max(top,e); md=Math.max(md,1-e/top); pad.push(e); } paden.push(pad); dd.push(md); eind.push(e); }
  const q=(a,f)=>{ const s=[...a].sort((x,y)=>x-y); return s[Math.floor(f*(s.length-1))]; };
  return {paden,q,dd,eind}; }
IA.positie=(a,w)=>{ const s=st.ps, rb=s.rek*s.risico/100, af=Math.abs(s.in-s.stop), stuks=af>0?Math.floor(rb/af):0, waarde=stuks*s.in, onderpand=waarde/Math.max(1,s.lev);
  const long=s.stop<s.in, liq=s.lev>1?(long?s.in*(1-1/s.lev+0.005):s.in*(1+1/s.lev-0.005)):null, liqGevaar=liq!=null&&(long?liq>=s.stop:liq<=s.stop);
  const M=mc(s.wk/100,s.rw,s.risico/100,s.seed), W=640,H=220; const allEind=M.paden.slice(0,40).flat(); const lo=Math.min(...allEind), hi=Math.max(...allEind);
  const x=i=>6+i*(W-52)/100, y=v=>8+(hi-v)/(hi-lo||1)*(H-16);
  const lijn=(pad,kl,dik)=>`<polyline fill="none" stroke="${kl}" stroke-width="${dik}" points="${pad.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  const med=[]; for(let i=0;i<=100;i++) med.push(M.q(M.paden.map(p=>p[i]),.5));
  const svg=`<svg viewBox="0 0 ${W} ${H}" class="graf"><line class="raster" x1="0" x2="${W-46}" y1="${y(100)}" y2="${y(100)}"/>${M.paden.slice(0,40).map(p=>lijn(p,'rgba(154,167,180,.35)',1)).join('')}${lijn(med,'#e9bc55',2.4)}<text class="as" x="${W-42}" y="${y(100)+4}">start</text></svg>`;
  const E=s.wk/100*s.rw-(1-s.wk/100), tk=v=>(v>=100?'+':'')+nl(v-100,0)+'%';
  return blok(w,'Positiegrootte',`<div class="velden">
   <label class="veld">Rekening<input type="number" value="${s.rek}" data-inp="ps" data-k="rek"></label><label class="veld">Risico per trade (%)<input type="number" step="0.1" value="${s.risico}" data-inp="ps" data-k="risico"></label>
   <label class="veld">Ingang<input type="number" step="0.01" value="${s.in}" data-inp="ps" data-k="in"></label><label class="veld">Stop<input type="number" step="0.01" value="${s.stop}" data-inp="ps" data-k="stop"></label>
   <label class="veld">Hefboom (1 = geen)<input type="number" min="1" value="${s.lev}" data-inp="ps" data-k="lev"></label></div>
   <div class="uitkomst" data-deel="p1"><div class="kv"><span>Risicobedrag (1R)</span><b>${nlk(rb)}</b></div><div class="kv"><span>Aantal stuks</span><b>${nlk(stuks)}</b></div>
   <div class="kv"><span>Positiewaarde</span><b>${nlk(waarde)} (${pct(waarde/s.rek,0)} van de rekening)</b></div>${s.lev>1?`<div class="kv"><span>Onderpand bij ${s.lev}× hefboom</span><b>${nlk(onderpand)}</b></div>
   <div class="kv"><span>Liquidatie, grofweg</span><b style="color:${liqGevaar?'var(--fout)':'inherit'}">${nl(liq,2)}${liqGevaar?' , vóór je stop!':''}</b></div>`:''}</div>
   <div data-deel="p1b">${s.lev>1?'<p class="klein" style="margin-top:6px">De liquidatieprijs is een benadering met een onderhoudsmarge van een half procent; de precieze regel verschilt per beurs en per contract.</p>':''}</div>
   <div class="kop" style="margin-top:18px">Honderd trades, vierhonderd keer</div>
   <div class="velden"><label class="veld"><span data-deel="pl1">Winstkans: ${s.wk}%</span><input type="range" min="20" max="70" value="${s.wk}" data-inp="ps" data-k="wk"></label><label class="veld"><span data-deel="pl2">Winst per winnaar: ${nl(s.rw,1)}R</span><input type="range" min="0.5" max="4" step="0.1" value="${s.rw}" data-inp="ps" data-k="rw"></label></div>
   <div data-deel="p2">${svg}<div class="uitkomst"><div class="kv"><span>Verwachting per trade</span><b>${R(E)}</b></div>
   <div class="kv"><span>Rekening na 100 trades, mediaan</span><b>${tk(M.q(M.eind,.5))}</b></div><div class="kv"><span>Slechtste en beste 5 procent</span><b>${tk(M.q(M.eind,.05))} tot ${tk(M.q(M.eind,.95))}</b></div>
   <div class="kv"><span>Diepste terugval onderweg, mediaan</span><b>${pct(M.q(M.dd,.5),0)}</b></div><div class="kv"><span>Diepste terugval, slechtste 10 procent</span><b>${pct(M.q(M.dd,.9),0)} of meer</b></div></div></div>
   <p class="uitleg">Elke grijze lijn is dezelfde strategie met hetzelfde risico, alleen in een andere volgorde. Zet het risico op 1 procent en daarna op 5 procent, en kijk wat de terugval doet. Een strategie met een positieve verwachting kan met te veel risico per trade toch de rekening halveren; dat is de les van Kelly.</p>
   <div class="rij">${knop('psn','Nieuwe vierhonderd')}</div>`); };
INP.ps=el=>{ const v=parseFloat(String(el.value).replace(',','.')); if(!isNaN(v)) st.ps[el.dataset.k]=v; };
ACT.psn=()=>{ st.ps.seed++; };

/* ---------- stops ---------- */
const STP=(()=>{ const d=reeks(71,[{n:20,to:108,s:.45},{n:6,to:104.8,s:.3,v:.6},{n:5,to:107,s:.3,v:1.1},{n:4,to:105.4,s:.3,v:.8},{bar:{c:-.2,l:.5,v:1.9}},{n:12,to:112,s:.4,v:1.1}]);
  const hl=Math.min(...d.slice(20,26).map(b=>b.l)), a=atr(d)[30], sw=d[35]; sw.l=hl-0.45*a; return {d,hl,a,in:d[30].c}; })();
st.sp={k:'dal'};
IA.stops=(a,w)=>{ const S=STP, stops={krap:{p:S.in-0.7*S.a,n:'Krap: 0,7 ATR onder de ingang'},dal:{p:S.hl,n:'Precies op het hogere dal'},atr:{p:S.hl-0.9*S.a,n:'Onder het dal, plus 0,9 ATR'}}, s=stops[st.sp.k];
  const geraakt=S.d.slice(31).findIndex(b=>b.l<=s.p);
  return blok(w,'Drie stops, één trade',seg('sp',[['krap','Krap'],['dal','Op het dal'],['atr','Dal plus ATR']],st.sp.k)+
   grafiek(S.d,{lijnen:[{p:S.in,label:'ingang',cls:'wit',vanI:30},{p:s.p,label:'stop',cls:'rood',vanI:30},{p:S.hl,label:'hoger dal',cls:'groen',rechts:true}],beslis:30,volGem:true,h:290})+
   `<div class="terugk ${geraakt<0?'goed':'fout'}">${s.n}: ${geraakt<0?'blijft staan, de trade loopt door naar het doel.':`geraakt ${geraakt+1} bar${geraakt?'s':''} na de ingang, en daarna loopt de koers zonder jou door.`}</div>
   <p class="uitleg">ATR op het moment van instappen: ${nl(S.a,2)}. De prik onder het dal is geen toeval: daar lagen de stops van iedereen die hetzelfde dal zag, en de uitvoering ervan leverde de verkopers die de prik nodig had. Een stop met een marge van een halve tot een hele ATR valt buiten die zone, en de positie is navenant kleiner.</p>`); };
ACT.sp=el=>{ st.sp.k=el.dataset.v; };

/* ---------- leesvolgorde ---------- */
const CHECK=[
 ['context','Context','Het hogere tijdframe wijst mijn kant op, en de trend is niet oud.',false],
 ['locatie','Locatie','De koers staat bij een niveau met een reden (zone, AVWAP, value area).',true],
 ['volume','Volume','De inspanning past bij wat ik verwacht, en de deelname is ongewoon.',false],
 ['flow','Orderflow','Op het niveau wordt echt gehandeld, en het houdt.',false,true],
 ['trigger','Trigger','Er is een concrete gebeurtenis die ik inzet, niet een gevoel.',true],
 ['risico','Risico','Stop op het ongeldigheidspunt, en het doel ligt minstens 2R verder.',true]
];
st.ck={};
IA.checklist=(a,w)=>{ const v=CHECK.map(c=>st.ck[c[0]]), ingevuld=CHECK.every(c=>st.ck[c[0]]);
  const hard=CHECK.filter(c=>c[3]&&st.ck[c[0]]==='nee'), zacht=CHECK.filter(c=>!c[3]&&st.ck[c[0]]==='nee');
  let oordeel=''; if(ingevuld){ oordeel= hard.length?`<div class="terugk fout"><b>Geen trade.</b> ${hard.map(c=>c[1]).join(', ')} ontbreekt, en dat is niet te compenseren.</div>`
    : zacht.length>=2?`<div class="terugk fout"><b>Geen trade.</b> Twee of meer bijkomende redenen ontbreken (${zacht.map(c=>c[1].toLowerCase()).join(', ')}).</div>`
    : zacht.length===1?`<div class="terugk goed"><b>Toegestaan, kleiner.</b> ${zacht[0][1]} zit niet mee; neem de trade met een halve positie of laat hem.</div>`
    : `<div class="terugk goed"><b>Trade.</b> Schrijf de zin op: context, locatie, trigger, stop en doel.</div>`; }
  return blok(w,'Leesvolgorde',CHECK.map(c=>`<div class="check"><div class="t"><b>${c[1]}</b>${c[2]}</div><div class="drie">${['ja','nee'].concat(c[4]?['nvt']:[]).map(x=>`<button data-act="ck" data-k="${c[0]}" data-v="${x}" class="${st.ck[c[0]]===x?x:''}">${x==='nvt'?'n.v.t.':x}</button>`).join('')}</div></div>`).join('')+
   (oordeel||'<p class="uitleg">Loop de zes stappen door. Locatie, trigger en risico zijn hard: ontbreekt er een, dan is er geen trade.</p>')+`<div class="rij">${knop('ckr','Opnieuw')}</div>`); };
ACT.ck=el=>{ st.ck[el.dataset.k]=el.dataset.v; if(CHECK.every(c=>st.ck[c[0]])) oefendag(); }; ACT.ckr=()=>{ st.ck={}; };

/* ---------- valkuilen ---------- */
const BIAS=['Dispositie-effect','Recency en overmoed','Wraaktrade','Overtrading','Bevestigingsbias'];
const BIASV=[
 ["Je sluit een winnaar op +0,6R omdat je bang bent dat hij terugvalt, terwijl je verliezer van gisteren nog open staat op -1,8R, ver voorbij de stop die je had gepland.",0,"Winst vroeg nemen en verlies laten lopen: het dispositie-effect van Odean, in één scherm."],
 ["Na twee winnende uitbraken verdubbel je de positie op de derde, omdat je ‘het nu door hebt’.",1,"Twee trades zeggen niets over de derde. Het risico hoort bij je plan, niet bij je stemming."],
 ["Vijf minuten na een verlies zie je een nieuwe setup die je normaal zou overslaan, en je neemt hem.",2,"De trade gaat niet over de grafiek maar over het saldo. Een vaste pauze na een verlies werkt beter dan wilskracht."],
 ["Het is een rustige dag zonder nieuws en je hebt al negen trades gedaan.",3,"Barber en Odean: de actiefste handelaren verdienden het minst, vooral door kosten. Een maximum per dag voorkomt het."],
 ["Na je instap lees je vooral berichten en grafieken die bevestigen dat je gelijk hebt.",4,"Zoek na je instap bewust naar het argument tegen: wat moet er gebeuren om je ongelijk te geven? Dat is je stop."]
];
st.bs={i:0,antw:{}};
IA.bias=(a,w)=>{ const [t,g,u]=BIASV[st.bs.i], an=st.bs.antw[st.bs.i];
  return blok(w,`Herken de valkuil (${st.bs.i+1} van ${BIASV.length})`,`<p class="uitleg" style="font-size:15px;color:var(--ink)">${t}</p><div class="vraag">${BIAS.map((b,i)=>`<button class="opt ${an!=null?(i===g?'goed':(i===an?'fout':'')):''}" data-act="bs" data-v="${i}" ${an!=null?'disabled':''}>${b}</button>`).join('')}</div>`+
   (an!=null?`<div class="terugk ${an===g?'goed':'fout'}">${u}</div>`:'')+`<div class="rij">${st.bs.i>0?knop('bsn','Vorige','data-v="-1"'):''}${st.bs.i<BIASV.length-1&&an!=null?knop('bsn','Volgende','data-v="1"','knop klein'):''}</div>`); };
ACT.bs=el=>{ st.bs.antw[st.bs.i]=+el.dataset.v; oefendag(); }; ACT.bsn=el=>{ st.bs.i=Math.max(0,Math.min(BIASV.length-1,st.bs.i+(+el.dataset.v))); };

/* ================================================================
   SCHERMEN
   ================================================================ */
let view={tab:'vandaag', les:null, toets:null, sub:{trainer:'beslis', gereedschap:'positie'}};
const app=document.getElementById('app');
const afgerond=()=>LESSEN.filter((_,i)=>isAf(i)).length;
const modLessen=id=>VOLG.filter(i=>LESSEN[i].m===id);
const volgende=()=>{ const i=VOLG.find(j=>!isAf(j)); return i==null?null:i; };
function kaartenKlaar(){ const d=dagIndex(); return KAARTEN.map((k,i)=>({i,k,s:store.kaarten[i]})).filter(x=>!x.s||(x.s.due||0)<=d); }
function reeksDagen(){ const dagen=new Set(store.oefdagen); let n=0; const d=new Date(); const f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  if(!dagen.has(f(d))){ d.setDate(d.getDate()-1); if(!dagen.has(f(d))) return 0; } while(dagen.has(f(d))){ n++; d.setDate(d.getDate()-1); } return n; }
const casusScore=()=>{ const g=CASES.filter(c=>store.beslis[c.id]!=null); return {gespeeld:g.length, stappen:g.reduce((t,c)=>t+store.beslis[c.id],0), max:g.reduce((t,c)=>t+c.stap.length,0)}; };

function render(boven=true){
  if(boven) window.scrollTo(0,0);
  if(view.les!==null) app.innerHTML=lesScherm(view.les);
  else if(view.toets) app.innerHTML=toetsScherm(view.toets);
  else app.innerHTML={vandaag:tabVandaag,lessen:tabLessen,trainer:tabTrainer,gereedschap:tabGereedschap,ik:tabIk}[view.tab]();

}
const ICO={
 vandaag:'<svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 8-9"/><path d="M15 6h5v5"/></svg>',
 lessen:'<svg viewBox="0 0 24 24"><path d="M4 5h7v14H4zM13 5h7v14h-7z"/></svg>',
 trainer:'<svg viewBox="0 0 24 24"><path d="M7 4v16M12 7v10M17 5v14"/><rect x="5.5" y="8" width="3" height="7"/><rect x="10.5" y="9" width="3" height="5"/><rect x="15.5" y="7" width="3" height="8"/></svg>',
 gereedschap:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M8 18h2M12 18h2"/></svg>',
 ik:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>'
};

  document.getElementById('nav').innerHTML=items.map(([id,l])=>`<button data-tab="${id}" class="${view.les===null&&!view.toets&&view.tab===id?'aan':''}">${ICO[id]}${l}</button>`).join(''); }

function tabVandaag(){
  const v=volgende(), klaar=kaartenKlaar().length, d=dagIndex(), regelLes=LESSEN[d%LESSEN.length], cs=casusScore();
  return `<div class="hero"><div class="merk">Trading</div><h1>Technische analyse, getraind op beslissingen</h1>
   <p>Structuur, volume, orderboek, algoritmes en contrarian denken, samengebracht in één leesvolgorde, en getoetst in scenario's met meerdere stappen.</p>
   <div class="chips"><span class="chip">${cs.gespeeld} van ${CASES.length} casussen</span><span class="chip">${afgerond()} van ${LESSEN.length} lessen</span><span class="chip">${reeksDagen()} dag${reeksDagen()===1?'':'en'} op rij</span></div></div>
   <div class="kaart"><span class="label">Trainen</span><p style="margin-top:6px;font-size:14.5px">Grafiek tot het beslismoment, met de context erbij. Beslis of je instapt, wanneer, waar de stop ligt en wat de doorslag geeft.</p><div class="rij"><button class="knop" data-gaan="trainer:beslis">Beslisser</button><button class="knop stil" data-gaan="trainer:volume">Volume en delta</button><button class="knop stil" data-gaan="trainer:kaarten">Kaarten${klaar?` (${klaar})`:''}</button></div></div>
   ${v!=null?`<div class="kaart"><span class="label">Volgende les</span><h2 style="margin-top:4px">${LESSEN[v].t}</h2><p class="sub" style="margin-top:4px">${MOD[LESSEN[v].m].naam} · ${LESSEN[v].min} min</p><div class="rij"><button class="knop stil" data-les="${v}">Open les</button></div></div>`:''}
   <div class="kaart"><span class="label">Vuistregel</span><p style="margin-top:6px;font-size:15.5px;font-weight:600">${regelLes.regel}</p><p class="klein" style="margin-top:4px">Uit: ${regelLes.t}</p></div>`;
}

function tabLessen(){
  return `<div class="hero"><div class="merk">Lessen</div><h1>${MODULES.length} modules, ${LESSEN.length} lessen</h1><p>Elke les: de kern in punten, één interactief stuk, het bewijs en een controlevraag. Ken je een module al, doe dan de toets.</p></div>`+
   MODULES.map((m,mi)=>{ const idx=modLessen(m.id), af=idx.filter(isAf).length;
    return `<div class="kaart"><div class="modkop"><div class="nr">${mi+1}</div><div class="groei"><h2>${m.naam}</h2><p class="sub">${m.tag}</p></div><span class="klein">${af}/${idx.length}</span></div>
     <div class="balk"><i style="width:${af/idx.length*100}%"></i></div>
     ${idx.map(i=>`<div class="lesrij" data-les="${i}"><div class="n ${isAf(i)?'af':''}">${isAf(i)?'✓':LESNR[i]}</div><div class="g"><b>${LESSEN[i].t}</b><span>${LESSEN[i].min} min · bewijs ${punten(LESSEN[i].bewijs.sterkte)}</span></div></div>`).join('')}
     ${af<idx.length?`<div class="rij"><button class="knop klein stil" data-toets="${m.id}">Ken ik al: toets ${idx.length} vragen</button></div>`:''}</div>`; }).join('');
}

function vraagBlok(sleutel,c){ const k=st.vraag[sleutel];
  return `<div class="vraag"><p style="font-weight:700;font-size:15px">${c.v}</p>${c.o.map((o,j)=>`<button class="opt ${k!=null?(j===c.a?'goed':(j===k?'fout':'')):''}" data-vraag="${sleutel}" data-j="${j}" ${k!=null?'disabled':''}>${o}</button>`).join('')}
   ${k!=null?`<div class="terugk ${k===c.a?'goed':'fout'}">${k===c.a?'Goed. ':'Niet goed. '}${c.u}</div>`:''}</div>`; }

function lesScherm(i){
  const l=LESSEN[i], m=MOD[l.m], idx=modLessen(l.m), pos=idx.indexOf(i)+1, v=VOLG.indexOf(i), vorige=VOLG[v-1], volg=VOLG[v+1];
  store.laatsteLes=l.id; bewaar();
  return `<button class="terug" data-tab="lessen">‹ Lessen</button><div class="les">
   <p class="klein" style="margin-top:14px">${m.naam} · les ${pos} van ${idx.length} · ${l.min} min</p><h1>${l.t}</h1><p class="lead">${l.d}</p>
   <ul class="punten">${(l.punten||[]).map(p=>`<li>${p}</li>`).join('')}</ul>
   ${toonIA(l.ia)}
   <div class="regel">${l.regel}</div>
   <div class="valkuil"><span class="label">Waar het misgaat</span><p style="margin-top:4px">${l.valkuil}</p></div>
   <details class="kaart"><summary><span class="label">Wat de literatuur zegt</span> ${punten(l.bewijs.sterkte)} <span class="klein">${STERKTE[l.bewijs.sterkte]}</span></summary><p style="margin-top:8px;font-size:14.5px;color:#dde4ea">${l.bewijs.tekst}</p></details>
   ${l.tekst?`<details class="kaart"><summary><span class="label">Achtergrond</span> <span class="klein">de uitleg in lopende tekst</span></summary><div class="proza">${l.tekst.map(p=>`<p>${p}</p>`).join('')}</div></details>`:''}
   <div class="kaart"><span class="label">Controle</span><div style="margin-top:8px">${vraagBlok('les'+l.id,l.check)}</div></div>
   <div class="rij" style="margin-top:16px">${isAf(i)?`<span class="label af">Les afgerond</span>`:`<button class="knop" data-af="${i}">Les afronden</button>`}</div>
   <div class="rij" style="margin-top:14px">${vorige!=null?`<button class="knop stil" data-les="${vorige}">‹ Vorige</button>`:''}${volg!=null?`<button class="knop stil" data-les="${volg}">Volgende: ${LESSEN[volg].t} ›</button>`:''}</div></div>`;
}

function toetsScherm(mid){
  const idx=modLessen(mid), m=MOD[mid], antw=idx.map(i=>st.vraag['toets'+i]), klaar=antw.every(a=>a!=null), fout=idx.filter(i=>st.vraag['toets'+i]!==LESSEN[i].check.a);
  if(klaar&&!fout.length&&!idx.every(isAf)){ idx.forEach(i=>store.done[LESSEN[i].id]=true); oefendag(); bewaar(); }
  return `<button class="terug" data-tab="lessen">‹ Lessen</button><div class="les"><h1>Toets: ${m.naam}</h1><p class="lead">Alles goed en de module staat op af. Een fout wijst de les aan die je beter wel even doet.</p>
   ${idx.map(i=>`<div class="kaart">${vraagBlok('toets'+i,LESSEN[i].check)}</div>`).join('')}
   ${klaar?(fout.length?`<div class="kaart"><span class="label">Nog doen</span>${fout.map(i=>`<div class="lesrij" data-les="${i}"><div class="n">${LESNR[i]}</div><div class="g"><b>${LESSEN[i].t}</b><span>${LESSEN[i].min} min</span></div></div>`).join('')}<div class="rij"><button class="knop klein stil" data-toetsopnieuw="${mid}">Toets opnieuw</button></div></div>`
     :`<div class="kaart"><span class="label af">Module afgerond</span><p style="margin-top:6px">Alles goed. De lessen staan op af.</p></div>`):''}</div>`;
}

function tabTrainer(){ const s=view.sub.trainer;
  const inhoud= s==='beslis'?seg('bzt',CASETAGS.map(t=>[t,t]),st.bslTag)+toonIA('beslis')+beslisLijst()
    : s==='snel'?toonIA('trainer') : s==='volume'?toonIA('kwadrant')+toonIA('delta')+toonIA('algotape') : kaartScherm();
  return `<div class="hero"><div class="merk">Trainer</div><h1>Beslissen onder onzekerheid</h1><p>De grafiek tot het beslismoment, de context ernaast, en daarna in stappen: of, wanneer, waar de stop, en wat de doorslag gaf.</p></div>`+
   seg('subtr',[['beslis','Beslisser'],['snel','Snel'],['volume','Lezen'],['kaarten','Kaarten']],s)+inhoud; }
ACT.subtr=el=>{ view.sub.trainer=el.dataset.v; render(false); return 'klaar'; };

st.kt={toon:false};
function kaartScherm(){ const klaar=kaartenKlaar();
  if(!klaar.length) return `<div class="kaart midden"><p style="font-size:30px">✓</p><p>Alle kaarten zijn voor nu herhaald.</p></div>`;
  const {i,k}=klaar[0];
  return `<p class="sub" style="margin-top:12px">${klaar.length} kaart${klaar.length===1?'':'en'} klaar</p><div class="flits"><div class="v">${k[0]}</div>${st.kt.toon?`<div class="a">${k[1]}</div>`:''}</div>
   <div class="rij">${st.kt.toon?`<button class="knop stil" data-kaart="${i}" data-v="0" style="flex:1">Nog niet</button><button class="knop" data-kaart="${i}" data-v="1" style="flex:1">Wist ik</button>`:`<button class="knop vol" data-kaartdraai="1">Toon antwoord</button>`}</div>`; }
const INTERVAL=[0,1,2,4,8,16,32];

function tabGereedschap(){ const s=view.sub.gereedschap;
  const inhoud= s==='positie'?toonIA('positie') : s==='verwachting'?toonIA('verwachting') : s==='checklist'?toonIA('checklist') : s==='bewijs'?toonIA('bewijskaart') : spiek();
  return `<div class="hero"><div class="merk">Gereedschap</div><h1>Voor naast de grafiek</h1><p>Rekenhulp, de leesvolgorde, de bewijskaart en een spiekbrief.</p></div>`+
   seg('subgr',[['positie','Positie'],['verwachting','Verwachting'],['checklist','Leesvolgorde'],['bewijs','Bewijs'],['spiek','Spiekbrief']],s)+inhoud; }
ACT.subgr=el=>{ view.sub.gereedschap=el.dataset.v; render(false); return 'klaar'; };

function spiek(){ return `<div class="kaart spiek"><h3>Inspanning tegen resultaat</h3><table><tr><th></th><th>Grote bar</th><th>Kleine bar</th></tr>
  <tr><td><b>Hoog volume</b></td><td>Bevestiging</td><td>Absorptie, let op omslag</td></tr><tr><td><b>Laag volume</b></td><td>Dun, broos</td><td>Rust; in een pullback gezond</td></tr></table></div>
 <div class="kaart spiek"><h3>Prijs en open interest</h3><table><tr><th></th><th>OI op</th><th>OI neer</th></tr><tr><td><b>Prijs op</b></td><td>Nieuwe longs</td><td>Short squeeze</td></tr><tr><td><b>Prijs neer</b></td><td>Nieuwe shorts</td><td>Longs eruit, liquidaties</td></tr></table></div>
 <div class="kaart spiek"><h3>Algoritmes herkennen</h3><table><tr><th>Spoor</th><th>Waarschijnlijk</th></tr><tr><td>Vaste grootte, vast ritme, één kant</td><td>Uitvoeringsalgoritme: niet tegenin</td></tr><tr><td>Veel verhandeld op één prijs, niveau vult aan</td><td>Iceberg</td></tr><tr><td>Burst kleine prints, dun boek, geen nieuws</td><td>Momentum ignition: niet achterna</td></tr><tr><td>Muur die meeschuift, niets verhandeld</td><td>Spoof</td></tr><tr><td>Prik door zichtbaar niveau, snelle terugkeer</td><td>Stop run: handel de terugkeer</td></tr><tr><td>Koers kleeft aan strike op vervaldag</td><td>Long gamma, pin</td></tr></table></div>
 <div class="kaart spiek"><h3>Contrarian</h3><p><b>Extreem</b> + <b>klem</b> + <b>mislukte beweging</b>. Nieuws dat de beweging verklaart: niet contrarian.</p></div>
 <div class="kaart spiek"><h3>Rekenen</h3><p>Stuks = rekening × risico% / (ingang − stop).</p><p>Verwachting = W × gem. winst − (1 − W) × gem. verlies, in R.</p><p>Herstel na verlies: 10% → 11%, 25% → 33%, 50% → 100%.</p><p>Stop = structureel punt ± 0,5 tot 1 ATR.</p></div>
 <div class="kaart spiek"><h3>De leesvolgorde</h3><p><b>Context</b> · <b>Locatie</b> · <b>Volume</b> · <b>Orderflow</b> · <b>Trigger</b> · <b>Risico</b>. Locatie, trigger en risico zijn hard.</p></div>`; }

function tabIk(){ const beheerst=Object.values(store.kaarten).filter(k=>k&&k.box>=4).length, cs=casusScore();
  return `<div class="hero"><div class="merk">Voortgang</div><h1>Wat er staat</h1><p>Alles wordt alleen op dit toestel bewaard.</p></div>
   <div class="kaart"><div class="kv"><span>Casussen gespeeld</span><b>${cs.gespeeld} van ${CASES.length}</b></div><div class="kv"><span>Beslisstappen verdedigbaar (beste poging)</span><b>${cs.stappen} van ${cs.max}</b></div>
   <div class="kv"><span>Lessen af</span><b>${afgerond()} van ${LESSEN.length}</b></div><div class="kv"><span>Snelle setups verdedigbaar</span><b>${store.trainer.goed} van ${store.trainer.totaal}</b></div>
   <div class="kv"><span>Kaarten beheerst</span><b>${beheerst} van ${KAARTEN.length}</b></div><div class="kv"><span>Oefendagen</span><b>${store.oefdagen.length}</b></div></div>
   ${cs.max>=20?`<div class="kaart"><span class="label">Je beslisscore, eerlijk</span><p style="margin-top:6px;font-size:14.5px">${(()=>{ const [lo,hi]=wilson(cs.stappen,cs.max); return `${pct(cs.stappen/cs.max,0)} van de stappen verdedigbaar, 95%-interval ${pct(lo,0)} tot ${pct(hi,0)}. De stappen binnen één casus hangen samen, dus het werkelijke interval is wijder.`; })()}</p></div>`:''}
   ${MODULES.map(m=>{ const idx=modLessen(m.id), af=idx.filter(isAf).length; return `<div class="kaart"><div class="kv" style="border:0"><span>${m.naam}</span><b>${af}/${idx.length}</b></div><div class="balk"><i style="width:${af/idx.length*100}%"></i></div></div>`; }).join('')}
   <div class="rij" style="margin-top:18px"><button class="knop klein stil" data-wis="1">Alles wissen</button></div>`; }

/* ================================================================
   GEBEURTENISSEN
   ================================================================ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-les],[data-af],[data-toets],[data-toetsopnieuw],[data-vraag],[data-gaan],[data-kaart],[data-kaartdraai],[data-wis],[data-act]');
  if(!t) return;
  const ds=t.dataset;
  if(ds.act){ const r=ACT[ds.act]&&ACT[ds.act](t); if(r!=='klaar'){ const w=t.closest('.ia')?.dataset.w; if(w) herteken(w); } return; }
  if(ds.tab){ view={...view,tab:ds.tab,les:null,toets:null}; render(); return; }
  if(ds.les!=null){ view.les=+ds.les; view.toets=null; render(); return; }
  if(ds.af!=null){ store.done[LESSEN[+ds.af].id]=true; oefendag(); bewaar(); render(false); return; }
  if(ds.toets){ view.toets=ds.toets; view.les=null; render(); return; }
  if(ds.toetsopnieuw){ modLessen(ds.toetsopnieuw).forEach(i=>delete st.vraag['toets'+i]); render(); return; }
  if(ds.vraag){ if(st.vraag[ds.vraag]==null){ st.vraag[ds.vraag]=+ds.j; oefendag(); } render(false); return; }
  if(ds.gaan){ const [tab,sub]=ds.gaan.split(':'); view.tab=tab; view.les=null; view.toets=null; view.sub[tab]=sub; render(); return; }
  if(ds.kaartdraai){ st.kt.toon=true; render(false); return; }
  if(ds.kaart!=null){ const i=+ds.kaart, s=store.kaarten[i]||{box:0,due:0};
    if(ds.v==='1'){ s.box=Math.min(INTERVAL.length-1,s.box+1); s.due=dagIndex()+INTERVAL[s.box]; } else { s.box=1; s.due=dagIndex(); }
    store.kaarten[i]=s; st.kt.toon=false; oefendag(); bewaar(); render(false); return; }
  if(ds.wis){ if(confirm('Alle voortgang van Trading op dit toestel wissen?')){ store.done={}; store.oefdagen=[]; store.kaarten={}; store.trainer={goed:0,totaal:0}; store.beslis={}; bewaar(); render(); } return; }
});
/* Invoervelden: alleen de uitkomsten worden opnieuw getekend, niet het veld
   zelf, anders verlies je bij elke toets de cursor en bij een schuif de greep. */
document.addEventListener('input',e=>{ const el=e.target.closest('[data-inp]'); if(!el) return; INP[el.dataset.inp](el); const w=el.closest('.ia')?.dataset.w; if(w) vervangDelen(w); });
function vervangDelen(w){ const el=document.getElementById(iaId(w)); if(!el) return; const [naam,arg]=w.split(':'); const tmp=document.createElement('div'); tmp.innerHTML=IA[naam](arg,w);
  tmp.querySelectorAll('[data-deel]').forEach(n=>{ const oud=el.querySelector(`[data-deel="${n.dataset.deel}"]`); if(oud) oud.outerHTML=n.outerHTML; }); }

render();
</script>
</body>
</html>
