<style>
  :root{
    --ink:#1a1618; --muted:#7a6f73; --line:#f0e7e6; --bg:#fbf7f5; --card:#ffffff;
    --pri:#ea580c; --pri2:#e11d48; --accent:#f59e0b;
    --grad:linear-gradient(135deg,#fb923c 0%,#f97316 45%,#e11d48 100%);
    --radius:18px; --shadow:0 10px 30px rgba(120,40,30,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.5;}
  body{max-width:640px;margin:0 auto;padding:0 14px 100px;}
  a{color:var(--pri);}
  h1,h2,h3{line-height:1.2;}
  .hero{position:relative;overflow:hidden;border-radius:var(--radius);margin-top:14px;padding:26px 22px;color:#fff;background:var(--grad);box-shadow:var(--shadow);}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);}
  .hero::before{content:"";position:absolute;left:-30px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);}
  .hero .eyebrow{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;opacity:.9;}
  .hero h1{font-size:26px;font-weight:800;margin:4px 0 6px;position:relative;z-index:1;}
  .hero p{opacity:.95;font-size:14px;max-width:92%;position:relative;z-index:1;}
  .hero .stats{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;flex-wrap:wrap;}
  .hero .chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;backdrop-filter:blur(4px);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px;box-shadow:var(--shadow);}
  .card h2{font-size:17px;font-weight:800;}
  .sub{color:var(--muted);font-size:13px;}
  .sub2{color:var(--muted);font-size:12px;display:block;}
  .pbar{height:9px;background:#f2e9e7;border-radius:999px;overflow:hidden;margin-top:8px;}
  .pbar i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .5s;}
  .pbar.mod i{background:var(--mc,var(--pri));}
  .btn{font:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--pri);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;transition:transform .08s,filter .15s;}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:#fdeee4;color:var(--pri);}
  .btn.ok{background:linear-gradient(135deg,#12b886,#0ca678);}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.75;cursor:default;}
  .tag{display:inline-block;background:#fdeee4;color:var(--pri);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .tag.done{background:#e4f8ef;color:#0ca678;}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
  .nav .inner{display:flex;width:100%;max-width:640px;}
  .nav button{flex:1;background:none;border:0;padding:8px 1px 9px;font:inherit;font-size:10.5px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .nav button .ic{font-size:20px;}
  .nav button.active{color:var(--pri);}
  .modhead{display:flex;align-items:center;gap:11px;padding:2px 2px 12px;}
  .modhead .me{width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--mc);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);}
  .modhead b{font-size:15.5px;}
  .lesrow{display:flex;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid var(--line);cursor:pointer;}
  .lesrow .num{width:32px;height:32px;flex:none;border-radius:9px;background:#fdeee4;color:var(--pri);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13.5px;}
  .lesrow .num.done{background:linear-gradient(135deg,#12b886,#0ca678);color:#fff;}
  .lesrow .grow{flex:1;min-width:0;}
  .lesrow .grow b{font-size:14.5px;display:block;}
  .lesrow .grow span{font-size:12px;color:var(--muted);}
  .lesrow .chev{color:var(--muted);font-size:20px;}
  .topbar{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .back{background:#fdeee4;color:var(--pri);border:0;border-radius:10px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer;}
  .block{margin-top:16px;}
  .block h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--pri);margin-bottom:6px;}
  .why{background:#fff7ed;border:1px solid #fde3c7;border-left:3px solid #f97316;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#7c3a12;}
  .tech{background:#fdf9f7;border:1px solid var(--line);border-left:3px solid var(--pri);border-radius:10px;padding:11px 13px;margin-top:8px;}
  .tech b{display:block;font-size:14.5px;margin-bottom:2px;}
  .tech p{font-size:13.5px;color:#4a4245;}
  .lines li{list-style:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:7px;font-size:14px;}
  .lines li::before{content:"🎙️ ";}
  .fout{background:#fff1f2;border:1px solid #fecdd3;border-left:3px solid #ef4444;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#7f1d2b;margin-top:8px;}
  .oef{background:linear-gradient(135deg,#fff7ed,#fef2f2);border:1px solid #fde3c7;border-radius:12px;padding:13px;margin-top:10px;}
  .oef b{color:#c2410c;}
  .quiz .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:8px;font:inherit;font-size:14px;cursor:pointer;transition:.12s;}
  .quiz .opt:hover{border-color:var(--pri);}
  .quiz .opt.good{background:#e4f8ef;border-color:#0ca678;color:#0a5c46;font-weight:700;}
  .quiz .opt.bad{background:#fff1f2;border-color:#ef4444;color:#9f1239;}
  .quizfb{margin-top:10px;font-size:13.5px;padding:10px 12px;border-radius:10px;}
  .quizfb.goodfb{background:#e4f8ef;color:#0a5c46;}
  .quizfb.badfb{background:#fff1f2;color:#9f1239;}
  .flash{background:var(--grad);color:#fff;border-radius:16px;padding:26px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:center;text-align:center;box-shadow:var(--shadow);}
  .flash .fq{font-size:18px;font-weight:800;line-height:1.35;}
  .flash .fa{font-size:15px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.3);line-height:1.5;}
  .flash small{opacity:.85;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .seg{display:flex;background:#fdeee4;border-radius:12px;padding:4px;gap:4px;margin-top:12px;overflow:auto;}
  .seg button{flex:1;white-space:nowrap;border:0;background:none;font:inherit;font-weight:700;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:9px;cursor:pointer;}
  .seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .quote{font-size:15px;line-height:1.55;}
  .kv{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);}
  .kv:last-child{border-bottom:0;}
  .big{font-size:30px;font-weight:800;}
  .center{text-align:center;}
  .muted{color:var(--muted);}
  .refl{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;font-size:14px;resize:vertical;min-height:64px;margin-top:8px;background:#fff;color:var(--ink);}
  .badges{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px;}
  .badge{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;}
  .badge.locked{opacity:.42;filter:grayscale(1);}
  .badge .be{font-size:22px;}
  .badge b{font-size:13px;display:block;}
  .badge span{font-size:11px;color:var(--muted);}
  .reflitem{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px;}
  .reflitem:first-child{border-top:0;}
  .reflitem .rd{font-size:11px;color:var(--muted);}
  .fade{animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .backhome{display:inline-flex;align-items:center;gap:6px;margin-top:18px;color:var(--muted);font-size:12.5px;text-decoration:none;}
  /* Ouder-code gate — Bennaghmouch Academie */
  .lock{display:none;position:fixed;inset:0;z-index:50;background:var(--grad);align-items:center;justify-content:center;padding:20px;}
  .lockcard{background:#fff;border-radius:20px;padding:28px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.28);}
  .lockicon{font-size:40px;line-height:1;}
  .lockttl{font-size:20px;font-weight:800;margin-top:8px;color:var(--ink);}
  .locksub{color:var(--muted);font-size:13px;margin-top:6px;}
  .lockin{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;font-size:20px;text-align:center;letter-spacing:6px;margin:16px 0 10px;background:#fff;color:var(--ink);}
  .lockmsg{color:#e11d48;font-size:13px;min-height:18px;margin-top:6px;}
  .lockcard .backhome{margin-top:14px;}
  .shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-7px);}40%,80%{transform:translateX(7px);}}
</style>

<!-- ===================================================================== -->
<!-- DE POORT — je meldt je op de startpagina, niet hier.                   -->
<!--                                                                        -->
<!-- Alle apps staan op hetzelfde webadres, dus de aanmelding van de         -->
<!-- startpagina is hier gewoon leesbaar. Wie niet is aangemeld, wordt       -->
<!-- teruggestuurd en komt na het aanmelden vanzelf op deze pagina terug.    -->
<!-- Wie hier niets te zoeken heeft, krijgt dat te lezen in plaats van een   -->
<!-- lege pagina of een foutmelding.                                        -->
<!-- ===================================================================== -->
<script>
var POORT = (function(){
  var SLEUTEL = 'bennahub.wie', UREN = 8, PAD = '../../';
  function wie(){
    try{
      var s = JSON.parse(localStorage.getItem(SLEUTEL) || 'null');
      if(!s || !s.naam) return null;
      if(Date.now() - (s.tijd || 0) > UREN*3600*1000) return null;   /* verlopen */
      return s;
    }catch(e){ return null; }
  }
  function terugAdres(){
    return PAD + '?terug=' + encodeURIComponent(location.pathname + location.search);
  }
  /* Eigen opmaak, want dit moet ook kloppen als het stijlblok van de app nog
     niet geladen is of er straks anders uitziet. */
  function weiger(w, naam){
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'
      + 'justify-content:center;padding:24px;background:#F6F4F0;color:#24282B;'
      + 'font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif');
    d.innerHTML = '<div style="max-width:420px;text-align:center">'
      + '<div style="font-size:2.6rem;line-height:1">🔒</div>'
      + '<h1 style="font-family:Georgia,serif;font-size:1.6rem;margin:14px 0 0;color:#0D0D0D">Dit is een app voor de groten</h1>'
      + '<p style="margin:12px 0 0;color:#5F5C55">Hallo ' + (w.naam.charAt(0).toUpperCase() + w.naam.slice(1))
      + '. ' + naam + ' is van papa. Ga terug naar de startpagina — daar staan de apps die voor jou klaarstaan.</p>'
      + '<a href="' + PAD + '" style="display:inline-block;margin-top:20px;background:#0D0D0D;color:#F6F4F0;'
      + 'text-decoration:none;padding:12px 20px;border-radius:11px;font-weight:500">← Naar de startpagina</a>'
      + '</div>';
    function zet(){ document.body.appendChild(d); }
    if(document.body) zet(); else document.addEventListener('DOMContentLoaded', zet);
  }
  return {
    wie: wie,
    /* appId = de sleutel van deze app; alleenOuder = of kinderen erbuiten blijven.
       Een ouder mag altijd; een kind alleen als het die app uitdrukkelijk in zijn
       eigen lijstje heeft staan (dat zet je in het ouderoverzicht). */
    eis: function(appId, alleenOuder, naam){
      var w = wie();
      if(!w){ location.replace(terugAdres()); return null; }
      var expliciet = w.apps && w.apps.length && w.apps.indexOf(appId) >= 0;
      if(alleenOuder && w.rol !== 'ouder' && !expliciet){ weiger(w, naam || 'Deze app'); return null; }
      return w;
    }
  };
})();
</script>

  {m:'structuur', t:"Je kernboodschap — de één-zin", d:"Als het publiek maar één zin onthoudt, welke moet dat zijn?",

     ["Herhaal 'm 3×","Zeg je kernboodschap in de opening, in het midden en aan het eind. Herhaling maakt het onthoudbaar."]

  {m:'structuur', t:"Een krachtige opening", d:"De eerste 30 seconden bepalen of het publiek luistert of afhaakt.",

   tech:[

     ["Sla de opwarmer over","Geen lange introductie, excuses of 'kunnen jullie me horen?'. Begin met je sterkste zin."]
   ],
   lines:["Stel je voor dat…","Wat als ik je vertel dat…?","Drie jaar geleden maakte ik een fout die alles veranderde…"],

  {m:'structuur', t:"Structuur: de rode draad", d:"Het publiek moet altijd weten waar je bent en waar je heen gaat.",
   min:12, principe:"Een goed verhaal heeft een duidelijke route. Een heldere structuur ontlast het publiek.",
   waarom:"Ons werkgeheugen is beperkt. Een heldere structuur (bijvoorbeeld drie delen) ontlast het publiek en maakt je verhaal makkelijk te volgen én te onthouden.",
   tech:[
     ["Werk met drie","Deel je verhaal in drie hoofdpunten. Drie is genoeg om rijk te zijn en weinig genoeg om te onthouden."],
     ["Gebruik signaalzinnen","'Dat brengt me bij mijn tweede punt…' Zulke bruggetjes houden het publiek op de route."],
     ["Kondig de structuur aan","'Ik vertel je drie dingen: A, B en C.' Verwachting scheppen maakt luisteren makkelijker."]
   ],
   lines:["Ik neem je mee langs drie punten: …","Dat brengt me bij het tweede…","Tot slot, en dit is het belangrijkste: …"],
   fout:"Van de hak op de tak springen zonder duidelijke overgangen. Het publiek raakt de draad kwijt en haakt af.",
   oef:"Herschrijf je volgende presentatie naar exact drie hoofdpunten. Schrijf de signaalzin op die je tussen elk punt gebruikt.",
   check:{v:"Waarom werkt een indeling in drie punten?", o:["Het klinkt professioneel","Het is genoeg om rijk te zijn én weinig genoeg om te onthouden","Het vult de tijd"], a:1, u:"Drie punten passen in het werkgeheugen: rijk genoeg, toch te onthouden."}},

  {m:'structuur', t:"Een sterke afsluiting & call-to-action", d:"De laatste zin is wat blijft hangen. Maak 'm krachtig.",

   tech:[
     ["Cirkel terug","Verwijs in je slot terug naar je opening (het verhaal, de vraag). Dat geeft een bevredigend 'rond' gevoel."],
     ["Herhaal de kernboodschap","Sluit af met die ene zin die je wilt dat ze onthouden."],
     ["Geef een call-to-action","Vertel concreet wat je van hen wilt: 'Begin deze week met…'. Een presentatie zonder actie verdampt."]
   ],
   lines:["We begonnen met [vraag] — het antwoord is: …","Als je één ding doet na vandaag, doe dan dit: …","Dank jullie wel."],
   fout:"Wegsterven met 'eh, ja, dat was het eigenlijk' of doorpraten na je sterke slot. Stop op je hoogtepunt.",
   oef:"Schrijf de laatste twee zinnen van je volgende presentatie uit: de herhaalde kernboodschap + één concrete call-to-action.",
   check:{v:"Hoe sluit je het best af?", o:["Met 'ja, dat was het'","Met de kernboodschap + een concrete call-to-action","Door nog wat extra punten toe te voegen"], a:1, u:"Herhaal je kern en geef een concrete actie — het einde weegt zwaar (peak-end)."}},

   lines:[],

  {m:'uitvoering', t:"Pauzes & stiltes", d:"Een stilte is geen leegte — het is een uitroepteken.",

  {m:'uitvoering', t:"Oogcontact & connectie", d:"Je praat niet tegen een zaal, maar tegen mensen.",

  {m:'publiek', t:"Je publiek lezen & betrekken", d:"Een presentatie is geen eenrichtingsverkeer.",

  {m:'publiek', t:"Vragen beantwoorden — ook lastige", d:"De vragenronde is een kans, geen bedreiging.",
   min:12, principe:"Rust, luister volledig, en het is oké om iets niet te weten. Hoe je met vragen omgaat, bepaalt of je overkomt als expert.",

   ],
   lines:["Goede vraag — als ik het goed begrijp, vraag je…?","Dat weet ik niet zeker; ik kom er bij je op terug.","Terecht punt. Zo kijk ik ernaar: …"],

   check:{v:"Wat doe je als je een antwoord niet weet?", o:["Iets verzinnen dat plausibel klinkt","Eerlijk zeggen dat je erop terugkomt","De vraag negeren"], a:1, u:"Eerlijk 'ik kom erop terug' is sterker en geloofwaardiger dan bluffen."}},

  {m:'publiek', t:"Omgaan met een black-out of fout", d:"Iedereen verliest weleens de draad. Wat telt, is hoe je 'm opvangt.",

/* ---------------- STREAK / VOORTGANG ---------------- */
function streak(){ const dagen=new Set(store.oefdagen); let s=0; let d=new Date();
  const key=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
  if(!dagen.has(key(d))){ d.setDate(d.getDate()-1); if(!dagen.has(key(d))) return 0; }
  while(dagen.has(key(d))){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function afgerond(){ return LESSONS.filter((_,i)=>store.done[i]).length; }
function modVoortgang(id){ const idx=LESSONS.map((l,i)=>[l,i]).filter(([l])=>l.m===id).map(([,i])=>i);
  const done=idx.filter(i=>store.done[i]).length; return {done, totaal:idx.length}; }
function kaartenBeheerst(){ return Object.values(store.kaarten).filter(k=>k&&k.box>=4).length; }
function kaartenDue(){ const d=dagIndex(); return KAARTEN.map((k,i)=>({i,k,st:store.kaarten[i]}))
  .filter(x=> !x.st || (x.st.due||0)<=d ); }

  <div class="card"><ul class="lines" style="padding:0;margin:0">${MATERIAAL[cur].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card center">
    <p class="sub">Wil je oefenen met deze zinnen in context?</p>
    <button class="btn block" data-tab="oefenen" data-act="naarsim" style="margin-top:10px">🎭 Naar de simulator</button>
  </div>`;
}

function tabIk(){
  const s=streak(), af=afgerond(), pct=Math.round(af/LESSONS.length*100);
  const beheerst=kaartenBeheerst();
  const recent=store.reflecties.slice(-5).reverse();
  const bd=badges();
  return `
  <div class="hero"><div class="eyebrow">Jouw groei</div><h1>Voortgang & mijlpalen</h1><p>Consistentie verslaat intensiteit. Elke dag telt.</p></div>
  <div class="card">
    <div class="kv"><span>🔥 Huidige streak</span><b>${s} dag${s===1?'':'en'}</b></div>
    <div class="kv"><span>🗓️ Totaal oefendagen</span><b>${store.oefdagen.length}</b></div>
    <div class="kv"><span>📚 Lessen afgerond</span><b>${af} / ${LESSONS.length}</b></div>
    <div class="kv"><span>🧠 Kaarten beheerst</span><b>${beheerst} / ${KAARTEN.length}</b></div>
  </div>
  <div class="card">
    <div class="kv" style="border:0"><span><b>Cursusvoortgang</b></span><b>${pct}%</b></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    ${MODULES.map(m=>{const {done,totaal}=modVoortgang(m.id);const p=Math.round(done/totaal*100);return `
      <div style="margin-top:12px">
        <div class="kv" style="border:0;padding:2px 0"><span style="font-size:13px">${m.emoji} ${esc(m.naam)}</span><b style="font-size:13px">${done}/${totaal}</b></div>
        <div class="pbar mod" style="--mc:${m.kleur}"><i style="width:${p}%"></i></div>
      </div>`;}).join('')}
  </div>
  <div class="card">
    <b style="font-size:15px">🏅 Mijlpalen</b>
    <div class="badges">
      ${bd.map(([e,t,d,unlocked])=>`<div class="badge ${unlocked?'':'locked'}"><span class="be">${e}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}
    </div>
  </div>
  ${recent.length?`<div class="card">
    <b style="font-size:15px">✍️ Jouw reflecties</b>
    <div style="margin-top:8px">${recent.map(r=>`<div class="reflitem"><span class="rd">${esc(r.d)}</span><br>${esc(r.t)}</div>`).join('')}</div>
  </div>`:''}
  <div class="card center">
    <p class="big">${store.oefdagen.length===0?'🎤':'⭐'}</p>
    <p class="sub">${store.oefdagen.length===0?'Begin vandaag met de uitdaging van de dag — de eerste stap is de belangrijkste.':'Sterk bezig. Kom morgen terug voor je volgende oefening.'}</p>
  </div>
  <a class="backhome" href="../index.html">‹ Terug naar de Bennaghmouch Academie</a>`;
}

function badges(){
  const s=streak(), af=afgerond(), od=store.oefdagen.length, beh=kaartenBeheerst(), ref=store.reflecties.length;
  return [
    ['🌱','Eerste stap','1 oefendag gedaan', od>=1],
    ['🔥','Op dreef','3-dagen streak', s>=3],
    ['⚡','Doorzetter','7-dagen streak', s>=7],
    ['📚','Leergierig','5 lessen afgerond', af>=5],
    ['🎓','Podiummeester','alle lessen afgerond', af>=LESSONS.length],
    ['🗓️','Toegewijd','30 oefendagen', od>=30],
    ['🧠','Scherp','10 kaarten beheerst', beh>=10],
    ['✍️','Reflectief','5 reflecties', ref>=5]
  ];
}

/* ---------------- EVENTS ---------------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ view.les=null; view.tab=b.dataset.tab; if(b.dataset.act) act(b.dataset.act,b.dataset); render(); }));
  document.querySelectorAll('[data-les]').forEach(b=>b.addEventListener('click',()=>{ view.les=+b.dataset.les; render(); }));
  document.querySelectorAll('[data-mat]').forEach(b=>b.addEventListener('click',()=>{ view.mat=b.dataset.mat; render(); }));
  document.querySelectorAll('[data-oefsub]').forEach(b=>b.addEventListener('click',()=>{ view.oefsub=b.dataset.oefsub; view.reveal=false; render(); }));
  document.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>quizAnswer(+b.dataset.quiz,+b.dataset.opt,b)));
  document.querySelectorAll('[data-act]').forEach(b=>{ if(b.hasAttribute('data-tab')) return; b.addEventListener('click',()=>act(b.dataset.act,b.dataset)); });
}
function quizAnswer(i,opt,btn){
  const l=LESSONS[i]; if(store.checks[i]) return;
  const wrap=btn.closest('.quiz'); const fb=wrap.querySelector('.quizfb'); const opts=wrap.querySelectorAll('.opt');
  if(opt===l.check.a){ store.checks[i]=true; save();
    opts.forEach(o=>{o.disabled=true;}); btn.classList.add('good');
    fb.style.display='block'; fb.className='quizfb goodfb'; fb.innerHTML='✅ Klopt! '+esc(l.check.u);
  } else {
    btn.classList.add('bad'); btn.disabled=true;
    fb.style.display='block'; fb.className='quizfb badfb'; fb.textContent='Nog niet — probeer een andere.';
  }
}
function act(a,ds){
  if(a==='terug'){ view.les=null; view.tab='lessen'; render(); }
  else if(a==='done'){ store.done[+ds.les]=true; save(); render(); }
  else if(a==='undone'){ store.done[+ds.les]=false; save(); render(); }
  else if(a==='oefdone'){ const t=today(); if(!store.oefdagen.includes(t)){ store.oefdagen.push(t); store.oefdagen=store.oefdagen.slice(-400); store.oefLaatst=t; save(); } render(); }
  else if(a==='nieuweopener'){ const el=document.querySelector('.quote'); const arr=MATERIAAL["Openingen"]; if(el) el.innerHTML='🎙️ “'+esc(arr[Math.floor(Math.random()*arr.length)])+'”'; }
  else if(a==='reflsave'){ const el=document.getElementById('reflinput'); if(!el) return; const t=el.value.trim(); const d=today();
    const ex=store.reflecties.find(r=>r.d===d);
    if(t===''){ if(ex) store.reflecties=store.reflecties.filter(r=>r.d!==d); }
    else if(ex){ ex.t=t; } else { store.reflecties.push({d,t}); }
    store.reflecties=store.reflecties.slice(-200); save(); render();
  }
  else if(a==='kaartreveal'){ view.reveal=true; render(); }
  else if(a==='kaartgoed'||a==='kaartfout'){ const id=+ds.kid; const st=store.kaarten[id]||{box:0,due:0};
    if(a==='kaartgoed'){ st.box=Math.min(5,(st.box||0)+1); } else { st.box=0; }
    st.due=dagIndex()+KINTERVAL[st.box]; store.kaarten[id]=st; save(); view.reveal=false; render();
  }
  else if(a==='sim'){ view.sim=Math.floor(Math.random()*SIM.length); view.simModel=false; render(); }
  else if(a==='simmodel'){ view.simModel=true; render(); }
  else if(a==='naarsim'){ view.oefsub='sim'; }
}
/* ---- Ouder-code gate — Bennaghmouch Academie (aanpasbare code) ---- */
const AC_DEFAULT='1987';
function acGetCode(){ try{ return localStorage.getItem('academie_code') || AC_DEFAULT; }catch(e){ return AC_DEFAULT; } }
function acSetCode(c){ try{ localStorage.setItem('academie_code', c); }catch(e){} }
function acUnlocked(){ try{return sessionStorage.getItem('academie_ok')==='1';}catch(e){return false;} }
function acDoUnlock(lock){ try{sessionStorage.setItem('academie_ok','1');}catch(e){} lock.style.display='none'; render(); }
function acBoot(){
  const lock=document.getElementById('lock');
  if(acUnlocked()){ if(lock) lock.style.display='none'; render(); return; }
  if(!lock){ render(); return; }
  const card=lock.querySelector('.lockcard'); const orig=card.innerHTML;
  lock.style.display='flex';
  const shake=()=>{ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };
  function showUnlock(){
    card.innerHTML=orig;
    const inp=card.querySelector('#lockinput'), btn=card.querySelector('#lockbtn'),
          msg=card.querySelector('#lockmsg'), chg=card.querySelector('#lockchg');
    const go=()=>{ if(inp.value.trim()===acGetCode()){ acDoUnlock(lock); }
      else { msg.textContent='Onjuiste code — probeer opnieuw.'; inp.value=''; inp.focus(); shake(); } };
    btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
    if(chg) chg.onclick=e=>{ e.preventDefault(); showChange(); };
    setTimeout(()=>inp.focus(),60);
  }
  function showChange(){
    card.innerHTML='<div class="lockicon">🔧</div><div class="lockttl">Ouder-code wijzigen</div>'
      +'<p class="locksub">Voer je huidige code in en kies een nieuwe (minstens 4 cijfers).</p>'
      +'<input id="cCur" class="lockin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Huidige code">'
      +'<input id="cNew" class="lockin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Nieuwe code">'
      +'<input id="cNew2" class="lockin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Nieuwe code nogmaals">'
      +'<button id="cSave" class="btn block">Opslaan</button>'
      +'<p id="cMsg" class="lockmsg"></p>'
      +'<a id="cBack" class="backhome" href="#">‹ Terug</a>';
    const cur=card.querySelector('#cCur'), nw=card.querySelector('#cNew'), nw2=card.querySelector('#cNew2'),
          save=card.querySelector('#cSave'), msg=card.querySelector('#cMsg'), back=card.querySelector('#cBack');
    const go=()=>{
      if(cur.value.trim()!==acGetCode()){ msg.style.color='#e11d48'; msg.textContent='Huidige code klopt niet.'; shake(); return; }
      const a=nw.value.trim(), b=nw2.value.trim();
      if(!/^[0-9]{4,8}$/.test(a)){ msg.style.color='#e11d48'; msg.textContent='Nieuwe code: 4 tot 8 cijfers.'; shake(); return; }
      if(a!==b){ msg.style.color='#e11d48'; msg.textContent='De nieuwe codes komen niet overeen.'; shake(); return; }
      acSetCode(a); msg.style.color='#0ca678'; msg.textContent='Code gewijzigd ✓'; setTimeout(()=>acDoUnlock(lock),700);
    };
    save.onclick=go; nw2.onkeydown=e=>{ if(e.key==='Enter') go(); };
    back.onclick=e=>{ e.preventDefault(); showUnlock(); };
    setTimeout(()=>cur.focus(),60);
  }
  showUnlock();
}
acBoot();
</script>
