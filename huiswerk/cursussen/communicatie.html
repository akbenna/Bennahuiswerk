<!-- DE POORT — je meldt je op de startpagina, niet hier.                   -->
<!--                                                                        -->
<!-- Alle apps staan op hetzelfde webadres, dus de aanmelding van de         -->
<!-- startpagina is hier gewoon leesbaar. Wie niet is aangemeld, wordt       -->
<!-- teruggestuurd en komt na het aanmelden vanzelf op deze pagina terug.    -->
<!-- Wie hier niets te zoeken heeft, krijgt dat te lezen in plaats van een   -->
<!-- lege pagina of een foutmelding.                                        -->
<!-- ===================================================================== -->
<script>
var POORT = (function(){
  var SLEUTEL = 'bennahub.wie', UREN = 8, PAD = '../../';
  function wie(){
    try{
      var s = JSON.parse(localStorage.getItem(SLEUTEL) || 'null');
      if(!s || !s.naam) return null;
      if(Date.now() - (s.tijd || 0) > UREN*3600*1000) return null;   /* verlopen */
      return s;
    }catch(e){ return null; }
  }
  function terugAdres(){
    return PAD + '?terug=' + encodeURIComponent(location.pathname + location.search);
  }
  /* Eigen opmaak, want dit moet ook kloppen als het stijlblok van de app nog
     niet geladen is of er straks anders uitziet. */
  function weiger(w, naam){
    var d = document.createElement('div');
    d.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;'
      + 'justify-content:center;padding:24px;background:#F6F4F0;color:#24282B;'
      + 'font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif');
    d.innerHTML = '<div style="max-width:420px;text-align:center">'
      + '<div style="font-size:2.6rem;line-height:1">🔒</div>'
      + '<h1 style="font-family:Georgia,serif;font-size:1.6rem;margin:14px 0 0;color:#0D0D0D">Dit is een app voor de groten</h1>'
      + '<p style="margin:12px 0 0;color:#5F5C55">Hallo ' + (w.naam.charAt(0).toUpperCase() + w.naam.slice(1))
      + '. ' + naam + ' is van papa. Ga terug naar de startpagina — daar staan de apps die voor jou klaarstaan.</p>'
      + '<a href="' + PAD + '" style="display:inline-block;margin-top:20px;background:#0D0D0D;color:#F6F4F0;'
      + 'text-decoration:none;padding:12px 20px;border-radius:11px;font-weight:500">← Naar de startpagina</a>'
      + '</div>';
    function zet(){ document.body.appendChild(d); }
    if(document.body) zet(); else document.addEventListener('DOMContentLoaded', zet);
  }
  return {
    wie: wie,
    /* appId = de sleutel van deze app; alleenOuder = of kinderen erbuiten blijven.
       Een ouder mag altijd; een kind alleen als het die app uitdrukkelijk in zijn
       eigen lijstje heeft staan (dat zet je in het ouderoverzicht). */
    eis: function(appId, alleenOuder, naam){
      var w = wie();
      if(!w){ location.replace(terugAdres()); return null; }
      var expliciet = w.apps && w.apps.length && w.apps.indexOf(appId) >= 0;
      if(alleenOuder && w.rol !== 'ouder' && !expliciet){ weiger(w, naam || 'Deze app'); return null; }
      return w;
    }
  };
})();
</script>

   check:{v:"Wat geloven mensen bij tegenstrijdigheid tussen je woorden en je lichaamstaal?", o:["De woorden","De lichaamstaal","Geen van beide"], a:1, u:"Bij tegenstrijdigheid wint de non-verbale boodschap — het lichaam."}},

  {m:'fundament', t:"Je stem & vertrouwen", d:"Dezelfde woorden klinken totaal anders met de juiste stem.",
   min:11, principe:"Tempo, toon en pauzes bepalen of mensen naar je luisteren en je geloven. Een rustige, lagere, gevarieerde stem straalt vertrouwen uit.",
   waarom:"Een lagere, rustigere stem wordt onbewust als competenter en betrouwbaarder gehoord. Haast en uptalk (zinnen omhoog laten eindigen) signaleren onzekerheid.",
   tech:[
     ["Vertraag & pauzeer","Praat 20% langzamer dan je neiging is. Een stilte vóór een belangrijk punt geeft het gewicht."],
     ["Zak met je toon","Eindig zinnen omlaag, niet omhoog als een vraag. Uptalk ondermijnt je gezag."],
     ["Adem vanuit je buik","Diepe buikademhaling geeft een vollere, kalmere stem en houdt zenuwen in bedwang."]
   ],
   lines:[],
   fout:"Elke stilte vullen met 'uh', 'eigenlijk' of 'gewoon'. Een bewuste pauze klinkt zelfverzekerder dan een vulwoord.",
   oef:"Neem vandaag 60 seconden van jezelf op (een verhaaltje). Luister terug op tempo, pauzes en toonhoogte. Doe het nog eens, 20% langzamer.",
   check:{v:"Wat straalt het meeste vertrouwen uit?", o:["Snel praten zonder pauzes","Zinnen omhoog laten eindigen","Rustig tempo met bewuste pauzes"], a:2, u:"Rust, een lagere toon en pauzes lezen als zelfvertrouwen."}},

  {m:'fundament', t:"Charisma & warmte", d:"Charisma is geen gave — het is aandacht.",
   min:12, principe:"Charismatische mensen laten de ánder stralen: volledig aanwezig, oprecht nieuwsgierig en gul met erkenning.",
   waarom:"We vinden mensen sympathiek die ons het gevoel geven gezien te worden. De spotlight op de ander zetten werkt sterker dan zelf indruk maken.",
   tech:[
     ["Volledige aanwezigheid","Telefoon weg, ogen bij de ander, gedachten in het nu. Aanwezigheid is het zeldzaamste cadeau."],
     ["De spotlight op de ander","Stel vragen, geef complimenten, onthoud details van eerdere gesprekken."],
     ["Oprechte erkenning","Benoem specifiek wat je waardeert: 'De manier waarop je dat oploste, vond ik slim.' Vaag is leeg; specifiek raakt."]
   ],
   lines:["Ik moest nog denken aan wat je laatst zei over…","Wat knap dat je dat zo hebt aangepakt.","Dat waardeer ik echt in jou: …"],
   fout:"Wachten tot je zelf weer mag praten in plaats van luisteren. Charisma zit in aandacht geven, niet in aandacht nemen.",
   oef:"Geef vandaag drie specifieke, oprechte complimenten. Let op wat het met de sfeer én met jou doet.",
   check:{v:"Waar zit charisma vooral in?", o:["Zelf interessant zijn","De ander laten stralen","Veel over jezelf vertellen"], a:1, u:"Charisma is aandacht geven — de spotlight op de ander zetten."}},

  {m:'openen', t:"De perfecte opener", d:"Elk gesprek begint met de eerste seconden. Breek het ijs zonder script.",
   min:12, principe:"Een goede opener is warm, laagdrempelig en nodigt uit om te reageren. Mensen onthouden niet wát je zei, maar hoe je ze liet voelen.",
   waarom:"De drempel om te beginnen is bijna altijd hoger in je hoofd dan in de realiteit. De meeste mensen vinden een praatje juist prettig — ze durven alleen zelf niet te beginnen.",
   tech:[
     ["De 3 soorten openers","Situatie ('Druk hier, hè?'), observatie ('Mooie tas — waar heb je die vandaan?') of oprechte vraag ('Wat brengt jou hier?'). Kies wat past bij de plek."],
     ["Warmte vóór inhoud","Glimlach en oogcontact eerst, wóórden daarna. Je eerste indruk is grotendeels non-verbaal."],
     ["Laat een haak achter","Eindig je opener met een open vraag, zodat de ander iets heeft om op te reageren. Nooit een ja/nee-vraag."]
   ],
   lines:["Ik ken hier bijna niemand — hoe ken jij [de gastheer]?","Jij lijkt iemand die hier vaker komt. Wat is jouw favoriete plek?","Even eerlijk: wat is het leukste dat je vandaag hebt gedaan?"],
   fout:"Een ja/nee-vraag stellen ('Leuk feestje?'). Dat geeft de ander niets om op door te praten.",
   oef:"Spreek vandaag één onbekende aan met een situatie-opener (in de rij, lift of koffiehoek). Doel: gewoon dóen — de uitkomst maakt niet uit.",
   check:{v:"Wat kenmerkt een sterke opener?", o:["Hij eindigt met een ja/nee-vraag","Hij eindigt met een open haak","Hij gaat vooral over jezelf"], a:1, u:"Een open vraag geeft de ander iets om op te reageren."}},

  {m:'openen', t:"FORD & doorvragen", d:"De kunst om een gesprek gaande te houden. Nooit meer een pijnlijke stilte.",
   min:13, principe:"Mensen praten het liefst over zichzelf. Jouw taak is niet interessant zíjn, maar geïnteresseerd zijn. FORD geeft je oneindig veel gespreksstof.",
   waarom:"Praten over jezelf activeert in de hersenen hetzelfde beloningssysteem als lekker eten of geld. Wie de ander laat praten, wordt als prettiger en sympathieker ervaren.",
   tech:[
     ["FORD","Family (gezin), Occupation (werk), Recreation (vrije tijd), Dreams (dromen/plannen). Vier onuitputtelijke bronnen voor elk gesprek."],
     ["Open vragen (wie/wat/hoe)","Vermijd ja/nee. Vraag 'Hoe ben je daarin gerold?' i.p.v. 'Vind je je werk leuk?'"],
     ["Doorvragen op emotie","Waar iemand enthousiasme toont, graaf: 'Wat maakt dat zo bijzonder voor je?' Daar zit het echte gesprek."]
   ],
   lines:["Hoe ben je hierin terechtgekomen?","Wat vind je daar het leukste aan?","En wat doe je als je níét aan het werk bent?","Als geld geen rol speelde — wat zou je dan doen?"],
   fout:"Doorschieten in een verhoor: vraag op vraag zonder zelf iets te delen. Wissel af met een korte eigen reactie.",
   oef:"Voer vandaag één gesprek waarin je drie keer doorvraagt vóórdat je zelf iets over jezelf vertelt. Merk hoe het gesprek vanzelf stroomt.",
   check:{v:"Waar staat FORD voor?", o:["Feiten, Opinie, Reactie, Data","Family, Occupation, Recreation, Dreams","Focus, Openheid, Rust, Doel"], a:1, u:"Family, Occupation, Recreation, Dreams — vier bronnen voor eindeloze gespreksstof."}},

  {m:'openen', t:"Van small talk naar diepgang", d:"Oppervlakkig praten is de opwarmer. Brug moeiteloos naar een écht gesprek.",
   min:12, principe:"Small talk bouwt veiligheid; diepgang bouwt band. De brug is een net iets persoonlijkere vraag op het juiste moment.",
   waarom:"Verbondenheid groeit via wederzijdse, geleidelijk toenemende openheid (self-disclosure). Te snel te diep schrikt af; nooit dieper blijft oppervlakkig.",
   tech:[
     ["Bouw een brug","Pak een woord uit de small talk en verdiep het: 'Je zei net dat je pas verhuisd bent — hoe bevalt het nieuwe leven?'"],
     ["Deel eerst zelf iets","Kwetsbaarheid nodigt uit tot kwetsbaarheid. Deel iets kleins en persoonlijks, dan durft de ander ook."],
     ["Vraag naar het waarom","Achter elk feit zit een verhaal. 'Waarom is dat belangrijk voor je?' opent de diepte."]
   ],
   lines:["Wat je net zei over [X] — hoe kwam je daarbij?","Waar word je de laatste tijd echt blij van?","Wat houdt je op dit moment het meest bezig?"],
   fout:"Te snel te diep gaan. Bouw op met een brug-vraag; begin niet meteen met de zwaarste levensvraag.",
   oef:"Breng vandaag één gesprek van small talk naar iets persoonlijkers met een brug-vraag. Deel eerst zelf iets kleins.",
   check:{v:"Hoe bouw je een brug naar diepgang?", o:["Direct een zware vraag stellen","Een woord uit de small talk verdiepen","Over het weer blijven praten"], a:1, u:"Pak iets uit het gesprek en verdiep het geleidelijk; deel eerst zelf iets."}},

  {m:'verbinden', t:"Luisteren als een leider", d:"De meest onderschatte skill. Wie écht luistert, wint elk vertrouwen.",
   min:11, principe:"Luisteren is niet wachten tot jij mag praten. Het is de ander het gevoel geven volledig gehoord te zijn. Dat maakt je onvergetelijk.",
   waarom:"Gehoord worden verlaagt letterlijk stress en verhoogt vertrouwen. Wie zich begrepen voelt, opent zich en onthoudt jou als 'iemand bij wie ik mezelf kan zijn'.",
   tech:[
     ["LSD: Luisteren, Samenvatten, Doorvragen","Vat samen wat je hoort ('Dus als ik je goed begrijp…') vóór je reageert. Het bewijst dat je luisterde."],
     ["Minimal encouragers","'Mm', knikken, 'en toen?' — kleine signalen die de ander laten doorpraten zonder dat jij het gesprek kaapt."],
     ["De 2-seconden pauze","Wacht twee tellen na wat de ander zei vóór je praat. Je onderbreekt minder en de ander voelt zich serieus genomen."]
   ],
   lines:["Dus als ik je goed begrijp, …?","Even checken of ik het snap: je bedoelt…","Ga door, ik luister."],
   fout:"Meteen je eigen, vergelijkbare verhaal vertellen ('Oh, dat had ik ook!'). Dat kaapt de spotlight. Vat eerst samen.",
   oef:"Vat vandaag in één gesprek minstens twee keer samen wat de ander zei vóór je je eigen mening geeft.",
   check:{v:"Waar staat de S in LSD voor?", o:["Spreken","Samenvatten","Sturen"], a:1, u:"Luisteren, Samenvatten, Doorvragen — samenvatten bewijst dat je luisterde."}},

  {m:'verbinden', t:"Namen onthouden & gebruiken", d:"'Iemands naam is voor die persoon het mooiste woord in elke taal.' — Dale Carnegie.",
   min:9, principe:"Namen onthouden is geen talent maar een techniek. Een naam gebruiken schept direct verbondenheid.",
   waarom:"Een naam gebruiken activeert een gevoel van erkenning. Vergeten leest (onterecht) als desinteresse — dus het is de moeite waard om het te trainen.",
   tech:[
     ["Herhaal meteen","Zeg de naam direct terug: 'Leuk je te ontmoeten, Sara.' Herhaling verankert."],
     ["Associeer & visualiseer","Koppel de naam aan een beeld of iemand die je kent ('Sara zoals mijn buurvrouw')."],
     ["Gebruik 'm 3×","Nog eens midden in het gesprek en bij het afscheid. Niet vaker — dan wordt het geforceerd."]
   ],
   lines:["Sorry, hoe was je naam ook alweer? Ik wil 'm onthouden.","Fijn met je gesproken te hebben, [naam] — tot snel!"],
   fout:"Doen alsof je de naam verstond terwijl dat niet zo is. Vraag 'm gewoon nog eens — dat waarderen mensen juist.",
   oef:"Onthoud vandaag de naam van drie nieuwe mensen door ze meteen te herhalen en te visualiseren.",
   check:{v:"Wat is de eerste stap om een naam te onthouden?", o:["Hem opschrijven","Hem meteen hardop herhalen","Er niet naar vragen"], a:1, u:"Direct herhalen verankert de naam het sterkst."}},

  {m:'verbinden', t:"Empathie & emotie lezen", d:"Verbinding ontstaat als de ander zich begrepen voelt op gevoelsniveau.",
   min:12, principe:"Benoem de emotie, niet alleen de inhoud. Mensen onthouden wie hun gevoel zag.",
   waarom:"Emoties benoemen ('affect labeling') kalmeert het brein van de ander aantoonbaar en bouwt vertrouwen. Het is een van de krachtigste verbindende technieken die er zijn.",
   tech:[
     ["Lees de signalen","Let op toon, tempo en gezicht, niet alleen op de woorden. Wat zegt het lichaam?"],
     ["Benoem het gevoel","'Het klinkt alsof je daar behoorlijk gefrustreerd van werd.' Zit je ernaast? Dan corrigeert de ander — ook prima, je liet zien dat je meeleeft."],
     ["Valideer vóór je oplost","Erken het gevoel eerst ('Logisch dat dat zwaar is'). Advies pas als erom gevraagd wordt."]
   ],
   lines:["Het klinkt alsof dat je echt raakte.","Logisch dat je daar [gevoel] van werd.","Hoe voelde dat voor je?"],
   fout:"Direct in de oplos-stand schieten. Ongevraagd advies laat de ander zich juist níét gehoord voelen.",
   oef:"Benoem vandaag in één gesprek hardop het gevoel dat je bij de ander proeft, vóór je iets oplost of adviseert.",
   check:{v:"Wat doe je het best vóór je advies geeft?", o:["Meteen een oplossing bieden","Het gevoel benoemen en valideren","Het onderwerp veranderen"], a:1, u:"Valideren van de emotie schept vertrouwen; advies komt daarna."}},

  {m:'verbinden', t:"Storytelling", d:"Feiten overtuigen niet — verhalen wel. Leer boeien met een goed verhaal.",
   min:13, principe:"Een verhaal maakt je boodschap onthoudbaar en menselijk. Structuur is alles: zonder spanning geen aandacht.",
   waarom:"Een verhaal activeert meer hersengebieden dan losse feiten en synchroniseert zelfs de hersenactiviteit van verteller en luisteraar. Structuur en spanning houden de aandacht vast.",
   tech:[
     ["Situatie → complicatie → oplossing","Schets de situatie, introduceer een probleem of wending, en land met wat je leerde. Klassiek en krachtig."],
     ["Begin met de haak","Open met spanning of een vraag: 'Ik dacht dat ik ontslagen zou worden…'. Nooit met de saaie context vooraf."],
     ["Toon, niet vertel","'Mijn handen trilden' i.p.v. 'ik was nerveus'. Details en emotie laten de ander meebeleven."]
   ],
   lines:["Ik zal je iets vertellen dat ik nooit meer vergeet…","Even een klein verhaal — dit veranderde hoe ik erover denk…"],
   fout:"Te lang uitweiden over de aanloop. Kom snel bij de spanning; schrap alle details die er niet toe doen.",
   oef:"Bereid één anekdote van 60 seconden voor volgens situatie-complicatie-oplossing en vertel 'm vandaag aan iemand.",
   check:{v:"Waarmee begin je een sterk verhaal?", o:["De achtergrond en context","Een haak met spanning","De conclusie"], a:1, u:"Open met spanning of een vraag — de haak trekt de aandacht."}},

  {m:'verbinden', t:"Humor & speelsheid", d:"Lichtheid maakt je benaderbaar. Leer lachen dat verbindt.",
   min:10, principe:"Humor die verbindt, lacht mét mensen en nooit ten koste van iemand. Zelfspot (mild) maakt je menselijk.",
   waarom:"Samen lachen geeft een gedeeld 'wij'-gevoel en verlaagt spanning. Milde zelfspot maakt je sympathiek; anderen bespotten breekt juist af.",
   tech:[
     ["Milde zelfspot","Lach om je eigen kleine missers ('Ik ben hopeloos met namen — hou me ten goede'). Dat ontwapent."],
     ["Speel in op het moment","De grappigste opmerking gaat over wat hier en nu gebeurt — niet over een ingestudeerde grap."],
     ["Callback","Verwijs later terug naar een grapje van eerder in het gesprek. Dat schept een gedeelde 'inside joke'."]
   ],
   lines:["Ik waarschuw je: ik ben hopeloos met namen.","Zoals we net al vaststelden — experts, wij tweeën.","Dat gaan we straks vast weer 'per ongeluk' doen."],
   fout:"Grappen ten koste van anderen of sarcasme bij een nieuw contact. Risicovol en vaak afstotend.",
   oef:"Maak vandaag één luchtige opmerking of milde zelfspot in een gesprek. Let op hoe het de sfeer opent.",
   check:{v:"Welke humor verbindt het best bij een nieuw contact?", o:["Sarcasme over de ander","Milde zelfspot en inspelen op het moment","Ingestudeerde moppen"], a:1, u:"Mild lachen om jezelf en om het moment ontwapent en verbindt."}},

  {m:'netwerken', t:"Je persoonlijke pitch", d:"Op 'wat doe je?' wil je geen functietitel opdreunen, maar nieuwsgierig maken.",
   min:11, principe:"Geef een haakje dat uitnodigt tot doorvragen, in plaats van een omschrijving die het gesprek afsluit.",
   waarom:"Mensen onthouden waarde en verhaal, geen functieomschrijving. Een pitch die nieuwsgierig maakt, opent een gesprek in plaats van het te beëindigen.",
   tech:[
     ["Probleem → oplossing → voor wie","'Ik help [wie] om [probleem] op te lossen.' Concreter en menselijker dan een functietitel."],
     ["Geef een haakje","Eindig met iets dat vragen oproept: '…en het gekke is, de meesten weten niet dat het kan.'"],
     ["Pas 'm aan je publiek aan","Vertel het deel dat voor déze persoon relevant is. Eén pitch past niet iedereen."]
   ],
   lines:["Ik help [wie] met [waarde] — meestal als [herkenbaar probleem] speelt.","Kort gezegd: ik zorg dat [resultaat]. En jij, waar ben jij mee bezig?"],
   fout:"Een lange monoloog of vakjargon. Houd het onder 20 seconden en eindig met een vraag terug.",
   oef:"Schrijf vandaag je pitch op in de vorm 'Ik help [wie] met [waarde]'. Oefen 'm hardop tot hij natuurlijk klinkt.",
   check:{v:"Hoe eindig je je pitch het best?", o:["Met je volledige cv","Met een haakje en een vraag terug","Met je functietitel"], a:1, u:"Een haakje maakt nieuwsgierig; de vraag terug houdt het een gesprek."}},

  {m:'netwerken', t:"Netwerken met impact", d:"Netwerken is geen visitekaartjes verzamelen — het is relaties bouwen die ertoe doen.",
   min:14, principe:"Goede netwerkers geven eerst en vragen later. Ze denken in 'hoe kan ik helpen?' — dat maakt hen onvergetelijk en gewild.",
   waarom:"Wederkerigheid is een sterke sociale kracht: wie eerst waarde geeft, roept de behoefte op om iets terug te doen. 'Hoe kan ik helpen?' maakt je gewild.",
   tech:[
     ["Geef eerst","Bied waarde vóór je iets vraagt: een tip, een introductie, een compliment."],
     ["Bereid je doel voor","Weet vóór een event: wie wil ik spreken en waarom? Twee goede gesprekken zijn meer waard dan twintig handjes schudden."],
     ["Denk in verbindingen","Stel mensen aan elkáár voor. De verbinder wordt van iedereen het meest gewaardeerd."]
   ],
   lines:["Waar ben je op dit moment het meest mee bezig?","Kan ik je ergens mee helpen of aan iemand voorstellen?","Jij en [naam] zouden elkaar echt moeten kennen — zal ik jullie verbinden?"],
   fout:"Meteen vragen wat de ander voor jóu kan doen. Dat voelt transactioneel en schrikt af.",
   oef:"Bied vandaag één persoon iets aan zonder er iets voor terug te vragen: een tip, een link of een introductie.",
   check:{v:"Wat doen sterke netwerkers als eerste?", o:["Vragen om een gunst","Waarde geven","Hun kaartje uitdelen"], a:1, u:"Geef eerst — wederkerigheid volgt vanzelf."}},

  {m:'netwerken', t:"Opvolgen & relaties onderhouden", d:"Een contact zonder opvolging verdampt. De echte waarde zit ná het gesprek.",
   min:11, principe:"De echte waarde van netwerken zit in wat er ná het gesprek gebeurt. Eén persoonlijk bericht op tijd maakt het verschil.",
   waarom:"Herhaald, licht contact bouwt vertrouwen (het mere-exposure-effect). Eén persoonlijk bericht binnen 48 uur maakt het verschil tussen 'vergeten' en 'gekend'.",
   tech:[
     ["Opvolgen binnen 48 uur","Stuur een korte, persoonlijke boodschap die refereert aan jullie gesprek."],
     ["Voeg waarde toe, niet alleen 'leuk was het'","Deel de link, het artikel of de introductie die je noemde."],
     ["Onderhoud met licht contact","Een berichtje bij een mijlpaal of relevant nieuws houdt de band warm — zonder agenda."]
   ],
   lines:["Leuk gesproken over [X] — hier de link die ik beloofde.","Ik moest aan je denken toen ik [dit] zag; leek me iets voor jou.","Hoe ging het uiteindelijk met [wat ze noemden]?"],
   fout:"Alleen contact opnemen wanneer je iets nodig hebt. Dat voelt de ander direct aan.",
   oef:"Volg vandaag één contact op met een persoonlijk berichtje dat refereert aan jullie gesprek.",
   check:{v:"Wanneer volg je een nieuw contact het best op?", o:["Binnen 48 uur, persoonlijk","Pas als je iets nodig hebt","Nooit, dat is opdringerig"], a:0, u:"Snel en persoonlijk opvolgen voorkomt dat het contact verdampt."}},

  {m:'netwerken', t:"Online & digitaal netwerken", d:"Dezelfde principes gelden online — wees menselijk, niet generiek.",
   min:11, principe:"Warmte, geven en oprechte interesse werken ook digitaal, maar de signalen lopen anders. Personaliseer altijd.",
   waarom:"Gepersonaliseerd bereik krijgt veel meer respons dan standaardberichten. Op video bepalen kadrering, licht en oogcontact (in de lens) hoe aanwezig je overkomt.",
   tech:[
     ["Personaliseer je bericht","Verwijs naar iets specifieks (een post, een gedeelde interesse). Nooit een copy-paste connectieverzoek."],
     ["Geef ook online eerst","Reageer waarderend op iemands werk vóór je iets vraagt. Zichtbaar zijn = warm binnenkomen."],
     ["Videocall-aanwezigheid","Kijk in de lens (niet naar jezelf), zorg voor licht vóór je en een rustige achtergrond. Glimlach bij binnenkomst."]
   ],
   lines:["Ik zag je [post/project] over [X] — sterk gedaan. Ik zou je graag toevoegen omdat…","Geen agenda, ik wilde vooral zeggen dat [oprechte waardering].","Leuk je (digitaal) te spreken — waar werk jij nu aan?"],
   fout:"Een standaard connectieverzoek zonder bericht, of meteen iets verkopen. Dat wordt genegeerd.",
   oef:"Stuur vandaag één gepersonaliseerd online bericht dat verwijst naar iets specifieks van de ander — zonder iets te vragen.",
   check:{v:"Wat werkt online het best?", o:["Een generiek massabericht","Een persoonlijk bericht dat naar iets specifieks verwijst","Meteen je aanbod pitchen"], a:1, u:"Personalisatie en eerst waarde geven werken online net zo goed als offline."}},

  {m:'lastig', t:"Nee zeggen & grenzen — en toch aardig blijven", d:"Grenzen stellen zonder de relatie te schaden. Assertief, niet agressief.",
   min:11, principe:"Een duidelijke, warme nee is waardevoller dan een halfslachtige ja. Mensen respecteren wie zijn grenzen kent.",
   waarom:"Onduidelijke grenzen leiden tot overbelasting en stille wrok. Een warme, heldere nee beschermt de relatie juist — er is geen onuitgesproken 'nee' die later ontploft.",
   tech:[
     ["Waardeer → weiger → alternatief","'Dank dat je aan me denkt (waardeer). Dit past nu niet bij me (weiger). Wat wél kan is… (alternatief).'"],
     ["Kort en zonder overmatig excuus","Eén reden is genoeg. Te veel uitleg klinkt als een opening om te onderhandelen."],
     ["Nee tegen de vraag, ja tegen de persoon","Wijs het verzoek af, niet de mens. Houd je toon warm en je rug recht."]
   ],
   lines:["Wat fijn dat je aan me denkt — dit lukt me nu even niet.","Ik zeg hier nee tegen, maar laten we snel bijpraten.","Dat past nu niet in mijn planning; volgende maand wel."],
   fout:"Ja zeggen terwijl je nee bedoelt, om aardig te zijn. Dat kost je later meer — voor jou én de relatie.",
   oef:"Zeg vandaag één keer bewust en warm 'nee' tegen iets kleins, met de formule waardeer-weiger-alternatief.",
   check:{v:"Wat is de kern van een goede nee?", o:["Veel excuses aanbieden","Warm maar duidelijk, kort onderbouwd","Vaag blijven zodat niemand teleurgesteld is"], a:1, u:"Waardeer, weiger duidelijk en bied eventueel een alternatief — kort en warm."}},

  {m:'lastig', t:"Feedback geven & ontvangen", d:"Goede feedback gaat over gedrag en effect, niet over de persoon.",
   min:12, principe:"Feedback op gedrag voelt veilig; feedback op karakter zet mensen in de verdediging. Ontvangen begint met luisteren, niet verdedigen.",

/* ---------------- STREAK / VOORTGANG ---------------- */
function streak(){ const dagen=new Set(store.oefdagen); let s=0; let d=new Date();
  const key=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
  if(!dagen.has(key(d))){ d.setDate(d.getDate()-1); if(!dagen.has(key(d))) return 0; }
  while(dagen.has(key(d))){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function afgerond(){ return LESSONS.filter((_,i)=>store.done[i]).length; }
function modVoortgang(id){ const idx=LESSONS.map((l,i)=>[l,i]).filter(([l])=>l.m===id).map(([,i])=>i);
  const done=idx.filter(i=>store.done[i]).length; return {done, totaal:idx.length}; }
function kaartenBeheerst(){ return Object.values(store.kaarten).filter(k=>k&&k.box>=4).length; }
function kaartenDue(){ const d=dagIndex(); return KAARTEN.map((k,i)=>({i,k,st:store.kaarten[i]}))
  .filter(x=> !x.st || (x.st.due||0)<=d ); }

        </div>`;}).join('')}
    </div>`;
  }
  return html;
}

function quizHTML(i){
  const l=LESSONS[i]; if(!l.check) return '';
  const passed=!!store.checks[i];
  return `<div class="block"><h3>Kennischeck</h3>
    <div class="quiz">
      <p style="font-size:14.5px"><b>${esc(l.check.v)}</b></p>
      ${l.check.o.map((o,oi)=>{ let cls='opt'; let dis=''; if(passed){dis='disabled'; if(oi===l.check.a) cls+=' good';} return `<button class="${cls}" ${dis} data-quiz="${i}" data-opt="${oi}">${esc(o)}</button>`;}).join('')}
      <p class="quizfb goodfb" style="${passed?'':'display:none'}">${passed?('✅ Klopt! '+esc(l.check.u)):''}</p>
    </div></div>`;
}

function lesDetail(i){
  const l=LESSONS[i]; const done=!!store.done[i]; const mod=MOD[l.m];
  return `
  <div class="topbar"><button class="back" data-act="terug">‹ Lessen</button><span class="tag" style="background:${mod.kleur}22;color:${mod.kleur}">${mod.emoji} ${esc(mod.naam)}</span><span class="tag">Les ${i+1} · ${l.min} min</span></div>
  <div class="hero" style="margin-top:12px"><div class="eyebrow">Les ${i+1}</div><h1>${esc(l.t)}</h1><p>${esc(l.d)}</p></div>

  <div class="card">
    <div class="block"><h3>Kernprincipe</h3><p class="quote">${esc(l.principe)}</p></div>
    <div class="block"><h3>Waarom het werkt</h3><div class="why">${esc(l.waarom)}</div></div>
    <div class="block"><h3>Technieken</h3>
      ${l.tech.map(([b,p])=>`<div class="tech"><b>${esc(b)}</b><p>${esc(p)}</p></div>`).join('')}
    </div>
    ${l.lines&&l.lines.length?`<div class="block"><h3>Zo klinkt het</h3><ul class="lines" style="padding:0;margin:0">${l.lines.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    <div class="block"><h3>Valkuil</h3><div class="fout">⚠️ ${esc(l.fout)}</div></div>
    <div class="oef"><b>🎯 Oefening van vandaag</b><p style="margin-top:4px">${esc(l.oef)}</p></div>
    ${quizHTML(i)}
    ${done
      ? `<button class="btn ok block" data-act="undone" data-les="${i}" style="margin-top:16px">✅ Afgerond — tik om te herzien</button>`
      : `<button class="btn block" data-act="done" data-les="${i}" style="margin-top:16px">Markeer als afgerond</button>`}
  </div>
  ${i<LESSONS.length-1?`<button class="btn ghost block" data-les="${i+1}" style="margin-top:12px">Volgende les › ${esc(LESSONS[i+1].t)}</button>`:`<div class="card center"><b>🎉 Laatste les!</b><p class="sub">Herhaal dagelijks in het tabblad Vandaag en oefen met de kenniskaarten.</p></div>`}`;
}

function tabOefenen(){
  const sub=view.oefsub||'kaarten';
  let inner='';
  if(sub==='kaarten') inner=oefKaarten();
  else inner=oefSimulator();
  return `
  <div class="hero"><div class="eyebrow">Oefenen</div><h1>Trainen & herhalen</h1>
    <p>Verstevig wat je leerde met kenniskaarten en oefen echte situaties in de simulator.</p></div>
  <div class="seg">
    <button data-oefsub="kaarten" class="${sub==='kaarten'?'on':''}">🧠 Kenniskaarten</button>
    <button data-oefsub="sim" class="${sub==='sim'?'on':''}">🎭 Simulator</button>
  </div>
  ${inner}`;
}
function oefKaarten(){
  const due=kaartenDue(); const beheerst=kaartenBeheerst();
  if(due.length===0){
    return `<div class="card center">
      <p class="big">🧠</p>
      <b>Alles herhaald!</b>
      <p class="sub" style="margin-top:6px">Je hebt alle kaarten voor nu gehad. Kaarten komen automatisch terug volgens spaced repetition — kom later terug.</p>
      <div class="kv" style="margin-top:12px"><span>Beheerst</span><b>${beheerst} / ${KAARTEN.length}</b></div>
    </div>`;
  }
  const cur=due[0]; const [q,a]=cur.k; const rev=view.reveal;
  return `
  <div class="card">
    <div class="kv" style="border:0;padding-top:0"><span class="sub">Nog te herhalen: ${due.length}</span><span class="sub">Beheerst: ${beheerst}/${KAARTEN.length}</span></div>
    <div class="flash">
      <small>Kenniskaart</small>
      <div class="fq" style="margin-top:10px">${esc(q)}</div>
      ${rev?`<div class="fa">${esc(a)}</div>`:''}
    </div>
    ${rev
      ? `<div class="pill-row" style="margin-top:12px">
           <button class="btn ghost" style="flex:1" data-act="kaartfout" data-kid="${cur.i}">Nog niet</button>
           <button class="btn ok" style="flex:1" data-act="kaartgoed" data-kid="${cur.i}">Ik wist het ✓</button>
         </div>`
      : `<button class="btn block" data-act="kaartreveal" style="margin-top:12px">Toon antwoord</button>`}
  </div>
  <p class="sub center" style="margin-top:10px">Eerlijk zijn loont: kaarten die je goed kent, keren minder vaak terug.</p>`;
}
function oefSimulator(){
  const sc=view.sim!=null?SIM[view.sim]:null;
  return `
  <div class="card center">
    <span class="tag">Gesprekssimulator</span>
    ${sc?`
      <p class="quote" style="margin-top:12px;text-align:left"><b>Situatie:</b> ${esc(sc.s)}</p>
      <p class="sub" style="margin-top:10px;text-align:left"><b>Aanpak:</b> ${esc(sc.aanpak)}</p>
      ${view.simModel
        ? `<div class="oef" style="text-align:left"><b>💬 Modelzin</b><p style="margin-top:4px">“${esc(sc.zin)}”</p><p class="sub" style="margin-top:6px">Dit is één manier — jouw eigen woorden werken vaak beter. Zeg 'm hardop.</p></div>`
        : `<button class="btn ghost block" data-act="simmodel" style="margin-top:12px">Toon een modelzin</button>`}
    `:`<p class="quote" style="margin-top:12px">Tik op de knop voor een willekeurige oefensituatie. Bedenk je opener, stel één open vraag en oefen je exit.</p>`}
    <button class="btn block" data-act="sim" style="margin-top:12px">🎲 ${sc?'Nieuwe situatie':'Geef me een oefensituatie'}</button>
  </div>
  <div class="card">
    <b style="font-size:14px">Zo pak je 'm aan</b>
    <p class="sub" style="margin-top:6px">1. Open warm (situatie/observatie/vraag). 2. Stel één open vraag en vraag door. 3. Sluit af met een waarderende exit + vervolg. Gebruik de zinnen uit de Toolkit.</p>
  </div>`;
}

function tabToolkit(){
  const cats=Object.keys(MATERIAAL);
  const cur=view.mat||cats[0];
  return `
  <div class="hero"><div class="eyebrow">Oefenmateriaal</div><h1>Je gespreks-toolkit</h1>
    <p>Kant-en-klare zinnen om vandaag te gebruiken. Vervang [X] door de situatie.</p></div>
  <div class="seg">${cats.map(c=>`<button data-mat="${esc(c)}" class="${c===cur?'on':''}">${esc(c)}</button>`).join('')}</div>
  <div class="card"><ul class="lines" style="padding:0;margin:0">${MATERIAAL[cur].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div class="card center">
    <p class="sub">Wil je oefenen met deze zinnen in context?</p>
    <button class="btn block" data-tab="oefenen" data-act="naarsim" style="margin-top:10px">🎭 Naar de simulator</button>
  </div>`;
}

function tabIk(){
  const s=streak(), af=afgerond(), pct=Math.round(af/LESSONS.length*100);
  const beheerst=kaartenBeheerst();
  const recent=store.reflecties.slice(-5).reverse();
  const bd=badges();
  return `
  <div class="hero"><div class="eyebrow">Jouw groei</div><h1>Voortgang & mijlpalen</h1><p>Consistentie verslaat intensiteit. Elke dag telt.</p></div>
  <div class="card">
    <div class="kv"><span>🔥 Huidige streak</span><b>${s} dag${s===1?'':'en'}</b></div>
    <div class="kv"><span>🗓️ Totaal oefendagen</span><b>${store.oefdagen.length}</b></div>
    <div class="kv"><span>📚 Lessen afgerond</span><b>${af} / ${LESSONS.length}</b></div>
    <div class="kv"><span>🧠 Kaarten beheerst</span><b>${beheerst} / ${KAARTEN.length}</b></div>
  </div>
  <div class="card">
    <div class="kv" style="border:0"><span><b>Cursusvoortgang</b></span><b>${pct}%</b></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    ${MODULES.map(m=>{const {done,totaal}=modVoortgang(m.id);const p=Math.round(done/totaal*100);return `
      <div style="margin-top:12px">
        <div class="kv" style="border:0;padding:2px 0"><span style="font-size:13px">${m.emoji} ${esc(m.naam)}</span><b style="font-size:13px">${done}/${totaal}</b></div>
        <div class="pbar mod" style="--mc:${m.kleur}"><i style="width:${p}%"></i></div>
      </div>`;}).join('')}
  </div>
  <div class="card">
    <b style="font-size:15px">🏅 Mijlpalen</b>
    <div class="badges">
      ${bd.map(([e,t,d,unlocked])=>`<div class="badge ${unlocked?'':'locked'}"><span class="be">${e}</span><div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}
    </div>
  </div>
  ${recent.length?`<div class="card">
    <b style="font-size:15px">✍️ Jouw reflecties</b>
    <div style="margin-top:8px">${recent.map(r=>`<div class="reflitem"><span class="rd">${esc(r.d)}</span><br>${esc(r.t)}</div>`).join('')}</div>
  </div>`:''}
  <div class="card center">
    <p class="big">${store.oefdagen.length===0?'💪':'⭐'}</p>
    <p class="sub">${store.oefdagen.length===0?'Begin vandaag met de uitdaging van de dag — de eerste stap is de belangrijkste.':'Sterk bezig. Kom morgen terug voor je volgende oefening.'}</p>
  </div>
  <a class="backhome" href="../index.html">‹ Terug naar de Bennaghmouch-cursussen</a>`;
}

function badges(){
  const s=streak(), af=afgerond(), od=store.oefdagen.length, beh=kaartenBeheerst(), ref=store.reflecties.length;
  return [
    ['🌱','Eerste stap','1 oefendag gedaan', od>=1],
    ['🔥','Op streek','3-dagen streak', s>=3],
    ['⚡','Doorzetter','7-dagen streak', s>=7],
    ['📚','Leergierig','5 lessen afgerond', af>=5],
    ['🎓','Meester','alle lessen afgerond', af>=LESSONS.length],
    ['🗓️','Toegewijd','30 oefendagen', od>=30],
    ['🧠','Scherp','10 kaarten beheerst', beh>=10],
    ['✍️','Reflectief','5 reflecties', ref>=5]
  ];
}

/* ---------------- EVENTS ---------------- */
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{ view.les=null; view.tab=b.dataset.tab; if(b.dataset.act) act(b.dataset.act,b.dataset); render(); }));
  document.querySelectorAll('[data-les]').forEach(b=>b.addEventListener('click',()=>{ view.les=+b.dataset.les; render(); }));
  document.querySelectorAll('[data-mat]').forEach(b=>b.addEventListener('click',()=>{ view.mat=b.dataset.mat; render(); }));
  document.querySelectorAll('[data-oefsub]').forEach(b=>b.addEventListener('click',()=>{ view.oefsub=b.dataset.oefsub; view.reveal=false; render(); }));
  document.querySelectorAll('[data-quiz]').forEach(b=>b.addEventListener('click',()=>quizAnswer(+b.dataset.quiz,+b.dataset.opt,b)));
  document.querySelectorAll('[data-act]').forEach(b=>{ if(b.hasAttribute('data-tab')) return; b.addEventListener('click',()=>act(b.dataset.act,b.dataset)); });
}
function quizAnswer(i,opt,btn){
  const l=LESSONS[i]; if(store.checks[i]) return;
  const wrap=btn.closest('.quiz'); const fb=wrap.querySelector('.quizfb'); const opts=wrap.querySelectorAll('.opt');
  if(opt===l.check.a){ store.checks[i]=true; save();
    opts.forEach(o=>{o.disabled=true;}); btn.classList.add('good');
    fb.style.display='block'; fb.className='quizfb goodfb'; fb.innerHTML='✅ Klopt! '+esc(l.check.u);
  } else {
    btn.classList.add('bad'); btn.disabled=true;
    fb.style.display='block'; fb.className='quizfb badfb'; fb.textContent='Nog niet — probeer een andere.';
  }
}
function act(a,ds){
  if(a==='terug'){ view.les=null; view.tab='lessen'; render(); }
  else if(a==='done'){ store.done[+ds.les]=true; save(); render(); }
  else if(a==='undone'){ store.done[+ds.les]=false; save(); render(); }
  else if(a==='oefdone'){ const t=today(); if(!store.oefdagen.includes(t)){ store.oefdagen.push(t); store.oefdagen=store.oefdagen.slice(-400); store.oefLaatst=t; save(); } render(); }
  else if(a==='nieuweopener'){ const el=document.querySelector('.quote'); const arr=MATERIAAL["Openers"]; if(el) el.innerHTML='💬 “'+esc(arr[Math.floor(Math.random()*arr.length)])+'”'; }
  else if(a==='reflsave'){ const el=document.getElementById('reflinput'); if(!el) return; const t=el.value.trim(); const d=today();
    const ex=store.reflecties.find(r=>r.d===d);
    if(t===''){ if(ex) store.reflecties=store.reflecties.filter(r=>r.d!==d); }
    else if(ex){ ex.t=t; } else { store.reflecties.push({d,t}); }
    store.reflecties=store.reflecties.slice(-200); save(); render();
  }
  else if(a==='kaartreveal'){ view.reveal=true; render(); }
  else if(a==='kaartgoed'||a==='kaartfout'){ const id=+ds.kid; const st=store.kaarten[id]||{box:0,due:0};
    if(a==='kaartgoed'){ st.box=Math.min(5,(st.box||0)+1); } else { st.box=0; }
    st.due=dagIndex()+KINTERVAL[st.box]; store.kaarten[id]=st; save(); view.reveal=false; render();
  }
  else if(a==='sim'){ view.sim=Math.floor(Math.random()*SIM.length); view.simModel=false; render(); }
  else if(a==='simmodel'){ view.simModel=true; render(); }
  else if(a==='naarsim'){ view.oefsub='sim'; }
}
/* ---- Ouder-code gate — Bennaghmouch Academie (aanpasbare code) ---- */
const AC_DEFAULT='1987';
function acGetCode(){ try{ return localStorage.getItem('academie_code') || AC_DEFAULT; }catch(e){ return AC_DEFAULT; } }
function acSetCode(c){ try{ localStorage.setItem('academie_code', c); }catch(e){} }
function acUnlocked(){ try{return sessionStorage.getItem('academie_ok')==='1';}catch(e){return false;} }
function acDoUnlock(lock){ try{sessionStorage.setItem('academie_ok','1');}catch(e){} lock.style.display='none'; render(); }
function acBoot(){
  const lock=document.getElementById('lock');
  if(acUnlocked()){ if(lock) lock.style.display='none'; render(); return; }
  if(!lock){ render(); return; }
  const card=lock.querySelector('.lockcard'); const orig=card.innerHTML;
  lock.style.display='flex';
  const shake=()=>{ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); };
  function showUnlock(){
    card.innerHTML=orig;
    const inp=card.querySelector('#lockinput'), btn=card.querySelector('#lockbtn'),
          msg=card.querySelector('#lockmsg'), chg=card.querySelector('#lockchg');
    const go=()=>{ if(inp.value.trim()===acGetCode()){ acDoUnlock(lock); }
      else { msg.textContent='Onjuiste code — probeer opnieuw.'; inp.value=''; inp.focus(); shake(); } };
    btn.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
    if(chg) chg.onclick=e=>{ e.preventDefault(); showChange(); };
    setTimeout(()=>inp.focus(),60);
  }
  function showChange(){
    card.innerHTML='<div class="lockicon">🔧</div><div class="lockttl">Ouder-code wijzigen</div>'
      +'<p class="locksub">Voer je huidige code in en kies een nieuwe (minstens 4 cijfers).</p>'
      +'<input id="cCur" class="lockin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Huidige code">'
      +'<input id="cNew" class="lockin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Nieuwe code">'
      +'<input id="cNew2" class="lockin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Nieuwe code nogmaals">'
      +'<button id="cSave" class="btn block">Opslaan</button>'
      +'<p id="cMsg" class="lockmsg"></p>'
      +'<a id="cBack" class="backhome" href="#">‹ Terug</a>';
    const cur=card.querySelector('#cCur'), nw=card.querySelector('#cNew'), nw2=card.querySelector('#cNew2'),
          save=card.querySelector('#cSave'), msg=card.querySelector('#cMsg'), back=card.querySelector('#cBack');
    const go=()=>{
      if(cur.value.trim()!==acGetCode()){ msg.style.color='#e11d48'; msg.textContent='Huidige code klopt niet.'; shake(); return; }
      const a=nw.value.trim(), b=nw2.value.trim();
      if(!/^[0-9]{4,8}$/.test(a)){ msg.style.color='#e11d48'; msg.textContent='Nieuwe code: 4 tot 8 cijfers.'; shake(); return; }
      if(a!==b){ msg.style.color='#e11d48'; msg.textContent='De nieuwe codes komen niet overeen.'; shake(); return; }
      acSetCode(a); msg.style.color='#0ca678'; msg.textContent='Code gewijzigd ✓'; setTimeout(()=>acDoUnlock(lock),700);
    };
    save.onclick=go; nw2.onkeydown=e=>{ if(e.key==='Enter') go(); };
    back.onclick=e=>{ e.preventDefault(); showUnlock(); };
    setTimeout(()=>cur.focus(),60);
  }
  showUnlock();
}
acBoot();
</script>
