function tekenWolkStatus(st){
  const bol = $('#wBol'); if(!bol) return;
  bol.className = 'wolkbol' + (st.aan ? (st.fout ? ' fout' : ' aan') : '');
  const uit = $('#wUitgelogd'), aan = $('#wIngelogd');
  if(uit) uit.style.display = st.aan ? 'none' : '';
  if(aan) aan.style.display = st.aan ? '' : 'none';
  if(st.aan && $('#wNaam')) $('#wNaam').textContent = st.account;
}
function koppelWolk(){
  if(!$('#wBol')) return;
  tekenWolkStatus(WOLK.status());
  WOLK.opStatus(tekenWolkStatus);
  $('#wIn').onclick = async () => {
    const a = $('#wAcc').value.trim().toLowerCase(), w = $('#wPin').value;
    if(!a || !w){ wolkMeld('Vul een naam en een wachtwoord in.', 'fout'); return; }
    wolkMeld('Bezig\u2026');
    try{ await WOLK.inloggen(a, w); await gelijktrekken(); $('#wPin').value = '';
         wolkMeld('Ingelogd en gelijkgetrokken.', 'goed'); tekenOuder(); }
    catch(e){ wolkMeld(e.message, 'fout'); }
  };
  $('#wNieuw').onclick = async () => {
    const a = $('#wAcc').value.trim().toLowerCase(), w = $('#wPin').value;
    if(!a || w.length < 4){ wolkMeld('Kies een naam en een wachtwoord van minstens vier tekens.', 'fout'); return; }
    wolkMeld('Bezig\u2026');
    try{ await WOLK.registreren(a, w, S); $('#wPin').value = '';
         wolkMeld('Account aangemaakt. Wat hier al stond is meegenomen.', 'goed'); tekenOuder(); }
    catch(e){ wolkMeld(e.message, 'fout'); }
  };
  $('#wSync').onclick = async () => {
    wolkMeld('Bezig\u2026');
    const ok = await gelijktrekken();
    wolkMeld(ok ? 'Gelijkgetrokken.' : 'Kon de centrale kopie niet ophalen; er is niets verloren gegaan.', ok ? 'goed' : 'fout');
    if(ok) tekenOuder();
  };
  $('#wUit').onclick = () => { WOLK.uitloggen(); wolkMeld('Uitgelogd. De voortgang blijft op dit toestel staan.'); tekenOuder(); };
}

function bewerkProfiel(id){
  const p = S.profielen[id];
  if(!p) return;
  toonBlad(
    '<h3>' + esc(p.naam) + '</h3>' +
    '<div class="veldje" style="margin-top:14px"><label class="lbl" for="bpNaam">Naam</label>' +
      '<input class="veld" id="bpNaam" maxlength="24" value="' + esc(p.naam) + '"></div>' +
    '<div class="veldje"><label class="lbl" for="bpLeeftijd">Leeftijd</label>' +
      '<input class="veld" id="bpLeeftijd" type="number" min="4" max="99" value="' + p.leeftijd + '"></div>' +
    '<div class="veldje"><label class="lbl" for="bpSpoor">Spoor</label>' +
      '<select class="veld" id="bpSpoor">' +
        '<option value="auto"' + (!p.spoorHandmatig ? ' selected' : '') + '>Automatisch op leeftijd (nu spoor ' + spoorBijLeeftijd(p.leeftijd) + ')</option>' +
        [1,2,3,4].map(s => '<option value="' + s + '"' + (p.spoorHandmatig && p.spoor === s ? ' selected' : '') + '>' +
          'Spoor ' + s + ' — ' + esc(SPOORNAAM[s]) + '</option>').join('') +
      '</select>' +
      '<p class="klein muted" style="margin:6px 0 0">Bij een ander spoor begint het leerpad opnieuw te tellen. De herhalingskaarten blijven behouden.</p></div>' +
    '<div class="veldje"><label class="lbl" for="bpDoel">Dagplafond herhalingen</label>' +
      '<input class="veld" id="bpDoel" type="number" min="5" max="200" value="' + p.dagdoel + '">' +
      '<p class="klein muted" style="margin:6px 0 0">Wat er boven dit aantal uitkomt schuift door naar de volgende dag, zodat de wachtrij nooit onbegrensd groeit.</p></div>' +
    '<div class="veldje"><label class="lbl" for="bpIntentie">Afspraak — wanneer en waar</label>' +
      '<input class="veld" id="bpIntentie" maxlength="140" value="' + esc(p.intentie) + '"></div>' +
    '<div class="rij"><button class="k rek" id="bpBewaar">Opslaan</button>' +
    '<button class="k rand" onclick="sluitBlad()">Annuleren</button></div>');

  $('#bpBewaar').onclick = () => {
    const nn = $('#bpNaam').value.trim();
    const nl = parseInt($('#bpLeeftijd').value, 10);
    if(!nn || !(nl >= 4 && nl <= 99)) return;
    p.naam = nn; p.leeftijd = nl;
    const sp = $('#bpSpoor').value;
    const oudSpoor = p.spoor;
    if(sp === 'auto'){ p.spoorHandmatig = false; p.spoor = spoorBijLeeftijd(nl); }
    else { p.spoorHandmatig = true; p.spoor = parseInt(sp, 10); }
    if(p.spoor !== oudSpoor) p.blok = 0;
    p.dagdoel = Math.min(200, Math.max(5, parseInt($('#bpDoel').value, 10) || p.dagdoel));
    p.intentie = $('#bpIntentie').value.trim();
    bewaar(); sluitBlad();
    if(p.id === P.id) herbouwPad();
    tekenAlles();
  };
}

function verwijderProfiel(id, knop){
  const p = S.profielen[id];
  if(!p) return;
  knop.outerHTML = '<span class="rij"><span class="klein" style="color:var(--fout)">' +
    esc(p.naam) + ' verwijderen?</span>' +
    '<button class="k gevaar klein" id="vpJa">Ja</button>' +
    '<button class="k rand klein" id="vpNee">Nee</button></span>';
  $('#vpJa').onclick = () => {
    delete S.profielen[id];
    if(S.actief === id){
      const rest = Object.keys(S.profielen);
      S.actief = rest[0] || null;
      P = S.actief ? S.profielen[S.actief] : null;
    }
    bewaar();
    if(!P){ tekenOnthaal(); } else { herbouwPad(); tekenAlles(); }
  };
  $('#vpNee').onclick = () => tekenOuder();
}

function exporteer(){
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lisan-backup-' + vandaag() + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  $('#ouImportMelding').innerHTML = '<div class="melding" style="margin-top:10px">Back-up opgeslagen als lisan-backup-' + vandaag() + '.json</div>';
}

function importeer(bestand){
  if(!bestand) return;
  const lezer = new FileReader();
  lezer.onload = () => {
    try{
      const nieuw = JSON.parse(lezer.result);
      if(!nieuw || typeof nieuw !== 'object' || !nieuw.profielen || typeof nieuw.profielen !== 'object')
        throw new Error('geen geldig Arabisch-bestand');
      const n = Object.keys(nieuw.profielen).length;
      $('#ouImportMelding').innerHTML =
        '<div class="melding waarschuwing" style="margin-top:10px">Dit bestand bevat ' + n +
        ' profiel' + (n === 1 ? '' : 'en') + '. Terugzetten vervangt alles wat er nu op dit toestel staat.' +
        '<div class="rij" style="margin-top:10px"><button class="k klein" id="impJa">Terugzetten</button>' +
        '<button class="k rand klein" id="impNee">Annuleren</button></div></div>';
      $('#impJa').onclick = () => {
        S = nieuw;
        if(!S.profielen) S.profielen = {};
        P = S.actief && S.profielen[S.actief] ? S.profielen[S.actief] : Object.values(S.profielen)[0] || null;
        S.actief = P ? P.id : null;
        bewaar(); pasThemaToe();
        if(P){ herbouwPad(); startApp(); } else tekenOnthaal();
      };
      $('#impNee').onclick = () => tekenOuder();
    }catch(e){
      $('#ouImportMelding').innerHTML =
        '<div class="melding waarschuwing" style="margin-top:10px">Dit bestand kon niet worden gelezen: ' +
        esc(e.message) + '</div>';
    }
  };
  lezer.readAsText(bestand);
}

</script>
<script>
/* ============================================================
   LISAN — opstarten
   ============================================================ */

function pasThemaToe(){
  const keuze = S.thema || 'auto';
  const donker = keuze === 'donker' ||
    (keuze === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.thema = donker ? 'donker' : 'licht';
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', donker ? '#15140F' : '#FAF8F4');
}

function koppelChrome(){
  $$('.tab').forEach(b => b.onclick = () => naarTab(b.dataset.t));

  /* Profielwisselaar: één tik in de kop, want op één toestel zitten
     hier meerdere mensen achter. */
  $('#profielKnop').onclick = () => {
    if(!zelfIsOuder()){
      toonBlad('<h3>Dat gaat via de startpagina</h3>' +
        '<p style="margin-top:10px">Je bent hier aangemeld als <b>' + esc(P ? P.naam : 'jezelf') + '</b>. ' +
        'Wil je iemand anders zijn, meld je dan op de startpagina af en kies daar je eigen tegel.</p>' +
        '<a class="k rand vol" href="../" style="margin-top:14px;display:block;text-align:center">Naar de startpagina</a>' +
        '<button class="k stil vol" style="margin-top:6px" onclick="sluitBlad()">Sluiten</button>');
      return;
    }
    const lijst = Object.values(S.profielen);
    toonBlad('<h3>Wie leert er?</h3><div class="stack" style="margin-top:14px">' +
      lijst.map(p => '<button class="profkaart" data-p="' + esc(p.id) + '"' +
        (p.id === P.id ? ' style="border-color:var(--accent)"' : '') + '>' +
        '<span class="bol">' + esc(p.naam.trim().charAt(0).toUpperCase()) + '</span>' +
        '<span><b>' + esc(p.naam) + '</b><small>' + esc(SPOORNAAM[p.spoor]) +
        (p.id === P.id ? ' · actief' : '') + '</small></span></button>').join('') +
      '</div>' +
      '<button class="k rand vol" id="bladNaarOuder" style="margin-top:14px">Naar het ouderbeheer</button>' +
      '<button class="k stil vol" style="margin-top:6px" onclick="sluitBlad()">Sluiten</button>');
    $$('#bladInhoud .profkaart').forEach(b => b.onclick = () => {
      kiesProfiel(b.dataset.p); herbouwPad(); sluitBlad();
      sessie = null; spel = null; actieveTab = 'vandaag'; naarTab('vandaag'); tekenAlles();
    });
    $('#bladNaarOuder').onclick = () => { sluitBlad(); naarTab('ouder'); };
  };

  $('#overlay').addEventListener('click', e => { if(e.target.id === 'overlay') sluitBlad(); });
  $('#bladSluit').onclick = sluitBlad;
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && $('#overlay').classList.contains('aan')) sluitBlad();
  });

  /* Terug uit een sessie of spel met de terugknop van de telefoon.
     Zonder dit sluit de browser de app en is de sessie weg. */
  window.addEventListener('popstate', () => {
    if($('#overlay').classList.contains('aan')){ sluitBlad(); history.pushState({},''); }
  });
  history.pushState({}, '');
}

function start(){
  laadStaat();
  WOLK.init('lisan');
  // Op de achtergrond gelijktrekken: de app is meteen bruikbaar, en dit
  // mag mislukken zonder dat iemand er iets van merkt.
  if(WOLK.status().aan) gelijktrekken(true).then(ok => { if(ok){ zelfKoppelen(); if(P){ herbouwPad(); tekenAlles(); } } });
  window.addEventListener('pagehide', () => { if(WOLK.status().aan) WOLK.bewaar(S, true); });
  pasThemaToe();
  spraak.init();
  koppelChrome();
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)')
      .addEventListener('change', () => { if((S.thema||'auto') === 'auto') pasThemaToe(); });
  }
  /* Wie op de startpagina is aangemeld, is het hier ook. Lukt dat, dan is het
     onthaal met "hoe heet je en hoe oud ben je" niet meer nodig: dat weten we al. */
  zelfKoppelen();
  if(P){ herbouwPad(); startApp(); }
  else  { tekenOnthaal(); }

  /* De dag kan verschieten terwijl de app openstaat (iemand zet hem
     's avonds neer en pakt hem 's ochtends weer op). Elke minuut
     kijken of de datum is gedraaid en dan opnieuw tekenen. */
  let laatsteDag = vandaag();
  setInterval(() => {
    if(vandaag() !== laatsteDag && P && !sessie){ laatsteDag = vandaag(); tekenAlles(); }
  }, 60000);
}

/* Amiri staat sinds kort als bestand naast de app, dus dit hoort niet
   meer voor te komen. De controle blijft staan voor het geval het
   bestand ontbreekt of niet uitgepakt raakt: dan wijken de vormen
   zichtbaar af van wat er in de uitleg staat, en dat melden we liever
   rustig dan dat we het verbergen. */
/* document.fonts.check() geeft ook true voor een familie die
   helemaal niet bestaat, dus die is hier onbruikbaar. We meten in
   plaats daarvan de breedte van een stuk Arabisch: valt Amiri terug
   op het systeemfont, dan is de breedte gelijk aan die van de
   fallback. */
function amiriAanwezig(){
  try{
    const c = document.createElement('canvas').getContext('2d');
    const meet = f => { c.font = '72px ' + f; return c.measureText('بِسْمِ اللّٰهِ الرَّحْمٰنِ').width; };
    return meet('Amiri, monospace') !== meet('monospace');
  }catch(e){ return true; }   // bij twijfel niets melden
}

function controleerFont(){
  if(!document.fonts) return;
  document.fonts.ready.then(() => {
    if(!amiriAanwezig()){
      const b = document.createElement('div');
      b.className = 'wrap';
      b.innerHTML = '<div class="melding waarschuwing" style="margin:10px 0">' +
        'Het lettertype Amiri kon niet worden geladen; het Arabisch wordt met een lettertype van dit toestel getoond. ' +
        'De letters kloppen, maar zien er iets anders uit dan in de uitleg — en sommige tekens van de Warsh-druk ontbreken. ' +
        'Het lettertype hoort in fonts/ te staan; ontbreekt die map, dan is er iets misgegaan bij het kopiëren.</div>';
      document.querySelector('main').prepend(b);
    }
  });
}

document.addEventListener('DOMContentLoaded', () => { start(); controleerFont(); });

</script>
