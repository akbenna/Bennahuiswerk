 vraag:{v:'Wat is het oordeel van de arts?',o:['Het is ernstig','Het is niet ernstig, maar hij moet rusten','Hij moet naar het ziekenhuis','Hij heeft niets'],j:1,u:'لَيْسَ الْأَمْرُ خَطِيرًا، وَلٰكِنْ يَجِبُ أَنْ تَسْتَرِيحَ. Let op لَيْسَ met de accusatief خَطِيرًا.'}},

{id:'t-11',n2:3,titel:'Een reis naar Marokko',
 ar:'سَافَرْنَا فِي الصَّيْفِ الْمَاضِي إِلَى الْمَغْرِبِ.\nوَصَلَتِ الطَّائِرَةُ إِلَى مَطَارِ الدَّارِ الْبَيْضَاءِ فِي الْمَسَاءِ.\nثُمَّ أَخَذْنَا الْقِطَارَ إِلَى فَاسَ، وَهِيَ مَدِينَةٌ قَدِيمَةٌ فِيهَا أَقْدَمُ جَامِعَةٍ فِي الْعَالَمِ.\nمَشَيْنَا فِي أَزِقَّةِ الْمَدِينَةِ الْقَدِيمَةِ وَشَرِبْنَا الشَّايَ بِالنَّعْنَاعِ.\nلَنْ أَنْسَى تِلْكَ الرِّحْلَةَ أَبَدًا.',
 nl:'Wij reisden afgelopen zomer naar Marokko.\nHet vliegtuig kwam \'s avonds aan op de luchthaven van Casablanca.\nDaarna namen wij de trein naar Fez, een oude stad met de oudste universiteit ter wereld.\nWij liepen door de steegjes van de oude stad en dronken muntthee.\nIk zal die reis nooit vergeten.',
 gloss:[['الدَّار الْبَيْضَاء','Casablanca (letterlijk: het witte huis)'],['أَقْدَم','oudste'],['جَامِعَة','universiteit'],['أَزِقَّة','steegjes'],['نَعْنَاع','munt'],['رِحْلَة','reis']],
 vraag:{v:'Wat is er bijzonder aan Fez volgens de tekst?',o:['Het is de hoofdstad','Er staat de oudste universiteit ter wereld','Er is een luchthaven','Het ligt aan zee'],j:1,u:'فِيهَا أَقْدَمُ جَامِعَةٍ فِي الْعَالَمِ — de al-Qarawiyyin, gesticht in 859.'}},

{id:'t-12',n2:3,titel:'Het huis van mijn grootmoeder',
 ar:'بَيْتُ جَدَّتِي فِي قَرْيَةٍ صَغِيرَةٍ قُرْبَ الْجَبَلِ.\nلِلْبَيْتِ بَابٌ خَشَبِيٌّ قَدِيمٌ وَفِنَاءٌ فِي الْوَسَطِ.\nكُنَّا نَجْلِسُ فِي الْفِنَاءِ بَعْدَ الْغُرُوبِ وَنَسْتَمِعُ إِلَى قِصَصِ جَدَّتِي.\nكَانَتْ تَحْكِي عَنْ زَمَانٍ لَمْ نَعْرِفْهُ، وَكُنَّا نُصْغِي دُونَ أَنْ نَتَكَلَّمَ.',
 nl:'Het huis van mijn oma staat in een klein dorp bij de berg.\nHet huis heeft een oude houten deur en een binnenplaats in het midden.\nWij zaten na zonsondergang op de binnenplaats en luisterden naar de verhalen van mijn oma.\nZij vertelde over een tijd die wij niet kenden, en wij luisterden zonder te spreken.',
 gloss:[['قُرْب','bij, nabij'],['خَشَبِيّ','houten'],['فِنَاء','binnenplaats'],['غُرُوب','zonsondergang'],['تَحْكِي','zij vertelt'],['نُصْغِي','wij luisteren aandachtig']],
 vraag:{v:'Wat betekent كُنَّا نَجْلِسُ ?',o:['Wij zaten (gewoonte in het verleden)','Wij zullen zitten','Wij zitten','Wij gingen zitten (één keer)'],j:0,u:'كَانَ plus imperfectum drukt een herhaalde handeling in het verleden uit: "wij zaten altijd".'}},

{id:'t-13',n2:4,titel:'Over de wortel van het woord',
 ar:'يَقُومُ الْمُعْجَمُ الْعَرَبِيُّ عَلَى فِكْرَةٍ بَسِيطَةٍ وَعَمِيقَةٍ فِي آنٍ وَاحِدٍ: أَنَّ الْكَلِمَاتِ لَيْسَتْ وَحَدَاتٍ مُنْفَصِلَةً بَلْ تَنْبُتُ مِنْ جُذُورٍ.\nفَالْجَذْرُ ك-ت-ب يَحْمِلُ مَعْنَى الْكِتَابَةِ، وَمِنْهُ يَتَفَرَّعُ الْكَاتِبُ وَالْمَكْتُوبُ وَالْمَكْتَبُ وَالْمَكْتَبَةُ وَالْكِتَابُ.\nوَلِهٰذَا فَإِنَّ مَنْ يَحْفَظُ الْجُذُورَ يَفْهَمُ أَكْثَرَ مِمَّا حَفِظَ، وَهٰذَا مَا يُمَيِّزُ الْعَرَبِيَّةَ عَنْ كَثِيرٍ مِنَ اللُّغَاتِ.',
 nl:'Het Arabische woordenboek berust op een gedachte die tegelijk eenvoudig en diepzinnig is: dat woorden geen losse eenheden zijn maar uit wortels ontspruiten.\nDe wortel k-t-b draagt de betekenis van het schrijven, en daaruit vertakken zich de schrijver, het geschrevene, het bureau, de bibliotheek en het boek.\nDaarom begrijpt wie de wortels onthoudt meer dan hij heeft onthouden, en dit onderscheidt het Arabisch van veel andere talen.',
 gloss:[['مُعْجَم','woordenboek'],['فِكْرَة','gedachte, idee'],['عَمِيق','diep'],['تَنْبُتُ','zij ontspruiten'],['جُذُور','wortels'],['يَتَفَرَّعُ','het vertakt zich'],['يُمَيِّزُ','het onderscheidt']],
 vraag:{v:'Wat is de kerngedachte van de tekst?',o:['Arabisch is moeilijk','Woorden groeien uit wortels','Woordenboeken zijn onmisbaar','Schrijven is belangrijk'],j:1,u:'Het woordenboek berust op de gedachte dat woorden uit wortels ontspruiten — en wie de wortel kent, begrijpt meer woorden dan hij heeft geleerd.'}},

{id:'t-14',n2:4,titel:'De geneeskunde bij Ibn Sina',
 ar:'وُلِدَ ابْنُ سِينَا فِي بُخَارَى سَنَةَ سَبْعِينَ وَثَلَاثِمِائَةٍ لِلْهِجْرَةِ، وَاشْتَهَرَ فِي الشَّرْقِ وَالْغَرْبِ بِكِتَابِهِ «الْقَانُونُ فِي الطِّبِّ».\nظَلَّ هٰذَا الْكِتَابُ يُدَرَّسُ فِي جَامِعَاتِ أُورُوبَّا قُرُونًا طَوِيلَةً بَعْدَ وَفَاتِهِ.\nوَكَانَ ابْنُ سِينَا يَرَى أَنَّ الطَّبِيبَ لَا يُعَالِجُ الْمَرَضَ وَحْدَهُ بَلْ يُعَالِجُ الْإِنْسَانَ كُلَّهُ، وَهِيَ فِكْرَةٌ لَمْ تَفْقِدْ قِيمَتَهَا إِلَى الْيَوْمِ.',
 nl:'Ibn Sina werd geboren in Bukhara in het jaar 370 van de hidjra, en werd in Oost en West beroemd door zijn boek "De Canon van de geneeskunde".\nDit boek werd nog eeuwen na zijn dood aan Europese universiteiten onderwezen.\nIbn Sina meende dat de arts niet de ziekte alleen behandelt maar de hele mens, een gedachte die tot op de dag van vandaag haar waarde niet heeft verloren.',
 gloss:[['وُلِدَ','hij werd geboren (passief)'],['اِشْتَهَرَ','hij werd beroemd'],['ظَلَّ','hij bleef'],['يُدَرَّسُ','het wordt onderwezen (passief)'],['وَفَاة','overlijden'],['يُعَالِجُ','hij behandelt'],['قِيمَة','waarde']],
 vraag:{v:'Welke opvatting van Ibn Sina noemt de tekst?',o:['Dat de arts vooral moet lezen','Dat de arts de hele mens behandelt, niet alleen de ziekte','Dat geneeskunde een wetenschap is','Dat Europa van hem leerde'],j:1,u:'لَا يُعَالِجُ الْمَرَضَ وَحْدَهُ بَلْ يُعَالِجُ الْإِنْسَانَ كُلَّهُ. Let op de twee passieven in de tekst: وُلِدَ en يُدَرَّسُ.'}},

{id:'t-15',n2:4,titel:'Waarom een taal leren',
 ar:'قِيلَ قَدِيمًا إِنَّ مَنْ تَعَلَّمَ لُغَةَ قَوْمٍ أَمِنَ مَكْرَهُمْ، وَلٰكِنَّ الْأَمْرَ أَوْسَعُ مِنْ ذٰلِكَ.\nفَاللُّغَةُ لَيْسَتْ مَجْمُوعَةَ كَلِمَاتٍ تُتَرْجَمُ، بَلْ طَرِيقَةٌ فِي رُؤْيَةِ الْعَالَمِ.\nوَمَنْ يَتَعَلَّمُ لُغَةَ أَجْدَادِهِ لَا يَكْتَسِبُ أَدَاةً جَدِيدَةً فَحَسْبُ، بَلْ يَسْتَعِيدُ صِلَةً كَانَتْ عَلَى وَشَكِ الِانْقِطَاعِ.\nوَلَيْسَ فِي ذٰلِكَ حَنِينٌ إِلَى الْمَاضِي بِقَدْرِ مَا فِيهِ اخْتِيَارٌ لِلْمُسْتَقْبَلِ.',
 nl:'Vanouds werd gezegd dat wie de taal van een volk leert, veilig is voor hun list — maar de zaak reikt verder dan dat.\nEen taal is niet een verzameling woorden die vertaald wordt, maar een manier om de wereld te zien.\nEn wie de taal van zijn voorouders leert, verwerft niet alleen een nieuw werktuig, maar herstelt een band die op het punt stond te breken.\nDaarin schuilt niet zozeer heimwee naar het verleden als wel een keuze voor de toekomst.',
 gloss:[['قِيلَ','er werd gezegd (passief)'],['مَكْر','list'],['أَوْسَع','ruimer'],['رُؤْيَة','het zien, visie'],['يَكْتَسِبُ','hij verwerft'],['يَسْتَعِيدُ','hij herwint'],['صِلَة','band'],['اِنْقِطَاع','breuk'],['حَنِين','heimwee']],
 vraag:{v:'Wat stelt de laatste zin?',o:['Het gaat om heimwee','Het gaat meer om een keuze voor de toekomst dan om heimwee','Het verleden is belangrijker','Talen leren is nutteloos'],j:1,u:'لَيْسَ فِي ذٰلِكَ حَنِينٌ ... بِقَدْرِ مَا فِيهِ اخْتِيَارٌ لِلْمُسْتَقْبَلِ — niet zozeer heimwee als wel een keuze voor de toekomst.'}}
];

<script>
/* ============================ WOLK — centrale opslag ============================
   Waarom: voortgang moet op elk toestel hetzelfde zijn. Lokaal blijft de bron
   waarop de app draait (snel, en werkt zonder internet); de wolk is de kopie die
   toestellen met elkaar deelt. Bij het openen halen we op en voegen we samen,
   daarna schrijven we bij elke wijziging vertraagd weg.

   Toegang loopt via beveiligde databasefuncties met account + wachtwoord. De
   tabel zelf is niet publiek benaderbaar; de sleutel hieronder is de publieke
   anon-sleutel en geeft uit zichzelf geen toegang tot gegevens.
================================================================================= */
const WOLK = (function () {
  const URL  = 'https://jnlvvdaisyerhxucxnuu.supabase.co';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpubHZ2ZGFpc3llcmh4dWN4bnV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NDg0MjIsImV4cCI6MjA4MjQyNDQyMn0.8ZXa-N96pRSQovdL_bH5FpJTHeL454830h5LMapCawY';

  let app = null, acc = null, pin = null, aan = false;
  let bezig = false, wacht = null, laatsteFout = null;
  const luisteraars = [];

  async function rpc(fn, body) {
    const r = await fetch(URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    let out = {};
    try { out = await r.json(); } catch (e) { /* leeg antwoord: val terug op de status */ }
    if (out && out.error) throw new Error(out.error);
    if (!r.ok) throw new Error('Verbinding mislukt (' + r.status + ')');
    return out;
  }

  const sleutel = () => 'bennahub.acc.' + app;
  function onthoud() {
    // Het wachtwoord staat lokaal zodat je niet elke keer opnieuw hoeft in te loggen.
    // Dit is een gezinsapp op eigen toestellen; de afweging is bewust gemaakt.
    try { localStorage.setItem(sleutel(), JSON.stringify({ acc, pin })); } catch (e) {}
  }
  function vergeet() { try { localStorage.removeItem(sleutel()); } catch (e) {} }

  function meld() { luisteraars.forEach(f => { try { f(status()); } catch (e) {} }); }
  function status() {
    return { aan, account: acc, bezig, fout: laatsteFout };
  }

  return {
    /* Roep dit eenmaal aan bij het starten. Geeft terug of er een account klaarstaat. */
    init(naamApp) {
      app = naamApp;
      try {
        const s = JSON.parse(localStorage.getItem(sleutel()) || 'null');
        if (s && s.acc && s.pin) { acc = s.acc; pin = s.pin; aan = true; }
      } catch (e) {}
      return aan;
    },
    status,
    opStatus(f) { luisteraars.push(f); f(status()); },

    async accounts() {
      try { return await rpc('bennahub_accounts', { p_app: app }); }
      catch (e) { return []; }
    },

    async registreren(account, wachtwoord, beginData) {
      await rpc('bennahub_register', { p_app: app, p_account: account, p_pin: wachtwoord, p_data: beginData || {} });
      acc = account; pin = wachtwoord; aan = true; laatsteFout = null; onthoud(); meld();
      return true;
    },

    async inloggen(account, wachtwoord) {
      const r = await rpc('bennahub_load', { p_app: app, p_account: account, p_pin: wachtwoord });
      acc = account; pin = wachtwoord; aan = true; laatsteFout = null; onthoud(); meld();
      return r.data || {};
    },

    uitloggen() { aan = false; acc = null; pin = null; vergeet(); meld(); },

    /* Haalt de wolkkopie op. Geeft null bij geen account of bij een storing —
       de app moet daar tegen kunnen en gewoon lokaal doorgaan. */
    async ophalen() {
      if (!aan) return null;
      bezig = true; meld();
      try {
        const r = await rpc('bennahub_load', { p_app: app, p_account: acc, p_pin: pin });
        laatsteFout = null;
        return r.data || {};
      } catch (e) {
        laatsteFout = e.message; return null;
      } finally { bezig = false; meld(); }
    },

    /* Wegschrijven met vertraging: tijdens een sessie verandert er veel achter
       elkaar, en we willen niet bij elke toetsaanslag het net op. */
    bewaar(data, direct) {
      if (!aan) return;
      clearTimeout(wacht);
      const doen = async () => {
        bezig = true; meld();
        try { await rpc('bennahub_save', { p_app: app, p_account: acc, p_pin: pin, p_data: data }); laatsteFout = null; }
        catch (e) { laatsteFout = e.message; }
        finally { bezig = false; meld(); }
      };
      if (direct) return doen();
      wacht = setTimeout(doen, 2500);
    }
  };
})();

/* Hulpjes voor het samenvoegen van twee momentopnamen. Regel: niets weggooien.
   Bij een botsing wint de hoogste waarde of de nieuwste datum, nooit "leeg". */
const SAMEN = {
  max: (a, b) => Math.max(a || 0, b || 0),
  nieuwste(a, b) { if (!a) return b; if (!b) return a; return a >= b ? a : b; },
  /* Twee objecten met id → record; per id de winnaar volgens `kies`. */
  perId(a, b, kies) {
    const uit = Object.assign({}, a || {});
    for (const id of Object.keys(b || {})) {
      uit[id] = (id in uit) ? kies(uit[id], b[id]) : b[id];
    }
    return uit;
  },
  unie(a, b) { return [...new Set([...(a || []), ...(b || [])])]; }
};

/* Tashkil: de klinker- en hulptekens. Nodig om te kunnen vergelijken
   én om vocalisatie te kunnen afpellen. */
const TASHKIL = /[ً-ْٰـ]/g;
const ontdoeTashkil = s => String(s).replace(TASHKIL,'');

/* Vergelijken van getypte antwoorden. Een leerling die "kitab" typt
   in plaats van "kitāb" heeft het goed; strengheid op diakritische
   tekens meet typvaardigheid, niet taalkennis. */
function normNl(s){
  return String(s).toLowerCase().trim()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')  // ā→a, ḥ→h, ṣ→s
    .replace(/[ʿʾ'`´’‘]/g,'')                          // ayn/hamza-tekens
    .replace(/[^a-z0-9 ]/g,' ')
    .replace(/\s+/g,' ').trim();
}
/* Voor Arabische invoer: tekens weg, alif-varianten gelijkschakelen,
   ى en ي gelijkschakelen. Wat overblijft is het skelet dat telt. */
function normAr(s){
  return ontdoeTashkil(String(s).trim())
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/\s+/g,' ');
}
function antwoordKlopt(gegeven, juisteLijst){
  const g1 = normNl(gegeven), g2 = normAr(gegeven);
  return juisteLijst.some(j => {
    const jn = normNl(j);
    if(jn && jn === g1) return true;
    if(/[؀-ۿ]/.test(j) && normAr(j) === g2) return true;
    return false;
  });
}

/* ---------- 3. FSRS ----------------------------------------
   Compacte FSRS-implementatie (de rekenkern van FSRS-4.5/5).

   Aannames, expliciet gemaakt omdat ze afwijken van een volledige
   Anki-implementatie:

   1. VASTE GEWICHTEN. De parameters worden niet geoptimaliseerd op de
      eigen reviewgeschiedenis. Dat vergt duizenden herhalingen en een
      optimizer; een gezin haalt die aantallen niet snel. We gebruiken
      de gepubliceerde standaardgewichten.
   2. DAGKORREL. Intervallen en verstreken tijd worden in hele dagen
      gerekend. Herhalingen binnen dezelfde dag (de "short-term
      scheduler" van FSRS-5) laten we weg; in plaats daarvan komt een
      kaart die je vandaag fout had achteraan de wachtrij van vandaag
      terug, zonder dat de stabiliteit opnieuw wordt bijgewerkt.
   3. VIER OORDELEN. 1 opnieuw, 2 lastig, 3 goed, 4 makkelijk. Bij
      oefeningen in de sessie oordeelt de app zelf: goed in één keer
      is 3, fout is 1. Alleen in het tabblad Herhaling kiest een
      volwassene zelf, omdat zelfbeoordeling daar informatie toevoegt
      en bij een kind vooral ruis oplevert.
   4. GEWENSTE RETENTIE 0,90. Bij die waarde geldt bij benadering
      interval ≈ stabiliteit, wat het rekenwerk goed controleerbaar
      maakt.
   5. FUZZ. Op intervallen vanaf drie dagen zit een spreiding van
      ±5%, zodat kaarten die op dezelfde dag geleerd zijn niet
      levenslang op dezelfde dag terugkomen.                        */
const FSRS = (function(){
  const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,
             0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
  const VERVAL = -0.5;
  const FACTOR = 19/81;
  const RETENTIE = 0.90;
  const MAX_INTERVAL = 365*3;
  const klem = (x,lo,hi) => Math.min(hi, Math.max(lo, x));

  const ophaalbaarheid = (dagen, S) => Math.pow(1 + FACTOR*dagen/Math.max(S,0.01), VERVAL);
  const interval = S => {
    const i = (S/FACTOR) * (Math.pow(RETENTIE, 1/VERVAL) - 1);
    return klem(Math.round(i), 1, MAX_INTERVAL);
  };
  const beginStabiliteit = g => klem(W[g-1], 0.1, MAX_INTERVAL);
  const beginMoeilijkheid = g => klem(W[4] - Math.exp(W[5]*(g-1)) + 1, 1, 10);

  function nieuweMoeilijkheid(D, g){
    const delta = -W[6]*(g-3);
    const lineair = D + delta*(10-D)/9;                 // demping richting de randen
    return klem(W[7]*beginMoeilijkheid(4) + (1-W[7])*lineair, 1, 10);
  }
  function stabiliteitNaSucces(S, D, R, g){
    const hard  = g === 2 ? W[15] : 1;
    const bonus = g === 4 ? W[16] : 1;
    const alfa = 1 + Math.exp(W[8]) * (11-D) * Math.pow(S, -W[9])
                 * (Math.exp(W[10]*(1-R)) - 1) * hard * bonus;
    return klem(S*alfa, 0.1, MAX_INTERVAL);
  }
  function stabiliteitNaFout(S, D, R){
    const Sf = W[11] * Math.pow(D, -W[12]) * (Math.pow(S+1, W[13]) - 1) * Math.exp(W[14]*(1-R));
    return klem(Math.min(Sf, S), 0.1, MAX_INTERVAL);
  }

  /* k = kaartstaat of null (nieuw). g = 1..4. Geeft een nieuwe staat. */
  function beoordeel(k, g, dag){
    dag = dag || vandaag();
    let S, D, verlopen = 0;
    if(!k || k.s == null){
      S = beginStabiliteit(g);
      D = beginMoeilijkheid(g);
    }else{
      verlopen = Math.max(0, dagVerschil(k.laatst || dag, dag));
      const R = ophaalbaarheid(verlopen, k.s);
      D = nieuweMoeilijkheid(k.d, g);
      S = g === 1 ? stabiliteitNaFout(k.s, k.d, R) : stabiliteitNaSucces(k.s, D, R, g);
    }
    let iv = interval(S);
    if(iv >= 3){                                    // spreiding, zie aanname 5
      const spreiding = 1 + (Math.random()*0.1 - 0.05);
      iv = klem(Math.round(iv*spreiding), 3, MAX_INTERVAL);
    }
    return {
      s: +S.toFixed(4), d: +D.toFixed(4),
      laatst: dag, due: plusDagen(dag, iv),
      herh: (k?.herh || 0) + 1,
      missers: (k?.missers || 0) + (g === 1 ? 1 : 0)
    };
  }
  return { beoordeel, interval, ophaalbaarheid, RETENTIE };
})();

let S = null;          // de hele opslag

/* Twee momentopnamen samenvoegen. Regel: niets weggooien. Een profiel dat
   ergens bestaat blijft bestaan; per profiel wint de verste voortgang en per
   kaart de meest recente beoordeling. Zo kan een kind op de telefoon oefenen
   en op de tablet verder, zonder dat de ene het werk van de andere wist. */
function samenvoegenProfiel(a, b){
  if(!a) return b; if(!b) return a;
  const kaarten = SAMEN.perId(a.kaarten, b.kaarten, (x, y) => {
    // 'laatst' is de datum van de laatste beoordeling; die bepaalt wie wint
    const lx = (x && x.laatst) || '', ly = (y && y.laatst) || '';
    if(lx !== ly) return lx > ly ? x : y;
    return ((x && x.herhalingen) || 0) >= ((y && y.herhalingen) || 0) ? x : y;
  });
  const dagen = SAMEN.perId(a.dagen, b.dagen, (x, y) => ({
    blokken: SAMEN.max(x.blokken, y.blokken), herhaald: SAMEN.max(x.herhaald, y.herhaald),
    goed: SAMEN.max(x.goed, y.goed), fout: SAMEN.max(x.fout, y.fout)
  }));
  const letters = SAMEN.perId(a.letters, b.letters, (x, y) => SAMEN.max(x, y));
  const spelrecords = SAMEN.perId(a.spelrecords, b.spelrecords, (x, y) => SAMEN.max(x, y));
  return Object.assign({}, a, b, {
    kaarten, dagen, letters, spelrecords,
    blok: SAMEN.max(a.blok, b.blok),
    punten: SAMEN.max(a.punten, b.punten),
    // instellingen volgen de kant die ze het laatst bewust heeft gezet;
    // bij twijfel die van b (de kopie die zojuist binnenkwam)
    voorkeur: Object.assign({}, a.voorkeur, b.voorkeur)
  });
}
function samenvoegen(a, b){
  a = a || {}; b = b || {};
  const profielen = {};
  const ids = new Set([...Object.keys(a.profielen || {}), ...Object.keys(b.profielen || {})]);
  ids.forEach(id => { profielen[id] = samenvoegenProfiel((a.profielen||{})[id], (b.profielen||{})[id]); });
  return { versie:1, actief: a.actief || b.actief, thema: a.thema || b.thema, profielen };
}

/* Haalt de centrale kopie op, voegt samen, schrijft naar beide kanten terug. */
async function gelijktrekken(stil){
  const ver = await WOLK.ophalen();
  if(ver === null) return false;
  S = samenvoegen(S, ver);
  P = S.actief && S.profielen[S.actief] ? S.profielen[S.actief] : P;
  opslag.schrijf(S);
  await WOLK.bewaar(S, true);
  if(!stil && typeof tekenAlles === 'function') tekenAlles();
  return true;
}

/* Leeftijd bepaalt het spoor. De ouder kan het overschrijven; dan
   blijft spoorHandmatig true en rekent de app niet meer terug. */
function spoorBijLeeftijd(l){
  if(l <= 9)  return 1;
  if(l <= 12) return 2;
  if(l <= 15) return 3;
  return 4;
}

const isKind = () => P && P.spoor <= 2;

function maakProfiel(naam, leeftijd, intentie){
  const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const spoor = spoorBijLeeftijd(leeftijd);
  S.profielen[id] = {
    id, naam, leeftijd, spoor, spoorHandmatig:false,
    intentie: intentie || '',

    dagdoel: spoor === 1 ? 15 : spoor === 2 ? 25 : spoor === 3 ? 40 : 60,
    voorkeur: { vocalisatie: spoor <= 2 ? 'vol' : 'selectief', glossen:false, geluid:true },
    kaarten: {},        // kaart-id -> FSRS-staat
    blok: 0,            // hoeveel blokken van het leerpad af zijn
    dagen: {},          // datum -> {blokken:n, herhaald:n, goed:n, fout:n}
    punten: 0,
    spelrecords: {},
    letters: {},        // letter -> aantal keer goed (voor het veroverde alfabet)
    jaar: null          // het jaarprogramma; wordt aangemaakt na de niveaubepaling
  };
  S.actief = id;
  P = S.profielen[id];
  bewaar();
  return P;
}
function kiesProfiel(id){
  if(!S.profielen[id]) return false;
  S.actief = id; P = S.profielen[id]; bewaar(); return true;
}

/* =============================================================================
   HET PROFIEL KOMT VAN DE STARTPAGINA

   Deze app had zijn eigen profielwisselaar met iedereen erin. Dat betekende dat
   een kind het profiel van een ander kon aanklikken en in diens kaarten en
   voortgang terechtkwam. Wie je bent staat nu één keer vast, op de startpagina.
