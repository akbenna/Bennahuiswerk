============================================================================= */
function zelfIsOuder(){ const w = POORT.wie(); return !w || w.rol === 'ouder'; }
function zelfKoppelen(){
  const w = POORT.wie(); if(!w) return false;
  const gelijk = n => String(n||'').trim().toLowerCase() === w.naam;
  let p = Object.values(S.profielen).find(x => gelijk(x.naam));
  if(!p){
    /* Een ouder komt kijken en hoort daar geen leeg eigen profiel bij te
       krijgen; die kiest zelf in de wisselaar. Heeft hij er wél een, dan wordt
       dat hierboven al gevonden. */
    if(w.rol === 'ouder') return false;
    /* Het geboortejaar staat centraal; zonder dat kan de app het spoor niet
       kiezen. Ontbreekt het, dan begint hij op het middelste spoor en zet je
       het jaar alsnog in het ouderoverzicht van de startpagina. */
    const naam = w.naam.charAt(0).toUpperCase() + w.naam.slice(1);
    const leeftijd = w.geboren ? (new Date()).getFullYear() - w.geboren : 12;
    p = maakProfiel(naam, leeftijd, '');
  }
  /* Is het jaar centraal bijgesteld en staat het spoor hier nog niet met de hand
     vast, dan trekken we het spoor mee. */
  if(w.geboren && !p.spoorHandmatig){
    const nieuwSpoor = spoorBijLeeftijd((new Date()).getFullYear() - w.geboren);
    if(p.spoor !== nieuwSpoor){ p.spoor = nieuwSpoor; p.leeftijd = (new Date()).getFullYear() - w.geboren; }
  }
  kiesProfiel(p.id);
  return true;
}

/* ---------- 5. het leerpad ---------------------------------
   Het pad is een vaste reeks blokken. Eén blok is één sessie.

   Er is bewust geen streak en geen achterstand. De kalender wordt bij
   elke opening opnieuw op vandaag verankerd: het eerstvolgende blok
   dat je nog niet hebt gedaan, is dat van vandaag; het blok erna is
   dat van morgen. Wie een week niets doet, vindt dus geen zeven
   sessies terug maar precies één, en er is niets verloren gegaan.
   (Silverman & Barasch, JCR 2023: een gebroken reeks verlaagt het
   vervolggedrag; een schema dat altijd op vandaag staat kan niet
   breken.)

   Binnen een blok wordt alleen gemengd wat verward kan worden —
   ba/ta/tha bij elkaar, sin/shin bij elkaar, zons- tegen maansletters.
   Letters, woordenschat en grammatica zitten nooit in dezelfde sessie;
   dat is versnippering, geen interleaving.                         */

/* Verwarparen: letters die op elkaar lijken in vorm of klank staan in
   dezelfde groep, zodat je ze naast elkaar leert onderscheiden. */
const LETTERGROEPEN = [
  { l:['ا','ب'],          t:'Alif en ba — de eerste twee' },
  { l:['ت','ث'],          t:'Ta en tha — twee punten of drie' },
  { l:['ج','ح','خ'],      t:'Jim, ha en kha — één vorm, drie klanken' },
  { l:['د','ذ'],          t:'Dal en dhal' },
  { l:['ر','ز'],          t:'Ra en zay' },
  { l:['س','ش'],          t:'Sin en shin' },
  { l:['ص','ض'],          t:'Sad en dad — de zware s en d' },
  { l:['ط','ظ'],          t:'Ta en za — de zware t en dh' },
  { l:['ع','غ'],          t:'Ayn en ghayn — de keelletters' },
  { l:['ف','ق'],          t:'Fa en qaf — één punt of twee' },
  { l:['ك','ل'],          t:'Kaf en lam' },
  { l:['م','ن'],          t:'Mim en nun' },
  { l:['ه','و','ي'],      t:'Ha, waw en ya — de laatste drie' }
];

function hakInStukken(arr, n){
  const uit = [];
  for(let i=0;i<arr.length;i+=n) uit.push(arr.slice(i,i+n));
  return uit;
}

/* Rondgang over meerdere stromen volgens een herhalend patroon. Zo
   wisselt de sóórt sessie van dag tot dag, terwijl elke sessie zelf
   over één ding gaat. */
function rondgang(stromen, patroon){
  const kopie = {}; Object.keys(stromen).forEach(k => kopie[k] = stromen[k].slice());
  const uit = []; let i = 0, leeg = 0;
  while(leeg < patroon.length*2 && uit.length < 500){
    const sleutel = patroon[i % patroon.length]; i++;
    if(kopie[sleutel] && kopie[sleutel].length){ uit.push(kopie[sleutel].shift()); leeg = 0; }
    else leeg++;
    if(Object.keys(kopie).every(k => !kopie[k].length)) break;
  }
  return uit;
}

function bouwPad(spoor){
  const woorden = WOORDEN.map((w,i)=>({w,i})).filter(x => x.w.s <= spoor);
  const gram    = GRAMMATICA.filter(g => g.sp === spoor);
  const zinnen  = ZINNEN.map((z,i)=>({z,i})).filter(x => x.z.n2 === Math.min(spoor,4));
  const teksten = TEKSTEN.filter(t => t.n2 === Math.min(spoor,4));

  /* Titels moeten uit elkaar te houden zijn in een lijst van
     zeventig stappen; "Woorden: familie" drie keer op rij helpt
     niemand. Vandaar de doortelling per thema en de categorie bij
     de zinnen. */
  const themaTeller = {};
  const stroomW = hakInStukken(woorden, spoor === 1 ? 6 : 8).map(g => {
    const th = g[0].w.th;
    themaTeller[th] = (themaTeller[th] || 0) + 1;
    const meer = woorden.filter(x => x.w.th === th).length > (spoor === 1 ? 6 : 8);
    return {k:'woorden', titel:'Woorden: ' + th + (meer ? ' ' + themaTeller[th] : ''), items:g};
  });
  const stroomG = gram.map(g => ({k:'grammatica', titel:g.titel, id:g.id}));
  const stroomZ = hakInStukken(zinnen, 6).map(g => {
    const soorten = [...new Set(g.map(x => x.z.c))];
    return {k:'zinnen', titel:'Zinnen: ' + soorten.slice(0,2).join(' en '), items:g};
  });
  const stroomT = teksten.map(t => ({k:'tekst', titel:'Lezen: '+t.titel, id:t.id}));

  if(spoor === 1){
    const stroomL = LETTERGROEPEN.map(g => ({k:'letters', titel:g.t, letters:g.l}));
    const stroomTk = TEKENS.map((t,i) => ({k:'teken', titel:'Teken: '+t.tr+' — '+t.n, idx:i}));
    return rondgang({L:stroomL, T:stroomTk, W:stroomW, Z:stroomZ},
                    ['L','L','T','W','L','W','Z']);
  }
  if(spoor === 2){
    return rondgang({G:stroomG, W:stroomW, Z:stroomZ, T:stroomT},
                    ['G','W','Z','W','T','W','G']);
  }
  if(spoor === 3){
    return rondgang({G:stroomG, W:stroomW, Z:stroomZ, T:stroomT},
                    ['G','Z','W','T','G','Z','W']);
  }
  /* Volwassen spoor: hetzelfde materiaal in hoger tempo, plus de
     Koranwoorden als eigen stroom. */
  const stroomK = hakInStukken(KORAN100.map((k,i)=>({k,i})), 10)
    .map((g,i) => ({k:'koran', titel:'Koranwoorden '+(i*10+1)+'–'+(i*10+g.length), items:g}));
  const teller4 = {};
  const woorden4 = hakInStukken(WOORDEN.map((w,i)=>({w,i})), 14).map(g => {
    const th = g[0].w.th;
    teller4[th] = (teller4[th] || 0) + 1;
    return {k:'woorden', titel:'Woorden: ' + th + ' ' + teller4[th], items:g};
  });
  return rondgang({G:stroomG, K:stroomK, W:woorden4, Z:stroomZ, T:stroomT},
                  ['G','K','Z','W','K','T','G']);
}

let PAD = [];
function herbouwPad(){ PAD = P ? bouwPad(P.spoor) : []; }

/* Het blok van vandaag: het eerste dat nog niet af is. */
const blokVanVandaag = () => PAD[Math.min(P.blok, PAD.length-1)] || null;
const padKlaar = () => P && P.blok >= PAD.length;
const sessieGedaanVandaag = () => !!(P && P.dagen[vandaag()] && P.dagen[vandaag()].blokken > 0);

/* ---------- 6. kaarten ------------------------------------- */
/* Kaart-id's zijn afgeleid van de inhoud, niet opgeslagen. Zo blijft
   een profiel geldig als de inhoud groeit: nieuwe woorden krijgen
   nieuwe id's, bestaande kaarten houden hun geschiedenis. */
function kaartId(soort, sleutel, richting){
  return soort + ':' + sleutel + (richting ? ':' + richting : '');
}
function kaartStaat(id){ return P.kaarten[id] || null; }
function kaartOpslaan(id, staat){ P.kaarten[id] = staat; }

/* Alle kaarten die bij het huidige spoor horen. */
function alleKaartIds(){
  const uit = [];
  if(P.spoor === 1) LETTERS.forEach(l => uit.push(kaartId('L', l.l)));
  WOORDEN.forEach((w,i) => {
    if(w.s > P.spoor) return;
    uit.push(kaartId('W', i, 'nl'));
    if(P.spoor >= 2) uit.push(kaartId('W', i, 'ar'));
  });
  GRAMMATICA.filter(g => g.sp <= P.spoor).forEach(g =>
    g.oef.forEach((_,n) => uit.push(kaartId('G', g.id, n))));
  ZINNEN.filter(z => z.n2 <= P.spoor).forEach((z,i) => uit.push(kaartId('Z', ZINNEN.indexOf(z))));
  if(P.spoor === 4) KORAN100.forEach((k,i) => uit.push(kaartId('K', i)));
  return uit;
}

/* De wachtrij van vandaag, met dagplafond. Het plafond is er om te
   voorkomen dat een gemiste periode zich opstapelt tot een berg die
   niemand meer aanraakt; wat er niet in past schuift door naar
   morgen, met de langst wachtende kaarten eerst. */
function herhalingsRij(plafond){
  const dag = vandaag();
  const rij = [];
  Object.keys(P.kaarten).forEach(id => {
    const k = P.kaarten[id];
    if(k && k.due && k.due <= dag) rij.push({id, k, over: dagVerschil(k.due, dag)});
  });
  rij.sort((a,b) => b.over - a.over);          // langst wachtend eerst
  const max = plafond == null ? P.dagdoel : plafond;
  return { rij: rij.slice(0, max), totaal: rij.length, plafond: max };
}
const aantalDue = () => herhalingsRij(1e6).totaal;

/* ---------- 7. spraak --------------------------------------
   Web Speech is een extraatje, nooit een afhankelijkheid. Is er geen
   Arabische stem, dan verdwijnt de knop en werkt alles verder. */
const spraak = {
  stem: null,
  beschikbaar: false,
  init(){
    if(!('speechSynthesis' in window)) return;
    const zoek = () => {
      const stemmen = window.speechSynthesis.getVoices() || [];
      const ar = stemmen.find(v => /^ar/i.test(v.lang));
      if(ar){ this.stem = ar; this.beschikbaar = true; document.body.classList.add('heeft-stem'); }
    };
    zoek();
    window.speechSynthesis.onvoiceschanged = zoek;
  },
  zeg(tekst){
    if(!this.beschikbaar || !P?.voorkeur.geluid) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(tekst);
      u.voice = this.stem; u.lang = this.stem.lang; u.rate = 0.82;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
};

/* ---------- 8. vocalisatie ---------------------------------
   Volledige tashkil helpt de beginner en remt de gevorderde. Daarom
   drie standen. "Selectief" laat de tekens alleen staan bij woorden
   die zonder tekens meer dan één lezing toelaten; die woorden staan
   in een korte lijst, want automatisch bepalen van ambiguïteit vergt
   een morfologische analyse die hier niet thuishoort. */
const AMBIGU = new Set(['كتب','علم','قتل','درس','فعل','حسن','ملك','قدر','ذكر','عمل','كفر','نور','حكم','جمع','سلم','قرأ','فهم']);
function vocaliseer(ar){
  const stand = P?.voorkeur.vocalisatie || 'vol';
  if(stand === 'vol') return ar;
  if(stand === 'kaal') return ontdoeTashkil(ar);
  // selectief: per woord beslissen
  return ar.split(' ').map(w => {
    const kaal = ontdoeTashkil(w).replace(/^ال/,'');
    return AMBIGU.has(kaal) || AMBIGU.has(ontdoeTashkil(w)) ? w : ontdoeTashkil(w);
  }).join(' ');
}

/* Wikkelt losse Arabische stukken die middenin Nederlandse tekst
   staan in een eigen isolatie-element. De opdracht vraagt om
   direction:rtl met unicode-bidi:isolate in een eigen klasse — die
   eis geldt ook voor het Arabisch dat verspreid door de uitleg
   loopt, niet alleen voor de blokken. Attributen bevatten in deze
   app uitsluitend ASCII, dus een tekstvervanging is hier veilig. */
const AR_TEKENS = '\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF';
const AR_RUN = new RegExp('[' + AR_TEKENS + '](?:[' + AR_TEKENS + '\u200d ]*[' + AR_TEKENS + '])?', 'g');
function arIn(html){
  return String(html == null ? '' : html)
    .replace(AR_RUN, m => '<span class="arin' + (m.length > 16 ? ' lang' : '') + '">' + m + '</span>');
}

/* ---------- 9. letters in hun vier vormen -------------------
   Met zero-width joiner in plaats van de Unicode-presentatievormen;
   zie de toelichting boven het bestand letters.js. */
const ZWJ = '‍';
function letterVormen(l){
  const vl = LETTERS.find(x => x.l === l)?.vl;
  return {
    los:    l,
    begin:  vl ? l + ZWJ : l,
    midden: vl ? ZWJ + l + ZWJ : ZWJ + l,
    eind:   ZWJ + l,
    verbindtLinks: !!vl
  };
}

</script>
<script>
/* ============================================================
   LISAN — oefeningen
   ------------------------------------------------------------
   Uitgangspunt: ophalen boven herkennen. Meerkeuze wordt alleen
   ingezet waar onderscheiden zélf de vaardigheid is (welke van deze
   drie lijkende letters hoor je?) en waar intypen onredelijk zou
   zijn. Overal elders typt, bouwt of stelt de leerling samen.

   Tweede uitgangspunt: bij élk antwoord volgt terugkoppeling, ook
   bij een goed antwoord, en bij een fout antwoord staat er altijd
   bij waaróm. Toetsen zonder terugkoppeling levert weinig op.
   ============================================================ */

/* --- 1. bouwstenen ----------------------------------------- */

/* Afleiders kiezen uit dezelfde soort. Uit een willekeurige hoek van
   de woordenschat plukken maakt de vraag makkelijker dan bedoeld. */
function afleiders(bron, uitsluiten, n, veld){
  const kandidaten = bron.filter(x => x[veld] !== uitsluiten);
  return husselen(kandidaten).slice(0, n);
}

function maakKies(vraag, juistTekst, afleiderTeksten, uitleg, extra){
  const opties = husselen([juistTekst].concat(afleiderTeksten));
  return Object.assign({
    soort:'kies', vraag, opties, juist: opties.indexOf(juistTekst), uitleg
  }, extra || {});
}

/* --- 2. per blokvorm --------------------------------------- */

function oefLetters(letters){
  const uit = [];
  const groep = LETTERS.filter(l => letters.includes(l.l));
  const rest  = LETTERS.filter(l => !letters.includes(l.l));

  groep.forEach(L => {
    const id = kaartId('L', L.l);
    /* Klank intypen: ophalen, niet herkennen. De transcriptie is met
       een gewoon toetsenbord te typen, dus dit kan ook een kind. */
    uit.push({
      id, soort:'typ',
      vraag:'Welke klank heeft deze letter? Typ de naam of de klank.',
      ar:L.l, arGroot:true, spreek:L.n,
      juist:[L.tr, L.k, L.tr.replace(/[ʾʿ]/g,''), L.n],
      uitleg:'<b>'+esc(L.n)+'</b> — '+esc(L.tr)+', klank <b>'+esc(L.k)+'</b>. '+L.u
    });
    /* Onderscheiden binnen de verwargroep: hier is meerkeuze juist
       wél de goede vorm, want het gáát om het uit elkaar houden. */
    const anderen = groep.filter(x => x.l !== L.l).map(x => x.l);
    const vulling = afleiders(rest, L.l, Math.max(0, 3 - anderen.length), 'l').map(x => x.l);
    uit.push(maakKies(
      'Welke letter is <b>' + esc(L.n) + '</b> (' + esc(L.tr) + ')?',
      L.l, anderen.concat(vulling).slice(0,3),
      'Dit is ' + esc(L.n) + '. ' + esc(L.u.split('.')[0]) + '.',
      { id: kaartId('L', L.l, 'vorm'), optiesArabisch:true }
    ));
    /* Vormherkenning: in welke gedaante staat de letter hier? */
    const v = letterVormen(L.l);
    const welke = willekeurig([['begin','beginvorm'],['midden','middenvorm'],['eind','eindvorm']]);
    uit.push(maakKies(
      'In welke vorm staat deze letter hier?',
      welke[1], husselen(['losse vorm','beginvorm','middenvorm','eindvorm'].filter(x => x !== welke[1])).slice(0,3),
      L.vl
        ? 'De ' + esc(L.n) + ' verbindt naar beide kanten, dus hij heeft alle vier de vormen.'
        : 'Let op: de ' + esc(L.n) + ' verbindt niet naar links. Begin- en middenvorm zien er daarom hetzelfde uit als de losse en de eindvorm.',
      { ar: v[welke[0]], arGroot:true }
    ));
  });

  /* Zonsletter of maansletter — alleen de vraag stellen als de groep
     beide soorten bevat, anders is het geen onderscheid maar een
     weetje. */
  if(groep.some(l => l.zon) && groep.some(l => !l.zon)){
    const L = willekeurig(groep);
    /* De transcriptie kent digrafen (th, dh, sh, kh, gh); die moeten
       als één klank worden verdubbeld — ash-sh…, niet as-s…. */
    const klank = (L.tr.match(/^(th|dh|sh|kh|gh|.)/) || [L.tr[0]])[0];
    uit.push(maakKies(
      'Hoe spreek je <span class="ar klein-ar">ال' + L.l + '</span> uit — versmelt de l of niet?',
      L.zon ? 'De l versmelt: a' + klank + '-' + klank + '…' : 'De l blijft: al-…',
      [L.zon ? 'De l blijft: al-…' : 'De l versmelt'],
      L.zon
        ? esc(L.n) + ' is een zonsletter. De l van het lidwoord verdwijnt en de letter wordt verdubbeld.'
        : esc(L.n) + ' is een maansletter. De l blijft gewoon hoorbaar.'
    ));
  }

  /* Afsluiten met een woord bouwen uit losse letters. */
  const L0 = groep[0];
  if(L0.vb){
    uit.push(oefBouwWoord(ontdoeTashkil(L0.vb), L0.vb,
      WOORDEN.find(w => ontdoeTashkil(w.a) === ontdoeTashkil(L0.vb))?.n || '',
      kaartId('L', L0.l, 'bouw')));
  }
  return uit;
}

function oefTeken(idx){
  const T = TEKENS[idx];
  const uit = [];
  uit.push({
    id: kaartId('T', idx), soort:'typ',
    vraag:'Hoe heet dit teken?',
    ar:T.demo, arGroot:true,
    juist:[T.tr, T.n, T.tr.replace(/-/g,' ')],
    uitleg:'<b>'+esc(T.n)+'</b> — '+esc(T.tr)+'. '+T.u
  });
  uit.push(maakKies(
    'Wat doet dit teken?',
    T.u.split('.')[0] + '.',
    husselen(TEKENS.filter(x => x.n !== T.n)).slice(0,3).map(x => x.u.split('.')[0] + '.'),
    esc(T.n) + ': ' + T.u,
    { id: kaartId('T', idx, 'wat'), ar:T.demo, arGroot:true }
  ));
  return uit;
}

function oefBouwWoord(kaal, gevocaliseerd, nl, id){
  const letters = Array.from(kaal).filter(c => c !== ' ');
  return {
    id, soort:'bouw',
    vraag: nl ? 'Bouw het woord voor <b>' + esc(nl) + '</b>' : 'Bouw dit woord na',
    hint: gevocaliseerd,
    doel: kaal,
    tegels: husselen(letters.concat(husselen(LETTERS.map(l=>l.l).filter(l=>!letters.includes(l))).slice(0,2))),
    uitleg:'<span class="ar klein-ar">' + gevocaliseerd + '</span>' + (nl ? ' — ' + esc(nl) : '') +
           '. Let op de volgorde: de eerste letter staat het meest rechts.'
  };
}

function oefWoorden(items){
  const uit = [];
  items.forEach(({w,i}, n) => {
    /* Arabisch → Nederlands, intypen. */
    uit.push({
      id: kaartId('W', i, 'nl'), soort:'typ',
      vraag:'Wat betekent dit?',
      ar: vocaliseer(w.a), arGroot:true, spreek:w.a,
      juist: w.n.split(/[,(]/).map(s => s.trim()).filter(Boolean).concat([w.n]),
      uitleg:'<span class="ar klein-ar">' + w.a + '</span> — <b>' + esc(w.n) + '</b> (' + esc(w.t) + ')' +
             (w.mv ? '<br>Meervoud: <span class="ar klein-ar">' + w.mv + '</span>' : '') +
             (w.g ? '<br>Geslacht: ' + (w.g === 'v' ? 'vrouwelijk' : 'mannelijk') : '') +
             (w.d ? '<br><span class="muted">' + esc(w.d) + '</span>' : '')
    });
    /* Andere richting: produceren. Kinderen bouwen het woord uit
       losse letters, oudere leerlingen typen het met het
       schermtoetsenbord. */
    if(n % 2 === 0){
      if(P.spoor <= 2){
        uit.push(oefBouwWoord(ontdoeTashkil(w.a), w.a, w.n, kaartId('W', i, 'ar')));
      }else{
        uit.push({
          id: kaartId('W', i, 'ar'), soort:'typ-ar',
          vraag:'Schrijf in het Arabisch: <b>' + esc(w.n) + '</b>',
          juist:[w.a, ontdoeTashkil(w.a)],
          uitleg:'<span class="ar klein-ar">' + w.a + '</span> — ' + esc(w.t) +
                 '. Klinkertekens hoef je niet mee te typen.'
        });
      }
    }
    /* Luisteren en kiezen — alleen als er echt een Arabische stem is. */
    if(spraak.beschikbaar && n === 1){
      uit.push(maakKies(
        'Luister en kies het juiste woord.',
        w.n, afleiders(WOORDEN.filter(x => x.th === w.th), w.n, 3, 'n').map(x => x.n),
        'Je hoorde <span class="ar klein-ar">' + w.a + '</span> — ' + esc(w.n) + '.',
        { id: kaartId('W', i, 'luister'), spreekNu:w.a, luister:true }
      ));
    }
  });
  return uit;
}

function oefGrammatica(id){
  const G = GRAMMATICA.find(g => g.id === id);
  if(!G) return [];
  return G.oef.map((o,n) => {
    if(o.k === 'kies'){
      const opties = o.o.slice();
      return {
        id: kaartId('G', G.id, n), soort:'kies',
        vraag:o.v, opties, juist:o.j, uitleg:o.u,
        optiesArabisch: opties.every(x => /^[\s؀-ۿ]+$/.test(x))
      };
    }
    return {
      id: kaartId('G', G.id, n), soort: /[؀-ۿ]/.test(o.jt[0]) ? 'typ-ar' : 'typ',
      vraag:o.v, juist:o.jt, uitleg:o.u
    };
  });
}

function oefZinnen(items){
  const uit = [];
  items.forEach(({z,i}, n) => {
    /* Zin samenstellen uit losse woorden: productie zonder dat je
       elke letter hoeft te typen. */
    const woorden = z.a.split(' ');
    if(woorden.length >= 2 && woorden.length <= 9){
      uit.push({
        id: kaartId('Z', i), soort:'bouw-zin',
        vraag:'Zet de woorden in de goede volgorde: <b>' + esc(z.n) + '</b>',
        doel:z.a, tegels:husselen(woorden),
        uitleg:'<span class="ar klein-ar">' + z.a + '</span><br><span class="tr">' + esc(z.t) + '</span>'
      });
    }
    /* Gat in de zin: één woord weg, zelf invullen. */
    if(n % 2 === 1 && woorden.length >= 3){
      const g = Math.floor(Math.random()*woorden.length);
      const zonder = woorden.slice(); zonder[g] = '____';
      uit.push({
        id: kaartId('Z', i, 'gat'), soort:'typ-ar',
        vraag:'Vul het ontbrekende woord in.<br><span class="small muted">' + esc(z.n) + '</span>',
        ar: zonder.join(' '),
        juist:[woorden[g], ontdoeTashkil(woorden[g])],
        uitleg:'<span class="ar klein-ar">' + z.a + '</span><br><span class="tr">' + esc(z.t) + '</span><br>' + esc(z.n)
      });
    }
  });
  return uit;
}

function oefTekst(id){
  const T = TEKSTEN.find(t => t.id === id);
  if(!T) return [];
  const uit = [{
    id: kaartId('X', T.id), soort:'kies',
    vraag:T.vraag.v, opties:T.vraag.o.slice(), juist:T.vraag.j, uitleg:T.vraag.u
  }];
  /* Twee woorden uit de glossen terugvragen — die zijn tijdens het
     lezen alleen achter een tik zichtbaar geweest. */
  husselen(T.gloss).slice(0,2).forEach((g,n) => {
    uit.push({
      id: kaartId('X', T.id, 'g'+n), soort:'typ',
      vraag:'Uit de tekst: wat betekent dit woord?',
      ar:g[0], arGroot:true,
      juist:g[1].split(/[,(]/).map(s=>s.trim()).filter(Boolean).concat([g[1]]),
      uitleg:'<span class="ar klein-ar">' + g[0] + '</span> — <b>' + esc(g[1]) + '</b>'
    });
  });
  return uit;
}

function oefKoran(items){
  const uit = [];
  items.forEach(({k,i}, n) => {
    uit.push({
      id: kaartId('K', i), soort:'typ',
      vraag:'Wat betekent dit woord?',
      ar:k.a, arGroot:true, spreek:k.a,
      juist:k.n.split(/[,;]/).map(s => s.trim()).filter(Boolean).concat([k.n]),
      uitleg:'<span class="ar klein-ar">' + k.a + '</span> — <b>' + esc(k.n) + '</b> (' + esc(k.t) + ')' +
             (k.r !== '—' ? '<br>Wortel: <span class="ar klein-ar">' + k.r + '</span>' : '') +
             '<br><span class="muted">Ongeveer ' + k.f + ' keer in de Koran.</span>'
    });
    if(n % 3 === 0 && k.r !== '—'){
      uit.push(maakKies(
        'Welke wortel zit in <span class="ar klein-ar">' + k.a + '</span>?',
        k.r, afleiders(KORAN100.filter(x => x.r !== '—'), k.r, 3, 'r').map(x => x.r),
        '<span class="ar klein-ar">' + k.a + '</span> komt van <span class="ar klein-ar">' + k.r +
        '</span>. Wie de wortel kent, herkent alle woorden die eruit voortkomen.',
        { id: kaartId('K', i, 'wortel'), optiesArabisch:true }
      ));
    }
  });
  return uit;
}

/* --- 3. de oefeningen van één blok ------------------------- */
function oefeningenVoorBlok(blok){
  if(!blok) return [];
  switch(blok.k){
    case 'letters':     return oefLetters(blok.letters);
    case 'teken':       return oefTeken(blok.idx);
    case 'woorden':     return oefWoorden(blok.items);
    case 'grammatica':  return oefGrammatica(blok.id);
    case 'zinnen':      return oefZinnen(blok.items);
    case 'tekst':       return oefTekst(blok.id);
    case 'koran':       return oefKoran(blok.items);
    default:            return [];
  }
}

/* --- 4. een kaart uit de herhalingswachtrij naar een oefening --- */
function oefeningVoorKaart(id){
  const [soort, sleutel, richting] = id.split(':');
  try{
    if(soort === 'L'){
      const L = LETTERS.find(x => x.l === sleutel);
      if(!L) return null;
      if(richting === 'vorm') return oefLetters([L.l])[1];
      if(richting === 'bouw') return oefLetters([L.l]).find(o => o.soort === 'bouw') || null;
      return oefLetters([L.l])[0];
    }
    if(soort === 'T') return oefTeken(+sleutel)[richting === 'wat' ? 1 : 0];
    if(soort === 'W'){
      const i = +sleutel, w = WOORDEN[i];
      if(!w) return null;
      const set = oefWoorden([{w,i}]);
      return set.find(o => o.id === id) || set[0];
    }
    if(soort === 'G'){
      const set = oefGrammatica(sleutel);
      return set.find(o => o.id === id) || null;
    }
    if(soort === 'Z'){
      const i = +sleutel, z = ZINNEN[i];
      if(!z) return null;
      const set = oefZinnen([{z,i}]);
      return set.find(o => o.id === id) || set[0] || null;
    }
    if(soort === 'X'){
      const set = oefTekst(sleutel);
      return set.find(o => o.id === id) || set[0] || null;
    }
    if(soort === 'K'){
      const i = +sleutel, k = KORAN100[i];
      if(!k) return null;
      const set = oefKoran([{k,i}]);
      return set.find(o => o.id === id) || set[0] || null;
    }
  }catch(e){ /* inhoud kan verschoven zijn; kaart dan overslaan */ }
  return null;
}

/* ============================================================
   5. weergeven en beoordelen
   ============================================================ */
let huidigeOef = null, oefBeantwoord = false, oefBouwsel = [];
/* Staat de app in herhalingsstand mét zelfbeoordeling? Alleen het
   volwassen spoor krijgt die keuze; bij een kind levert "hoe ging
   dat?" vooral ruis op en vertraagt het de sessie. */
let zelfOordeel = false;

function toonOefening(oef, doel, klaarFn){
  huidigeOef = oef; oefBeantwoord = false; oefBouwsel = [];
  const spreekKnop = (tekst) => (spraak.beschikbaar && P.voorkeur.geluid && tekst)
    ? '<button class="ikoon" id="oefSpreek" aria-label="Uitspreken" title="Uitspreken">🔈</button>' : '';

  let hoofd = '';
  if(oef.ar && !oef.luister){
    hoofd = '<div class="mid" style="margin:6px 0 18px">' +
      '<div class="ar ' + (oef.arGroot ? 'reus' : 'groot') + '">' + oef.ar + '</div>' +
      spreekKnop(oef.spreek || oef.ar) + '</div>';
  }
  if(oef.luister){
    hoofd = '<div class="mid" style="margin:6px 0 18px">' +
      '<button class="k" id="oefSpreek" style="min-width:140px">🔈 Nog eens</button></div>';
  }

  let invoer = '';
  if(oef.soort === 'kies'){
    invoer = '<div id="oefOpties">' + oef.opties.map((o,i) =>
      '<button class="optie" data-i="' + i + '">' +
        (oef.optiesArabisch ? '<span class="ar">' + o + '</span>' : esc(o)) +
      '</button>').join('') + '</div>';
  }
  else if(oef.soort === 'typ'){
    invoer = '<input class="veld" id="oefIn" autocomplete="off" autocapitalize="off" ' +
             'spellcheck="false" placeholder="Typ je antwoord">' +
             '<div class="rij" style="margin-top:12px"><button class="k" id="oefNa">Controleren</button>' +
             '<button class="k stil" id="oefWeet">Weet ik niet</button></div>';
  }
  else if(oef.soort === 'typ-ar'){
    invoer = (oef.ar ? '' : '') +
      '<input class="veld ar-in" id="oefIn" autocomplete="off" spellcheck="false" dir="rtl" placeholder="…">' +
      '<div class="toetsen" id="oefToetsen"></div>' +
      '<div class="rij" style="margin-top:12px"><button class="k" id="oefNa">Controleren</button>' +
      '<button class="k stil" id="oefWeet">Weet ik niet</button></div>';
  }
  else if(oef.soort === 'bouw' || oef.soort === 'bouw-zin'){
    invoer = '<div class="bouwvak" id="oefVak"></div><div class="tegels" id="oefTegels"></div>' +
      '<div class="rij" style="margin-top:12px"><button class="k" id="oefNa">Controleren</button>' +
      '<button class="k stil" id="oefLeeg">Wissen</button></div>';
  }

  doel.innerHTML =
    '<div class="vraagblok">' +
      '<div class="vraagtekst">' + arIn(oef.vraag) + '</div>' +
      hoofd + invoer +
      '<div id="oefTerug"></div>' +
      '<div id="oefVerder" style="margin-top:14px"></div>' +
    '</div>';

  const spreekEl = doel.querySelector('#oefSpreek');
  if(spreekEl) spreekEl.onclick = () => spraak.zeg(oef.spreekNu || oef.spreek || oef.ar);
  if(oef.luister) setTimeout(() => spraak.zeg(oef.spreekNu), 350);

  if(oef.soort === 'kies'){
    doel.querySelectorAll('#oefOpties .optie').forEach(b =>
      b.onclick = () => { if(!oefBeantwoord) beoordeelKies(+b.dataset.i, doel, klaarFn); });
  }
  if(oef.soort === 'typ' || oef.soort === 'typ-ar'){
    const inv = doel.querySelector('#oefIn');
    inv.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); doel.querySelector('#oefNa').click(); } });
    doel.querySelector('#oefNa').onclick = () => { if(!oefBeantwoord) beoordeelTyp(inv.value, doel, klaarFn); };
    doel.querySelector('#oefWeet').onclick = () => { if(!oefBeantwoord) beoordeelTyp('', doel, klaarFn, true); };
    if(oef.soort === 'typ-ar') bouwToetsenbord(doel.querySelector('#oefToetsen'), inv);
    setTimeout(() => { if(oef.soort === 'typ') inv.focus(); }, 60);
  }
  if(oef.soort === 'bouw' || oef.soort === 'bouw-zin'){
    tekenBouw(doel, oef);
    doel.querySelector('#oefNa').onclick = () => { if(!oefBeantwoord) beoordeelBouw(doel, klaarFn); };
    doel.querySelector('#oefLeeg').onclick = () => { oefBouwsel = []; tekenBouw(doel, oef); };
  }
}

/* Schermtoetsenbord. Zonder dit kan niemand op een telefoon Arabisch
   invoeren zonder eerst een systeemtoetsenbord te installeren. */
const TOETSRIJ = ['ا','ب','ت','ث','ج','ح','خ','د','ذ','ر','ز','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي','ة','ى','ء','أ','إ','آ','ؤ','ئ'];
function bouwToetsenbord(vak, invoer){
  if(!vak) return;
  vak.innerHTML =
    TOETSRIJ.map(t => '<button class="toets" data-t="' + t + '" type="button">' + t + '</button>').join('') +
    '<button class="toets breed" data-t=" " type="button">spatie</button>' +
    '<button class="toets breed" data-t="«" type="button">wis</button>';
  vak.querySelectorAll('.toets').forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    if(t === '«') invoer.value = invoer.value.slice(0,-1);
    else invoer.value += t;
    invoer.focus();
  });
}

function tekenBouw(doel, oef){
  const vak = doel.querySelector('#oefVak'), teg = doel.querySelector('#oefTegels');
  const zin = oef.soort === 'bouw-zin';
  vak.innerHTML = oefBouwsel.length
    ? oefBouwsel.map((t,i) => '<button class="tegel inbouw" data-p="' + i + '">' + t + '</button>').join('')
    : '<span class="muted small" style="direction:ltr">Tik de stukken in de goede volgorde aan — van rechts naar links.</span>';
  const gebruikt = {};
  oefBouwsel.forEach(t => gebruikt[t] = (gebruikt[t]||0)+1);
  const nog = {};
  teg.innerHTML = oef.tegels.map((t,i) => {
    nog[t] = (nog[t]||0)+1;
    const isGebruikt = nog[t] <= (gebruikt[t]||0);
    return '<button class="tegel ' + (isGebruikt ? 'gebruikt' : '') + '" data-i="' + i + '"' +
           (zin ? ' style="font-size:1.3rem;min-width:auto;padding:8px 12px"' : '') + '>' + t + '</button>';
  }).join('');
  teg.querySelectorAll('.tegel').forEach(b => b.onclick = () => {
    if(oefBeantwoord) return;
    oefBouwsel.push(oef.tegels[+b.dataset.i]); tekenBouw(doel, oef);
  });
  vak.querySelectorAll('.tegel').forEach(b => b.onclick = () => {
    if(oefBeantwoord) return;
    oefBouwsel.splice(+b.dataset.p, 1); tekenBouw(doel, oef);
  });
}

function beoordeelKies(i, doel, klaarFn){
  const oef = huidigeOef, goed = i === oef.juist;
  doel.querySelectorAll('#oefOpties .optie').forEach((b,bi) => {
    b.disabled = true;
    if(bi === oef.juist) b.classList.add('goed');
    else if(bi === i) b.classList.add('fout');
    else b.classList.add('flauw');
  });
  rondOefeningAf(goed, doel, klaarFn, oef.opties[oef.juist]);
}

function beoordeelTyp(waarde, doel, klaarFn, opgegeven){
  const oef = huidigeOef;
  const goed = !opgegeven && waarde.trim() !== '' && antwoordKlopt(waarde, oef.juist);
  const inv = doel.querySelector('#oefIn'); if(inv) inv.disabled = true;
  const tst = doel.querySelector('#oefToetsen'); if(tst) tst.style.display = 'none';
  rondOefeningAf(goed, doel, klaarFn, oef.juist[0]);
}

function beoordeelBouw(doel, klaarFn){
  const oef = huidigeOef;
  const gemaakt = oef.soort === 'bouw-zin' ? oefBouwsel.join(' ') : oefBouwsel.join('');
  const goed = normAr(gemaakt) === normAr(oef.doel);
  rondOefeningAf(goed, doel, klaarFn, oef.doel);
}

/* Terugkoppeling is verplicht en staat er altijd — ook bij goed, want
   dan bevestig je de redenering in plaats van alleen de uitkomst. */
function rondOefeningAf(goed, doel, klaarFn, juistTekst){
  oefBeantwoord = true;
  const oef = huidigeOef;
  const naKnoppen = doel.querySelector('#oefNa'); if(naKnoppen) naKnoppen.disabled = true;
  const weet = doel.querySelector('#oefWeet'); if(weet) weet.disabled = true;
  const leeg = doel.querySelector('#oefLeeg'); if(leeg) leeg.disabled = true;

  const arJuist = /[؀-ۿ]/.test(String(juistTekst||''));
  doel.querySelector('#oefTerug').innerHTML =
    '<div class="terug ' + (goed ? 'goed' : 'fout') + '">' +
      '<b>' + (goed ? 'Goed' : 'Nog niet') + '</b>' +
      (goed ? '' : '<div style="margin-bottom:6px">Het juiste antwoord is ' +
        (arJuist ? '<span class="ar klein-ar">' + juistTekst + '</span>' : '<b>' + esc(juistTekst) + '</b>') + '.</div>') +
      '<div class="uitleg">' + arIn(oef.uitleg) + '</div>' +
    '</div>';

  /* FSRS bijwerken. In de sessie oordeelt de app zelf: goed in één
     keer is "goed" (3), fout is "opnieuw" (1). Zie aanname 3. */
  const vorigeStaat = oef.id ? kaartStaat(oef.id) : null;
  if(oef.id){
    kaartOpslaan(oef.id, FSRS.beoordeel(vorigeStaat, goed ? 3 : 1));
  }
  const d = vandaag();
  P.dagen[d] = P.dagen[d] || {blokken:0, herhaald:0, goed:0, fout:0};
  P.dagen[d][goed ? 'goed' : 'fout']++;
  if(goed && isKind()) P.punten += 10;
  /* Het veroverde alfabet: een letter kleurt pas als je hem drie keer
     goed hebt gehad. */
  if(oef.id && oef.id.startsWith('L:') && goed){
    const l = oef.id.split(':')[1];
    P.letters[l] = (P.letters[l] || 0) + 1;
  }
  bewaar();

  /* Zelfbeoordeling: alleen bij herhaling en alleen op het volwassen
     spoor. Het oordeel vervangt het automatische, gerekend vanaf
     dezelfde uitgangsstaat, zodat er niet twee keer wordt bijgewerkt. */
  const vak = doel.querySelector('#oefVerder');
  if(zelfOordeel && goed && oef.id){
    vak.innerHTML =
      '<div class="klein muted" style="margin-bottom:6px">Hoe ging dat?</div>' +
      '<div class="raster r3">' +
      [[2,'Lastig'],[3,'Goed'],[4,'Makkelijk']].map(([g,n]) =>
        '<button class="k rand" data-g="' + g + '">' + n + '</button>').join('') +
      '</div>';
    vak.querySelectorAll('button[data-g]').forEach(b => b.onclick = () => {
      kaartOpslaan(oef.id, FSRS.beoordeel(vorigeStaat, +b.dataset.g));
      bewaar(); klaarFn();
    });
    return;
  }
  vak.innerHTML = '<button class="k vol" id="oefDoor">Verder</button>';
  const door = doel.querySelector('#oefDoor');
  door.onclick = klaarFn;
  setTimeout(() => door.focus(), 40);
}

</script>
<script>
/* ============================================================
   LISAN — schermen
   ============================================================ */

/* ---------- modaal ---------- */
function toonBlad(html){
  $('#bladInhoud').innerHTML = html;
  $('#overlay').classList.add('aan');
  document.body.style.overflow = 'hidden';
}
function sluitBlad(){
  $('#overlay').classList.remove('aan');
  document.body.style.overflow = '';
}

/* ---------- tabs ---------- */
const TABS = ['vandaag','leerpad','jaarplan','alfabet','woorden','herhaling','spel','ouder'];
let actieveTab = 'vandaag';
function naarTab(t){
  actieveTab = t;
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === t)));
  $$('.zicht').forEach(v => v.classList.toggle('aan', v.id === 'z-' + t));
  window.scrollTo({top:0});
  teken(t);
}
function teken(t){
  if(t === 'vandaag')   tekenVandaag();
  if(t === 'leerpad')   tekenLeerpad();
  if(t === 'jaarplan')  tekenJaarplan();
  if(t === 'alfabet')   tekenAlfabet();
  if(t === 'woorden')   tekenWoorden();
  if(t === 'herhaling') tekenHerhaling();
  if(t === 'spel')      tekenSpel();
  if(t === 'ouder')     tekenOuder();
}
function tekenAlles(){
  document.body.dataset.modus = isKind() ? 'kind' : 'volwassen';
  $('#tabSpel').style.display = isKind() ? '' : 'none';
  const n = aantalDue();
  const bol = $('#dueBol');
  bol.textContent = n; bol.style.display = n ? '' : 'none';
  $('#profielNaam').textContent = P ? P.naam : '';
  $('#profielBol').textContent  = P ? P.naam.trim().charAt(0).toUpperCase() : '?';
  teken(actieveTab);
}

/* ============================================================
   JAARPLAN — zesendertig weken, anderhalf uur per week
   ============================================================ */
function jaarVan(pr){ return (pr||P) && (pr||P).jaar; }
function weekVan(n){ return JAAR.find(w => w.n === n); }
function blokVan(n){ return BLOKKEN.find(b => n >= b.weken[0] && n <= b.weken[1]); }
/* Alles wat tot en met deze week aan letters is behandeld — het programma is
   cumulatief, dus herhalen doe je uit de hele voorraad tot hier. */
function lettersTot(n){ return JAAR.filter(w => w.n <= n).flatMap(w => w.letters || []); }
function sessiesGedaan(j){ return Object.keys(j.sessies || {}).length; }
function minutenTotaal(j){ return Object.values(j.sessies || {}).reduce((m,x) => m + (x.minuten || 0), 0); }

function startJaar(niveau, week, score){
  P.jaar = {
    gestart: vandaag(), niveau, week,
    meting: { d: vandaag(), score, totaal: METING.length },
    sessies: {}, toetsen: {}
  };
  bewaar();
}

/* ---------- de niveaubepaling ---------- */
function tekenJaarplan(){
  const doel = $('#z-jaarplan');
  if(!P){ doel.innerHTML = '<div class="wrap"><div class="kaart">Kies eerst een profiel.</div></div>'; return; }
  const j = jaarVan();
  if(!j){ doel.innerHTML = jaarOnthaal(); $('#startMeting').onclick = () => meting(); return; }

  const w = weekVan(j.week) || JAAR[JAAR.length-1];
  const blok = blokVan(j.week);
  const af = sessiesGedaan(j), pct = Math.round(af / JAAR.length * 100);
  const klaar = !!(j.sessies || {})[j.week];

  doel.innerHTML = '<div class="wrap">' +
    '<h1>Jaarplan</h1>' +
    '<p class="muted small" style="margin-top:4px">Zesendertig weken van ' + SESSIEMINUTEN + ' minuten. Lezen en schrijven, met elke week een stuk geloof erbij.</p>' +

    '<div class="kaart" style="margin-top:14px">' +
      '<div class="rij tussen"><b>Week ' + j.week + ' van ' + JAAR.length + '</b>' +
        '<span class="muted small">' + af + ' ' + (af === 1 ? 'les' : 'lessen') + ' gedaan · ' + pct + '%</span></div>' +
      '<div class="balk" style="margin-top:8px"><i style="width:' + pct + '%"></i></div>' +
      '<p class="klein muted" style="margin-top:8px">' + esc(blok ? 'Blok ' + blok.n + ' — ' + blok.t : '') + '</p>' +
    '</div>' +

    '<div class="kaart" style="margin-top:14px">' +
      '<span class="label">De les van deze week</span>' +
      '<h2 style="margin:6px 0 2px">' + esc(w.t) + '</h2>' +
      '<p class="small" style="margin:0 0 10px">' + esc(w.doel) + '</p>' +
      (w.letters && w.letters.length
        ? '<div class="rij" style="margin-bottom:10px">' + w.letters.map(l => '<span class="ar" style="font-size:2rem">' + l + '</span>').join('') + '</div>'
        : '') +
      '<div class="rij">' +
        (klaar ? '<span class="vlag acc">Deze week is afgerond</span>' : '') +
        '<button class="k vol" id="startLes">' + (klaar ? 'Nog een keer doen' : 'Begin de les') + '</button>' +
        '<button class="k rand" id="werkblad">Werkblad afdrukken</button>' +
        (w.toets ? '<button class="k rand" id="doeToets">Toets van blok ' + w.toets + '</button>' : '') +
      '</div>' +
    '</div>' +

    '<h3 style="margin:22px 0 8px">Het hele jaar</h3>' +
    BLOKKEN.map(b =>
      '<div class="kaart" style="margin-top:10px">' +
        '<div class="rij tussen"><b>Blok ' + b.n + ' — ' + esc(b.t) + '</b>' +
          ((j.toetsen || {})[b.n] ? '<span class="vlag acc">toets ' + j.toetsen[b.n].score + '/' + j.toetsen[b.n].totaal + '</span>' : '') +
        '</div>' +
        '<p class="klein muted" style="margin:2px 0 8px">' + esc(b.u) + '</p>' +
        '<div class="rij" style="gap:6px">' +
          JAAR.filter(x => x.n >= b.weken[0] && x.n <= b.weken[1]).map(x => {
            const gedaan = !!(j.sessies || {})[x.n];
            const nu = x.n === j.week;
            /* de knop van de huidige week is gevuld, maar mag niet uitrekken:
               .vol is elders een knop over de volle breedte */
            return '<button class="k rand' + (nu ? ' vol' : '') + '" data-week="' + x.n + '"' +
              ' title="Week ' + x.n + ' — ' + esc(x.t) + '"' +
              ' style="display:inline-block;width:auto;padding:6px 10px;font-size:.82rem' +
              (gedaan && !nu ? ';border-color:var(--accent);color:var(--accent)' : '') + '">' +
              (gedaan ? '✓ ' : '') + x.n + '</button>';
          }).join('') +
        '</div>' +
      '</div>').join('') +

    '<div class="kaart" style="margin-top:14px">' +
      '<span class="label">Hoe een les eruitziet</span>' +
      '<div style="margin-top:8px">' + SESSIE.map(st =>
        '<div class="rij tussen" style="padding:7px 0;border-bottom:1px solid var(--line)">' +
          '<span>' + esc(st.t) + '</span><span class="muted small">' + st.min + ' min</span></div>').join('') +
      '</div>' +
      '<p class="klein muted" style="margin-top:10px">Samen ' + SESSIEMINUTEN + ' minuten. Zaterdag of zondag werkt het beste: één vast moment per week is meer waard dan elke dag een beetje.</p>' +
    '</div>' +
  '</div>';

  $('#startLes').onclick = () => les(j.week, 0);
  $('#werkblad').onclick = () => werkblad(j.week);
  if($('#doeToets')) $('#doeToets').onclick = () => blokToets(w.toets);
  $$('[data-week]').forEach(b => b.onclick = () => { P.jaar.week = +b.dataset.week; bewaar(); tekenJaarplan(); });
}

function jaarOnthaal(){
  return '<div class="wrap">' +
    '<h1>Jaarplan</h1>' +
    '<div class="kaart" style="margin-top:14px">' +
      '<p>Een jaar Arabisch, zesendertig weken lang, één vast moment per week van ' + SESSIEMINUTEN + ' minuten. Elke les heeft dezelfde opbouw: herhalen, nieuwe letters, lezen, schrijven, en een stuk geloof dat aansluit op het woord van die week.</p>' +
      '<p>Het loopt cumulatief: wat je in week drie leert, komt in week twintig nog terug. Aan het eind lees je al-Fatiha en de korte soera\'s van het blad.</p>' +
      '<p>We beginnen met een korte niveaubepaling van achttien vragen. Die bepaalt niet wie het knapst is, maar op welke week jouw programma begint — wie de eerste letters al kent, hoeft die niet nog eens.</p>' +
      '<div class="rij" style="margin-top:14px"><button class="k vol" id="startMeting">Doe de niveaubepaling</button></div>' +
    '</div>' +
  '</div>';
}

/* ---------- de niveaubepaling ---------- */
function meting(){
  let i = 0, goed = 0; const per = {};
  const stap = () => {
    if(i >= METING.length) return metingKlaar(goed, per);
    const q = METING[i];
    toonBlad(
      '<span class="label">Niveaubepaling · vraag ' + (i+1) + ' van ' + METING.length + '</span>' +
      '<div class="balk" style="margin:10px 0 16px"><i style="width:' + Math.round(i/METING.length*100) + '%"></i></div>' +
      '<p style="margin:0 0 4px">' + esc(q.v) + '</p>' +
      (q.ar ? '<div class="ar" style="font-size:2.6rem;text-align:center;margin:14px 0">' + q.ar + '</div>' : '') +
      '<div id="opties" style="margin-top:12px">' +
        q.o.map((o,k) => '<button class="k rand" data-o="' + k + '" style="display:block;width:100%;text-align:right;margin-top:8px">' +
          (/[؀-ۿ]/.test(o) ? '<span class="ar" style="font-size:1.5rem">' + o + '</span>' : esc(o)) + '</button>').join('') +
      '</div>');
    $$('#opties [data-o]').forEach(b => b.onclick = () => {
      const ok = +b.dataset.o === q.a;
      if(ok) goed++;
      per[q.g] = per[q.g] || {goed:0, totaal:0};
      per[q.g].totaal++; if(ok) per[q.g].goed++;
      i++; stap();
    });
  };
  stap();
}
function metingKlaar(goed, per){
  let nv = METINGNIVEAUS[0];
  METINGNIVEAUS.forEach(x => { if(goed >= x.min) nv = x; });
  toonBlad(
    '<span class="label">Niveaubepaling</span>' +
    '<h2 style="margin:6px 0">' + goed + ' van de ' + METING.length + ' goed</h2>' +
    '<p><b>' + esc(nv.t) + '</b> — ' + esc(nv.u) + '</p>' +
    '<div class="kaart dun" style="margin-top:12px">' +
      Object.keys(per).map(g => '<div class="rij tussen" style="padding:5px 0"><span>' + esc(g) + '</span>' +
        '<span class="muted small">' + per[g].goed + '/' + per[g].totaal + '</span></div>').join('') +
    '</div>' +
    '<p class="klein muted" style="margin-top:12px">Het programma begint voor jou bij week ' + nv.week + '. Je kunt altijd terug naar een eerdere week — in het jaarplan tik je gewoon op het weeknummer.</p>' +
    '<div class="rij" style="margin-top:16px"><button class="k vol" id="metingOk">Begin bij week ' + nv.week + '</button></div>');
  $('#metingOk').onclick = () => { startJaar(nv.niveau, nv.week, goed); sluitBlad(); tekenJaarplan(); };
}

/* ---------- de cockpit: het jaarplan van alle kinderen naast elkaar ---------- */
/* Wat een ouder wil weten past op één scherm: waar staat ieder kind, wanneer was
   de laatste les, hoe gingen de toetsen, en wat komt er zaterdag. */
function cockpit(){
  const lijst = Object.values(S.profielen);
  const metJaar = lijst.filter(x => x.jaar);
  const rij = pr => {
    const j = pr.jaar;
    if(!j) return '<div class="kaart" style="margin-top:10px">' +
      '<div class="rij tussen"><b>' + esc(pr.naam) + '</b><span class="muted small">nog geen jaarplan</span></div>' +
      '<p class="klein muted" style="margin:6px 0 0">Laat ' + esc(pr.naam) + ' de niveaubepaling doen onder <b>Jaarplan</b>; daarna begint het programma op de juiste week.</p>' +
      '</div>';
    const af = sessiesGedaan(j), pct = Math.round(af / JAAR.length * 100);
    const w = weekVan(j.week) || JAAR[JAAR.length-1];
    const laatste = Object.values(j.sessies || {}).map(x => x.d).sort().pop();
    const toetsen = Object.keys(j.toetsen || {}).sort();
    const uren = Math.round(minutenTotaal(j) / 6) / 10;
    return '<div class="kaart" style="margin-top:10px">' +
      '<div class="rij tussen"><b>' + esc(pr.naam) + '</b>' +
        '<span class="muted small">week ' + j.week + ' van ' + JAAR.length + ' · ' + pct + '%</span></div>' +
      '<div class="balk" style="margin:8px 0"><i style="width:' + pct + '%"></i></div>' +
      '<div class="rij" style="gap:16px;margin-top:8px">' +
        '<span class="statvak"><b>' + af + '</b><span>lessen</span></span>' +
        '<span class="statvak"><b>' + uren + '</b><span>uur les</span></span>' +
        '<span class="statvak"><b>' + (j.meting ? j.meting.score + '/' + j.meting.totaal : '—') + '</b><span>niveaubepaling</span></span>' +
        '<span class="statvak"><b>' + toetsen.length + '</b><span>toetsen</span></span>' +
      '</div>' +
      (toetsen.length
        ? '<div class="rij" style="margin-top:10px">' + toetsen.map(k => {
            const t = j.toetsen[k], p2 = Math.round(t.score/t.totaal*100);
            return '<span class="vlag ' + (p2 >= 80 ? 'acc' : p2 >= 60 ? 'warmv' : '') + '">blok ' + k + ': ' + t.score + '/' + t.totaal + '</span>';
          }).join('') + '</div>'
        : '') +
      '<p class="klein muted" style="margin-top:10px">Laatste les: ' + (laatste ? esc(laatste) : 'nog geen') +
        ' · hierna: <b>' + esc(w.t) + '</b>' + (w.toets ? ' (met toets)' : '') + '</p>' +
      '<div class="rij" style="margin-top:10px">' +
        '<button class="k rand" data-cok="' + pr.id + '">Open het jaarplan</button>' +
        '<button class="k rand" data-cwb="' + pr.id + '">Werkblad van deze week</button>' +
        '<button class="k rand" data-cmeet="' + pr.id + '">Opnieuw meten</button>' +
      '</div>' +
    '</div>';
  };
  return '<h3 style="margin-top:22px">Jaarplan — de cockpit</h3>' +
    '<p class="small muted" style="margin:4px 0 0">Zesendertig weken van ' + SESSIEMINUTEN + ' minuten per kind. Hier zie je waar iedereen staat, wanneer de laatste les was en hoe de toetsen gingen.</p>' +
    (lijst.length ? lijst.map(rij).join('') : '<div class="kaart" style="margin-top:10px">Nog geen profielen.</div>') +
    (metJaar.length > 1
      ? '<p class="klein muted" style="margin-top:10px">Tip: laat de kinderen tegelijk beginnen maar niet per se op dezelfde week — het programma is per kind. Wie verder is, helpt de ander; dat is het beste wat er is voor allebei.</p>'
      : '');
}

/* ---------- de les zelf ---------- */
/* Zeven onderdelen achter elkaar, met de klok erbij. De klok is een hulpmiddel,
   geen baas: hij loopt door en waarschuwt zacht, maar niets sluit vanzelf af. */
let _klok = null;
function les(n, i){
  const w = weekVan(n); if(!w) return;
  clearInterval(_klok);
  if(i >= SESSIE.length) return lesKlaar(n);
  const st = SESSIE[i];
  const eerder = lettersTot(n - 1);
  let inhoud = '';

  if(st.id === 'open'){
    inhoud = '<div class="mid"><div class="ar reus">بِسْمِ اللَّهِ</div>' +
      '<p class="tr">Bismillah</p></div>' +
      '<div class="kaart dun" style="margin-top:14px"><b>Vandaag: ' + esc(w.t) + '</b>' +
      '<p class="small" style="margin:6px 0 0">' + esc(w.doel) + '</p></div>';
  }
  if(st.id === 'herhaal'){
    const kies = eerder.slice(-12);
    inhoud = '<p class="small">Lees deze letters van de vorige weken hardop voor. Twijfel je bij één, kijk hem dan samen na in het alfabet.</p>' +
      (kies.length
        ? '<div class="rij" style="justify-content:center;margin-top:14px">' +
            kies.map(l => '<span class="ar" style="font-size:2.1rem;padding:6px 10px">' + l + '</span>').join('') + '</div>'
        : '<p class="klein muted" style="margin-top:10px">Dit is de eerste week; er is nog niets om te herhalen. Ga door naar de letters.</p>') +
      '<p class="klein muted" style="margin-top:12px">Daarna: doe een ronde in <b>Herhaling</b> — die kaarten komen precies terug op het moment dat je ze dreigt te vergeten.</p>';
  }
  if(st.id === 'letters'){
    inhoud = (w.letters || []).length
      ? (w.letters || []).map(l => {
          const L = LETTERS.find(x => x.l === l); const v = letterVormen(l);
          return '<div class="kaart dun" style="margin-top:10px">' +
            '<div class="rij tussen"><div><b>' + (L ? esc(L.n) + ' — ' + esc(L.tr) : l) + '</b>' +
            '<div class="klein muted">klank: ' + (L ? esc(L.k) : '') + '</div></div>' +
            '<span class="ar" style="font-size:2.6rem">' + l + '</span></div>' +
            '<div class="rij" style="justify-content:space-around;margin-top:10px;background:var(--surface-2);border-radius:10px;padding:8px 0">' +
              [['los',v.los],['begin',v.begin],['midden',v.midden],['eind',v.eind]].map(([nm,vv]) =>
                '<div class="mid"><div class="ar" style="font-size:1.9rem">' + vv + '</div><div class="klein muted">' + nm + '</div></div>').join('') +
            '</div>' +
            (L ? '<p class="klein" style="margin-top:8px">' + esc(L.u) + '</p>' : '') +
            (L && L.vb ? '<div class="rij" style="margin-top:6px"><span class="klein muted">voorbeeld</span><span class="ar">' + L.vb + '</span></div>' : '') +
          '</div>';
        }).join('')
      : '<p class="small">Deze week komen er geen nieuwe letters bij. ' + esc(w.focus ? 'De aandacht gaat naar: ' + w.focus + '.' : 'Het gaat om herhalen en vastzetten.') + '</p>';
  }
  if(st.id === 'lezen'){
    inhoud = '<p class="small">Hardop lezen, drie keer per regel. Eerst langzaam en spellend, dan één keer vloeiend.</p>' +
      '<div style="margin-top:12px">' + (w.lezen || []).map(x =>
        '<div class="kaart dun" style="margin-top:8px;text-align:center"><div class="ar" style="font-size:2rem">' + x + '</div></div>').join('') + '</div>';
  }
  if(st.id === 'schrijven'){
    inhoud = '<p class="small">Van rechts naar links. Eerst overtrekken, dan zelf. Neem de tijd: netjes is belangrijker dan veel.</p>' +
      '<div class="rij" style="margin-top:14px"><button class="k vol" id="naarWerkblad">Open het werkblad</button></div>' +
      '<p class="klein muted" style="margin-top:10px">Het werkblad is gemaakt om af te drukken. Lukt dat niet, laat het kind dan op het scherm meekijken en op papier naschrijven.</p>';
  }
  if(st.id === 'geloof'){
    const g = w.geloof || {};
    inhoud = '<div class="mid"><div class="ar reus">' + (g.ar || '') + '</div><p class="tr">' + esc(g.tr || '') + '</p></div>' +
      '<h3 style="margin-top:12px">' + esc(g.t || '') + '</h3>' +
      '<p style="margin-top:6px">' + esc(g.x || '') + '</p>' +
      '<p class="klein muted" style="margin-top:12px">Meer hierover staat in Islam leren, de andere app van de hub.</p>';
  }
  if(st.id === 'slot'){
    inhoud = '<p class="small">Spreek af wat er deze week thuis blijft liggen:</p>' +
      '<ul style="margin:10px 0 0 18px;line-height:1.8">' +
        ((w.letters || []).length ? '<li>Elke dag vijf minuten de nieuwe letters schrijven.</li>' : '') +
        '<li>De woorden van vandaag één keer per dag hardop lezen.</li>' +
        '<li>Een ronde in <b>Herhaling</b>, drie keer deze week.</li>' +
      '</ul>' +
      '<div class="mid" style="margin-top:16px"><div class="ar reus">الْحَمْدُ لِلَّهِ</div><p class="tr">Alhamdulillah</p></div>';
  }

  toonBlad(
    '<span class="label">Week ' + n + ' · ' + esc(st.t) + ' · onderdeel ' + (i+1) + ' van ' + SESSIE.length + '</span>' +
    '<div class="balk" style="margin:10px 0 4px"><i style="width:' + Math.round(i/SESSIE.length*100) + '%"></i></div>' +
    '<div class="rij tussen" style="margin-bottom:12px">' +
      '<span class="klein muted">' + esc(st.wat) + '</span>' +
      '<span class="klein muted" id="klok" style="font-family:var(--mono)">' + st.min + ':00</span>' +
    '</div>' +
    inhoud +
    '<div class="rij tussen" style="margin-top:20px">' +
      '<button class="k rand" id="lesTerug"' + (i === 0 ? ' disabled' : '') + '>Terug</button>' +
      '<button class="k vol" id="lesDoor">' + (i === SESSIE.length - 1 ? 'De les is klaar' : 'Volgende') + '</button>' +
    '</div>');

  let over = st.min * 60;
  const toon = () => { const e = $('#klok'); if(e) e.textContent = Math.floor(over/60) + ':' + String(over % 60).padStart(2,'0'); };
  _klok = setInterval(() => { over--; if(over <= 0){ over = 0; clearInterval(_klok); } toon(); }, 1000);
  $('#lesDoor').onclick  = () => les(n, i + 1);
  $('#lesTerug').onclick = () => les(n, i - 1);
  if($('#naarWerkblad')) $('#naarWerkblad').onclick = () => werkblad(n);
}

function lesKlaar(n){
  clearInterval(_klok);
  const j = jaarVan(), w = weekVan(n);
  j.sessies = j.sessies || {};
  const eerder = !!j.sessies[n];
  j.sessies[n] = { d: vandaag(), minuten: SESSIEMINUTEN };
  (w.letters || []).forEach(l => { P.letters[l] = (P.letters[l] || 0) + 1; });
  if(!eerder) P.punten += 30;
  if(j.week === n && n < JAAR.length) j.week = n + 1;
  bewaar();
  toonBlad(
    '<div class="mid"><div class="ar reus">أَحْسَنْت</div><p class="tr">Ahsant — goed gedaan</p></div>' +
    '<h2 style="margin-top:12px">Week ' + n + ' is af</h2>' +
    '<p style="margin-top:6px">' + esc(w.doel) + '</p>' +
    (w.toets ? '<p class="small" style="margin-top:10px">Deze week hoort er een toets bij. Doe hem nu, of een andere dag deze week.</p>' : '') +
    '<div class="rij" style="margin-top:16px">' +
      (w.toets ? '<button class="k vol" id="naarToets">Doe de toets</button>' : '') +
      '<button class="k rand" id="lesSluit">Sluiten</button></div>');
  if($('#naarToets')) $('#naarToets').onclick = () => blokToets(w.toets);
  $('#lesSluit').onclick = () => { sluitBlad(); tekenJaarplan(); };
}

/* ---------- het werkblad ---------- */
/* Bedoeld om af te drukken: de letters in hun vier vormen, een rij om over te
   trekken en lege regels om zelf te schrijven. De rest van de pagina wordt bij
   het afdrukken weggelaten. */
function werkblad(n){
  const w = weekVan(n);
  const ltrs = (w.letters || []).length ? w.letters : lettersTot(n).slice(-3);
  const rij = l => '<div class="wbrij"><span class="wbgroot">' + l + '</span>' +
    Array.from({length:6}).map(() => '<span class="wbspoor">' + l + '</span>').join('') + '</div>';
  toonBlad(
    '<div class="printbaar">' +
      '<div class="wbkop"><b>Arabisch · werkblad week ' + n + '</b><span>' + esc(w.t) + '</span></div>' +
      '<p class="klein muted">Naam: ______________________   Datum: ______________</p>' +
      ltrs.map(l => {
        const L = LETTERS.find(x => x.l === l), v = letterVormen(l);
        return '<div class="wbblok">' +
          '<div class="rij tussen"><b>' + (L ? esc(L.n) + ' — ' + esc(L.tr) : l) + '</b>' +
            '<span class="klein muted">' + (L ? esc(L.k) : '') + '</span></div>' +
          '<div class="rij" style="justify-content:space-around;margin:6px 0">' +
            [['los',v.los],['begin',v.begin],['midden',v.midden],['eind',v.eind]].map(([nm,vv]) =>
              '<div class="mid"><div class="ar" style="font-size:1.7rem">' + vv + '</div><div class="klein muted">' + nm + '</div></div>').join('') +
          '</div>' +
          rij(l) + rij(l) +
          '<div class="wbleeg"></div><div class="wbleeg"></div>' +
        '</div>';
      }).join('') +
      '<div class="wbblok"><b>Lezen</b>' +
        (w.lezen || []).map(x => '<div class="wbrij"><span class="ar" style="font-size:1.7rem">' + x + '</span></div>').join('') +
      '</div>' +
      '<p class="klein muted">Van rechts naar links. Eerst overtrekken, dan zelf.</p>' +
    '</div>' +
    '<div class="rij" style="margin-top:16px">' +
      '<button class="k vol" onclick="window.print()">Afdrukken</button>' +
      '<button class="k rand" onclick="sluitBlad()">Sluiten</button></div>');
}

/* ---------- de toets aan het eind van een blok ---------- */
function blokToets(nr){
  const b = BLOKKEN.find(x => x.n === nr); if(!b) return;
  const weken = JAAR.filter(x => x.n >= b.weken[0] && x.n <= b.weken[1]);
  const ltrs = weken.flatMap(x => x.letters || []);
  const woorden = weken.flatMap(x => x.lezen || []);
  const vragen = [];
  ltrs.slice(0, 8).forEach(l => {
    const L = LETTERS.find(x => x.l === l); if(!L) return;
    const fout = LETTERS.filter(x => x.l !== l).sort(() => Math.random() - .5).slice(0,2).map(x => x.tr);
    vragen.push({ ar:l, v:'Welke letter is dit?', o:husselJ([L.tr, ...fout]), goed:L.tr });
  });
  woorden.slice(-6).forEach(x => {
    const fout = woorden.filter(y => y !== x).sort(() => Math.random() - .5).slice(0,2);
    if(fout.length < 2) return;
    vragen.push({ ar:'', v:'Welk woord hoor je?', o:husselJ([x, ...fout]), goed:x, ar2:x, spreek:true });
  });
  const rij = vragen.slice(0, 12);
  let i = 0, goed = 0;
  const stap = () => {
    if(i >= rij.length) return toetsKlaar(nr, goed, rij.length);
    const q = rij[i];
    toonBlad(
      '<span class="label">Toets blok ' + nr + ' · vraag ' + (i+1) + ' van ' + rij.length + '</span>' +
      '<div class="balk" style="margin:10px 0 16px"><i style="width:' + Math.round(i/rij.length*100) + '%"></i></div>' +
      '<p style="margin:0">' + esc(q.v) + '</p>' +
      (q.ar ? '<div class="ar" style="font-size:2.8rem;text-align:center;margin:14px 0">' + q.ar + '</div>' : '') +
      (q.spreek ? '<div class="mid" style="margin:12px 0"><button class="k rand spreek" data-x="' + esc(q.ar2) + '">Luister</button></div>' : '') +
      '<div id="tOpties">' + q.o.map((o,k) =>
        '<button class="k rand" data-o="' + k + '" style="display:block;width:100%;margin-top:8px">' +
        (/[؀-ۿ]/.test(o) ? '<span class="ar" style="font-size:1.5rem">' + o + '</span>' : esc(o)) + '</button>').join('') + '</div>');
    $$('#bladInhoud .spreek').forEach(x => x.onclick = () => spraak.zeg(x.dataset.x));
    $$('#tOpties [data-o]').forEach(bt => bt.onclick = () => {
      if(q.o[+bt.dataset.o] === q.goed) goed++;
      i++; stap();
    });
  };
  stap();
}
function husselJ(a){ const b = a.slice(); for(let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; }
function toetsKlaar(nr, goed, totaal){
  const j = jaarVan();
  j.toetsen = j.toetsen || {};
  const oud = j.toetsen[nr];
  if(!oud || goed > oud.score) j.toetsen[nr] = { d: vandaag(), score: goed, totaal };
  P.punten += goed * 5;
  bewaar();
  const pct = Math.round(goed/totaal*100);
  toonBlad(
    '<span class="label">Toets blok ' + nr + '</span>' +
    '<h2 style="margin:6px 0">' + goed + ' van de ' + totaal + ' goed</h2>' +
    '<div class="balk" style="margin:10px 0"><i style="width:' + pct + '%"></i></div>' +
    '<p>' + (pct >= 80 ? 'Dat zit goed. Ga door naar het volgende blok.'
           : pct >= 60 ? 'De basis staat. Loop de letters die misgingen nog een keer na in het alfabet voordat je verdergaat.'
           : 'Nog niet. Doe de weken van dit blok nog een keer — dat is geen straf maar precies hoe leren werkt.') + '</p>' +
    '<div class="rij" style="margin-top:16px"><button class="k vol" onclick="sluitBlad();tekenJaarplan()">Klaar</button></div>');
}

const GEZIN = [

];

function tekenOnthaal(){

            '<p class="small muted" style="margin:0 0 12px">' +

          .map(x => '<option value="' + x + '">').join('') + '</datalist></div>' +

function koppelNieuwProfiel(){
  const naam = $('#npNaam'), lft = $('#npLeeftijd'), wnr = $('#npWanneer'), war = $('#npWaar');
  const zin = () => {
    const a = wnr.value.trim(), b = war.value.trim();
    if(!a && !b) return '';
    return 'Elke dag ' + (a || 'op een vast moment') + (b ? ', ' + b : '') + ' oefen ik Arabisch.';
  };
  const ver = () => {
    const l = parseInt(lft.value, 10);
    const sp = $('#npSpoor');
    if(l >= 4 && l <= 99){
      const s = spoorBijLeeftijd(l);
      sp.style.display = '';
      sp.innerHTML = 'Spoor ' + s + ' — <b>' + esc(SPOORNAAM[s]) + '</b> (' + esc(SPOORLEEFTIJD[s]) + ')';
    }else sp.style.display = 'none';
    const z = $('#npZin'), t = zin();
    if(t){ z.style.display = ''; z.innerHTML = '<b>' + esc(t) + '</b>'; } else z.style.display = 'none';
    $('#npMaak').disabled = !(naam.value.trim() && l >= 4 && l <= 99);
  };
  [naam,lft,wnr,war].forEach(el => { el.oninput = ver; el.onchange = ver; });
  $('#npMaak').onclick = () => {
    maakProfiel(naam.value.trim(), parseInt(lft.value,10), zin());
    herbouwPad(); startApp();
  };
  ver();
}

function blokOmschrijving(b){
  if(!b) return '';
  switch(b.k){
    case 'letters':    return 'Nieuwe letters, hun vier vormen en hun klank. Ze staan met opzet naast elkaar omdat ze op elkaar lijken.';
    case 'teken':      return 'Een klinker- of hulpteken: wat het doet en hoe je het hoort.';
    case 'woorden':    return b.items.length + ' nieuwe woorden, met beeld en uitspraak.';
    case 'grammatica': return (GRAMMATICA.find(g => g.id === b.id) || {}).kern || '';
    case 'zinnen':     return 'Zinnen die je meteen kunt gebruiken, en zelf samenstellen.';
    case 'tekst':      return 'Een korte tekst lezen, met de vertaling achter een tik.';
    case 'koran':      return b.items.length + ' veelvoorkomende Koranwoorden, met hun wortel.';
    default: return '';
  }
}
function schattingMinuten(blok, herh){
  const n = oefeningenVoorBlok(blok).length;
  return Math.max(5, Math.round((n*0.6 + herh*0.35 + 2)));
}

/* --- de sessie zelf --- */
function startSessie(metNieuw){
  const blok = metNieuw && !padKlaar() ? blokVanVandaag() : null;
  const {rij} = herhalingsRij();
  sessie = {
    blok,
    stap: blok ? 'leren' : 'herhalen',
    oefeningen: blok ? oefeningenVoorBlok(blok) : [],
    i: 0,
    herh: rij.map(r => r.id),
    hi: 0,
    fouten: []
  };
  zelfOordeel = false;
  tekenSessie();
}

function stopSessie(){
  sessie = null; zelfOordeel = false;
  tekenAlles();
}

function tekenSessie(){
  const doel = $('#z-vandaag');
  const totaalStappen = 2 + (sessie.oefeningen.length ? 1 : 0) + (sessie.herh.length ? 1 : 0);
  const nu = sessie.stap === 'leren' ? 0 : sessie.stap === 'oefenen' ? 1 : sessie.stap === 'herhalen' ? 2 : 3;
  const balk = '<div class="stapbalk">' +
    ['leren','oefenen','herhalen','klaar'].map((s,i) =>
      '<i class="' + (i < nu ? 'klaar' : i === nu ? 'aan' : '') + '"></i>').join('') + '</div>';

  if(sessie.stap === 'leren'){
    doel.innerHTML = '<div class="wrap">' + balk +
      '<div class="rij tussen"><span class="label">Leren</span>' +
      '<button class="k stil klein" id="sesStop">Stoppen</button></div>' +
      '<h2 style="margin:6px 0 14px">' + arIn(esc(sessie.blok.titel)) + '</h2>' +
      leerInhoud(sessie.blok) +
      '<button class="k vol" id="sesVerder" style="margin-top:20px">Nu oefenen</button></div>';
    koppelLeerInhoud(sessie.blok);
    $('#sesVerder').onclick = () => {
      sessie.stap = sessie.oefeningen.length ? 'oefenen' : (sessie.herh.length ? 'herhalen' : 'klaar');
      if(sessie.stap === 'klaar') rondSessieAf();
      tekenSessie();
    };
    $('#sesStop').onclick = stopSessie;
    return;
  }

  if(sessie.stap === 'oefenen'){
    const oef = sessie.oefeningen[sessie.i];
    if(!oef){
      sessie.stap = sessie.herh.length ? 'herhalen' : 'klaar';
      if(sessie.stap === 'klaar') rondSessieAf();
      return tekenSessie();
    }
    doel.innerHTML = '<div class="wrap">' + balk +
      '<div class="rij tussen"><span class="label">Oefenen · ' + (sessie.i+1) + ' van ' + sessie.oefeningen.length + '</span>' +
      '<button class="k stil klein" id="sesStop">Stoppen</button></div>' +
      '<div id="oefHouder" style="margin-top:12px"></div></div>';
    $('#sesStop').onclick = stopSessie;
    zelfOordeel = false;
    toonOefening(oef, $('#oefHouder'), () => { sessie.i++; tekenSessie(); });
    return;
  }

  if(sessie.stap === 'herhalen'){
    const id = sessie.herh[sessie.hi];
    if(!id){ sessie.stap = 'klaar'; rondSessieAf(); return tekenSessie(); }
    const oef = oefeningVoorKaart(id);
    if(!oef){ sessie.hi++; delete P.kaarten[id]; return tekenSessie(); }
    doel.innerHTML = '<div class="wrap">' + balk +
      '<div class="rij tussen"><span class="label">Herhalen · ' + (sessie.hi+1) + ' van ' + sessie.herh.length + '</span>' +
      '<button class="k stil klein" id="sesStop">Stoppen</button></div>' +
      '<div id="oefHouder" style="margin-top:12px"></div></div>';
    $('#sesStop').onclick = stopSessie;
    zelfOordeel = P.spoor >= 3;
    toonOefening(oef, $('#oefHouder'), () => {
      const d = vandaag();
      P.dagen[d] = P.dagen[d] || {blokken:0, goed:0, fout:0, herhaald:0};
      P.dagen[d].herhaald++;
      bewaar();
      sessie.hi++; tekenSessie();
    });
    return;
  }

  /* klaar */
  const d = vandaag(), st = P.dagen[d] || {goed:0,fout:0,herhaald:0};
  doel.innerHTML = '<div class="wrap">' + balk +
    '<div class="kaart accent mid" style="padding:30px 18px;margin-top:10px">' +
      '<div class="ar" style="font-size:2.6rem">أَحْسَنْت</div>' +
      '<h2 style="margin-top:8px">Klaar</h2>' +
      '<p class="small" style="margin-top:6px">' +
        (isKind() ? 'Je hebt ' + P.punten + ' punten.' : 'Deze stap is afgerond.') + '</p>' +
    '</div>' +
    '<div class="raster r3" style="margin-top:16px">' +
      '<div class="kaart dun statvak"><b>' + st.goed + '</b><span>goed</span></div>' +
      '<div class="kaart dun statvak"><b>' + st.fout + '</b><span>nog niet</span></div>' +
      '<div class="kaart dun statvak"><b>' + st.herhaald + '</b><span>herhaald</span></div>' +
    '</div>' +
    '<p class="small muted" style="margin-top:16px">Morgen staat de volgende stap klaar. Kom je er niet aan toe, dan schuift alles mee — er ontstaat geen achterstand.</p>' +
    '<button class="k vol" id="sesTerug" style="margin-top:14px">Terug naar Vandaag</button></div>';
  $('#sesTerug').onclick = stopSessie;
}

function rondSessieAf(){
  const d = vandaag();
  P.dagen[d] = P.dagen[d] || {blokken:0, goed:0, fout:0, herhaald:0};
  if(sessie.blok){
    P.dagen[d].blokken++;
    P.blok = Math.min(P.blok + 1, PAD.length);
    if(isKind()) P.punten += 25;
  }
  bewaar();
}

/* --- de leerstof van een blok tonen --- */
function leerInhoud(b){
  if(b.k === 'letters'){
    return b.letters.map(l => letterKaartHTML(LETTERS.find(x => x.l === l))).join('') +
      '<div class="melding" style="margin-top:14px">Deze letters staan bij elkaar omdat ze op elkaar lijken. Ze naast elkaar leren is lastiger dan één voor één, en juist daarom onthoud je het verschil.</div>';
  }
  if(b.k === 'teken'){
    const T = TEKENS[b.idx];
    return '<div class="kaart mid"><div class="ar reus">' + T.demo + '</div>' +
      '<h3 style="margin-top:8px">' + esc(T.n) + '</h3>' +
      '<div class="tr">' + esc(T.tr) + '</div>' +
      '<p style="margin-top:12px;text-align:left">' + arIn(T.u) + '</p></div>';
  }

        '</div></div>').join('') + '</div>';
  }
  if(b.k === 'tekst') return tekstHTML(TEKSTEN.find(t => t.id === b.id));
  if(b.k === 'koran'){
    return '<div class="kaart">' + b.items.map(({k}) =>
      '<div class="rij tussen" style="padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:nowrap">' +
        '<div class="rek"><span class="ar">' + k.a + '</span> <span class="tr">' + esc(k.t) + '</span>' +

  }
  return '';

function komendeDagenHTML(){
  const d = vandaag(), tel = {};
  Object.values(P.kaarten).forEach(k => {
    if(!k.due) return;
    const n = Math.max(0, dagVerschil(d, k.due));
    if(n <= 13) tel[n] = (tel[n]||0)+1;
  });
  const max = Math.max(1, ...Object.values(tel));
  let uit = '<div style="display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:12px">';
  for(let i=0;i<14;i++){
    const n = tel[i]||0;
    uit += '<div style="flex:1;text-align:center">' +
      '<div title="' + n + ' kaarten" style="height:' + Math.round(n/max*70) + 'px;background:' +
      (i===0 ? 'var(--warm)' : 'var(--accent)') + ';border-radius:3px 3px 0 0;min-height:' + (n?'3px':'0') + '"></div>' +
      '<div class="klein muted" style="font-size:.6rem;margin-top:3px">' + (i===0 ? 'nu' : i) + '</div></div>';
  }
  return uit + '</div><p class="klein muted">Aantal kaarten per dag, veertien dagen vooruit.</p>';
}

        '<span class="l">' + l.l + '</span><span class="nm">' + esc(l.tr) + '</span></div>').join('') +

function startSpel(id){
  spel = { id, ronde:0, punten:0, totaal: id === 'bouwen' ? 6 : 10, vraag:null, klaar:false };
  volgendeSpelVraag();
}
function volgendeSpelVraag(){
  const bruikbaar = WOORDEN.filter(w => w.s <= P.spoor && w.b);
  if(spel.id === 'klank'){
    const L = willekeurig(LETTERS);
    const fout = husselen(LETTERS.filter(x => x.l !== L.l)).slice(0,3);
    spel.vraag = { type:'kies', kop:'Welke letter is <b>' + esc(L.n) + '</b>?', toon:'',
      opties: husselen([L].concat(fout)).map(x => ({tekst:x.l, ar:true, goed:x.l === L.l})),
      uitleg:'<span class="ar klein-ar">' + L.l + '</span> — <b>' + esc(L.tr) +
             '</b>, klank ' + esc(L.k) + (L.moeilijk ? ' (een klank die het Nederlands niet kent)' : ''),
      letter:L.l };
  }
  if(spel.id === 'beeld'){
    const w = willekeurig(bruikbaar);
    const fout = husselen(bruikbaar.filter(x => x.a !== w.a)).slice(0,3);
    spel.vraag = { type:'kies', kop:'Welk woord hoort hierbij?', toon:'<div style="font-size:4rem" class="mid">' + w.b + '</div>',
      opties: husselen([w].concat(fout)).map(x => ({tekst:vocaliseer(x.a), ar:true, goed:x.a === w.a})),
      uitleg:'<span class="ar klein-ar">' + w.a + '</span> — ' + esc(w.n) };
  }
  if(spel.id === 'bouwen'){
    const w = willekeurig(WOORDEN.filter(x => x.s <= P.spoor && ontdoeTashkil(x.a).length <= 5 && !x.a.includes(' ')));
    spel.vraag = { type:'bouw', kop:'Bouw het woord voor <b>' + esc(w.n) + '</b>',
      toon: w.b ? '<div style="font-size:3rem" class="mid">' + w.b + '</div>' : '',
      doel: ontdoeTashkil(w.a),
      tegels: husselen(Array.from(ontdoeTashkil(w.a))),
      uitleg:'<span class="ar klein-ar">' + w.a + '</span> — ' + esc(w.n) };
  }
  if(spel.id === 'luister'){
    const w = willekeurig(bruikbaar);
    const fout = husselen(bruikbaar.filter(x => x.th === w.th && x.a !== w.a).concat(
      husselen(bruikbaar.filter(x => x.a !== w.a)).slice(0,3))).slice(0,3);
    spel.vraag = { type:'kies', kop:'Wat hoor je?', toon:'', spreek:w.a,
      opties: husselen([w].concat(fout)).map(x => ({tekst:x.n + ' ' + (x.b||''), ar:false, goed:x.a === w.a})),
      uitleg:'<span class="ar klein-ar">' + w.a + '</span> — ' + esc(w.n) };
  }
  spel.beantwoord = false; spel.bouwsel = [];
  tekenSpelRonde();
}

function tekenSpelRonde(){
  const doel = $('#z-spel'), v = spel.vraag;
  if(spel.klaar){
    const record = Math.max(P.spelrecords[spel.id] || 0, spel.punten);
    doel.innerHTML = '<div class="wrap"><div class="kaart accent mid" style="padding:32px 18px;margin-top:20px">' +
      '<div class="ar" style="font-size:2.4rem">مُمْتَاز</div>' +
      '<h2 style="margin-top:8px">' + spel.punten + ' van ' + spel.totaal + ' goed</h2>' +
      (record === spel.punten && spel.punten > 0 ? '<p class="small">Nieuw record.</p>' : '') +
      '</div>' +
      '<div class="rij" style="margin-top:16px">' +
        '<button class="k rek" id="spelNog">Nog een keer</button>' +
        '<button class="k rand rek" id="spelStop">Terug</button></div></div>';
    $('#spelNog').onclick = () => startSpel(spel.id);
    $('#spelStop').onclick = () => { spel = null; tekenSpel(); };
    return;
  }

  doel.innerHTML = '<div class="wrap">' +
    '<div class="rij tussen"><span class="label">Ronde ' + (spel.ronde+1) + ' van ' + spel.totaal + '</span>' +
    '<button class="k stil klein" id="spelWeg">Stoppen</button></div>' +
    '<div class="balk" style="margin:8px 0 16px"><i style="width:' + Math.round(spel.ronde/spel.totaal*100) + '%"></i></div>' +
    '<div class="vraagblok">' +
      '<div class="vraagtekst">' + v.kop + '</div>' + (v.toon || '') +
      (v.spreek ? '<div class="mid" style="margin:8px 0 16px"><button class="k" id="spelHoor">🔈 Nog eens</button></div>' : '') +
      (v.type === 'kies'
        ? '<div id="spelOpties">' + v.opties.map((o,i) =>
            '<button class="optie" data-i="' + i + '">' + (o.ar ? '<span class="ar">' + o.tekst + '</span>' : esc(o.tekst)) + '</button>').join('') + '</div>'
        : '<div class="bouwvak" id="oefVak"></div><div class="tegels" id="oefTegels"></div>' +
          '<div class="rij" style="margin-top:12px"><button class="k" id="spelNa">Controleren</button>' +
          '<button class="k stil" id="spelLeeg">Wissen</button></div>') +
      '<div id="spelTerug"></div><div id="spelVerder" style="margin-top:14px"></div>' +
    '</div></div>';

  $('#spelWeg').onclick = () => { spel = null; tekenSpel(); };
  if(v.spreek){ $('#spelHoor').onclick = () => spraak.zeg(v.spreek); setTimeout(() => spraak.zeg(v.spreek), 300); }

  if(v.type === 'kies'){
    $$('#spelOpties .optie').forEach(b => b.onclick = () => {
      if(spel.beantwoord) return;
      const i = +b.dataset.i, goed = v.opties[i].goed;
      $$('#spelOpties .optie').forEach((x,xi) => {
        x.disabled = true;
        if(v.opties[xi].goed) x.classList.add('goed');
        else if(xi === i) x.classList.add('fout');
        else x.classList.add('flauw');
      });
      spelAf(goed);
    });
  }else{
    huidigeOef = v; oefBeantwoord = false; oefBouwsel = [];
    const nep = { soort:'bouw', tegels:v.tegels };
    tekenBouw(doel, nep);
    $('#spelNa').onclick = () => {
      if(spel.beantwoord) return;
      spelAf(normAr(oefBouwsel.join('')) === normAr(v.doel));
    };
    $('#spelLeeg').onclick = () => { oefBouwsel = []; tekenBouw(doel, nep); };
  }
}

function spelAf(goed){
  spel.beantwoord = true; oefBeantwoord = true;
  if(goed){ spel.punten++; P.punten += 5; }
  if(goed && spel.vraag.letter) P.letters[spel.vraag.letter] = (P.letters[spel.vraag.letter]||0) + 1;
  bewaar();
  $('#spelTerug').innerHTML = '<div class="terug ' + (goed ? 'goed' : 'fout') + '">' +
    '<b>' + (goed ? 'Goed' : 'Nog niet') + '</b><div class="uitleg">' + spel.vraag.uitleg + '</div></div>';
  $('#spelVerder').innerHTML = '<button class="k vol" id="spelDoor">Verder</button>';
  $('#spelDoor').onclick = () => {
    spel.ronde++;
    if(spel.ronde >= spel.totaal){
      spel.klaar = true;
      P.spelrecords[spel.id] = Math.max(P.spelrecords[spel.id] || 0, spel.punten);
      bewaar(); tekenSpelRonde();
    }else volgendeSpelVraag();
  };
}
