<html lang="nl">
<head>

<style>
/* ============================================================================
   KALIBRATIE — persoonlijk energiebalansmodel
   Ontwerpprincipe, door de hele app heen: geen enkel getal zonder zijn
   onzekerheid. Wat gemeten is staat in serif en groot; wat geschat is draagt
   zijn interval en zijn graad; wat ontbreekt wordt benoemd in plaats van
   stilzwijgend als nul behandeld.
   ========================================================================== */
:root{
  --canvas:#F7F6F3; --vlak:#FFFFFF; --vlak2:#EFEDE8;
  --ink:#12140F; --ink2:#2A2E28; --grijs:#5E6159; --dim:#8E9189;
  --lijn:#DEDBD3; --lijn2:#C6C2B8;
  --k:#3D5A57;  --kbg:#E1EBE9;      /* accent: de kleur van het model */
  --let:#8A5A00; --letbg:#F8EFD4;   /* let op */
  --fout:#A32F2A; --foutbg:#FAE6E4;
  --goed:#2F6B1F; --goedbg:#E4EFDD;
  --schaduw:0 1px 2px rgba(20,18,14,.04), 0 8px 22px rgba(20,18,14,.05);
  --sans:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:'Newsreader',Georgia,serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --canvas:#131417; --vlak:#1B1D21; --vlak2:#24272B;
  --ink:#F3F2EE; --ink2:#DFDED8; --grijs:#A6A9A1; --dim:#71746D;
  --lijn:#31343A; --lijn2:#454951;
  --k:#8FB3AE; --kbg:#1D2A29;
  --let:#E9BC55; --letbg:#302711;
  --fout:#F09B95; --foutbg:#341A18;
  --goed:#8FD268; --goedbg:#1E2A18;
  --schaduw:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink2);font-family:var(--sans);font-size:16px;
  line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100dvh;
  padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:660px;margin:0 auto}
h1,h2,h3{font-family:var(--serif);color:var(--ink);letter-spacing:-.02em;line-height:1.15;margin:0;font-weight:500}
p{margin:0}
a{color:var(--k)}
.eyebrow{font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grijs)}
.klein{font-size:.84rem;color:var(--grijs);line-height:1.5}
.mini{font-size:.75rem;color:var(--dim);line-height:1.45}
.cijfer{font-family:var(--mono);font-variant-numeric:tabular-nums}
.getal{font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--ink);line-height:1;font-weight:400}
button,input,select,textarea{font-family:inherit;font-size:1rem;color:inherit}
:focus-visible{outline:2px solid var(--k);outline-offset:2px;border-radius:6px}

/* ---------------------------------------------------------------- header -- */
header{padding:26px 0 12px;position:relative}
.merk{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.merk h1{font-size:1.7rem}
.sub{margin-top:2px;font-size:.82rem;color:var(--grijs)}
.chip{font-size:.72rem;color:var(--grijs);border:1px solid var(--lijn);border-radius:999px;
  padding:4px 11px;background:transparent;cursor:pointer;white-space:nowrap}
.chip.aan{border-color:var(--k);color:var(--k)}

/* ------------------------------------------------------------------ tabs -- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--vlak);
  border-top:1px solid var(--lijn);display:flex;justify-content:center;gap:2px;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:transparent;color:var(--grijs);cursor:pointer;
  padding:6px 10px;border-radius:9px;font-size:.68rem;display:flex;flex-direction:column;
  align-items:center;gap:3px;min-width:56px;line-height:1.1}
nav.tabs button .ic{font-size:1.05rem;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--k);background:var(--kbg);font-weight:600}

/* --------------------------------------------------------------- kaarten -- */
.kaart{background:var(--vlak);border:1px solid var(--lijn);border-radius:14px;
  padding:15px 17px;box-shadow:var(--schaduw);margin-bottom:13px}
.kaart.let{border-left:3px solid var(--let)}
.kaart.fout{border-left:3px solid var(--fout)}
.kaart.goed{border-left:3px solid var(--goed)}
.kaart.plat{box-shadow:none;background:var(--vlak2);border-color:transparent}
.tussen{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rij{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.duo{display:grid;gap:16px}
@media(min-width:520px){.duo{grid-template-columns:1fr 1fr}}
.trio{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}

/* ------------------------------------------------------------- besturing -- */
.knop{border:1px solid var(--lijn);background:var(--vlak);color:var(--ink2);
  padding:8px 14px;border-radius:10px;font-size:.86rem;cursor:pointer;white-space:nowrap}
.knop:hover{border-color:var(--lijn2)}
.knop.vol{background:var(--k);border-color:var(--k);color:var(--canvas);font-weight:600}
.knop.sm{padding:4px 10px;font-size:.76rem;border-radius:8px}
.knop:disabled{opacity:.45;cursor:default}
input,select,textarea{background:var(--vlak);border:1px solid var(--lijn);border-radius:10px;
  padding:8px 11px;width:100%;max-width:100%}
textarea{resize:vertical;min-height:74px;line-height:1.5}
label.veld{display:block}
label.veld>span{display:block;font-size:.72rem;color:var(--grijs);margin-bottom:3px}
.smal{width:88px}.smaller{width:68px}

/* ---------------------------------------------------------- balk en chip -- */
.balk{height:7px;border-radius:999px;background:var(--vlak2);overflow:hidden}
.balk>i{display:block;height:100%;background:var(--k);transition:width .2s}
.balk>i.let{background:var(--let)} .balk>i.goed{background:var(--goed)}
.conf{display:inline-flex;width:17px;height:17px;border-radius:4px;flex:0 0 auto;
  align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#FFF8EE}
.conf.A{background:#2F6B1F}.conf.B{background:#3D5A57}
.conf.C{background:#8E9189}.conf.D{background:#8A5A00}
@media(prefers-color-scheme:dark){.conf{color:#131417}
  .conf.A{background:#8FD268}.conf.B{background:#8FB3AE}
  .conf.C{background:#71746D}.conf.D{background:#E9BC55}}
.stoplicht{display:inline-block;width:11px;height:11px;border-radius:50%}
.lijst>*{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--lijn)}
.lijst>*:first-child{border-top:0}
.groei{flex:1 1 auto;min-width:0}
.knip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* -------------------------------------------------------------- venster --- */
.sluier{position:fixed;inset:0;background:rgba(10,12,10,.5);display:flex;z-index:50;
  align-items:flex-start;justify-content:center;padding:14px;overflow-y:auto}
.venster{background:var(--vlak);border-radius:16px;padding:20px;width:100%;max-width:520px;margin:20px 0}
.regel{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--lijn)}
.regel input,.regel select{width:auto}
svg.fig{display:block;width:100%;height:auto}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--lijn2);
  border-top-color:var(--k);border-radius:50%;animation:d .7s linear infinite;vertical-align:-2px}
@keyframes d{to{transform:rotate(360deg)}}
footer{margin:22px 0 8px;padding-top:13px;border-top:1px solid var(--lijn);
  font-size:.75rem;line-height:1.6;color:var(--dim)}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
/* ============================================================================
   1. VERBINDING
   Alle toegang loopt via SECURITY DEFINER-functies in Supabase met een
   sessietoken. De sleutel hieronder is de publieke anon-sleutel en geeft uit
   zichzelf geen toegang tot gegevens: geen enkele kal_-tabel is voor anon
   benaderbaar.
   ========================================================================== */
const URL_DB = 'https://jnlvvdaisyerhxucxnuu.supabase.co';
const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpubHZ2ZGFpc3llcmh4dWN4bnV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4NDg0MjIsImV4cCI6MjA4MjQyNDQyMn0.8ZXa-N96pRSQovdL_bH5FpJTHeL454830h5LMapCawY';
const SLEUTEL_SESSIE = 'kalibratie.sessie';

async function rpc(fn, body){
  const r = await fetch(URL_DB + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{apikey:ANON, Authorization:'Bearer '+ANON, 'Content-Type':'application/json'},
    body: JSON.stringify(body||{})
  });
  let uit = null;
  try{ uit = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((uit && (uit.message||uit.error)) || ('Verbinding mislukt ('+r.status+')'));
  return uit;
}
async function ai(body){
  const r = await fetch(URL_DB + '/functions/v1/kal-ai', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({token:S.token}, body))
  });
  const uit = await r.json();
  if(uit.error) throw new Error(uit.error);
  return uit;
}

/* ============================================================================
   2. HULP
   ========================================================================== */
const $ = s => document.querySelector(s);
const iso = d => { const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
const vandaag = () => iso(new Date());
const opDatum = s => new Date(s+'T12:00:00');
const plusDagen = (s,n) => { const d=opDatum(s); d.setDate(d.getDate()+n); return iso(d); };
const dagVerschil = (a,b) => Math.round((opDatum(b)-opDatum(a))/86400000);
const kortNL = s => opDatum(s).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
const langNL = s => opDatum(s).toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dz = n => (n==null||isNaN(n)) ? '—' : Number(n).toLocaleString('nl-NL');
const dec = (v,n=1) => (v==null||isNaN(v)) ? '—' : Number(v).toFixed(n).replace('.',',');
const chip = c => '<span class="conf '+c+'" title="Betrouwbaarheid '+c+'">'+c+'</span>';
const KCAL_PER_KG = 7700;

/* ============================================================================
   3. REKENKERN
   Pure functies. Elke keuze hieronder is verantwoord in VERANTWOORDING.md;
   de verwijzing staat erbij zodat een getal in het scherm terugvindbaar is.
   ========================================================================== */

/* Mifflin-St Jeor. Aanbevolen bij overgewicht boven Harris-Benedict
   (Frankenfield 2003). Blijft een prior, geen meting. */
function bmr(pf, w){
  return Math.round(10*w + 6.25*pf.lengte_cm - 5*pf.leeftijd_jaar + (pf.geslacht==='m'?5:-161));
}

/* Referentiegewicht voor het eiwitdoel: actueel gewicht met een plafond op
   BMI 30 (Weijs 2025). Vetmassa vraagt geen eiwit; rekenen op actueel gewicht
   geeft bij obesitas klinisch relevante overschatting (Dekker 2022). */
function eiwitReferentie(pf, w){
  const m = pf.lengte_cm/100;
  return Math.min(w, 30*m*m);
}

/* Kleinste-kwadratenregressie. Levert helling én standaardfout; die laatste
   voedt het betrouwbaarheidsinterval op het verbruik. */
function regressie(p){
  const n=p.length; if(n<3) return null;
  const mx=p.reduce((a,x)=>a+x.x,0)/n, my=p.reduce((a,x)=>a+x.y,0)/n;
  const sxx=p.reduce((a,x)=>a+(x.x-mx)**2,0); if(!sxx) return null;
  const sxy=p.reduce((a,x)=>a+(x.x-mx)*(x.y-my),0);
  const helling=sxy/sxx, snij=my-helling*mx;
  const rest=p.reduce((a,x)=>a+(x.y-(snij+helling*x.x))**2,0);
  return {helling, snij, se: Math.sqrt(rest/(n-2)/sxx), n};
}

/* Exponentieel gewogen gemiddelde met halfwaardetijd rond zeven dagen
   (alfa 0,1). Presteert gelijk aan Kalman-smoothing en is uitlegbaar
   (Turicchi 2020). Alleen een punt op dagen waarop echt gewogen is. */
function trendReeks(dagen){
  const k = Object.keys(dagen).sort(); let ema=null; const uit=[];
  for(const d of k){
    const w = dagen[d].gewicht_kg;
    if(w!=null) ema = ema==null ? w : ema*0.9 + w*0.1;
    uit.push({d, w, ema: (w!=null&&ema!=null) ? Math.round(ema*100)/100 : null,
              kcal: dagen[d]._kcal||null, eiwit: dagen[d]._eiwit||null});
  }
  return uit;
}

const VENSTER = 28;   // veelvoud van zeven: anders lekt het weekritme in de helling (Orsama 2014)

function analyse(dagen, pf){
  const eind = vandaag(), start = plusDagen(eind, -VENSTER+1);
  const sleutels = Object.keys(dagen).filter(k=>k>=start&&k<=eind).sort();

  const wPunten=[], innames=[], stappen=[];
  let gelogd=0, gemarkeerd=0;
  for(const k of sleutels){
    const d = dagen[k];
    if(d.gewicht_kg!=null) wPunten.push({x:dagVerschil(start,k), y:+d.gewicht_kg, datum:k});
    const kcal = d._kcal||0;
    if(kcal>0 && k!==eind){              // de lopende dag is per definitie onvolledig
      gelogd++;
      if(kcal<1200) gemarkeerd++;        // niet weggooien, wel apart tellen
      else innames.push(kcal);
    }
    if(d.stappen!=null) stappen.push(+d.stappen);
  }

  const alleW = Object.keys(dagen).filter(k=>dagen[k].gewicht_kg!=null).sort();
  const gewicht = alleW.length ? +dagen[alleW[alleW.length-1]].gewicht_kg
                               : (pf.start_gewicht_kg||pf.doel_gewicht_kg||80);
  const gemStappen = stappen.length ? stappen.reduce((a,b)=>a+b,0)/stappen.length : null;
  const gemInname = innames.length ? innames.reduce((a,b)=>a+b,0)/innames.length : null;
  const sdInname = innames.length>1
    ? Math.sqrt(innames.reduce((a,v)=>a+(v-gemInname)**2,0)/(innames.length-1)) : null;

  const rustBMR = bmr(pf, gewicht);
  /* De activiteitsfactor uit stappen is het zwakste onderdeel van de app: een
     gevalideerde conversie bestaat niet (Westerterp 2013). Daarom een band en
     geen punt, en zodra het model meet is hij overbodig. */
  const palLaag = 1.35, palHoog = gemStappen ? Math.min(1.70, 1.40 + gemStappen/22000) : 1.60;
  const priorLaag = Math.round(rustBMR*palLaag), priorHoog = Math.round(rustBMR*palHoog);
  const priorMid = Math.round((priorLaag+priorHoog)/2);

  const reg = regressie(wPunten);
  let tdee=null, laag=null, hoog=null, half=null, zekerheid='geen', hellingWk=null;
  if(reg) hellingWk = reg.helling*7;

  if(reg && gemInname!=null && wPunten.length>=7 && innames.length>=7){
    tdee = gemInname - reg.helling*KCAL_PER_KG;
    const seH = (reg.se ?? 0.05)*KCAL_PER_KG;
    const seG = sdInname!=null ? sdInname/Math.sqrt(innames.length) : 150;
    /* Ondergrens van 100 kcal: bij achtentwintig dagelijkse metingen ligt de
       ruisvloer op de helling alleen al rond 145 kcal/dag. Een smaller
       interval is schijnprecisie. */
    half = Math.max(100, 1.96*Math.sqrt(seH**2 + seG**2));
    laag = tdee-half; hoog = tdee+half;
    const dekking = gelogd/VENSTER;
    if(wPunten.length>=18 && innames.length>=18 && dekking>0.75 && half<350) zekerheid='hoog';
    else if(wPunten.length>=12 && innames.length>=12 && half<550) zekerheid='middel';
    else zekerheid='laag';
  }

  /* Tempo in procent lichaamsgewicht per week, herberekend op het actuele
     gewicht (Garthe 2011 in combinatie met Forbes 2000). */
  const tempoKgWk = (pf.tempo_pct_week/100)*gewicht;
  const tekort = tempoKgWk*KCAL_PER_KG/7;
  const hellingPct = hellingWk!=null ? hellingWk/gewicht*100 : null;
  const teSnel = hellingPct!=null && hellingPct < -1.0;
  const doel = tdee!=null ? Math.max(rustBMR, Math.round((tdee-tekort)/10)*10) : null;

  const eiwitRef = eiwitReferentie(pf, gewicht);
  const eiwitDoel = Math.round(pf.eiwit_g_per_kg*eiwitRef);

  const wekenTotDoel = (hellingWk && hellingWk<-0.05 && pf.doel_gewicht_kg)
    ? Math.round((gewicht-pf.doel_gewicht_kg)/-hellingWk) : null;

  return {gewicht, wPunten, reg, hellingWk, hellingPct, gemInname, sdInname, gemStappen,
    rustBMR, palLaag, palHoog, priorLaag, priorHoog, priorMid,
    tdee, laag, hoog, half, zekerheid, doel, tekort, tempoKgWk, teSnel,
    onderrapportage: tdee!=null ? priorMid-tdee : null,
    eiwitDoel, eiwitRef, wekenTotDoel,
    gelogd, volledig: innames.length, gemarkeerd, venster:VENSTER,
    bmi: gewicht/((pf.lengte_cm/100)**2)};
}

/* SCORE2, laag-risicoregio (Nederland), mannen en vrouwen onder de zeventig.
   Coëfficiënten uit Eur Heart J 2021;42:2439-54; deze implementatie
   reproduceert de vier gepubliceerde rekenvoorbeelden exact. */
function score2(pf, {leeftijd, rook, sbd, tc, hdl, dm}){
  if(leeftijd<40 || leeftijd>69) return null;
  const cage=(leeftijd-60)/5, csbp=(sbd-120)/20, ctc=tc-6, chdl=(hdl-1.3)/0.5;
  const r = rook?1:0, d = dm?1:0;
  let x, base, s1, s2;
  if(pf.geslacht==='m'){
    x = 0.3742*cage + 0.6012*r + 0.2777*csbp + 0.6457*d + 0.1458*ctc - 0.2698*chdl
      - 0.0755*cage*r - 0.0255*cage*csbp - 0.0281*cage*ctc + 0.0426*cage*chdl - 0.0983*cage*d;
    base = 0.9605; s1 = -0.5699; s2 = 0.7476;
  }else{
    x = 0.4648*cage + 0.7744*r + 0.3131*csbp + 0.8096*d + 0.1002*ctc - 0.2606*chdl
      - 0.1088*cage*r - 0.0277*cage*csbp - 0.0226*cage*ctc + 0.0613*cage*chdl - 0.1272*cage*d;
    base = 0.9776; s1 = -0.7380; s2 = 0.7019;
  }
  const u = 1 - Math.pow(base, Math.exp(x));
  if(u<=0 || u>=1) return null;
  const risico = (1 - Math.exp(-Math.exp(s1 + s2*Math.log(-Math.log(1-u)))))*100;
  let klasse;                                    // NHG-CVRM, leeftijdsafhankelijk
  if(leeftijd<50) klasse = risico<2.5?'laag':(risico<7.5?'matig':'hoog');
  else klasse = risico<5?'laag':(risico<10?'matig':'hoog');
  return {risico, klasse};
}

/* FIB-4 (Sterling 2006), met de leeftijdsgrens uit de Richtlijn MASLD/MASH
   2024: onder 65 jaar sluit 1,3 uit, daarboven 2,0 (McPherson 2017). */
function fib4({leeftijd, asat, alat, trombo}){
  if(!(leeftijd>0&&asat>0&&alat>0&&trombo>0)) return null;
  const w = (leeftijd*asat)/(trombo*Math.sqrt(alat));
  const onder = leeftijd>=65 ? 2.0 : 1.3;
  const klasse = w<onder ? 'uitgesloten' : (w<=2.67 ? 'grijs' : 'verwijzen');
  return {waarde:w, onder, klasse};
}

/* STOP-BANG, officiële versie: BMI-drempel 35 (niet 30) en een
   geslachtsspecifieke nekomtrek van 43 en 41 cm. */
const STOPBANG = [
  ['snurken','Luid snurken — hoorbaar door een gesloten deur'],
  ['moe','Overdag vaak moe of slaperig'],
  ['apneu','Waargenomen ademstops, stikken of naar adem happen'],
  ['bloeddruk','Hoge bloeddruk, of daarvoor behandeld'],
  ['bmi','BMI boven 35'],
  ['leeftijd','Ouder dan 50'],
  ['nek','Nekomtrek 43 cm of meer (man) / 41 cm of meer (vrouw)'],
  ['man','Man']
];
function stopbangScore(a){
  const n = STOPBANG.filter(([k])=>a[k]).length;
  const stop = ['snurken','moe','apneu','bloeddruk'].filter(k=>a[k]).length;
  let klasse = n<=2 ? 'laag' : (n<=4 ? 'matig' : 'hoog');
  // Verfijning voor de matige groep; verhoogt de specificiteit.
  if(klasse==='matig' && stop>=2 && (a.man || a.bmi || a.nek)) klasse = 'hoog';
  return {score:n, klasse};
}

/* Onderhoud: het stoplicht uit STOP Regain (Wing 2006). Triggert op het
   voortschrijdend gemiddelde, niet op de dagmeting — anders vuurt rood op
   dagelijkse schommelingen van een tot twee kilo. */
function onderhoudZone(trendGewicht, basis){
  if(trendGewicht==null || basis==null) return null;
  const d = trendGewicht - basis;
  if(d < 1.4)  return {zone:'groen',  kleur:'var(--goed)', delta:d};
  if(d < 2.3)  return {zone:'geel',   kleur:'var(--let)',  delta:d};
  return {zone:'rood', kleur:'var(--fout)', delta:d};
}

let S = {token:null, account:null, profiel:null, dagen:{}, regels:[], producten:[],
         recepten:[], metingen:[], labs:[], vragenlijsten:[], training:[]};

function bundelDagen(){
  // Voedingsregels worden per dag opgeteld en aan het dagrecord gehangen; de
  // rekenkern werkt met dagtotalen, de interface met de losse regels.
  const d = {};
  for(const r of (S.dagen._lijst||[])) d[r.datum] = Object.assign({}, r, {_kcal:0,_eiwit:0,_laag:0,_hoog:0});
  for(const r of S.regels){
    if(!d[r.datum]) d[r.datum] = {datum:r.datum,_kcal:0,_eiwit:0,_laag:0,_hoog:0};
    d[r.datum]._kcal  += +r.kcal_punt||0;
    d[r.datum]._laag  += +(r.kcal_laag ?? r.kcal_punt)||0;
    d[r.datum]._hoog  += +(r.kcal_hoog ?? r.kcal_punt)||0;
    d[r.datum]._eiwit += +r.eiwit_g||0;
  }
  return d;
}
function dagenKaart(){ const d=bundelDagen(); S._dagen=d; return d; }

async function laden(){
  const o = await rpc('kal_ophalen', {p_token:S.token});
  S.profiel = o.profiel;
  S.dagen = {_lijst:o.dagen||[]};
  S.regels = o.regels||[]; S.producten = o.producten||[];
  S.recepten = o.recepten||[]; S.metingen = o.metingen||[];
  S.labs = o.labs||[]; S.vragenlijsten = o.vragenlijsten||[];
  S.training = o.training||[];
}
function dagVan(k){ return (S._dagen||{})[k] || {datum:k,_kcal:0,_eiwit:0,_laag:0,_hoog:0}; }

function vwModel(A,D){
  const label = {hoog:'hoog', middel:'middel', laag:'laag', geen:'onvoldoende'}[A.zekerheid];
  const kleur = A.zekerheid==='hoog'?'var(--goed)':A.zekerheid==='laag'?'var(--let)':'var(--k)';
  const reeks = trendReeks(D);
  const trendNu = [...reeks].reverse().find(x=>x.ema!=null);

  return `
  <div class="kaart">
    <div class="tussen"><span class="eyebrow">Geschat dagelijks energieverbruik</span>
      <span class="eyebrow" style="color:${kleur}">zekerheid ${label}</span></div>
    ${A.tdee!=null ? `
      <div class="rij" style="align-items:baseline;margin-top:4px">
        <span class="getal" style="font-size:2.3rem">${dz(Math.round(A.laag))}–${dz(Math.round(A.hoog))}</span>
        <span class="klein">kcal per dag</span></div>
      ${intervalSVG(A)}
      <p style="font-size:.88rem;margin-top:10px">Afgeleid uit ${A.volledig} bruikbare registratiedagen — gemiddeld
        ${dz(Math.round(A.gemInname))} kcal — en een gewichtstrend van ${A.hellingWk>0?'+':''}${dec(A.hellingWk,2)} kg
        per week, ofwel ${dec(A.hellingPct,2)} procent van je lichaamsgewicht.
        Bij een streeftempo van ${dec(S.profiel.tempo_pct_week,1)} procent hoort een inname van
        <b>${dz(A.doel)} kcal</b>.</p>`
    : `
      <p style="font-family:var(--serif);font-size:1.3rem;color:var(--grijs);margin-top:4px">Nog niet te berekenen.</p>
      <p style="font-size:.88rem;margin-top:8px">Er zijn minstens zeven wegingen én zeven volledige registratiedagen
        nodig binnen het venster van ${A.venster} dagen. Je hebt nu <b>${A.wPunten.length}</b> weging${A.wPunten.length===1?'':'en'}
        en <b>${A.volledig}</b> bruikbare dag${A.volledig===1?'':'en'}. Weeg vanaf morgen elke ochtend; het model rekent
        zichzelf uit zodra de reeks lang genoeg is. Vier weken geeft pas een bruikbaar interval.</p>
      <div class="kaart plat" style="margin-top:12px">
        <div class="eyebrow">Voorlopige aanname zolang er geen trend is</div>
        <div class="rij" style="align-items:baseline;margin-top:3px">
          <span class="getal" style="font-size:1.5rem">${dz(A.priorLaag)}–${dz(A.priorHoog)}</span>
          <span class="klein">kcal</span></div>
        <p class="mini" style="margin-top:6px">Ruststofwisseling ${dz(A.rustBMR)} kcal (Mifflin-St Jeor) maal een
        activiteitsfactor tussen ${dec(A.palLaag,2)} en ${dec(A.palHoog,2)}. Dat is een band en geen getal, want een
        gevalideerde omrekening van stappen naar activiteitsfactor bestaat niet. Behandel dit als prior, geen meting.</p>
      </div>`}
  </div>

  ${A.teSnel ? `<div class="kaart let">
    <div class="eyebrow">Te snel</div>
    <p style="font-size:.88rem;margin-top:4px">De trend is ${dec(A.hellingWk,2)} kg per week, ofwel
    ${dec(A.hellingPct,2)} procent — steiler dan één procent. Dat gaat ten koste van vetvrije massa en is slecht vol
    te houden. Het advies is hier <b>méér</b> eten, niet minder${A.doel?`: het doel van ${dz(A.doel)} kcal ligt boven
    wat je nu gemiddeld logt`:''}.</p></div>`:''}

  ${A.tdee!=null ? `<div class="kaart">
    <div class="eyebrow">Consistentiecheck registratie</div>
    <p style="font-size:.88rem;margin-top:4px">De formule voorspelt bij dit gewicht en deze activiteit een onderhoud
      tussen ${dz(A.priorLaag)} en ${dz(A.priorHoog)} kcal. De gewichtstrend impliceert ${dz(Math.round(A.tdee))} kcal.
      ${A.onderrapportage>300
        ? `Een verschil van ongeveer <b>${dz(Math.round(A.onderrapportage))} kcal</b> is te groot voor toeval en past bij
           onderregistratie van twintig tot dertig procent — de best gedocumenteerde systematische fout in de
           voedingswetenschap. Dat maakt het advies niet ongeldig: de bias is proportioneel en stabiel binnen een
           persoon, dus zolang je op dezelfde manier blijft loggen klopt het doel in gelogde eenheden.`
        : A.onderrapportage < -300
        ? 'Je registreert méér dan de formule verwacht. Dat past bij een hogere activiteit dan de stappen laten zien, of bij een onrustige weegreeks.'
        : 'Die liggen dicht bij elkaar. De registratie is intern consistent.'}</p>
  </div>`:''}

  ${meetgaten(A,D)}

  <div class="kaart">
    <div class="eyebrow">Gewicht en voortschrijdend gemiddelde</div>
    ${gewichtSVG(reeks, A)}
    <p class="mini">Punten zijn losse wegingen, de lijn is een exponentieel gewogen gemiddelde met een halfwaardetijd
    van ongeveer een week. Dagelijkse schommelingen van één tot twee kilo zijn vocht, glycogeen en darminhoud —
    de helling is het signaal, niet de meting.</p>
  </div>

  <div class="kaart">
    <div class="eyebrow">Gelogde energie per dag</div>
    ${innameSVG(reeks, A)}
    <p class="mini">Oranje staven liggen onder 1.200 kcal en gelden als onvolledig, niet als succes.${
      A.gemarkeerd?' '+A.gemarkeerd+' dag'+(A.gemarkeerd===1?'':'en')+' in dit venster valt in die categorie.':''}</p>
  </div>

  <div class="kaart">
    <div class="eyebrow">Traject</div>
    <div class="trio" style="margin-top:8px">
      ${[['Nu', dec(A.gewicht,1)+' kg'],
         ['Trend', trendNu?dec(trendNu.ema,1)+' kg':'—'],
         ['Doel', (S.profiel.doel_gewicht_kg||'—')+' kg']]
        .map(([l,v])=>`<div><div class="mini">${l}</div><div class="getal" style="font-size:1.25rem">${v}</div></div>`).join('')}
    </div>
    <p style="font-size:.88rem;margin-top:10px">${
      A.wekenTotDoel
      ? `Bij het huidige tempo is ${S.profiel.doel_gewicht_kg} kg over ongeveer <b>${A.wekenTotDoel} weken</b> in zicht —
         rond ${esc(kortNL(plusDagen(vandaag(), A.wekenTotDoel*7)))}. Plateaus zitten daar niet in; reken op tien tot
         twintig procent langer.`
      : `Zonder gemeten helling is elke einddatum verzonnen. Bij ${dec(S.profiel.tempo_pct_week,1)} procent per week —
         nu ${dec(A.tempoKgWk,2)} kg — duurt ${dec(A.gewicht-(S.profiel.doel_gewicht_kg||A.gewicht),0)} kg ongeveer
         ${Math.round((A.gewicht-(S.profiel.doel_gewicht_kg||A.gewicht))/Math.max(0.1,A.tempoKgWk))} weken.`}</p>
    <div class="kaart plat" style="margin-top:10px">
      <p class="mini">Drie regels staan hard in de code. Het doel zakt nooit onder de ruststofwisseling
      (${dz(A.rustBMR)} kcal). Gaat de trend sneller dan één procent per week, dan luidt het advies méér eten.
      En actieve energie uit Garmin of Apple wordt nooit bij het doel opgeteld: de fout daarin is twintig tot vijftig
      procent en niet consistent in één richting, dus corrigeren kan niet.</p>
    </div>
  </div>`;
}

function meetgaten(A,D){
  const g=[], inst=S.profiel.instellingen||{};
  if(D[vandaag()]?.gewicht_kg==null)
    g.push('<b>De weging van vanochtend ontbreekt.</b> Zonder dagelijkse reeks is het model inert; het is de enige invoer die niet te schatten valt.');
  if(!inst.olie_gewogen)
    g.push('<b>Weeg één keer de olijfolie in de saladebereiding.</b> Verreweg de grootste onzekerheid van de dag: het verschil tussen 40 en 70 gram is 265 kcal, elke dag.');
  if(!inst.melk_gemeten)
    g.push('<b>Meet af wat de machine per cappuccino schenkt.</b> Bij vier à vijf op een werkdag de grootste onzichtbare post.');
  const leeg = Array.from({length:7},(_,i)=>plusDagen(vandaag(),-i-1)).filter(k=>!(D[k]?._kcal));
  if(leeg.length>=2)
    g.push('<b>'+leeg.length+' van de afgelopen zeven dagen heeft geen registratie.</b> Gaten verbreden het interval sneller dan een onnauwkeurige schatting dat doet: een ruwe D-waarde is beter dan niets.');
  if(!S.labs.length)
    g.push('<b>De klinische nulmeting staat nog leeg.</b> Bloeddruk, HbA1c, lipiden, ALAT en GGT, TSH, vitamine D en middelomtrek — zonder uitgangswaarde is beloop niet te beoordelen.');
  if(!g.length) return '';
  return `<div class="kaart let"><div class="eyebrow">Wat het model nog mist</div>
    <ol style="margin:8px 0 0;padding-left:19px;font-size:.86rem;line-height:1.5">
      ${g.map(x=>'<li style="margin-bottom:6px">'+x+'</li>').join('')}</ol></div>`;
}

/* ------------------------------------------------------------- de figuren -- */
function intervalSVG(A){
  const min = Math.min(A.laag, A.doel??A.laag, A.priorLaag) - 200;
  const max = Math.max(A.hoog, A.priorHoog) + 200;
  const p = v => ((v-min)/(max-min))*100;
  return `<svg class="fig" viewBox="0 0 100 18" preserveAspectRatio="none" style="height:48px;margin-top:10px" role="img"
      aria-label="Interval ${Math.round(A.laag)} tot ${Math.round(A.hoog)} kcal, doel ${A.doel}">
      <rect x="${p(A.priorLaag)}" y="7.5" width="${p(A.priorHoog)-p(A.priorLaag)}" height="3" fill="var(--dim)" opacity=".28"/>
      <line x1="0" y1="9" x2="100" y2="9" stroke="var(--lijn)" stroke-width=".35"/>
      <rect x="${p(A.laag)}" y="4" width="${p(A.hoog)-p(A.laag)}" height="10" fill="var(--k)" opacity=".2"/>
      <line x1="${p(A.laag)}" y1="4" x2="${p(A.laag)}" y2="14" stroke="var(--k)" stroke-width=".4"/>
      <line x1="${p(A.hoog)}" y1="4" x2="${p(A.hoog)}" y2="14" stroke="var(--k)" stroke-width=".4"/>
      <line x1="${p(A.tdee)}" y1="2" x2="${p(A.tdee)}" y2="16" stroke="var(--ink)" stroke-width=".7"/>
      ${A.doel?`<line x1="${p(A.doel)}" y1="2" x2="${p(A.doel)}" y2="16" stroke="var(--let)" stroke-width=".7"/>`:''}
    </svg>
    <div class="tussen mini cijfer"><span>${dz(Math.round(min))}</span>
      <span style="font-family:var(--sans)">grijs = formuleschatting · zwart = meting · oranje = doel</span>
      <span>${dz(Math.round(max))}</span></div>`;
}
function gewichtSVG(r, A){
  const pts = r.filter(x=>x.w!=null);
  if(pts.length<1) return '<p class="klein" style="margin-top:8px">Nog geen weging. Zodra er drie staan, verschijnt hier een lijn.</p>';
  const W=330,H=140,L=32,B=18;
  const vals = [...r.map(x=>x.w), ...r.map(x=>x.ema)].filter(v=>v!=null).map(Number);
  const lo=Math.min(...vals)-0.8, hi=Math.max(...vals)+0.8;
  const doel = S.profiel.doel_gewicht_kg;
  const doelInBeeld = doel!=null && doel>lo && doel<hi;
  const X=i=> r.length<2 ? (L+W)/2 : L + i/(r.length-1)*(W-L-4);
  const Y=v=> H-B-((v-lo)/((hi-lo)||1))*(H-B-10);
  const pad = r.map((x,i)=>x.ema!=null?X(i)+','+Y(x.ema):null).filter(Boolean).join(' ');
  const dots = r.map((x,i)=>x.w!=null?`<circle cx="${X(i)}" cy="${Y(x.w)}" r="2" fill="var(--dim)"/>`:'').join('');
  const yd = doelInBeeld ? Y(doel) : null;
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" style="margin-top:10px" role="img" aria-label="Gewicht per dag">
    ${[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${L}" y1="${Y(v)}" x2="${W}" y2="${Y(v)}" stroke="var(--lijn)" stroke-width="1"/>
      <text x="0" y="${Y(v)+3.5}" font-size="9.5" fill="var(--grijs)" font-family="ui-monospace,monospace">${v.toFixed(0)}</text>`}).join('')}
    ${yd!=null?`<line x1="${L}" y1="${yd}" x2="${W}" y2="${yd}" stroke="var(--let)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${W}" y="${yd-4}" font-size="9.5" fill="var(--let)" text-anchor="end">doel ${doel}</text>`
    : (doel!=null?`<text x="${W}" y="${H-4}" font-size="9" fill="var(--let)" text-anchor="end">doel ${doel} kg valt onder deze schaal</text>`:'')}
    ${dots}${pad?`<polyline points="${pad}" fill="none" stroke="var(--k)" stroke-width="2.2" stroke-linejoin="round"/>`:''}
    <text x="${L}" y="${H-4}" font-size="9.5" fill="var(--grijs)">${esc(kortNL(r[0].d))} —</text>
    <text x="${L+34}" y="${H-4}" font-size="9.5" fill="var(--grijs)">${esc(kortNL(r[r.length-1].d))}</text>
  </svg>`;
}
function innameSVG(r, A){
  const s = r.slice(-VENSTER);
  if(!s.length) return '';
  const W=330,H=118,L=32,B=15;
  const top = Math.max(2600, ...s.map(x=>x.kcal||0))*1.06;
  const Y=v=>H-B-(v/top)*(H-B-8);
  const bw = Math.max(2.5, (W-L-4)/s.length-2);
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" style="margin-top:10px" role="img" aria-label="Gelogde energie per dag">
    ${[0,1300,2600].map(v=>`<line x1="${L}" y1="${Y(v)}" x2="${W}" y2="${Y(v)}" stroke="var(--lijn)" stroke-width="1"/>
      <text x="0" y="${Y(v)+3.5}" font-size="9.5" fill="var(--grijs)" font-family="ui-monospace,monospace">${v}</text>`).join('')}
    ${s.map((x,i)=>x.kcal?`<rect x="${L+i/s.length*(W-L-4)}" y="${Y(x.kcal)}" width="${bw}"
       height="${H-B-Y(x.kcal)}" rx="1.5" fill="${x.kcal<1200?'var(--let)':'var(--k)'}" opacity=".85"/>`:'').join('')}
    <line x1="${L}" y1="${Y(1200)}" x2="${W}" y2="${Y(1200)}" stroke="var(--let)" stroke-width="1" stroke-dasharray="2 3"/>
    ${A.doel?`<line x1="${L}" y1="${Y(A.doel)}" x2="${W}" y2="${Y(A.doel)}" stroke="var(--k)" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="${W}" y="${Y(A.doel)-3}" font-size="9.5" fill="var(--k)" text-anchor="end">doel ${dz(A.doel)}</text>`:''}
    <text x="${L}" y="${H-3}" font-size="9.5" fill="var(--grijs)">${esc(kortNL(s[0].d))}</text>
    <text x="${W}" y="${H-3}" font-size="9.5" fill="var(--grijs)" text-anchor="end">${esc(kortNL(s[s.length-1].d))}</text>
  </svg>`;
}

   8. TABBLAD VOEDING
   ========================================================================== */
let zoekHits = null;
function vwVoeding(A){
  return `
  <div class="kaart">
    <div class="eyebrow">Zoeken in NEVO en de gerechtenbibliotheek</div>
    <input id="v-q" placeholder="couscous, olijfolie, tajine…" style="margin-top:8px"
      onkeydown="if(event.key==='Enter')zoeken()">
    <div class="rij" style="margin-top:8px"><button class="knop" onclick="zoeken()">Zoeken</button>
      <span class="mini">2.328 producten uit het Nederlands Voedingsstoffenbestand, plus de gevalideerde gerechten van ProVita.</span></div>
    <div id="v-hits">${zoekHits?hitsHTML():''}</div>
  </div>

  <div class="kaart">
    <div class="eyebrow">Eigen producten</div>
    <p class="mini" style="margin-top:4px">Wat je van het etiket overneemt en afweegt is een A-waarde — de enige categorie zonder schatting.</p>
    <div class="rij" style="margin-top:8px">
      <input id="p-n" placeholder="naam" style="flex:2 1 140px;width:auto">
      <input id="p-per" type="number" placeholder="per" value="100" style="flex:0 0 72px">
      <select id="p-u" style="flex:0 0 78px"><option>g</option><option>ml</option><option>stuk</option><option>portie</option></select>
      <input id="p-kcal" type="number" placeholder="kcal" style="flex:0 0 78px">
      <input id="p-eiw" type="number" step="0.1" placeholder="eiwit" style="flex:0 0 78px">
      <button class="knop vol" onclick="bewaarProduct()">Opslaan</button>
    </div>
    ${S.producten.length?`<div class="lijst" style="margin-top:10px">${S.producten.map(p=>`<div>
      ${chip('A')}<span class="groei knip" style="font-size:.86rem">${esc(p.naam)}</span>
      <span class="cijfer mini">${dz(p.kcal)}/${p.per}${esc(p.eenheid)} · ${dec(p.eiwit_g,1)} g</span>
      <button class="knop sm" onclick="wisRij('product','${p.id}')">×</button></div>`).join('')}</div>`:''}
  </div>

  <div class="kaart">
    <div class="eyebrow">Eiwitverdeling over de dag</div>
    ${eiwitVerdeling(A)}
  </div>`;
}
function hitsHTML(){
  const h = zoekHits;
  const rij = (naam, sub, kcal, eiw, code, conf) => `<div>
    ${chip(conf)}<span class="groei"><span class="knip" style="font-size:.86rem;display:block">${esc(naam)}</span>
    <span class="mini">${esc(sub)}</span></span>
    <span class="cijfer mini" style="text-align:right">${dz(kcal)} kcal<br>${dec(eiw,1)} g</span>
    <button class="knop sm" onclick="uitTabel('${code}')">+</button></div>`;
  let uit = '';
  if(h.nevo?.length) uit += '<div class="eyebrow" style="margin-top:12px">NEVO</div><div class="lijst">' +
    h.nevo.map(n=>rij(n.naam, 'per 100 g · '+(n.groep||''), n.kcal, n.eiwit_g, n.nevo_code, 'C')).join('') + '</div>';
  if(h.gerechten?.length) uit += '<div class="eyebrow" style="margin-top:12px">Gerechten van ProVita</div><div class="lijst">' +
    h.gerechten.map(g=>`<div>${chip('D')}<span class="groei"><span class="knip" style="font-size:.86rem;display:block">${esc(g.naam)}</span>
      <span class="mini">${esc(g.keuken||'')}${g.omschrijving?' · '+esc(g.omschrijving).slice(0,60):''}</span></span></div>`).join('') + '</div>';
  if(!uit) uit = '<p class="klein" style="margin-top:10px">Niets gevonden. Zeg het in gewone taal onder Vandaag — dan ontleedt de herkenning het voor je.</p>';
  return uit;
}
async function zoeken(){
  const q = $('#v-q').value.trim();
  $('#v-hits').innerHTML = '<p class="klein" style="margin-top:10px"><span class="spin"></span> Zoeken…</p>';
  try{ zoekHits = await rpc('kal_zoeken',{p_token:S.token, p_q:q, p_limiet:12}); }
  catch(e){ $('#v-hits').innerHTML = '<p class="klein">'+esc(e.message)+'</p>'; return; }
  $('#v-hits').innerHTML = hitsHTML();
}
async function uitTabel(code){
  const n = zoekHits.nevo.find(x=>x.nevo_code===code); if(!n) return;
  const g = parseFloat(prompt('Hoeveel gram '+n.naam+'?', '100')); if(!g) return;
  await bewaar(()=>rpc('kal_regels_toevoegen',{p_token:S.token, p_regels:[{
    datum, naam:n.naam+' · '+g+' g', hoeveelheid:g, eenheid:'g', gram_equivalent:g,
    kcal_punt:Math.round(n.kcal*g/100), kcal_laag:Math.round(n.kcal*g/100*0.95), kcal_hoog:Math.round(n.kcal*g/100*1.05),
    eiwit_g:Math.round(n.eiwit_g*g/100*10)/10, vet_g:Math.round(n.vet_g*g/100*10)/10,
    koolhydraat_g:Math.round(n.koolhydraat_g*g/100*10)/10, conf:'C', bron:'nevo', nevo_code:code,
    onzekerheidsbronnen:['portie opgegeven, niet gewogen']}]}));
  tab='vandaag';
}
async function bewaarProduct(){
  const naam=$('#p-n').value.trim(), kcal=parseFloat($('#p-kcal').value);
  if(!naam||!isFinite(kcal)) return;
  await bewaar(()=>rpc('kal_rij_toevoegen',{p_token:S.token,p_tabel:'product',p_rij:{
    naam, per:parseFloat($('#p-per').value)||100, eenheid:$('#p-u').value, kcal,
    eiwit_g:parseFloat($('#p-eiw').value)||0, conf:'A'}}));
}
async function wisRij(t,id){ await bewaar(()=>rpc('kal_rij_wissen',{p_token:S.token,p_tabel:t,p_id:id})); }

function eiwitVerdeling(A){
  const per = {ontbijt:0, lunch:0, diner:0, tussendoor:0, onbekend:0};
  for(const r of S.regels.filter(r=>r.datum===datum)) per[r.moment||'onbekend'] += +r.eiwit_g||0;
  const doelPerMaaltijd = Math.round(A.eiwitDoel/3);
  const mx = Math.max(doelPerMaaltijd*1.4, ...Object.values(per));
  return `<div style="margin-top:8px">
    ${Object.entries(per).filter(([m,v])=>v>0||['ontbijt','lunch','diner'].includes(m)).map(([m,v])=>`<div style="margin-bottom:7px">
      <div class="tussen"><span class="mini" style="text-transform:capitalize">${m}</span>
        <span class="cijfer mini">${dec(v,1)} g</span></div>
      <div class="balk"><i class="${v>=doelPerMaaltijd?'goed':''}" style="width:${Math.min(100,v/mx*100)}%"></i></div>
    </div>`).join('')}
    <p class="mini" style="margin-top:8px">Streef naar drie tot vier maaltijden van ${doelPerMaaltijd} tot
    ${Math.round(A.eiwitDoel/3*1.2)} g eiwit met minstens drie uur ertussen. Gelijkmatige verdeling gaf in Mamerow 2014
    een 25 procent hogere spiereiwitsynthese dan een scheve verdeling — al ging dat om acht deelnemers van gemiddeld
    37 jaar, dus behandel het als richting, niet als wet. Het ontbijt is de maaltijd waar de scheve verdeling
    vrijwel altijd ontstaat.</p></div>`;
}

   9. TABBLAD BEWEGING
   ========================================================================== */
function vwBeweging(A,D){
  const k = Object.keys(D).sort().slice(-21);
  const laatste7 = k.slice(-7).map(x=>D[x].stappen).filter(v=>v!=null).map(Number);

    <div class="regel"><div><b style="font-size:.87rem">Olijfolie in de saladebereiding</b>
      <div class="mini">De grootste onzekerheid van de dag. Weeg één keer.</div></div>
      <div class="rij" style="gap:5px">${inp('i-olie',i.olie_g)}<span class="mini">g</span>
        <input type="checkbox" id="i-oliew" ${i.olie_gewogen?'checked':''} style="width:19px;height:19px"></div></div>

    <div class="regel"><div><b style="font-size:.87rem">Melk per cappuccino</b></div>
      <div class="rij" style="gap:5px">${inp('i-melk',i.melk_ml)}
        <select id="i-melks" style="width:auto">${['mager','half','vol'].map(v=>
          `<option value="${v}"${i.melk_soort===v?' selected':''}>${v==='half'?'halfvol':v}</option>`).join('')}</select>
        <input type="checkbox" id="i-melkw" ${i.melk_gemeten?'checked':''} style="width:19px;height:19px"></div></div>

    <div class="regel"><div><b style="font-size:.87rem">Rookt</b>
      <div class="mini">Invoer voor SCORE2.</div></div>
      <input type="checkbox" id="i-rookt" ${i.rookt?'checked':''} style="width:19px;height:19px"></div>

    <div class="regel"><div><b style="font-size:.87rem">Fase</b></div>
      <select id="i-fase" style="width:auto">
        <option value="afvallen"${p.fase==='afvallen'?' selected':''}>afvallen</option>
        <option value="onderhoud"${p.fase==='onderhoud'?' selected':''}>onderhoud</option>
        <option value="pauze"${p.fase==='pauze'?' selected':''}>pauze</option></select></div>

    <div class="regel"><div><b style="font-size:.87rem">Basisgewicht onderhoud</b>
      <div class="mini">Het laagste stabiele gewicht; de zones rekenen hiervandaan.</div></div>
      ${inp('i-basis',p.onderhoud_basis_kg)}</div>

    <div class="rij" style="margin-top:14px">
      <button class="knop vol" onclick="bewaarProfiel()">Bewaren</button>
      <button class="knop" onclick="sluit()">Annuleren</button></div>
  </div></div>`;
}
async function bewaarProfiel(){
  const n = id => { const v=parseFloat($(id).value); return isFinite(v)?v:null; };
  const patch = {
    lengte_cm:n('#i-lengte'), leeftijd_jaar:n('#i-leeftijd'), geslacht:$('#i-gesl').value,
    doel_gewicht_kg:n('#i-doel'), tempo_pct_week:n('#i-tempo'), eiwit_g_per_kg:n('#i-eiwit'),
    fase:$('#i-fase').value, onderhoud_basis_kg:n('#i-basis'),
    instellingen:{olie_g:n('#i-olie'), olie_gewogen:$('#i-oliew').checked,
      melk_ml:n('#i-melk'), melk_soort:$('#i-melks').value, melk_gemeten:$('#i-melkw').checked,
      rookt:$('#i-rookt').checked}
  };
  venster=null;
  await bewaar(()=>rpc('kal_profiel_zetten',{p_token:S.token,p_patch:patch}));
}
function vensterImport(){
  return `<div class="sluier" onclick="if(event.target===this)sluit()"><div class="venster">
    <div class="tussen"><h2 style="font-size:1.25rem">Importeren</h2><button class="knop sm" onclick="sluit()">×</button></div>
    <p class="klein" style="margin-top:8px">Plak tekst uit Yazio of Apple Gezondheid, of stuur schermafdrukken mee.
    Er wordt alleen overgenomen wat er werkelijk staat; gaten worden niet opgevuld.</p>
    <textarea id="im-tekst" style="margin-top:10px;min-height:120px"
      placeholder="20 augustus 2026    1.319 kcal&#10;19 augustus 2026    1.481 kcal&#10;…"></textarea>
    <div class="rij" style="margin-top:8px">
      <label class="knop" style="cursor:pointer">Schermafdrukken kiezen
        <input type="file" accept="image/*" multiple style="display:none" onchange="kiesImportFotos(this)"></label>
      <span class="mini" id="im-n"></span></div>
    <p class="klein" id="im-mld" style="margin-top:8px;min-height:1.2em"></p>
    <div id="im-uit"></div>
    <div class="rij" style="margin-top:10px"><button class="knop vol" onclick="importeren()">Uitlezen</button></div>
  </div></div>`;
}
let importFotos=[], importConcept=null;
function kiesImportFotos(inp){
  importFotos=[]; const fs=[...inp.files].slice(0,8);
  let n=0;
  fs.forEach(f=>{ const r=new FileReader();
    r.onload=()=>{ importFotos.push({type:f.type, data:r.result.split(',')[1]});
      if(++n===fs.length) $('#im-n').textContent = fs.length+' afbeelding'+(fs.length===1?'':'en')+' klaar'; };
    r.readAsDataURL(f); });
}
async function importeren(){
  $('#im-mld').innerHTML='<span class="spin"></span> Uitlezen…';
  try{
    const uit = await ai({soort:'import', tekst:$('#im-tekst').value, fotos:importFotos});
    importConcept = uit.dagen||[];
    $('#im-mld').textContent = importConcept.length+' dagen gevonden.';
    $('#im-uit').innerHTML = `<div class="lijst" style="margin-top:8px;max-height:230px;overflow:auto">
      ${importConcept.map(d=>`<div><span class="cijfer mini groei">${esc(d.datum)}</span>
        <span class="cijfer mini">${d.kcal?dz(d.kcal)+' kcal':''} ${d.eiwit_g?'· '+dec(d.eiwit_g,0)+' g eiwit':''}
        ${d.stappen?'· '+dz(d.stappen)+' stappen':''} ${d.gewicht_kg?'· '+dec(d.gewicht_kg,1)+' kg':''}</span></div>`).join('')}
      </div><div class="rij" style="margin-top:8px"><button class="knop vol" onclick="importOpslaan()">Overnemen</button></div>`;
  }catch(e){ $('#im-mld').textContent = e.message; }
}
async function importOpslaan(){
  const dagen = importConcept.filter(d=>d.gewicht_kg!=null||d.stappen!=null||d.actieve_energie_kcal!=null);
  const eten = importConcept.filter(d=>d.kcal);
  venster=null;
  await bewaar(async ()=>{
    if(dagen.length) await rpc('kal_dagen_importeren',{p_token:S.token,p_dagen:dagen});
    if(eten.length) await rpc('kal_regels_toevoegen',{p_token:S.token, p_regels: eten.map(d=>({
      datum:d.datum, naam:'Dagtotaal, geïmporteerd', kcal_punt:d.kcal,
      kcal_laag:Math.round(d.kcal*0.85), kcal_hoog:Math.round(d.kcal*1.45),
      eiwit_g:d.eiwit_g, vet_g:d.vet_g, koolhydraat_g:d.koolhydraat_g, conf:'D', bron:'import',
      onzekerheidsbronnen:['dagtotaal uit een andere app, niet per product terug te rekenen',
        'bovengrens ruim genomen wegens de gebruikelijke onderregistratie']}))});
  });
}
function vensterAccount(){
  return `<div class="sluier" onclick="if(event.target===this)sluit()"><div class="venster">
    <div class="tussen"><h2 style="font-size:1.25rem">Account</h2><button class="knop sm" onclick="sluit()">×</button></div>
    <p class="klein" style="margin-top:8px">Aangemeld als <b>${esc(S.account||'')}</b>. De sessie blijft dertig dagen
    staan. Je gegevens staan in eigen tabellen in het Supabase-project van ProVita, afgescheiden van de
    patiëntgegevens, en zijn alleen via beveiligde databasefuncties met dit wachtwoord bereikbaar.</p>
    <div class="rij" style="margin-top:14px"><button class="knop" onclick="afmelden()">Afmelden</button></div>
  </div></div>`;
}
async function afmelden(){
  try{ await rpc('kal_afmelden',{p_token:S.token}); }catch(e){}
  try{ localStorage.removeItem(SLEUTEL_SESSIE); }catch(e){}
  S.token=null; S.account=null; venster=null;
  document.querySelector('nav.tabs')?.remove(); teken();
}

/* ============================================================================
   13. START
   ========================================================================== */
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

(async function(){
  try{
    const s = JSON.parse(localStorage.getItem(SLEUTEL_SESSIE)||'null');
    if(s&&s.token){ S.token=s.token; S.account=s.account; await laden(); }
  }catch(e){ S.token=null; }
  teken();
})();
</script>
</body>
